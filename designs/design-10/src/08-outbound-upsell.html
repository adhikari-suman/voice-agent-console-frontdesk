<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Outbound upsell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .body { padding: var(--s21); display: flex; flex-direction: column; gap: var(--s13); flex: 1; min-height: 0; }
  .cols { display: inline-flex; gap: var(--s5); align-items: center; }
  .cols code { font: 500 var(--f13)/1 var(--font); padding: var(--s3) var(--s5); border-radius: 5px; background: var(--surface-2); color: var(--text); }
  .tbl-wrap { border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; }
  .tbl td:nth-child(2), .tbl td:nth-child(3), .tbl td:nth-child(4) { white-space: nowrap; }
  .tbl .err-msg > span > span:first-child { white-space: nowrap; }
  .tbl td.bad { color: var(--pink); text-decoration: underline wavy rgba(255, 111, 158, 0.7); text-underline-offset: 4px; }
  .tbl .fix { color: var(--text-2); display: block; }
  .more { padding: var(--s8) var(--s21); font-size: var(--f13); line-height: 21px; color: var(--text-2); border-top: 1px solid var(--line); display: flex; align-items: center; gap: var(--s8); }
  .foot { margin-top: auto; display: flex; align-items: center; gap: var(--s13); padding-top: var(--s13); }
  .foot .help { max-width: 377px; }

  .single { padding: 0 var(--s21) var(--s21); display: flex; flex-direction: column; gap: var(--s13); flex: 1; min-height: 0; }
  .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s13); }
  .match { display: flex; gap: var(--s8); align-items: flex-start; padding: var(--s8) var(--s13); border-radius: var(--r-ctl); background: var(--night); border: 1px solid var(--line); font-size: var(--f13); line-height: 21px; }
  .match .ic { color: var(--leaf); margin-top: 2px; }
  .match b { display: block; font-weight: 600; color: var(--leaf); }
  .offers { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-ctl); }
  .offer { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s3) var(--s13); align-items: center; padding: var(--s8) var(--s13); }
  .offer + .offer { border-top: 1px solid var(--line); }
  .offer .nm { font: 600 var(--f13)/21px var(--font); }
  .offer .dt { grid-column: 2; font-size: var(--f13); line-height: 21px; color: var(--text-2); }
  .offer .pr { font: 600 var(--f13)/21px var(--font); font-variant-numeric: tabular-nums; text-align: right; }
  .offer .toggle { grid-row: 1 / span 2; }
  .single .btn.block { margin-top: auto; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, shell, outboundTabs } = Kiku;
  const S = K.upsellSingle;
  const C = K.upsellCsv;
  const fixes = {
    'Phone number too short': 'Use the full number with country code, then upload again.',
    'Confirmation number missing': 'Add the BRN number for this guest, then upload again.',
  };

  const row = (r) => {
    if (r.ok) return `<tr><td class="rn">${r.row}</td><td>${esc(r.phone)}</td><td>${r.confirmation}</td><td>${esc(r.guest)}</td><td><span class="ok">${ic('circle-check', 'ic-13')}Ready</span></td></tr>`;
    const badPhone = /phone/i.test(r.error);
    return `<tr class="err"><td class="rn">${r.row}</td>
      <td class="${badPhone ? 'bad' : ''}">${r.phone ? esc(r.phone) : '<span class="missing">Missing</span>'}</td>
      <td>${r.confirmation || '<span class="missing">Missing</span>'}</td>
      <td><span class="none">No booking matched</span></td>
      <td><span class="err-msg">${ic('circle-alert', 'ic-13')}<span><span>${esc(r.error)}</span><span class="fix">${fixes[r.error] || ''}</span></span></span></td></tr>`;
  };
  const offer = (o) => {
    const on = S.offers.includes(o.id);
    return `<label class="offer"><span class="toggle ${on ? 'on' : ''}" role="switch" aria-checked="${on}"></span>
      <span class="nm">${esc(o.name)}</span><span class="pr">${esc(o.price)}</span>
      <span class="dt">${esc(o.detail)}${o.alt ? ` · ${esc(o.alt)}` : ''}</span></label>`;
  };
  const [who, ...rest] = S.match.split(' · ');

  shell({
    role: 'admin', active: 'outbound', title: 'Outbound',
    sub: 'Calls Kiku places from the hotel',
    titleExtra: `<span style="margin-left:21px">${outboundTabs('upsell')}</span>`,
    content: `
    <div class="split">
      <section class="panel" aria-label="Upsell from a file">
        <div class="panel-head ruled"><h2 class="lg">Upload a list of bookings</h2><a class="link t13" href="#">${ic('download', 'ic-13')} Download CSV template</a></div>
        <div class="body">
          <div class="drop">
            <span class="file-ic">${ic('file-spreadsheet')}</span>
            <div class="grow">
              <p class="fname">${esc(C.file)}</p>
              <p class="fmeta">${C.size} · ${C.rows} rows · columns <span class="cols">${C.columns.map((c) => `<code>${c}</code>`).join('')}</span></p>
            </div>
            <button class="btn">${ic('replace')}Replace file</button>
          </div>
          <div class="tally">
            <span class="k leaf">${ic('circle-check')}<b>${C.ready}</b> ready to call</span>
            <span class="k pink">${ic('circle-alert')}<b>${C.errors}</b> rows need fixing</span>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Row</th><th>Phone</th><th>Confirmation</th><th>Booking</th><th>Check</th></tr></thead>
              <tbody>${C.preview.map(row).join('')}</tbody>
            </table>
            <p class="more">${ic('rows-3', 'ic-13')}${C.rows - C.preview.length} more rows, all ready. Only rows with errors and the first rows are shown.</p>
          </div>
          <div class="foot">
            <button class="btn primary lg">${ic('phone-outgoing')}Start ${C.ready} calls</button>
            <p class="help">The ${C.errors} rows with errors are skipped. Each call offers arrival pickup, breakfast and dinner.</p>
          </div>
        </div>
      </section>
      <section class="panel" aria-label="Call one guest">
        <div class="panel-head"><h2 class="lg">Call one guest</h2></div>
        <div class="single">
          <div class="g2">
            <div class="field"><label class="label" for="ph">Phone</label><input class="input lg-text" id="ph" value="${esc(S.phone)}"></div>
            <div class="field"><label class="label" for="cf">Confirmation number</label><input class="input lg-text" id="cf" value="${S.confirmation}"></div>
          </div>
          <div class="match">${ic('circle-check')}<p><b>Booking found: ${esc(who)}</b>${esc(rest.join(' · '))}</p></div>
          <div class="field">
            <p class="label">Offers to make <span class="opt">switch off any Kiku should skip</span></p>
            <div class="offers">${K.offers.map(offer).join('')}</div>
          </div>
          <button class="btn primary lg block">${ic('phone-outgoing')}Call now</button>
        </div>
      </section>
    </div>`,
  });
  Kiku.done();
</script>
</body>
</html>
