<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Outbound campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .form { padding: var(--s21); display: flex; flex-direction: column; gap: var(--s21); flex: 1; min-height: 0; }
  .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.618fr); gap: var(--s21); }
  .window { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto minmax(0, 1fr); gap: var(--s8); align-items: center; font-size: var(--f13); color: var(--text-2); }
  .opening { min-height: 144px; }
  .field > .seg { align-self: flex-start; }
  .readback { font-size: var(--f13); line-height: 21px; color: var(--text-2); display: flex; gap: var(--s8); align-items: flex-start; }
  .readback b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .readback .ic { color: var(--gold); margin-top: 2px; }
  .form-foot { margin-top: auto; display: flex; align-items: center; gap: var(--s13); padding-top: var(--s21); border-top: 1px solid var(--line); }
  .form-foot .help { max-width: 233px; }
  .form-foot .spacer { flex: 1; }
  .disabled-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: var(--s3); }

  .camps { display: flex; flex-direction: column; }
  .camp { padding: var(--s13) var(--s21) var(--s21); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--s5); }
  .camp.sel { background: var(--surface-2); }
  .camp-top { display: flex; align-items: center; justify-content: space-between; gap: var(--s8); }
  .camp h3 { font: 600 var(--f16)/21px var(--font); display: flex; align-items: center; gap: var(--s8); }
  .camp .offer { font-size: var(--f13); line-height: 21px; color: var(--text); }
  .camp .meta { font-size: var(--f13); line-height: 21px; color: var(--text-2); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 0 var(--s13); }
  .camp .meta span { display: inline-flex; align-items: center; gap: var(--s5); }
  .cstat { display: inline-flex; align-items: center; gap: var(--s5); font: 500 var(--f13)/21px var(--font); white-space: nowrap; color: var(--text-2); }
  .cstat.scheduled { color: var(--text); }
  .cstat.scheduled .ic { color: var(--gold); }
  .prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s5) var(--s13); align-items: center; margin-top: var(--s3); }
  .prog .bar > i { background: var(--gold); }
  .prog .of { font-size: var(--f13); line-height: 21px; font-variant-numeric: tabular-nums; }
  .funnel { grid-column: 1 / -1; display: flex; gap: var(--s21); font-size: var(--f13); line-height: 21px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .funnel b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, shell, outboundTabs } = Kiku;
  const D = K.campaignDraft;
  const draftCamp = K.campaigns.find((c) => c.code === D.code);
  const opening = esc(D.opening).replace(/\{(\w+)\}/g, '<span class="token">{$1}</span>');
  const [days, hours] = D.window.split(', ');
  const [from, to] = hours.split('–');

  const cstat = (c) => {
    if (c.status.startsWith('Paused')) return `<span class="cstat paused">${ic('circle-pause')}${esc(c.status)}</span>`;
    if (c.status.startsWith('Scheduled')) return `<span class="cstat scheduled">${ic('calendar-clock')}${esc(c.status)}</span>`;
    return `<span class="cstat draft">${ic('pencil-line')}${esc(c.status)}${c.code === D.code ? ', open' : ''}</span>`;
  };
  const camp = (c) => {
    const pct = c.contacts ? Math.round((c.called / c.contacts) * 1000) / 10 : 0;
    const prog = c.called
      ? `<div class="prog"><span class="bar" role="img" aria-label="${c.called} of ${c.contacts} called"><i style="width:${pct}%"></i></span><span class="of"><b>${c.called}</b> of ${c.contacts} called</span>
          <p class="funnel"><span><b>${c.answered}</b> answered</span><span><b>${c.booked}</b> booked</span><span><b>${c.failed}</b> failed</span></p></div>`
      : '';
    const meta = c.contacts
      ? `<span>${ic('users', 'ic-13')}${c.contacts} contacts</span><span>${ic('file-spreadsheet', 'ic-13')}${esc(c.audience)}</span><span>${ic('clock', 'ic-13')}${esc(c.window)}</span>`
      : `<span>${ic('file-spreadsheet', 'ic-13')}${esc(c.audience)}</span><span>${ic('clock', 'ic-13')}Window ${esc(c.window.toLowerCase())}</span>`;
    return `<article class="camp ${c.code === D.code ? 'sel' : ''}">
      <div class="camp-top"><h3><span class="tag gold num">${c.code}</span>${esc(c.name)}</h3></div>
      ${cstat(c)}
      <p class="offer">${esc(c.offer)}</p>
      ${prog}
      <p class="meta">${meta}</p>
    </article>`;
  };

  shell({
    role: 'admin', active: 'outbound', title: 'Outbound',
    sub: 'Calls Kiku places from the hotel',
    titleExtra: `<span style="margin-left:21px">${outboundTabs('campaign')}</span>`,
    content: `
    <div class="split">
      <section class="panel" aria-label="Set up ${D.code}">
        <div class="panel-head ruled">
          <h2 class="lg">${esc(draftCamp.name)} <span class="tag">${ic('pencil-line', 'ic-13')}Draft</span></h2>
          <button class="btn quiet">${ic('save')}Save draft</button>
        </div>
        <div class="form">
          <div class="g2">
            <div class="field"><label class="label" for="code">Promo code</label><div class="input-wrap">${ic('ticket')}<input class="input lg-text" id="code" value="${D.code}"></div></div>
            <div class="field"><label class="label" for="offer">Offer</label><input class="input lg-text" id="offer" value="${esc(draftCamp.offer)}"></div>
          </div>
          <div class="field">
            <p class="label">Audience</p>
            <div class="drop">
              <span class="file-ic">${ic('file-spreadsheet')}</span>
              <div class="grow">
                <p class="fname">${esc(D.file)}</p>
                <div class="tally">
                  <span class="k">${D.rows} rows</span>
                  <span class="k leaf">${ic('circle-check', 'ic-13')}<b>${D.ready}</b> ready to call</span>
                  <span class="k pink">${ic('circle-alert', 'ic-13')}<b>${D.errors}</b> rows need fixing</span>
                  <a class="link" href="#">Review ${D.errors} rows</a>
                </div>
              </div>
              <button class="btn">${ic('replace')}Replace file</button>
            </div>
            <p class="help">Rows with errors are left out. Kiku calls the ${D.ready} ready contacts.</p>
          </div>
          <div class="g2">
            <div class="field">
              <p class="label">Max attempts <span class="opt">per contact</span></p>
              <div class="seg" role="radiogroup" aria-label="Max attempts">${[1, 2, 3, 4, 5].map((n) => `<span class="seg-item ${n === D.maxAttempts ? 'active' : ''}" role="radio" aria-checked="${n === D.maxAttempts}" style="padding:0 13px">${n}</span>`).join('')}</div>
            </div>
            <div class="field">
              <p class="label">Call window <span class="opt">hotel time, ${K.hotel.tz}</span></p>
              <div class="window">
                <span class="select lg-text"><span class="lead">${ic('calendar')}${days}</span>${ic('chevron-down')}</span>
                <span class="select lg-text"><span class="num">${from}</span>${ic('chevron-down')}</span>
                <span>to</span>
                <span class="select lg-text"><span class="num">${to}</span>${ic('chevron-down')}</span>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="label">Opening line <span class="opt">Kiku says this first</span></label>
            <div class="textarea opening is-focus" role="textbox" aria-multiline="true" contenteditable="true" spellcheck="false">${opening}</div>
            <p class="help"><span class="token">{first_name}</span> is filled in from each row of ${esc(D.file)}.</p>
          </div>
          <p class="readback">${ic('info')}<span>Kiku will call <b>${D.ready}</b> contacts, up to <b>${D.maxAttempts}</b> times each, ${days} between <b>${from}</b> and <b>${to}</b>, offering ${esc(draftCamp.offer.charAt(0).toLowerCase() + draftCamp.offer.slice(1))} with code <b>${D.code}</b>.</span></p>
          <div class="form-foot">
            <button class="btn primary lg">${ic('calendar-check')}Schedule campaign</button>
            <p class="help">First calls go out Mon 28 Sep at ${from}, inside the call window.</p>
            <span class="spacer"></span>
            <div class="disabled-wrap">
              <button class="btn" disabled>${ic('phone-outgoing')}Start now</button>
              <span class="help">Outside the call window today</span>
            </div>
          </div>
        </div>
      </section>
      <section class="panel" aria-label="Campaigns">
        <div class="panel-head"><h2>Campaigns <span class="count">${K.campaigns.length}</span></h2><button class="btn">${ic('plus')}New campaign</button></div>
        <div class="camps">${K.campaigns.map(camp).join('')}</div>
      </section>
    </div>`,
  });
  Kiku.done();
</script>
</body>
</html>
