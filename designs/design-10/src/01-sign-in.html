<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .signin { display: grid; grid-template-columns: minmax(0, 1.618fr) minmax(0, 1fr); height: 100%; }
  .si-left { position: relative; overflow: hidden; border-right: 1px solid var(--line); }
  .si-art { position: absolute; width: 842px; height: 842px; left: 129px; top: 135px; }
  .si-brand { position: absolute; left: 55px; top: 55px; display: flex; align-items: center; gap: 21px; z-index: 1; }
  .si-brand h1 { font: 700 var(--f55)/1 var(--font); letter-spacing: -0.03em; }
  .si-brand p { font-size: var(--f16); line-height: 21px; color: var(--text-2); margin-top: 8px; }
  .si-right { position: relative; display: flex; flex-direction: column; justify-content: center; padding: 0 89px; }
  .si-form { width: 377px; padding: 34px; gap: 21px; }
  .si-form h2 { font: 650 var(--f21)/34px var(--font); letter-spacing: -0.01em; }
  .si-form .intro { font-size: var(--f13); line-height: 21px; color: var(--text-2); margin-top: -13px; }
  .si-form .input { height: 34px; }
  .pw-row { justify-content: space-between; }
  .si-foot { position: absolute; left: 89px; right: 89px; bottom: 34px; display: flex; align-items: center; gap: 8px; font-size: var(--f13); line-height: 21px; color: var(--text-2); }
</style>
</head>
<body>
<script>
  const { K, ic, kikuMark } = Kiku;
  document.body.innerHTML = `
  <div class="signin">
    <section class="si-left">
      <div class="si-brand">
        ${kikuMark(55, 55)}
        <div><h1>${K.product.name}</h1><p>${K.hotel.name}, ${K.hotel.city}</p></div>
      </div>
      <div class="si-art" id="art"></div>
    </section>
    <section class="si-right">
      <form class="panel si-form" onsubmit="return false">
        <h2>Sign in</h2>
        <p class="intro">Use your ${K.hotel.name} staff email.</p>
        <div class="field">
          <label class="label" for="em">Email</label>
          <input class="input lg-text" id="em" type="email" autocomplete="username" value="${K.people.specialist.email}">
        </div>
        <div class="field">
          <div class="label pw-row"><label for="pw">Password</label><a class="link" href="#">Forgot password?</a></div>
          <input class="input lg-text is-focus" id="pw" type="password" autocomplete="current-password" value="goldenangle1375">
        </div>
        <button class="btn primary lg block" type="submit">Sign in ${ic('arrow-right')}</button>
      </form>
      <p class="si-foot">${ic('info', 'ic-13')}${K.synthetic}</p>
    </section>
  </div>`;
  Kiku.done(null, () => Kiku.signInBloom(document.getElementById('art'), 233));
</script>
</body>
</html>
