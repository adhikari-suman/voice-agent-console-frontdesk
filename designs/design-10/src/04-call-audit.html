<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Call audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .who-chip { display: inline-flex; align-items: center; gap: var(--s8); font-size: var(--f13); line-height: 21px; }
  .who-chip .avatar { width: var(--s34); height: var(--s34); }
  .who-chip small { display: block; color: var(--text-2); font-size: var(--f13); }
  .head-num { font: 600 var(--f21)/1 var(--font); font-variant-numeric: tabular-nums; }

  .player-mini { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s3); }
  .player-mini .icon-btn { width: 28px; height: 28px; }
  .player-mini .speed { height: 28px; padding: 0 var(--s8); border-radius: var(--r-ctl); border: 1px solid var(--line-2); font: 600 var(--f13)/26px var(--font); color: var(--text-2); }
  .player .tl { align-self: stretch; }

  .entry.playing .t { color: var(--gold); }
  .kl { display: flex; flex-direction: column; padding: 0 var(--s13) var(--s13); }
  .kl li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; column-gap: var(--s13); align-items: baseline; padding: var(--s3) var(--s8); border-radius: var(--r-ctl); font-size: var(--f13); line-height: 21px; }
  .kl .t { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .kl .snip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .kl .n { color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .kl li.on { background: var(--surface-2); }
  .kl li.exact .snip { color: var(--gold); display: inline-flex; align-items: center; gap: var(--s5); font-weight: 600; }
  .kl li.exact .n { color: var(--gold); }
  .k-sum { font-size: var(--f13); line-height: 21px; color: var(--text-2); }
  .k-sum b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .oc { display: flex; flex-direction: column; padding: 0 var(--s21); }
  .oc li { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: var(--s8); align-items: start; padding: var(--s5) 0; font-size: var(--f13); line-height: 21px; border-bottom: 1px solid var(--line); }
  .oc li .ic { margin-top: 2px; }
  .oc li .amt { font-variant-numeric: tabular-nums; }
  .oc li.added .ic { color: var(--leaf); }
  .oc li.declined { color: var(--text-2); }
  .oc li.declined .ic { color: var(--failed); }
  .oc-total { display: flex; justify-content: space-between; align-items: baseline; padding: var(--s8) var(--s21) 0; }
  .oc-total span { font-size: var(--f13); color: var(--text-2); }
  .oc-total b { font: 650 var(--f21)/34px var(--font); font-variant-numeric: tabular-nums; }
  .oc-note { display: flex; gap: var(--s8); align-items: flex-start; padding: var(--s5) var(--s21) var(--s21); font-size: var(--f13); line-height: 21px; color: var(--text); }
  .oc-note .ic { color: var(--text-2); margin-top: 2px; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, status, shell, timeline, sec, first, bloomTokens, transcriptHtml } = Kiku;
  const A = K.audit;
  const playhead = 54;
  const kTurns = A.transcript.filter((e) => e.karaoke);
  const playingT = kTurns[0].t;
  const tom = K.users.find((u) => u.name === A.specialist);

  const kRow = (e) => {
    const b = bloomTokens(e);
    const snip = e.asWritten ? `${ic('check-check', 'ic-13')}Spoken as written` : esc(e.said);
    return `<li class="${e.asWritten ? 'exact' : ''} ${e.t === playingT ? 'on' : ''}"><span class="t">${e.t}</span><span class="snip">${snip}</span><span class="n">${b.kept} of ${b.total} words</span></li>`;
  };

  const outcome = A.outcome.map((o) => `<li class="${o.result}">${ic(o.result === 'added' ? 'circle-check' : 'x')}<span>${esc(o.item)}${o.result === 'declined' ? ' · declined' : ''}</span><span class="amt">${o.amount === '—' ? '' : o.amount}</span></li>`).join('');

  shell({
    role: 'specialist', active: 'logs', back: '03-call-logs.html', title: esc(A.guest),
    sub: `<span class="num">${A.id}</span> · ${esc(A.started)} · <span class="num">${esc(A.phone)}</span>`,
    titleExtra: `<span style="margin-left:13px">${status(A.status)}</span>`,
    right: `<span class="tag">${ic('phone-outgoing', 'ic-13')}Outbound · ${A.type}</span>
            <span class="head-num" title="Duration">${A.duration}</span>
            <span class="who-chip"><span class="avatar spec">${tom.initials}</span><span>${esc(A.specialist)}<small>Specialist, took over</small></span></span>`,
    content: `
    <div class="split">
      <div class="col">
        <section class="panel" aria-label="Recording">
          <div class="player">
            <div class="player-ctl">
              <button class="play" aria-label="Pause">${ic('pause')}</button>
              <div>
                <p class="player-time"><b>00:54</b> / ${A.duration}</p>
                <div class="player-mini">
                  <button class="icon-btn" aria-label="Back 5 seconds" title="Back 5 seconds">${ic('rotate-ccw')}</button>
                  <button class="icon-btn" aria-label="Forward 5 seconds" title="Forward 5 seconds">${ic('rotate-cw')}</button>
                  <span class="speed" role="button" aria-label="Playback speed">1x</span>
                </div>
              </div>
            </div>
            ${timeline({
              transcript: A.transcript, dur: sec(A.duration), playhead, labelW: 55,
              lanes: [
                { key: 'kiku', label: 'Kiku', cls: 'kiku', speakers: ['agent'] },
                { key: 'spec', label: first(A.specialist), cls: 'spec', speakers: ['specialist'] },
                { key: 'guest', label: first(A.guest), cls: 'guest', speakers: ['guest'] },
              ],
              marks: [{ t: '00:36', label: 'Escalated 00:36', icon: 'hand', side: 'l' }, { t: A.takeoverAt, label: `Took over ${A.takeoverAt}`, icon: 'mic' }],
              axis: ['00:00', '00:30', '01:00', '01:30', '02:00', A.duration],
            })}
          </div>
        </section>
        <section class="panel fill" aria-label="Message history">
          <div class="panel-head ruled">
            <h2>Message history <span class="count">${A.transcript.length} entries</span></h2>
            <div class="legend">
              <span class="k"><span class="sw-gold">Kiku wrote</span></span>
              <span class="k"><span class="sw-drop">dropped</span></span>
              <span class="k"><span class="sw-pink">improvised by ${esc(first(A.specialist))}</span></span>
            </div>
          </div>
          <div class="pane" id="hist"><div class="transcript">${transcriptHtml(A.transcript, { guest: first(A.guest), spec: A.specialist }, { mark: (e) => (e.t === playingT ? 'playing' : '') })}</div></div>
          <div class="panel-foot" id="hfoot"></div>
        </section>
      </div>
      <div class="col">
        <section class="panel" aria-label="Call facts">
          <div class="panel-body" style="padding-top:21px">
            <dl class="facts">
              <dt>Booking</dt><dd>${A.booking}</dd>
              <dt>Stay</dt><dd>${esc(A.stay)}</dd>
              <dt>Purpose</dt><dd>${esc(A.purpose)}</dd>
              <dt>Handled by</dt><dd>${esc(A.agent)}, then ${esc(A.specialist)} from ${A.takeoverAt}</dd>
              <dt>Escalated</dt><dd>${esc(A.escalationReason)}</dd>
            </dl>
          </div>
        </section>
        <section class="panel" aria-label="Karaoke summary">
          <div class="panel-head"><h2>Karaoke</h2><p class="k-sum"><b>${A.karaokeSummary.lines}</b> lines · <b>${A.karaokeSummary.asWritten}</b> as written · <b>${A.karaokeSummary.improvised}</b> improvised</p></div>
          <ol class="kl">${kTurns.map(kRow).join('')}</ol>
        </section>
        <section class="panel fill" aria-label="Outcome">
          <div class="panel-head"><h2>Outcome</h2>${status('completed')}</div>
          <ul class="oc">${outcome}</ul>
          <div class="oc-total"><span>Added to ${A.booking}</span><b>${A.total}</b></div>
          <p class="oc-note">${ic('notebook-pen')}${esc(A.note)}</p>
        </section>
      </div>
    </div>`,
  });
  Kiku.done(() => {
    const pane = document.getElementById('hist');
    const start = pane.querySelector('[data-t="00:31"]');
    Kiku.fitPane(pane, {
      start,
      earlier: (k) => `${ic('chevron-up')}<span>Show ${k} earlier entries, from 00:00</span>`,
      foot: document.getElementById('hfoot'),
      below: (n) => `${ic('arrow-down')}<span>${n} more entries below, to the end of the call at ${A.duration}</span>`,
    });
    if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
  });
</script>
</body>
</html>
