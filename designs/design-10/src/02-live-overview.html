<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Live board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .chart-wrap { position: relative; flex: 1; min-height: 0; }
  .chart-wrap .phyllo { position: absolute; inset: var(--s8) var(--s21) var(--s8); }
  .chart-key { position: absolute; left: var(--s21); top: var(--s13); width: 233px; z-index: 1; }
  .chart-key h2 { font: 600 var(--f21)/34px var(--font); letter-spacing: -0.01em; }
  .chart-key p { font-size: var(--f13); line-height: 21px; color: var(--text-2); margin-top: var(--s3); }
  .totals { padding: var(--s13) var(--s21); border-top: 1px solid var(--line); font-size: var(--f13); line-height: 21px; color: var(--text-2); }
  .totals b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .totals .status { vertical-align: top; }

  .q-hot { background: var(--pink-wash); border-top: 1px solid rgba(255, 111, 158, 0.35); border-bottom: 1px solid rgba(255, 111, 158, 0.35); padding: var(--s13) var(--s21) var(--s21); display: flex; flex-direction: column; gap: var(--s8); }
  .q-top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--s13); }
  .q-meta { display: flex; align-items: center; gap: var(--s8); font-size: var(--f13); line-height: 21px; color: var(--text-2); }
  .q-name { font: 650 var(--f21)/34px var(--font); letter-spacing: -0.01em; }
  .q-wait { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
  .q-wait span { font-size: var(--f13); line-height: 21px; color: var(--pink); }
  .q-wait b { font: 600 var(--f34)/1 var(--font); color: var(--pink); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .q-purpose { font-size: var(--f16); line-height: 1.5; }
  .q-reason { display: flex; align-items: center; gap: var(--s8); font-size: var(--f13); line-height: 21px; color: var(--text); }
  .q-reason .ic { color: var(--pink); }
  .q-actions { display: flex; gap: var(--s8); margin-top: var(--s5); }
  .q-actions .primary { flex: 1.618; }
  .q-actions .btn:not(.primary) { flex: 1; }
  .q-mine { padding: var(--s13) var(--s21); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3) var(--s13); align-items: center; }
  .q-mine .nm { font: 600 var(--f16)/21px var(--font); display: flex; align-items: baseline; gap: var(--s8); }
  .q-mine .sub { font-size: var(--f13); line-height: 21px; color: var(--text-2); }

  .rows .row { display: grid; align-items: center; column-gap: var(--s13); padding: var(--s5) var(--s21); min-height: var(--row); border-top: 1px solid var(--line); }
  .rows .row:hover { background: rgba(32, 36, 74, 0.6); }
  .rows .l1 { display: flex; align-items: baseline; gap: var(--s8); font-size: var(--f13); line-height: 21px; min-width: 0; }
  .rows .l1 b { font-weight: 600; white-space: nowrap; }
  .rows .l2 { font-size: var(--f13); line-height: 21px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live-row { grid-template-columns: minmax(0, 1fr) auto; }
  .fin-row { grid-template-columns: 44px minmax(0, 1fr) 104px 44px 16px; }
  .fin-row .tm, .fin-row .du { font-size: var(--f13); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .fin-row .du { color: var(--text); text-align: right; }
  .fin-row > .ic { color: var(--text-2); }
</style>
</head>
<body>
<script>
  const { K, esc, ic, status, direction, shell } = Kiku;
  const waiting = K.calls.find((c) => c.status === 'escalated' && !c.specialist);
  const mine = K.calls.find((c) => c.status === 'escalated' && c.specialist);
  const live = K.calls.filter((c) => c.status === 'in_progress');
  const finished = K.calls.filter((c) => c.status === 'completed' || c.status === 'failed');
  const s = K.stats;
  const liveCount = live.length + K.calls.filter((c) => c.status === 'escalated').length;

  const kind = (c) => (c.direction === 'outbound' ? `Outbound · ${c.type}${c.promo ? ' ' + c.promo : ''}` : 'Inbound');

  const liveRow = (c) => {
    const listening = String(c.specialist || '').includes('listening');
    return `<div class="row live-row" data-item>
      <div style="min-width:0">
        <div class="l1"><b>${esc(c.guest)}</b>${status(c.status)}<span class="num muted">${c.duration}</span></div>
        <div class="l2">${esc(c.direction === 'outbound' ? 'Outbound · ' + c.type : 'Inbound')} · ${esc(c.purpose)}</div>
      </div>
      ${listening
        ? `<a class="btn pressed" href="05-live-call-listening.html">${ic('headphones')}Listening</a>`
        : `<a class="btn" href="05-live-call-listening.html">${ic('headphones')}Listen</a>`}
    </div>`;
  };

  const finRow = (c) => `<a class="row fin-row" data-item href="${c.id === K.audit.id ? '04-call-audit.html' : '03-call-logs.html'}">
      <span class="tm">${c.started}</span>
      <div style="min-width:0"><div class="l1"><b>${esc(c.guest)}</b><span class="muted">${esc(kind(c))}</span></div><div class="l2">${esc(c.outcome || c.purpose)}</div></div>
      ${status(c.status)}
      <span class="du">${c.duration}</span>${ic('chevron-right')}
    </a>`;

  shell({
    role: 'specialist', active: 'live', title: 'Live board',
    sub: `${K.hotel.name} line ${K.hotel.line} · ${liveCount} calls live`,
    content: `
    <div class="split">
      <div class="golden-rows">
        <section class="panel">
          <div class="chart-wrap">
            <div class="chart-key"><h2>Today</h2><p>Each petal is one call, newest at the centre. A longer petal is a longer call. Crosses are failed calls.</p></div>
            <div class="phyllo" id="phyllo"></div>
          </div>
          <p class="totals"><b>${s.callsToday}</b> calls today: <b>${s.inbound}</b> inbound, <b>${s.outbound}</b> outbound:
            ${status('completed', s.completed + ' completed')}, ${status('in_progress', s.inProgress + ' in progress')}, ${status('escalated', s.escalated + ' escalated')}, ${status('failed', s.failed + ' failed')}.<br><b>${s.takeoversToday}</b> takeovers, <b>${s.avgHandle}</b> average handle, <b>${s.upsellValueToday}</b> added by upsell calls.</p>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Recently finished</h2><a class="link t13" href="03-call-logs.html">All call logs</a></div>
          <div class="pane rows" id="fin">${finished.map(finRow).join('')}</div>
        </section>
      </div>
      <div class="golden-rows">
        <section class="panel">
          <div class="panel-head"><h2 class="lg">Needs a specialist <span class="count">${K.calls.filter((c) => c.status === 'escalated').length}</span></h2></div>
          <article class="q-hot">
            <div class="q-top">
              <div>
                <div class="q-meta">${status('escalated')}<span>${direction(waiting)}</span><span class="num">${waiting.started}</span></div>
                <h3 class="q-name">${esc(waiting.guest)}</h3>
                <p class="q-meta num">${esc(waiting.phone)} · ${waiting.duration} on the line</p>
              </div>
              <div class="q-wait"><span>Waiting for you</span><b>${waiting.waiting}</b></div>
            </div>
            <p class="q-purpose">${esc(waiting.purpose)}</p>
            <p class="q-reason">${ic('hand')}${esc(waiting.escalationReason)}</p>
            <div class="q-actions">
              <a class="btn primary lg" href="06-takeover-karaoke.html">${ic('mic')}Take over</a>
              <a class="btn lg" href="05-live-call-listening.html">${ic('headphones')}Listen first</a>
            </div>
          </article>
          <div class="q-mine">
            <div>
              <p class="nm">${esc(mine.guest)} ${status('escalated')}</p>
              <p class="sub">${esc(mine.purpose)}. You took over at ${K.takeover.takeoverAt}.</p>
              <p class="sub">${esc(mine.escalationReason)}</p>
            </div>
            <a class="btn" href="06-takeover-karaoke.html">${ic('mic')}Back to call</a>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>In progress <span class="count">${live.length}</span></h2></div>
          <div class="pane rows">${live.map(liveRow).join('')}</div>
        </section>
      </div>
    </div>`,
  });
  Kiku.done(() => Kiku.fitPane(document.getElementById('fin')), () => Kiku.phyllotaxis(document.getElementById('phyllo')));
</script>
</body>
</html>
