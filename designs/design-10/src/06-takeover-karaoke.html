<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Karaoke takeover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .head-num { font: 600 var(--f21)/1 var(--font); font-variant-numeric: tabular-nums; color: var(--pink); }
  .on-line { display: inline-flex; align-items: center; gap: var(--s8); height: var(--ctl); padding: 0 var(--s13); border-radius: var(--r-ctl); background: var(--pink); color: var(--night); font: 700 var(--f13)/1 var(--font); }

  .prompter { border-color: var(--pink); }
  .prompter-bar { display: flex; align-items: center; justify-content: space-between; gap: var(--s13); padding: var(--s13) var(--s21); background: var(--pink-wash); border-bottom: 1px solid rgba(255, 111, 158, 0.4); }
  .prompter-bar p { display: flex; align-items: center; gap: var(--s8); font: 600 var(--f16)/21px var(--font); color: var(--pink); }
  .prompter-bar p span.muted { font-weight: 400; font-size: var(--f13); }
  .pr-body { padding: var(--s21) var(--s34) var(--s21); display: flex; flex-direction: column; gap: var(--s5); flex: 1; min-height: 0; }
  .pr-lab { display: flex; align-items: center; gap: var(--s8); font: 600 var(--f13)/21px var(--font); }
  .pr-lab.gold { color: var(--gold); }
  .pr-lab.pink { color: var(--pink); }
  .pr-lab .muted { font-weight: 400; }
  .pr-script { font-size: var(--f21); line-height: 34px; color: var(--gold); margin-bottom: var(--s13); }
  .pr-script .cut { color: var(--gold-dim); text-decoration: line-through; text-decoration-thickness: 1px; }
  .pr-script .ahead { color: var(--gold-dim); }
  .pr-said { font: 500 var(--f34)/1.3 var(--font); letter-spacing: -0.015em; color: var(--text); }
  .pr-said .imp { color: var(--pink); text-decoration: underline dotted rgba(255, 111, 158, 0.6); text-decoration-thickness: 2px; text-underline-offset: 8px; }
  .pr-said .caret { display: inline-block; width: 3px; height: 0.95em; background: var(--pink); vertical-align: -0.12em; margin-left: var(--s5); border-radius: 2px; animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .pr-kept { font-size: var(--f13); line-height: 21px; color: var(--text-2); font-variant-numeric: tabular-nums; margin-top: var(--s5); }
  .pr-next { margin-top: auto; padding-top: var(--s13); border-top: 1px dashed var(--line-2); display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--s13); align-items: baseline; }
  .pr-next p:last-child { font-size: var(--f16); line-height: 1.5; color: var(--gold-dim); }

  .lc { display: flex; flex-direction: column; gap: var(--s13); }
  .me { display: flex; align-items: center; gap: var(--s13); }
  .me p { font-size: var(--f13); line-height: 21px; }
  .mic { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: var(--s13); padding: var(--s13); border: 1px solid rgba(255, 111, 158, 0.4); border-radius: var(--r-ctl); background: var(--night); font-size: var(--f13); line-height: 21px; }
  .mic .meter { justify-content: space-between; }
  .mic .ic { color: var(--pink); }
  .ctl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s8); }
  .ctl-grid .wide { grid-column: 1 / -1; }
  .events li { display: grid; grid-template-columns: 44px 16px minmax(0, 1fr); gap: var(--s8); align-items: start; font-size: var(--f13); line-height: 21px; padding: var(--s3) 0; }
  .events .t { color: var(--text-2); font-variant-numeric: tabular-nums; }
  .events .ic { margin-top: 2px; color: var(--text-2); }
  .events li.pink .ic { color: var(--pink); }
  .reason { font-size: var(--f16); line-height: 1.5; margin-bottom: var(--s8); }
  .facts-list li { display: flex; gap: var(--s8); align-items: flex-start; font-size: var(--f13); line-height: 21px; padding: var(--s3) 0; }
  .facts-list .ic { color: var(--text-2); margin-top: 2px; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, status, shell, meter, first, transcriptHtml, avatar, wroteHtml, saidHtml, keptText } = Kiku;
  const T = K.takeover;
  const me = K.people.specialist;
  const liveTurn = T.transcript.find((e) => e.live);
  const history = T.transcript.filter((e) => !e.live);
  const evIcon = { escalation: 'hand', join: 'headphones', takeover: 'mic' };
  const events = T.transcript.filter((e) => e.speaker === 'system');

  shell({
    role: 'specialist', active: 'live', back: '02-live-overview.html', title: esc(T.guest),
    sub: `<span class="num">${T.id}</span> · Inbound on ${K.hotel.line} · started ${T.started} · <span class="num">${esc(T.phone)}</span>`,
    titleExtra: `<span style="margin-left:13px">${status(T.status)}</span>`,
    right: `<span class="on-line">${ic('mic')}You’re on the line</span><span class="head-num" title="Call time">${T.duration}</span>`,
    content: `
    <div class="split">
      <div class="golden-rows inv">
        <section class="panel" aria-label="Earlier in the call">
          <div class="panel-head ruled">
            <h2>Earlier in the call</h2>
            <div class="legend"><span class="sw-gold">Kiku wrote</span><span class="sw-drop">dropped</span><span class="sw-pink">you improvised</span></div>
          </div>
          <div class="pane" id="hist"><div class="transcript">${transcriptHtml(history, { guest: first(T.guest), spec: 'You' })}</div></div>
        </section>
        <section class="panel prompter" aria-label="Karaoke prompter" aria-live="polite">
          <div class="prompter-bar">
            <p>${ic('mic')}You’re speaking to ${esc(T.guest)} <span class="muted">Kiku is writing your lines</span></p>
            ${meter(34, 3, 'pink', (t) => (t < 0.9 ? 0.85 : 0.5))}
          </div>
          <div class="pr-body">
            <p class="pr-lab gold">${ic('scroll-text')}Kiku wrote <span class="muted num">· ${liveTurn.t}</span></p>
            <p class="pr-script">${wroteHtml(liveTurn, true)}</p>
            <p class="pr-lab pink">${ic('audio-lines')}You’re saying <span class="muted">· live</span></p>
            <p class="pr-said">${saidHtml(liveTurn)}<span class="caret" aria-hidden="true"></span></p>
            <p class="pr-kept">${keptText(liveTurn, ' so far')}</p>
            <div class="pr-next">
              <p class="pr-lab gold">${ic('corner-down-right')}Next line</p>
              <p>${esc(T.nextLine)}</p>
            </div>
          </div>
        </section>
      </div>
      <div class="col">
        <section class="panel" aria-label="Call controls">
          <div class="panel-head"><h2>On the line</h2><span class="tag pink">${ic('mic', 'ic-13')}Mic live</span></div>
          <div class="panel-body lc">
            <div class="me">${avatar(me, 'spec')}<div><p class="strong">${esc(me.name)} (you)</p><p class="muted">Took over at ${T.takeoverAt}. Kiku is writing, not speaking.</p></div></div>
            <div class="mic" aria-label="Your microphone level">${ic('mic')}${meter(34, 21, 'pink tall', (t) => (t < 0.85 ? 0.9 : 0.6))}</div>
            <div class="ctl-grid">
              <button class="btn">${ic('mic-off')}Mute my mic</button>
              <button class="btn pink-line">${ic('phone-off')}End call</button>
              <a class="btn wide" href="05-live-call-listening.html">${ic('bot')}Hand back to Kiku</a>
            </div>
          </div>
        </section>
        <section class="panel" aria-label="Escalation">
          <div class="panel-head"><h2>Why it escalated</h2></div>
          <div class="panel-body">
            <p class="reason">${esc(T.escalationReason)}</p>
            <ul class="events">${events.map((e) => `<li class="${e.kind !== 'join' ? 'pink' : ''}"><span class="t">${e.t}</span>${ic(evIcon[e.kind])}<span>${esc(e.text)}</span></li>`).join('')}</ul>
          </div>
        </section>
        <section class="panel fill" aria-label="Booking">
          <div class="panel-head"><h2>Booking <span class="num">${T.booking}</span></h2></div>
          <div class="panel-body">
            <dl class="facts" style="margin-bottom:8px"><dt>Stay</dt><dd>${esc(T.stay)}</dd><dt>Purpose</dt><dd>${esc(T.purpose)}</dd></dl>
            <ul class="facts-list">${T.facts.map((f) => `<li>${ic('receipt')}<span>${esc(f)}</span></li>`).join('')}</ul>
          </div>
        </section>
      </div>
    </div>`,
  });
  Kiku.done(() => {
    Kiku.pinBottom(document.getElementById('hist'), (k) => {
      const kk = history.slice(0, k).filter((e) => e.karaoke).length;
      return `${ic('chevron-up')}<span>Show ${k} earlier entries${kk ? `, including ${kk} more karaoke line${kk > 1 ? 's' : ''}` : ''}</span>`;
    });
    if (window.lucide) window.lucide.createIcons({ attrs: { 'stroke-width': 1.5 } });
  });
</script>
</body>
</html>
