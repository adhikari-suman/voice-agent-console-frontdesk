<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiku · Make a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,300..800;1,400..500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .body { padding: var(--s21); display: flex; flex-direction: column; gap: var(--s13); flex: 1; min-height: 0; }
  .cols { display: inline-flex; gap: var(--s5); align-items: center; }
  .cols code { font: 500 var(--f13)/1 var(--font); padding: var(--s3) var(--s5); border-radius: 5px; background: var(--surface-2); color: var(--text); }
  .tbl-wrap { border: 1px solid var(--line); border-radius: var(--r-ctl); overflow: hidden; }
  .tbl td.purpose { white-space: normal; }
  .tbl td:last-child { white-space: nowrap; }
  .tbl .fix { color: var(--text-2); display: block; }
  .more { padding: var(--s8) var(--s21); font-size: var(--f13); line-height: 21px; color: var(--text-2); border-top: 1px solid var(--line); display: flex; align-items: center; gap: var(--s8); }
  .template { display: flex; align-items: center; gap: var(--s13); padding: var(--s8) var(--s13); border-radius: var(--r-ctl); border: 1px dashed var(--line-2); font-size: var(--f13); line-height: 21px; color: var(--text-2); }
  .template .ic { color: var(--gold); }
  .template .grow { flex: 1; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: var(--s13); padding-top: var(--s13); }

  .single { padding: 0 var(--s21) var(--s21); display: flex; flex-direction: column; gap: var(--s21); flex: 1; min-height: 0; }
  .single .textarea { min-height: 144px; }
  .single .btn.block { margin-top: auto; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, shell, outboundTabs } = Kiku;
  const S = K.makeCallSingle;
  const C = K.makeCallCsv;
  const fixes = { 'Phone number missing': 'Add a number with country code, or remove the row, then upload again.' };

  const row = (r) => {
    const name = r.name ? esc(r.name) : '<span class="none">No name given</span>';
    if (r.ok) return `<tr><td class="rn">${r.row}</td><td style="white-space:nowrap">${esc(r.phone)}</td><td style="white-space:nowrap">${name}</td><td class="purpose">${esc(r.purpose)}</td><td><span class="ok">${ic('circle-check', 'ic-13')}Ready</span></td></tr>`;
    return `<tr class="err"><td class="rn">${r.row}</td><td>${r.phone ? esc(r.phone) : '<span class="missing">Missing</span>'}</td><td style="white-space:nowrap">${name}</td><td class="purpose">${esc(r.purpose)}</td>
      <td><span class="err-msg">${ic('circle-alert', 'ic-13')}<span>${esc(r.error)}</span></span></td></tr>
      <tr class="err"><td></td><td colspan="4" style="padding-top:0"><span class="fix">${fixes[r.error] || ''}</span></td></tr>`;
  };

  shell({
    role: 'admin', active: 'outbound', title: 'Outbound',
    sub: 'Calls Kiku places from the hotel',
    titleExtra: `<span style="margin-left:21px">${outboundTabs('make')}</span>`,
    content: `
    <div class="split">
      <section class="panel" aria-label="Calls from a file">
        <div class="panel-head ruled"><h2 class="lg">Upload a list of calls</h2><span class="t13 muted">One call per row</span></div>
        <div class="body">
          <div class="template">${ic('file-down')}<span class="grow">Start from the template. Columns: <span class="cols">${C.columns.map((c) => `<code>${c}</code>`).join('')}</span></span><a class="link" href="#">Download template</a></div>
          <div class="drop">
            <span class="file-ic">${ic('file-spreadsheet')}</span>
            <div class="grow">
              <p class="fname">${esc(C.file)}</p>
              <p class="fmeta">${C.size} · ${C.rows} rows</p>
            </div>
            <div class="tally" style="gap:13px">
              <span class="k leaf">${ic('circle-check')}<b>${C.ready}</b> ready</span>
              <span class="k pink">${ic('circle-alert')}<b>${C.errors}</b> needs fixing</span>
            </div>
            <button class="btn">${ic('replace')}Replace file</button>
          </div>
          <div class="tbl-wrap">
            <table class="tbl">
              <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th>Check</th></tr></thead>
              <tbody>${C.preview.map(row).join('')}</tbody>
            </table>
            <p class="more">${ic('rows-3', 'ic-13')}${C.rows - C.preview.length} more rows, all ready.</p>
          </div>
          <div class="foot">
            <button class="btn primary lg">${ic('phone-outgoing')}Place ${C.ready} calls</button>
            <p class="help">Row 6 is skipped until it has a phone number. The name column is optional, so row 2 is fine as it is.</p>
          </div>
        </div>
      </section>
      <section class="panel" aria-label="Make one call">
        <div class="panel-head"><h2 class="lg">Make one call</h2></div>
        <div class="single">
          <div class="field">
            <label class="label" for="pp">Purpose <span class="opt">what the call is for</span></label>
            <textarea class="textarea" id="pp" rows="5">${esc(S.purpose)}</textarea>
            <p class="help">Write it the way you’d brief a colleague. Kiku works from this.</p>
          </div>
          <div class="field">
            <label class="label" for="nm">Name <span class="opt">optional</span></label>
            <input class="input lg-text" id="nm" value="${esc(S.name)}">
          </div>
          <div class="field">
            <label class="label" for="ph">Phone</label>
            <input class="input lg-text is-focus" id="ph" value="${esc(S.phone)}">
          </div>
          <button class="btn primary lg block">${ic('phone-outgoing')}Place call</button>
        </div>
      </section>
    </div>`,
  });
  Kiku.done();
</script>
</body>
</html>
