<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Make a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  .wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 14px; padding: 18px 28px 18px; }
  .ttl { display: flex; align-items: baseline; gap: 12px; }
  .ttl h1 { font-size: 26px; }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 470px minmax(0,1fr); gap: 18px; }
  .path { min-height: 0; display: flex; flex-direction: column; }
  .ph2 { padding: 14px 20px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .ph2 .pl { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .ph2 h2 { font-size: 16px; font-weight: 700; }
  .pbody { flex: 1; min-height: 0; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px; }
  .purpose { min-height: 150px; font-size: 15px; line-height: 1.6; }
  .brief { border-left: 3px solid var(--kiku); padding: 10px 14px; background: var(--kiku-wash); font-size: 13px; color: var(--ink-2); }
  .brief b { color: #3E5516; }
  .pfoot { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--paper-2); display: flex; align-items: center; gap: 10px; }
  .pfoot .meta { margin-right: auto; }
  .prev { border: 1px solid var(--line); border-radius: 3px; background: #fff; overflow: hidden; }
  .prev table.grid th { padding-top: 10px; font-size: 11.5px; background: var(--paper-2); }
  .prev table.grid td { padding: 13px 12px; font-size: 13px; vertical-align: top; }
  .prev .rn { color: var(--ink-3); font-variant-numeric: tabular-nums; width: 48px; }
  .prev .nm .none { color: var(--ink-3); font-style: italic; }
  .skip { font-size: 12px; color: var(--ink-3); padding: 6px 12px; background: var(--paper-2); text-align: center; }
  .recent { margin-top: auto; border-top: 1px solid var(--line); padding-top: 12px; }
  .rc { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 13px; }
  .rc:last-child { border-bottom: 0; }
  .tpl { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 3px; font-size: 13px; }
  .tpl .meta { flex: 1; }
</style>
</head>
<body>
<div class="app">
  <div id="shell"></div>
  <main class="main">
    <section class="wrap">
      <div class="ttl"><h1 class="h-serif">Make a call</h1><span class="meta">Tell Kiku who to ring and why. It places the call and handles the conversation.</span></div>
      <div class="paths">
        <section class="panel path" id="single"></section>
        <section class="panel path" id="csv"></section>
      </div>
    </section>
  </main>
</div>
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<script>
const { K, esc } = TT;
TT.shell({ role: "admin", active: "09-outbound-make-a-call.html" });
const m = K.makeCallSingle;
document.getElementById("single").innerHTML = `
  <div class="ph2"><span class="pl">A</span><h2>One call</h2><span class="meta" style="margin-left:auto">Kiku calls straight away</span></div>
  <div class="pbody">
    <div class="field"><label>What is the call for?</label><div class="input area focus purpose">${esc(m.purpose)}</div>
      <span class="meta">Write it the way you'd brief a colleague. Kiku works from this.</span></div>
    <div class="field"><label>Guest name <span class="opt">Optional</span></label><div class="input"><i data-lucide="user-round" style="color:var(--ink-3)"></i>${m.name}</div></div>
    <div class="field"><label>Phone number</label><div class="input"><i data-lucide="phone" style="color:var(--ink-3)"></i><span class="num">${m.phone}</span></div></div>
    <div class="recent"><div class="sec-title" style="font-size:13px;margin-bottom:4px">Earlier today <span class="aside">Calls placed from this page</span></div>
      ${K.calls.filter(x => x.type === "Make a call").map(x => `<div class="rc"><span class="meta num">${x.started}</span><div><b>${x.guest}</b><div class="meta">${esc(x.outcome || x.purpose)}</div></div>${TT.status(x.status)}</div>`).join("")}
    </div>
  </div>
  <div class="pfoot"><span class="meta">Calling ${m.name.split(" ")[0]} on ${m.phone}</span><button class="btn human"><i data-lucide="phone-outgoing"></i>Place call</button></div>`;

const c = K.makeCallCsv;
const ok = c.preview.filter(r => r.ok), bad = c.preview.filter(r => !r.ok);
const row = r => `<tr class="${r.ok ? "" : "err"}"><td class="rn">${r.row}</td><td class="num" style="white-space:nowrap">${r.phone || '<span class="missing">Missing</span>'}</td><td class="nm">${r.name || '<span class="none">No name</span>'}</td><td>${r.ok ? esc(r.purpose) : `${esc(r.purpose)}<div class="rowerr" style="margin-top:4px;display:flex"><i data-lucide="circle-alert" style="width:14px;height:14px"></i>${r.error}</div>`}</td></tr>`;
document.getElementById("csv").innerHTML = `
  <div class="ph2"><span class="pl">B</span><h2>Many calls from a CSV</h2><span class="meta" style="margin-left:auto">Columns</span><span class="cols">${c.columns.map(x => `<code>${x}</code>`).join("")}</span></div>
  <div class="pbody">
    <div class="filechip"><span class="ic">CSV</span><div><div class="name">${c.file}</div><div class="meta">${c.size}, ${c.rows} rows</div></div>
      <div class="tally" style="margin-left:auto"><span class="ok"><i data-lucide="circle-check"></i>${c.ready} ready</span><span class="bad"><i data-lucide="circle-alert"></i>${c.errors} error</span><button class="btn sm ghost"><i data-lucide="refresh-cw"></i>Replace file</button></div></div>
    <div class="prev">
      <table class="grid"><thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>What the call is for</th></tr></thead>
      <tbody>${ok.map(row).join("")}<tr><td colspan="4" class="skip">${c.ready - ok.length} more ready rows</td></tr>${bad.map(row).join("")}</tbody></table>
    </div>
    <div class="tpl"><i data-lucide="file-down" style="color:var(--ink-2)"></i><span class="meta">Start from the template so the columns match: phone, name (optional), purpose. One call per row.</span><button class="btn sm"><i data-lucide="download"></i>Download template</button></div>
  </div>
  <div class="pfoot"><span class="meta">Row ${bad[0].row} will be skipped until it has a phone number</span><button class="btn human"><i data-lucide="phone-outgoing"></i>Place ${c.ready} calls</button></div>`;
TT.icons();
</script>
</body>
</html>
