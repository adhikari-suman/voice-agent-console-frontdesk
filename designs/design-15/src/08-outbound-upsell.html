<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Upsell calls</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .page { display: grid; grid-template-rows: auto 1fr; gap: 16px; }
  .offers { display: grid; grid-template-columns: auto repeat(3, 1fr); gap: 12px; align-items: stretch; }
  .offers .lead { display: grid; align-content: center; padding-right: 8px; max-width: 200px; }
  .offer { padding: 14px 16px; display: grid; grid-template-columns: 34px 1fr; gap: 1px 12px; align-content: start; }
  .offer > :not(.oi) { grid-column: 2; }
  .offer .oi { grid-row: span 4; width: 34px; height: 34px; border-radius: 9px; background: var(--teal-soft); color: var(--teal); display: grid; place-items: center; }
  .offer b { font-weight: 700; font-size: 14.5px; }
  .offer .pr { font-weight: 700; font-size: 13.5px; color: var(--teal); }
  .offer .alt { font-size: 12px; color: var(--ink-2); }
  .two { display: grid; grid-template-columns: 430px minmax(0,1fr); gap: 16px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane .hd { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .pane .hd .n { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; transform: translateY(-1px); }
  .pane .bd { padding: 16px 20px; display: grid; gap: 14px; align-content: start; min-height: 0; }
  .pane .ft { margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .match { display: flex; gap: 10px; padding: 11px 13px; border-radius: 9px; background: var(--teal-soft); font-size: 13px; align-items: flex-start; }
  .match svg { color: var(--teal); margin-top: 1px; }
  .tg { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
  .tg:last-child { border-bottom: 0; }
  .tg small { grid-column: 1; font-size: 12px; color: var(--ink-3); }
  .sw { grid-row: span 2; width: 36px; height: 20px; border-radius: 10px; background: var(--teal); position: relative; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 18px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
  .sw.off { background: var(--line); } .sw.off::after { left: 2px; }
  .prev td { height: 38px; font-size: 13px; }
  .prev tr.bad td { background: var(--fail-soft); }
  .prev .err { color: var(--fail); font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .prev .err svg { width: 13px; height: 13px; }
  .missing { color: var(--fail); font-style: italic; }
</style>
</head>
<body data-role="admin">
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="page" id="page"></div>
  </main>
</div>
<script>
$("#rail").innerHTML = rail("admin", "upsell");
$("#top").innerHTML = topbar("Upsell calls", `<span>Outbound</span>${ic("chevron-right")}`);
const U = K.upsellSingle, V = K.upsellCsv;
const oIcon = { pickup: "car-front", breakfast: "coffee", dinner: "utensils" };
const okSvg = STATUS.completed[1].replace("<svg", '<svg width="14" height="14"');
const erSvg = STATUS.failed[1].replace("<svg", '<svg width="14" height="14"');

$("#page").innerHTML = `
<div class="offers">
  <div class="lead"><span class="h2">What Kiku offers</span><span class="small muted">Guests can take any mix of these on an existing booking.</span></div>
  ${K.offers.map(o => `<div class="card offer"><span class="oi">${ic(oIcon[o.id])}</span><b>${o.name}</b><span class="pr">${o.price}</span><span class="small muted">${esc(o.detail)}</span>${o.alt ? `<span class="alt">${o.alt}</span>` : ""}</div>`).join("")}
</div>
<div class="two">
  <section class="card pane">
    <div class="hd"><span class="n">1</span><span class="h2">Call one guest</span></div>
    <div class="bd">
      <div class="row" style="gap:12px;align-items:start">
        <div class="field grow"><label>Phone</label><div class="input">${esc(U.phone)}</div></div>
        <div class="field grow"><label>Confirmation number</label><div class="input focus">${U.confirmation}</div></div>
      </div>
      <div class="match">${ic("circle-check")}<div><b style="font-weight:600">Booking found</b><br><span class="dim">${esc(U.match)}</span></div></div>
      <div>
        <div class="h3" style="margin-bottom:2px">Offers to mention</div>
        ${K.offers.map(o => `<div class="tg"><span>${o.name}</span><span class="sw" role="switch" aria-checked="true"></span><small>${o.price}</small></div>`).join("")}
      </div>
    </div>
    <div class="ft"><span class="small muted">Kiku calls now and hands over if the guest needs a person.</span><button class="btn ink" style="margin-left:auto">${ic("phone-outgoing")}Call now</button></div>
  </section>

  <section class="card pane">
    <div class="hd"><span class="n">2</span><span class="h2">Upload a list</span><span class="small muted">CSV with columns ${V.columns.map(c => `<span class="tok">${c}</span>`).join(" ")}</span></div>
    <div class="bd" style="overflow:hidden">
      <div class="file"><span class="ic">CSV</span><div class="grow"><b style="font-weight:600">${V.file}</b><div class="small muted">${V.size}, ${V.rows} rows</div></div>
        <div class="okerr"><span class="ok">${okSvg}${V.ready} ready</span><span class="er">${erSvg}${V.errors} errors</span></div><button class="btn sm ghost">Replace</button></div>
      <table class="tbl prev">
        <thead><tr><th>Row</th><th>Phone</th><th>Confirmation</th><th>Booking</th><th>Check</th></tr></thead>
        <tbody>${V.preview.map((r, i) => `${i === 4 ? `<tr><td colspan="5" class="small muted" style="height:30px">${V.ready - 4} more rows ready</td></tr>` : ""}<tr class="${r.ok ? "" : "bad"}">
          <td class="muted">${r.row}</td><td>${esc(r.phone)}</td><td>${r.confirmation || '<span class="missing">empty</span>'}</td>
          <td>${r.guest ? esc(r.guest) : '<span class="muted">No match</span>'}</td>
          <td>${r.ok ? `<span class="st st-completed">${STATUS.completed[1]}Ready</span>` : `<span class="err">${erSvg}${esc(r.error)}</span>`}</td></tr>`).join("")}</tbody>
      </table>
    </div>
    <div class="ft"><span class="small muted">The ${V.errors} rows with errors are skipped. Fix them in the file and upload again to include them.</span><button class="btn ink" style="margin-left:auto">${ic("phone-outgoing")}Start ${V.ready} calls</button></div>
  </section>
</div>`;
boot();
</script>
</body>
</html>
