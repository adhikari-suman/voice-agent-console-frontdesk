<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Make a call</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .page { display: grid; grid-template-rows: auto 1fr; gap: 16px; }
  .two { display: grid; grid-template-columns: 430px minmax(0,1fr); gap: 16px; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; }
  .pane .hd { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
  .pane .hd .n { width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: #fff; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; transform: translateY(-1px); }
  .pane .bd { padding: 16px 20px; display: grid; gap: 16px; align-content: start; min-height: 0; }
  .pane .ft { margin-top: auto; padding: 12px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .prev td { height: 44px; font-size: 13px; }
  .prev tr.bad td { background: var(--fail-soft); }
  .prev .err { color: var(--fail); font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .prev .err svg { width: 13px; height: 13px; }
  .missing { color: var(--fail); font-style: italic; }
  .intro { font-size: 15px; color: var(--ink-2); max-width: 820px; }
  .purpose { font-family: var(--serif); font-size: 17px; line-height: 1.5; min-height: 120px; }
  .tpl { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 9px; font-size: 13px; }
</style>
</head>
<body data-role="admin">
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="page" id="page"></div>
  </main>
</div>
<script>
$("#rail").innerHTML = rail("admin", "make");
$("#top").innerHTML = topbar("Make a call", `<span>Outbound</span>${ic("chevron-right")}`);
const M = K.makeCallSingle, V = K.makeCallCsv;
const okSvg = STATUS.completed[1].replace("<svg", '<svg width="14" height="14"');
const erSvg = STATUS.failed[1].replace("<svg", '<svg width="14" height="14"');

$("#page").innerHTML = `
<p class="intro">Tell Kiku why it's calling in plain words. It opens the call with that purpose, handles the conversation, and escalates to a specialist if the guest needs a person.</p>
<div class="two">
  <section class="card pane">
    <div class="hd"><span class="n">1</span><span class="h2">One call</span></div>
    <div class="bd">
      <div class="field"><label>Purpose <em>What should Kiku get done?</em></label><div class="input area purpose focus">${esc(M.purpose)}</div><span class="hint">Kiku reads this as instructions. The guest doesn't hear it word for word.</span></div>
      <div class="field"><label>Name <em>optional</em></label><div class="input">${esc(M.name)}</div><span class="hint">Leave empty and Kiku won't greet the guest by name.</span></div>
      <div class="field"><label>Phone</label><div class="input">${esc(M.phone)}</div></div>
    </div>
    <div class="ft"><span class="small muted">Kiku dials straight away.</span><button class="btn ink" style="margin-left:auto">${ic("phone-outgoing")}Place call</button></div>
  </section>

  <section class="card pane">
    <div class="hd"><span class="n">2</span><span class="h2">Many calls from a CSV</span><span class="small muted">Columns ${V.columns.map(c => `<span class="tok">${c}</span>`).join(" ")}</span></div>
    <div class="bd" style="overflow:hidden">
      <div class="tpl">${ic("file-down")}<span class="grow">Start from the template so the columns match: phone, name (optional), purpose. One call per row.</span><button class="btn sm">${ic("download")}Download template</button></div>
      <div class="file"><span class="ic">CSV</span><div class="grow"><b style="font-weight:600">${V.file}</b><div class="small muted">${V.size}, ${V.rows} rows</div></div>
        <div class="okerr"><span class="ok">${okSvg}${V.ready} ready</span><span class="er">${erSvg}${V.errors} error</span></div><button class="btn sm ghost">Replace</button></div>
      <table class="tbl prev" style="table-layout:fixed"><colgroup><col style="width:48px"><col style="width:150px"><col style="width:110px"><col><col style="width:196px"></colgroup>
        <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th>Check</th></tr></thead>
        <tbody>${V.preview.map((r, i) => `${i === 4 ? `<tr><td colspan="5" class="small muted" style="height:30px">${V.ready - 4} more rows ready</td></tr>` : ""}<tr class="${r.ok ? "" : "bad"}">
          <td class="muted">${r.row}</td><td>${r.phone ? esc(r.phone) : '<span class="missing">empty</span>'}</td><td>${r.name ? esc(r.name) : '<span class="muted">No name</span>'}</td>
          <td style="padding-top:9px;padding-bottom:9px;line-height:1.4">${esc(r.purpose)}</td>
          <td>${r.ok ? `<span class="st st-completed">${STATUS.completed[1]}Ready</span>` : `<span class="err">${erSvg}${esc(r.error)}</span>`}</td></tr>`).join("")}</tbody>
      </table>
      <span class="hint">Showing the first rows and every row with an error.</span>
    </div>
    <div class="ft"><span class="small muted">Row 6 is skipped until it has a phone number.</span><button class="btn ink" style="margin-left:auto">${ic("phone-outgoing")}Place ${V.ready} calls</button></div>
  </section>
</div>`;
boot();
</script>
</body>
</html>
