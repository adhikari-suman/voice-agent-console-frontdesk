<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Campaign calls</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .page { display: grid; grid-template-columns: 470px minmax(0,1fr); gap: 18px; }
  .list { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .camp { padding: 16px 18px; display: grid; gap: 10px; }
  .camp.sel { border: 1.5px solid var(--ink); box-shadow: 0 0 0 3px var(--line-2); }
  .camp .code { font-size: 20px; font-weight: 800; letter-spacing: -0.01em; }
  .camp .nm { font-size: 13px; color: var(--ink-2); }
  .cst { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 6px; background: var(--line-2); color: var(--ink-2); margin-left: auto; }
  .cst.paused { background: var(--esc-soft); color: var(--esc); }
  .cst.sched { background: var(--prog-soft); color: var(--prog); }
  .cst svg.lucide { width: 14px; height: 14px; }
  .funnel { height: 12px; display: flex; border-radius: 3px; overflow: hidden; background: var(--line-2); }
  .funnel i { display: block; height: 100%; }
  .nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .nums div { display: grid; }
  .nums b { font-size: 17px; font-weight: 700; }
  .nums span { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
  .nums span::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c); flex: none; }
  .meta { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .meta span { display: inline-flex; gap: 6px; align-items: center; }
  .meta svg.lucide { width: 14px; height: 14px; color: var(--ink-3); }
  .setup { display: flex; flex-direction: column; min-height: 0; }
  .setup .hd { padding: 18px 24px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
  .setup .hd h2 { font-size: 20px; font-weight: 800; }
  .setup .bd { padding: 18px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; align-content: start; }
  .full { grid-column: 1 / -1; }
  .days { display: flex; gap: 4px; }
  .days span { width: 36px; height: 32px; display: grid; place-items: center; border-radius: 7px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--line); color: var(--ink-3); background: #fff; }
  .days span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: #fff; height: 38px; }
  .step button { width: 38px; height: 36px; display: grid; place-items: center; color: var(--ink-2); }
  .step b { width: 40px; text-align: center; font-size: 15px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); line-height: 36px; }
  .opening { display: block; font-family: var(--serif); font-size: 19px; line-height: 1.55; padding: 16px 18px; min-height: 140px; }
  .ft { margin-top: auto; padding: 14px 24px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
</style>
</head>
<body data-role="admin">
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="page" id="page"></div>
  </main>
</div>
<script>
$("#rail").innerHTML = rail("admin", "campaign");
$("#top").innerHTML = topbar("Campaign calls", `<span>Outbound</span>${ic("chevron-right")}`);
const D = K.campaignDraft;
const stIcon = (s) => s.startsWith("Paused") ? ["paused", "circle-pause"] : s.startsWith("Scheduled") ? ["sched", "calendar-clock"] : ["draft", "pencil-line"];
function progress(c) {
  if (!c.called) return "";
  const pct = (n) => (n / c.contacts * 100) + "%";
  const answeredOther = c.answered - c.booked, noAnswer = c.called - c.answered - c.failed;
  return `<div class="funnel" role="img" aria-label="${c.called} of ${c.contacts} called">
    <i style="width:${pct(c.booked)};background:var(--teal)"></i><i style="width:${pct(answeredOther)};background:#7fb8a9"></i><i style="width:${pct(noAnswer)};background:#c4d3ce"></i><i style="width:${pct(c.failed)};background:var(--fail)"></i></div>
  <div class="nums">
    <div><b>${c.contacts}</b><span style="--c:var(--line)">contacts</span></div>
    <div><b>${c.called}</b><span style="--c:#c4d3ce">called</span></div>
    <div><b>${c.answered}</b><span style="--c:#7fb8a9">answered</span></div>
    <div><b>${c.booked}</b><span style="--c:var(--teal)">booked</span></div>
    <div><b>${c.failed}</b><span style="--c:var(--fail)">failed</span></div>
  </div>`;
}
const opening = esc(D.opening).replace("{first_name}", '<span class="tok">{first_name}</span>');
const burns = K.campaigns.find(c => c.code === D.code);

$("#page").innerHTML = `
<div class="list">
  <div class="row"><span class="h2">Campaigns</span><span class="small muted">${K.campaigns.length}</span><button class="btn sm" style="margin-left:auto">${ic("plus")}New campaign</button></div>
  ${K.campaigns.map(c => { const [cls, icn] = stIcon(c.status); return `
  <section class="card camp ${c.code === D.code ? "sel" : ""}">
    <div class="row"><span class="code">${c.code}</span><span class="cst ${cls}">${ic(icn)}${esc(c.status)}</span></div>
    <div class="nm"><b style="color:var(--ink);font-weight:600">${esc(c.name)}.</b> ${esc(c.offer)}</div>
    ${progress(c)}
    <div class="meta"><span>${ic("file-spreadsheet")}${esc(c.audience)}${c.contacts && !c.called ? `, ${c.contacts} contacts` : ""}</span><span>${ic("clock")}${esc(c.window)}</span></div>
    ${c.code === "AUTUMN26" ? `<div class="row" style="gap:8px"><button class="btn sm">${ic("play")}Resume now</button><span class="xs muted">Resumes on its own Mon 10:00</span></div>` : ""}
  </section>`; }).join("")}
</div>
<section class="card setup">
  <div class="hd"><h2>${D.code}</h2><span class="dim">${esc(burns.name)}</span><span class="cst draft" style="margin-left:8px">${ic("pencil-line")}Draft</span><span class="small muted" style="margin-left:auto">Setting up</span></div>
  <div class="bd">
    <div class="field"><label>Promo code</label><div class="input" style="font-weight:700;letter-spacing:.02em">${D.code}</div></div>
    <div class="field"><label>Offer</label><div class="input" style="font-size:13px;height:auto;min-height:38px;padding:8px 12px">${esc(burns.offer)}</div></div>
    <div class="field full"><label>Audience</label>
      <div class="file"><span class="ic">CSV</span><div class="grow"><b style="font-weight:600">${D.file}</b><div class="small muted">${D.rows} rows uploaded</div></div>
        <div class="okerr"><span class="ok">${STATUS.completed[1].replace('<svg', '<svg width="14" height="14"')}${D.ready} ready</span><span class="er">${STATUS.failed[1].replace('<svg', '<svg width="14" height="14"')}${D.errors} rows need fixing</span></div>
        <button class="btn sm">Review errors</button></div>
      <span class="hint">Rows with errors are skipped. Kiku calls the ${D.ready} ready contacts.</span>
    </div>
    <div class="field"><label>Call window</label>
      <div class="row"><span class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<span class="${i<5?"on":""}">${d}</span>`).join("")}</span></div>
      <div class="row"><div class="input" style="width:96px">10:00</div><span class="muted">to</span><div class="input" style="width:96px">18:00</div><span class="small muted">${K.hotel.tz}</span></div>
    </div>
    <div class="field"><label>Max attempts per contact</label>
      <div class="row"><span class="step"><button aria-label="Fewer">${ic("minus")}</button><b>${D.maxAttempts}</b><button aria-label="More">${ic("plus")}</button></span><span class="hint">Kiku retries unanswered calls on the next day in the window.</span></div>
    </div>
    <div class="field full"><label>Opening line <em>What Kiku says first. Insert fields with { }.</em></label>
      <div class="input area opening">${opening}</div>
      <span class="hint row" style="gap:6px"><span class="tok">{first_name}</span>comes from the first_name column of ${D.file}</span>
    </div>
  </div>
  <div class="ft"><span class="small muted">${D.ready} calls, ${D.window}, up to ${D.maxAttempts} attempts each</span><button class="btn" style="margin-left:auto">Save draft</button><button class="btn ink">${ic("calendar-check")}Schedule campaign</button></div>
</section>`;
boot();
</script>
</body>
</html>
