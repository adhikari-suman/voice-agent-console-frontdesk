<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Call logs</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .page { display: grid; grid-template-rows: auto 1fr; gap: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .fg { display: flex; gap: 6px; align-items: center; }
  .fg > .lbl { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
  .search { width: 280px; height: 32px; }
  .chip .st svg { width: 12px; height: 12px; }
  .chip.on .st { color: #fff; }
  .tablecard { display: flex; flex-direction: column; min-height: 0; padding-top: 14px; }
  .tbl td.pur { max-width: 300px; }
  .guest b { font-weight: 600; display: block; }
  .guest span { font-size: 12px; color: var(--ink-3); }
  .go { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink-3); }
  tr.sel .go { background: var(--ink); color: #fff; }
  .guest b, .guest span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .selhint { font-size: 11.5px; font-weight: 600; color: var(--lime-ink); display: block; }
  .foot { display: flex; justify-content: space-between; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); }
</style>
</head>
<body data-role="specialist">
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="page" id="page"></div>
  </main>
</div>
<script>
$("#rail").innerHTML = rail("specialist", "logs");
$("#top").innerHTML = topbar("Call logs");
const C = K.calls;
const count = (f) => C.filter(f).length;
const stChip = (s) => `<span class="chip">${statusTag(s)}<span class="c">${count(c => c.status === s)}</span></span>`;

$("#page").innerHTML = `
<div class="filters">
  <div class="input search">${ic("search")}<span class="muted small">Search guest, phone or purpose</span></div>
  <span class="chip on">${ic("calendar")}Today, 27 Sep</span>
  <div class="fg"><span class="lbl">Status</span><span class="chip on">All <span class="c">${C.length}</span></span>${["completed", "in_progress", "escalated", "failed"].map(stChip).join("")}</div>
  <div class="fg"><span class="lbl">Direction</span><span class="seg-ctl"><span class="on">All</span><span>Inbound ${count(c => c.direction === "inbound")}</span><span>Outbound ${count(c => c.direction === "outbound")}</span></span></div>
  <div class="fg"><span class="lbl">Type</span><span class="chip">Any type ${ic("chevron-down")}</span></div>
</div>
<section class="card tablecard">
  <div class="scroll fade" style="flex:1">
  <table class="tbl" style="table-layout:fixed"><colgroup><col style="width:76px"><col style="width:190px"><col style="width:200px"><col><col style="width:128px"><col style="width:70px"><col style="width:156px"><col style="width:58px"></colgroup>
    <thead><tr><th style="padding-left:18px">Time</th><th>Guest</th><th>Direction and type</th><th>What the call was for</th><th>Status</th><th>Length</th><th>Specialist</th><th></th></tr></thead>
    <tbody>
    ${C.map(c => `<tr class="${c.id === "KK-24027" ? "sel" : ""}">
      <td style="padding-left:18px"><b style="font-weight:600">${c.started}</b></td>
      <td class="guest"><b>${esc(c.guest)}</b><span>${esc(c.phone)}</span></td>
      <td><div class="row" style="gap:8px">${dirTag(c.direction)}${c.direction === "outbound" ? `<span class="tag">${c.type}</span>` : ""}</div></td>
      <td class="pur"><div class="ell" title="${esc(c.purpose)}">${esc(c.purpose)}</div>${c.id === "KK-24027" ? `<span class="selhint">Karaoke call: ${K.audit.karaokeSummary.lines} lines, ${K.audit.karaokeSummary.improvised} improvised</span>` : ""}</td>
      <td>${statusTag(c.status)}</td>
      <td>${c.duration}</td>
      <td class="small ${c.specialist ? "" : "muted"}">${c.specialist ? esc(c.specialist) : "Kiku only"}</td>
      <td><a class="go" href="04-call-audit.html" aria-label="Open audit">${ic("chevron-right")}</a></td>
    </tr>`).join("")}
    </tbody>
  </table>
  </div>
  <div class="foot"><span>${C.length} calls shown, newest first</span><span>Times in ${K.hotel.tz}</span></div>
</section>`;
boot();
</script>
</body>
</html>
