<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Call audit KK-24027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .face { padding-top: 18px; }
  .head { margin-bottom: 14px; align-items: flex-start; }
  .head .h1 { font-size: 26px; }
  .head .meta { margin-top: 6px; }
  .audit { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 336px; gap: 22px; }
  .left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  .deck { padding: 12px 16px 12px; }
  .transport { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .counter { font-size: 17px; font-weight: 600; padding: 0 12px; height: 36px; display: inline-flex; align-items: center; border-radius: 8px; background: var(--face); box-shadow: var(--inset); margin: 0 6px; }
  .counter span { color: var(--label); font-weight: 500; margin-left: 6px; }
  .transport .jump { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .jump .key .ico.amber { color: #9A6A08; }
  .jump .key .ico.orange { color: var(--orange-edge); }

  .tape { display: grid; grid-template-columns: 82px 1fr; column-gap: 10px; }
  .tape-lbls { display: grid; grid-template-rows: 20px 20px 26px 26px; row-gap: 6px; }
  .tl { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600; }
  .tape-body { position: relative; display: grid; grid-template-rows: 20px 20px 26px 26px; row-gap: 6px; }
  .ruler { position: relative; border-bottom: 1px solid var(--rule-2); }
  .ruler i { position: absolute; bottom: 0; width: 1px; height: 4px; background: #9C9B95; }
  .ruler i.major { height: 7px; background: var(--graphite); }
  .ruler b { position: absolute; bottom: 8px; font-size: 10.5px; font-weight: 500; color: var(--label); transform: translateX(-50%); }
  .lane { position: relative; border-radius: 5px; background: #E0DFDA; box-shadow: inset 0 1px 2px rgba(43,43,42,.2); }
  .seg { position: absolute; top: 4px; bottom: 4px; border-radius: 3px; display: grid; place-items: center; }
  .seg .ico { font-size: 12px; }
  .seg--spoken { background: var(--graphite); }
  .seg--script { border: 1px solid var(--graphite); background: var(--face); }
  .seg--voice { background: var(--dark); color: var(--face); }
  .seg--voice.is-improv::after { content: ''; position: absolute; left: 1px; right: 1px; bottom: -3px; height: 2px; border-radius: 1px; background: var(--orange); }
  .mk { position: absolute; top: 2px; bottom: -3px; width: 0; border-left: 1.5px solid; }
  .mk--esc { border-color: var(--amber); }
  .mk--join { border-left: 1px dashed var(--graphite); }
  .mk--take { border-color: var(--orange); }
  .mk-tag { position: absolute; top: -2px; z-index: 1; font-size: 11px; font-weight: 600; white-space: nowrap; display: flex; align-items: center; gap: 4px; padding: 0 6px; height: 18px; border-radius: 4px; background: var(--face); box-shadow: 0 0 0 1px var(--rule-2); }
  .mk-tag .ico { font-size: 12px; }
  .mk--esc .mk-tag { right: 5px; } .mk--esc .mk-tag .ico { color: #9A6A08; }
  .mk--take .mk-tag { left: 5px; } .mk--take .mk-tag .ico { color: var(--orange-edge); }
  .ph { position: absolute; top: 45px; bottom: -6px; width: 0; border-left: 2px solid var(--dark); }
  .ph::before { content: ''; position: absolute; left: -6px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--dark); box-shadow: 0 0 0 2px var(--panel); }
  .played { position: absolute; left: 0; top: 20px; height: 2px; background: var(--dark); }
  .tape-note { display: flex; align-items: center; gap: 16px; margin-top: 10px; padding-left: 92px; font-size: 11.5px; color: var(--label); }
  .tape-note span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 18px; height: 9px; border-radius: 2px; display: inline-block; }

  .history { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .history .display-head { padding: 11px 18px 10px; }
  .legend { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12px; color: var(--graphite); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .msgs { flex: 1; }

  .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .side section { border-top: 1px solid var(--rule-2); padding-top: 12px; }
  .side section:first-child { border-top: 0; padding-top: 0; }
  .side .h3 { margin-bottom: 9px; display: flex; align-items: baseline; gap: 10px; }
  .side .dl { grid-template-columns: 78px 1fr; gap: 6px 12px; font-size: 13px; }
  .reason { display: flex; gap: 8px; font-size: 13px; }
  .reason .ico { color: #9A6A08; font-size: 16px; margin-top: 1px; }

  .ksum { font-size: 13px; color: var(--graphite); }
  .ksum b { color: var(--dark); }
  .faders { display: grid; grid-template-columns: repeat(7, 1fr); padding: 10px 8px 8px; margin-top: 10px; }
  .fader { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .fv { font-size: 11px; font-weight: 600; height: 14px; display: flex; align-items: center; gap: 2px; margin-bottom: 4px; }
  .fv .ico { font-size: 12px; }
  .slot { position: relative; width: 4px; height: 58px; border-radius: 2px; background: #BDBCB6; box-shadow: inset 0 1px 1px rgba(43,43,42,.4); }
  .cap { position: absolute; left: 50%; width: 22px; height: 10px; margin-left: -11px; margin-bottom: -5px; border-radius: 3px; background: var(--key); border: 1px solid #B9B8B1; box-shadow: inset 0 1px 0 #fff, 0 1px 1.5px rgba(43,43,42,.35); }
  .cap::after { content: ''; position: absolute; left: 3px; right: 3px; top: 3.5px; height: 1px; background: var(--graphite); }
  .fader.is-exact .cap { background: var(--dark); border-color: var(--dark); }
  .fader.is-exact .cap::after { background: var(--face); }
  .ft { font-size: 10.5px; color: var(--label); }
  .fader-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--label); margin-top: 6px; }

  .out li { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--rule); align-items: start; }
  .out li .ico { font-size: 16px; margin-top: 1px; }
  .out li.is-declined { color: var(--graphite); }
  .out li .amt { font-weight: 600; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 9px 0 8px; font-size: 13px; }
  .total b { font-size: 20px; font-weight: 600; }
  .note { display: flex; gap: 8px; font-size: 13px; padding: 9px 11px; border-radius: 8px; background: var(--panel); box-shadow: var(--inset); }
  .note .ico { font-size: 16px; margin-top: 1px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head" id="head"></header>
    <div class="audit">
      <div class="left">
        <section class="display deck" id="deck" aria-label="Recording"></section>
        <section class="display history">
          <div class="display-head"><h2 class="h3">Message history</h2><div class="legend" id="legend"></div></div>
          <div class="scroll msgs" id="msgs"></div>
        </section>
      </div>
      <aside class="side" id="side"></aside>
    </div>
  </main>
</div>
<script>
  const { K, esc, ico, status, lamp, secs, mmss, first } = Kiku;
  Kiku.shell({ role: 'specialist', active: 'logs' });
  const a = K.audit;
  const who = first(a.specialist);
  const tr = a.transcript;
  const total = secs(a.duration);
  const pct = (t) => (secs(t) / total * 100).toFixed(3) + '%';
  const at = (kind) => tr.find(e => e.kind === kind).t;

  document.querySelector('#head').innerHTML = `
    <a class="key key--icon" href="03-call-logs.html" aria-label="Back to call logs">${ico('arrow-left')}</a>
    <div class="grow">
      <div class="head-title"><h1 class="h1">${esc(a.guest)}</h1>${status(a.status)}</div>
      <div class="meta">${ico('phone-outcome')}<span>Outbound · ${a.type}</span><span class="sep"></span><span>${esc(a.phone)}</span><span class="sep"></span><span>${a.id}</span><span class="sep"></span><span>${a.started}</span><span class="sep"></span><span>${a.duration}</span></div>
    </div>`;

  /* tape deck */
  const playAt = '00:58';
  let ruler = '';
  for (let s = 0; s <= total; s += 10) ruler += `<i class="${s % 30 === 0 ? 'major' : ''}" style="left:${(s / total * 100).toFixed(3)}%"></i>${s % 30 === 0 ? `<b style="left:${(s / total * 100).toFixed(3)}%">${mmss(s)}</b>` : ''}`;
  let laneA = '', laneB = '';
  tr.forEach((e, i) => {
    const next = tr[i + 1] || { t: a.duration };
    const l = pct(e.t), w = ((secs(next.t) - secs(e.t)) / total * 100 - 0.5).toFixed(3) + '%';
    if (e.speaker === 'agent') laneA += `<span class="seg seg--spoken" style="left:${l};width:${w}" title="Kiku spoke ${e.t}"></span>`;
    if (e.karaoke) {
      laneA += `<span class="seg seg--script" style="left:${l};width:${w}" title="Kiku wrote ${e.t}">${e.asWritten ? ico('check') : ''}</span>`;
      laneB += `<span class="seg seg--voice ${e.asWritten ? '' : 'is-improv'}" style="left:${l};width:${w}" title="${who} said ${e.t}">${e.asWritten ? ico('check') : ''}</span>`;
    }
  });
  const markers = `
    <span class="mk mk--esc" style="left:${pct(at('escalation'))}"><span class="mk-tag">${ico('warning-triangle')}escalated ${at('escalation')}</span></span>
    <span class="mk mk--join" style="left:${pct(at('join'))}"></span>
    <span class="mk mk--take" style="left:${pct(at('takeover'))}"><span class="mk-tag">${ico('microphone')}takeover ${a.takeoverAt}</span></span>
    <span class="ph" style="left:${pct(playAt)}"></span>`;
  document.querySelector('#deck').innerHTML = `
    <div class="transport">
      <button class="key key--icon" aria-label="Back 10 seconds">${ico('rewind')}</button>
      <button class="key key--icon key--dark" aria-label="Play">${ico('play-solid')}</button>
      <button class="key key--icon" aria-label="Forward 10 seconds">${ico('forward')}</button>
      <span class="counter">${playAt}<span>/ ${a.duration}</span></span>
      <div class="jump"><span class="lbl">jump to</span>
        <button class="key key--sm">${ico('warning-triangle', 'amber')}escalation ${at('escalation')}</button>
        <button class="key key--sm is-down" aria-pressed="true">${ico('microphone', 'orange')}takeover ${a.takeoverAt}</button>
      </div>
    </div>
    <div class="tape">
      <div class="tape-lbls"><div></div><div></div><div class="tl"><span class="trk">A</span>Kiku</div><div class="tl"><span class="trk trk--b">B</span>${esc(who)}</div></div>
      <div class="tape-body">
        <div></div>
        <div class="ruler">${ruler}</div>
        <div class="lane">${laneA}</div>
        <div class="lane">${laneB}</div>
        ${markers}
      </div>
    </div>
    <div class="tape-note">
      <span><i class="sw" style="background:var(--graphite)"></i>Kiku speaking</span>
      <span><i class="sw" style="border:1px solid var(--graphite);background:var(--face)"></i>Kiku's script, not spoken</span>
      <span><i class="sw" style="background:var(--dark);border-bottom:2px solid var(--orange)"></i>${esc(who)} improvising</span>
      <span>${ico('check')}spoken as written</span>
    </div>`;

  document.querySelector('#legend').innerHTML = `
    <span><span class="trk">A</span>Kiku wrote</span>
    <span><span class="trk trk--b">B</span>${esc(who)} said</span>
    <span><span class="k-ins">underlined</span> improvised</span>
    <span><span class="k-del">struck</span> dropped</span>`;
  const playing = tr.findIndex(e => e.t === '00:54');
  const pane = document.querySelector('#msgs');
  pane.innerHTML = Kiku.transcript(tr, { guest: a.guest, specialist: a.specialist, playing });
  requestAnimationFrame(() => {
    const rows = [...pane.children];
    const start = rows[tr.findIndex(e => e.kind === 'escalation') - 1].offsetTop - 4;
    const fit = rows.filter(r => r.offsetTop + r.offsetHeight <= start + pane.clientHeight).pop();
    pane.scrollTop = fit.offsetTop + fit.offsetHeight + 6 - pane.clientHeight;
  });

  /* side */
  const ks = a.karaokeSummary;
  const turns = tr.filter(e => e.karaoke);
  const faders = turns.map(t => `<div class="fader ${t.asWritten ? 'is-exact' : ''}">
      <span class="fv">${t.asWritten ? ico('check') : ''}${t.match}</span>
      <span class="slot"><i class="cap" style="bottom:${t.match}%"></i></span>
      <span class="ft">${t.t}</span></div>`).join('');
  const outcome = a.outcome.map(o => `<li class="${o.result === 'declined' ? 'is-declined' : ''}">${ico(o.result === 'added' ? 'check' : 'xmark')}<span>${esc(o.item)}<span class="lbl" style="display:block">${o.result}</span></span><span class="amt">${o.amount}</span></li>`).join('');
  document.querySelector('#side').innerHTML = `
    <section>
      <h2 class="h3">Call</h2>
      <dl class="dl">
        <dt>booking</dt><dd class="strong">${a.booking}</dd>
        <dt>stay</dt><dd>${esc(a.stay)}</dd>
        <dt>purpose</dt><dd>${esc(a.purpose)}</dd>
        <dt>agent</dt><dd>${a.agent}</dd>
        <dt>specialist</dt><dd class="row gap-8">${Kiku.knob(Kiku.initials(a.specialist), 'knob--sm')}${esc(a.specialist)}</dd>
      </dl>
      <p class="reason" style="margin-top:10px">${ico('warning-triangle')}<span>${esc(a.escalationReason)}</span></p>
    </section>
    <section>
      <h2 class="h3">Karaoke</h2>
      <p class="ksum"><b>${ks.lines}</b> lines from ${esc(who)} · <b>${ks.asWritten}</b> as written · <b>${ks.improvised}</b> improvised</p>
      <div class="display faders" aria-label="Match with Kiku's script, per line">${faders}</div>
      <div class="fader-axis"><span>match with Kiku's script, per line</span></div>
    </section>
    <section>
      <h2 class="h3">Outcome</h2>
      <ul class="out">${outcome}</ul>
      <div class="total"><span class="muted">added to ${a.booking}</span><b>${a.total}</b></div>
      <p class="note">${ico('page-edit')}<span>${esc(a.note)}</span></p>
    </section>`;
</script>
</body>
</html>
