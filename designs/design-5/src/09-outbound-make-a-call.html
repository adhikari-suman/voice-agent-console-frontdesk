<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Outbound, make a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .head { margin-bottom: 18px; }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 430px 1fr; gap: 22px; }
  .path { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .path-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px; border-bottom: 1px solid var(--rule); }
  .path-head .ico { font-size: 20px; }
  .path-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
  .path-foot { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--rule); }
  .path-foot .help { flex: 1; }
  .cols { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label); }
  .tpl { display: flex; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .tpl p { font-size: 13px; color: var(--graphite); flex: 1; }
  .tpl p b { color: var(--dark); font-weight: 600; }
  .prev { border-radius: 10px; background: var(--face); border: 1px solid var(--rule-2); overflow: hidden; }
  .prev .tbl th { background: var(--panel); padding-top: 8px; padding-bottom: 7px; }
  .prev .tbl td { font-size: 13px; padding-top: 7px; padding-bottom: 7px; line-height: 1.4; }
  .prev .tbl tr.is-error td { background: #F7EEEA; }
  .prev .why { display: block; font-size: 12px; color: var(--graphite); margin-top: 2px; }
  .prev .gap td { text-align: center; color: var(--label); font-size: 12px; padding: 3px; background: var(--panel); }
  .none { color: var(--label); }
  .purpose-in { min-height: 118px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head">
      <div class="grow head-title"><h1 class="h1">Outbound calls</h1><span class="meta">A general call for any purpose you describe.</span></div>
      <div id="tabs"></div>
    </header>
    <div class="paths">
      <section class="display path" id="single" aria-label="Place one call"></section>
      <section class="display path" id="csv" aria-label="Upload a list"></section>
    </div>
  </main>
</div>
<script>
  const { K, esc, ico, lamp } = Kiku;
  Kiku.shell({ role: 'admin', active: 'out' });
  document.querySelector('#tabs').innerHTML = Kiku.outboundTabs('make');
  const m = K.makeCallSingle, v = K.makeCallCsv;

  document.querySelector('#single').innerHTML = `
    <div class="path-head">${ico('phone-outcome')}<h2 class="h3">Place one call</h2></div>
    <div class="path-body">
      <div class="field"><label class="field-lbl" for="pu">purpose<span class="opt">what Kiku should get done</span></label>
        <textarea class="input purpose-in" id="pu" rows="4">${esc(m.purpose)}</textarea>
        <p class="help">Write it the way you'd brief a colleague. Kiku opens the call with it.</p></div>
      <div class="field"><label class="field-lbl" for="nm">name<span class="opt">optional</span></label><input class="input" id="nm" value="${esc(m.name)}" placeholder="Leave blank if you don't know it"></div>
      <div class="field"><label class="field-lbl" for="ph">phone</label><input class="input" id="ph" value="${esc(m.phone)}"></div>
    </div>
    <div class="path-foot"><p class="help">Kiku calls straight away.</p><button class="key key--orange key--lg">${ico('phone-outcome')}place call</button></div>`;

  const bad = v.preview.filter(r => !r.ok);
  const rows = v.preview.map((r, i) => {
    const prev = v.preview[i - 1];
    const gap = prev && r.row - prev.row > 1 ? `<tr class="gap"><td colspan="5">${r.row - prev.row > 2 ? `rows ${prev.row + 1}–${r.row - 1}` : `row ${prev.row + 1}`} ready</td></tr>` : '';
    return gap + `<tr class="${r.ok ? '' : 'is-error'}">
      <td>${r.row}</td>
      <td>${r.phone ? esc(r.phone) : `<span class="err">${ico('warning-circle')}${esc(r.error)}</span><span class="why">Add a number, or delete the row.</span>`}</td>
      <td>${r.name ? esc(r.name) : '<span class="none">no name</span>'}</td>
      <td>${esc(r.purpose)}</td>
      <td>${r.ok ? `<span class="ok" aria-label="Ready">${ico('check')}</span>` : ''}</td></tr>`;
  }).join('') + (v.preview.at(-1).row < v.rows ? `<tr class="gap"><td colspan="5">rows ${v.preview.at(-1).row + 1}–${v.rows} ready</td></tr>` : '');

  document.querySelector('#csv').innerHTML = `
    <div class="path-head">${ico('multiple-pages')}<h2 class="h3">Upload a list</h2><span class="cols" style="margin-left:auto">columns${v.columns.map(c => `<span class="token">${esc(c)}</span>`).join('')}</span></div>
    <div class="path-body">
      <div class="drop">
        <div class="cart"><span class="cart-ico">${ico('page')}</span>
          <div class="grow"><div class="cart-name">${esc(v.file)}</div><div class="tally" style="margin-top:3px"><span class="muted">${v.size} · ${v.rows} rows</span><span>${ico('check')}<b>${v.ready}</b> ready</span><span class="err">${ico('warning-circle')}${v.errors} error</span></div></div>
          <button class="key key--sm">${ico('upload')}replace</button></div>
      </div>
      <div class="prev"><table class="tbl">
        <colgroup><col style="width:56px"><col style="width:196px"><col style="width:128px"><col><col style="width:42px"></colgroup>
        <thead><tr><th>row</th><th>phone</th><th>name</th><th>purpose</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <div class="tpl"><p>Starting a new list? The template has the <b>phone</b>, <b>name</b> and <b>purpose</b> columns ready. Leave name blank when you don't have one.</p><button class="key key--sm">${ico('download')}template.csv</button></div>
    </div>
    <div class="path-foot"><p class="help">Row ${bad.map(r => r.row).join(', ')} is skipped until it has a phone number.</p><button class="key key--dark key--lg">${ico('phone-outcome')}start ${v.ready} calls</button></div>`;
</script>
</body>
</html>
