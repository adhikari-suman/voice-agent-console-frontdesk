<!doctype html>
<html lang="en">
<head>
<title>Kiku · Make a call</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  .main { flex-direction: column; gap: 16px; }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .path-b { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .recent { margin-top: auto; border-top: 1px solid var(--rule-2); padding-top: 12px; }
  .recent h3 { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 4px; }
  .rc { display: grid; grid-template-columns: 44px 130px minmax(0,1fr) 112px; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 12.5px; line-height: 18px; border-bottom: 1px solid var(--rule-2); }
  .rc:last-child { border-bottom: 0; }
  .rc .o { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pfoot { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--rule); flex: none; }
  .purpose { font-size: 15px; line-height: 24px; min-height: 120px; border-color: var(--slate); }
  .brief { border-radius: var(--r-m); background: var(--kiku-soft); padding: 12px 14px; display: flex; gap: 10px; font-size: 13px; line-height: 19px; color: var(--kiku); }
  table.grid td { height: auto; padding-top: 9px; padding-bottom: 9px; font-size: 12.5px; line-height: 18px; vertical-align: top; }
  .rn { color: var(--ink-3); width: 36px; }
  .tmpl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px dashed var(--slate); border-radius: var(--r-m); font-size: 12.5px; color: var(--ink-2); }
  .tmpl a { color: var(--kiku); font-weight: 650; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; margin-left: auto; white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
  <div id="shell"></div>
  <main class="main" id="main"></main>
</div>
<script>
const { K, esc } = D;
D.mount(D.shell({ role: "admin", active: "make" }));
const S = K.makeCallSingle, C = K.makeCallCsv;
const failSq = `<svg width="13" height="13" viewBox="0 0 14 14" style="flex:none"><rect x=".8" y=".8" width="12.4" height="12.4" rx="2" fill="currentColor"/><path d="M4.6 4.6l4.8 4.8M9.4 4.6l-4.8 4.8" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>`;
const rows = C.preview.map(r => `<tr class="${r.ok ? "" : "rowerr"}">
  <td class="rn num">${r.row}</td>
  <td class="num" style="white-space:nowrap">${r.phone ? esc(r.phone) : `<span class="why">${failSq}Missing</span>`}</td>
  <td style="white-space:nowrap">${r.name ? esc(r.name) : '<span class="muted">No name</span>'}</td>
  <td>${esc(r.purpose)}${r.ok ? "" : `<div class="why" style="margin-top:2px">${esc(r.error)}. Add a number or the row is skipped.</div>`}</td>
</tr>`).join("");

const recent = (type) => K.calls.filter(c => c.type === type).map(c => `<div class="rc"><span class="num muted">${c.started}</span><b style="font-weight:600">${esc(c.guest)}</b><span class="o">${esc(c.outcome || c.purpose)}</span>${D.status(c.status)}</div>`).join("");
document.getElementById("main").innerHTML = `
<div><h1 class="page">Make a call</h1><div class="page-sub">Tell Kiku why it's calling. It handles the conversation and logs the result.</div></div>
<div class="paths">
  <section class="panel">
    <div class="panel-h"><i data-lucide="phone"></i><h2>One call</h2><span class="sub">Write the purpose in plain words</span></div>
    <div class="path-b">
      <div class="field"><label>Purpose</label><textarea class="input purpose" rows="4">${esc(S.purpose)}</textarea></div>
      <div class="two">
        <div class="field"><label>Name <span class="opt">optional</span></label><div class="input filled">${esc(S.name)}</div></div>
        <div class="field"><label>Phone</label><div class="input filled num">${S.phone}</div></div>
      </div>
      <div class="brief"><i data-lucide="message-square-quote" style="margin-top:2px"></i><div>Kiku opens by name when you give one, then explains the purpose and asks what the guest would like.</div></div>
      <div class="recent"><h3>Placed today</h3>${recent("Make a call")}</div>
    </div>
    <div class="pfoot"><span class="muted" style="font-size:12.5px">The call appears on the Live board once it connects.</span><button class="btn primary" style="margin-left:auto"><i data-lucide="phone-outgoing"></i>Place call</button></div>
  </section>
  <section class="panel">
    <div class="panel-h"><i data-lucide="file-spreadsheet"></i><h2>Many calls from a CSV</h2><span class="sub">One purpose per row</span></div>
    <div class="path-b">
      <div class="file">
        <div class="ico"><i data-lucide="file-spreadsheet"></i></div>
        <div style="flex:1"><b>${C.file}</b><div class="meta num">${C.size}, ${C.rows} rows</div></div>
        <div class="tally num"><span class="ok"><i data-lucide="circle-check"></i>${C.ready} ready</span><span class="bad">${failSq}${C.errors} error</span></div>
        <button class="btn sm ghost">Replace</button>
      </div>
      <div class="scroll">
        <table class="grid">
          <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="tmpl"><i data-lucide="table-2"></i><span>Columns: <b class="code">${C.columns.join(", ")}</b></span><a href="#"><i data-lucide="download"></i>Download template</a></div>
    </div>
    <div class="pfoot"><span class="muted" style="font-size:12.5px">Showing 4 of ${C.ready} ready rows and the error.</span><button class="btn primary" style="margin-left:auto"><i data-lucide="phone-outgoing"></i>Place ${C.ready} calls</button></div>
  </section>
</div>`;
D.icons();
</script>
</body>
</html>
