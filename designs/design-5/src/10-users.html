<!doctype html>
<html lang="en">
<head>
<title>Kiku · Users</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  .main { display: grid; grid-template-columns: minmax(0,1fr) 400px; gap: 20px; }
  .left { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  table.grid td { height: 56px; }
  .person { display: flex; align-items: center; gap: 12px; }
  .person b { display: block; font-weight: 650; line-height: 18px; }
  .person span { font-size: 12px; color: var(--ink-3); }
  .avatar.sp { background: var(--human); }
  .avatar.ad { background: var(--ink); }
  .avatar.off { background: var(--slate); }
  .ust { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; }
  .ust.Active { color: var(--ok); }
  .ust.Invited { color: var(--kiku); }
  .ust.Deactivated { color: var(--ink-3); }
  .tk { display: flex; align-items: center; gap: 10px; }
  .tk .bar { width: 80px; height: 6px; border-radius: 3px; background: var(--paper); overflow: hidden; }
  .tk .bar b { display: block; height: 100%; background: var(--human); }
  tr.off td { color: var(--ink-3); }
  tr.new td { background: #FFF8FA; }

  .drawer { display: flex; flex-direction: column; }
  .drawer .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; }
  .rolepick { display: flex; flex-direction: column; gap: 10px; }
  .role { border: 1px solid var(--rule); border-radius: var(--r-m); padding: 12px 14px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; }
  .role.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--slate); margin-top: 1px; display: grid; place-items: center; }
  .role.on .radio { border-color: var(--ink); }
  .role.on .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--ink); }
  .role b { font-weight: 650; }
  .role ul { grid-column: 2; list-style: none; }
  .role li { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 7px; align-items: center; line-height: 21px; }
  .role li svg.lucide { width: 13px; height: 13px; color: var(--ok); }
  .role.dim li svg.lucide { color: var(--ink-3); }
  .dfoot { margin-top: auto; padding: 14px 20px; border-top: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; }
</style>
</head>
<body>
<div class="app">
  <div id="shell"></div>
  <main class="main" id="main"></main>
</div>
<script>
const { K, esc } = D;
D.mount(D.shell({ role: "admin", active: "users" }));
const U = K.users, N = K.newUserDraft;
const max = Math.max(...U.map(u => u.takeovers30d));
const stIcon = {
  Active: `<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>`,
  Invited: `<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg>`,
  Deactivated: `<svg width="13" height="13" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.2 10.8l7.6-7.6" stroke="currentColor" stroke-width="1.6"/></svg>`,
};
const rows = U.map(u => `<tr class="${u.status === "Deactivated" ? "off" : ""}">
  <td><div class="person"><span class="avatar ${u.status === "Deactivated" ? "off" : u.role === "Admin" ? "ad" : "sp"}">${u.initials}</span><div><b>${esc(u.name)}</b><span>${esc(u.email)}</span></div></div></td>
  <td>${u.role}</td>
  <td><span class="ust ${u.status}">${stIcon[u.status]}${u.status}</span></td>
  <td>${esc(u.lastActive)}</td>
  <td><div class="tk"><span class="num" style="width:22px;text-align:right">${u.takeovers30d}</span><span class="bar"><b style="width:${u.takeovers30d / max * 100}%"></b></span></div></td>
</tr>`).join("") + `<tr class="new"><td><div class="person"><span class="avatar off">GM</span><div><b>${esc(N.name)}</b><span>${esc(N.email)}</span></div></div></td><td>${N.role}</td><td><span class="ust Invited" style="color:var(--ink-3)"><i data-lucide="pencil-line" style="width:13px;height:13px"></i>Not sent yet</span></td><td class="muted">—</td><td></td></tr>`;

const counts = s => U.filter(u => u.status === s).length;
const roleCard = (r, on) => `<div class="role ${on ? "on" : "dim"}"><span class="radio"></span><b>${r}</b><ul>${K.roles[r].map(p => `<li><i data-lucide="check"></i>${esc(p)}</li>`).join("")}</ul></div>`;

document.getElementById("main").innerHTML = `
<section class="left">
  <div style="display:flex;align-items:flex-end;gap:16px">
    <div><h1 class="page">Users</h1><div class="page-sub">${U.length} people: ${counts("Active")} active, ${counts("Invited")} invited, ${counts("Deactivated")} deactivated.</div></div>
    <div class="input" style="margin-left:auto;width:280px"><i data-lucide="search" style="color:var(--ink-3)"></i><span class="muted">Search name or email</span></div>
  </div>
  <div class="panel" style="flex:1">
    <div class="scroll" style="padding:12px 8px 0">
      <table class="grid">
        <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th>Takeovers, 30 days</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>
</section>
<aside class="panel drawer" aria-label="Invite a user">
  <div class="panel-h"><i data-lucide="user-plus"></i><h2>Invite a user</h2><button class="btn sm ghost end" aria-label="Close"><i data-lucide="x"></i></button></div>
  <div class="body">
    <div class="field"><label>Full name</label><div class="input filled">${esc(N.name)}</div></div>
    <div class="field"><label>Work email</label><div class="input filled">${esc(N.email)}</div></div>
    <div class="field"><label>Role</label>
      <div class="rolepick">${roleCard("Specialist", N.role === "Specialist")}${roleCard("Admin", N.role === "Admin")}</div>
    </div>
    <div class="hint">Grace gets an email with a link to set her password. The invite shows as Invited until she signs in.</div>
  </div>
  <div class="dfoot"><button class="btn">Cancel</button><button class="btn primary" style="margin-left:auto"><i data-lucide="send"></i>Send invite</button></div>
</aside>`;
D.icons();
</script>
</body>
</html>
