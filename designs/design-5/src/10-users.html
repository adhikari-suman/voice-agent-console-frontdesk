<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .head { margin-bottom: 18px; }
  .users { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 372px; gap: 22px; }
  .people { overflow: hidden; align-self: start; }
  .people .tbl td, .people .tbl th { padding-left: 8px; padding-right: 8px; }
  .people .tbl td:first-child, .people .tbl th:first-child { padding-left: 16px; }
  .people .tbl td { height: 60px; padding-top: 8px; padding-bottom: 8px; }
  .person { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .person .nm { font-weight: 600; font-size: 14px; }
  .person .em { font-size: 12px; color: var(--graphite); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tr.is-off .person .nm, tr.is-off td { color: var(--graphite); }
  .role { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .role .ico { font-size: 16px; color: var(--graphite); }
  .tk { display: flex; align-items: center; gap: 8px; }
  .tk b { font-weight: 600; width: 22px; text-align: right; }
  .tk .match-bar { width: 44px; height: 6px; }
  .act { visibility: hidden; }
  tr.is-hover .act { visibility: visible; }

  .panel { display: flex; flex-direction: column; min-height: 0; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px 20px; border-bottom: 1px solid var(--rule); }
  .panel-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; }
  .panel-foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--rule); }
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; border-radius: 12px; background: #E6E5E0; box-shadow: var(--inset); }
  .rolekey { --h: auto; height: auto; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 10px; padding: 12px 12px 14px; white-space: normal; text-align: left; border-radius: 9px; }
  .rolekey .top { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: 0; }
  .rolekey ul { display: flex; flex-direction: column; gap: 6px; }
  .rolekey li { display: flex; gap: 7px; font-size: 12.5px; font-weight: 500; line-height: 1.35; letter-spacing: 0; color: var(--dark); }
  .rolekey li .ico { font-size: 14px; margin-top: 1px; }
  .rolekey:not(.is-down) li { color: var(--graphite); }
  .invite-note { display: flex; gap: 9px; font-size: 13px; color: var(--graphite); padding-top: 12px; border-top: 1px solid var(--rule); }
  .invite-note .ico { font-size: 17px; color: var(--dark); margin-top: 1px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head">
      <div class="grow head-title"><h1 class="h1">Users</h1><span class="meta" id="meta"></span></div>
      <button class="key is-down" aria-pressed="true" aria-controls="panel" id="newkey">new user</button>
    </header>
    <div class="users">
      <section class="display people"><table class="tbl" id="tbl"></table></section>
      <section class="display panel" id="panel" aria-label="New user"></section>
    </div>
  </main>
</div>
<script>
  const { K, esc, ico, lamp } = Kiku;
  Kiku.shell({ role: 'admin', active: 'users' });
  document.querySelector('#newkey').innerHTML = `${ico('user-plus')}new user`;
  const us = K.users;
  const n = (s) => us.filter(u => u.status === s).length;
  document.querySelector('#meta').innerHTML = `<span>${us.length} people</span><span class="sep"></span><span>${n('Active')} active</span><span class="sep"></span><span>${n('Invited')} invited</span><span class="sep"></span><span>${n('Deactivated')} deactivated</span>`;

  const max = Math.max(...us.map(u => u.takeovers30d));
  const stat = (s) => `<span class="status">${lamp(s === 'Active' ? 'green' : null)}${s}</span>`;
  const rows = us.map(u => `<tr class="${u.status === 'Deactivated' ? 'is-off' : ''} ${u.name === 'Tomasz Nowak' ? 'is-hover' : ''}">
    <td><div class="person">${Kiku.knob(u.initials)}<div style="min-width:0"><div class="nm">${esc(u.name)}</div><div class="em">${esc(u.email)}</div></div></div></td>
    <td><span class="role">${ico(u.role === 'Admin' ? 'key' : 'headset')}${u.role}</span></td>
    <td>${stat(u.status)}</td>
    <td>${esc(u.lastActive)}</td>
    <td>${u.role === 'Specialist' ? `<div class="tk"><b>${u.takeovers30d}</b><span class="match-bar"><i style="width:${(u.takeovers30d / max * 100).toFixed(1)}%"></i></span></div>` : '<span class="muted">—</span>'}</td>
    <td><button class="key key--sm key--icon act" aria-label="Edit ${esc(u.name)}">${ico('edit-pencil')}</button></td>
  </tr>`).join('');
  document.querySelector('#tbl').innerHTML = `<colgroup><col><col style="width:100px"><col style="width:112px"><col style="width:124px"><col style="width:90px"><col style="width:44px"></colgroup>
    <thead><tr><th>person</th><th>role</th><th>status</th><th>last active</th><th style="white-space:normal;line-height:1.25">takeovers, 30 days</th><th></th></tr></thead><tbody>${rows}</tbody>`;

  const d = K.newUserDraft;
  const roleKey = (r) => `<button class="key rolekey ${r === d.role ? 'is-down' : ''}" role="radio" aria-checked="${r === d.role}">
      <span class="top">${lamp(r === d.role ? 'green' : null)}${r}</span>
      <ul>${K.roles[r].map(p => `<li>${ico('check')}<span>${esc(p)}</span></li>`).join('')}</ul></button>`;
  document.querySelector('#panel').innerHTML = `
    <div class="panel-head"><h2 class="h2">New user</h2><button class="key key--sm key--icon" style="margin-left:auto" aria-label="Close">${ico('xmark')}</button></div>
    <div class="panel-body">
      <div class="field"><label class="field-lbl" for="nm">full name</label><input class="input" id="nm" value="${esc(d.name)}"></div>
      <div class="field"><label class="field-lbl" for="em">work email</label><input class="input" id="em" value="${esc(d.email)}"></div>
      <div class="field"><span class="field-lbl" id="rl">role</span><div class="roles" role="radiogroup" aria-labelledby="rl">${roleKey('Specialist')}${roleKey('Admin')}</div></div>
      <p class="invite-note">${ico('mail')}<span>${esc(d.name.split(' ')[0])} gets an email invite to set a password. Until then the account shows as Invited.</span></p>
    </div>
    <div class="panel-foot"><button class="key key--lg">cancel</button><button class="key key--orange key--lg" style="margin-left:auto">${ico('send-diagonal')}send invite</button></div>`;
</script>
</body>
</html>
