<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  body { display: grid; place-items: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .unit {
    width: 800px; display: grid; grid-template-columns: 280px 1fr; gap: 0;
    background: var(--face); border-radius: 16px; padding: 28px;
    box-shadow: 0 1px 2px rgba(43,43,42,.16), 0 10px 28px rgba(43,43,42,.09), inset 0 1px 0 #fff;
  }
  .plate { display: flex; flex-direction: column; padding: 4px 32px 2px 0; border-right: 1px solid var(--rule-2); }
  .plate .hotel { font-size: 22px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; margin-top: 22px; }
  .plate .tag { font-size: 13px; color: var(--graphite); margin-top: 4px; }
  .plate .spec { margin-top: auto; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; }
  .plate .spec dt { font-size: 12px; color: var(--label); letter-spacing: .02em; }
  .panel { padding: 4px 4px 2px 36px; display: flex; flex-direction: column; gap: 16px; }
  .panel .h1 { font-size: 24px; margin-bottom: 2px; }
  .panel .key--orange { margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <main class="unit">
    <div class="plate" id="plate"></div>
    <form class="panel" onsubmit="return false">
      <h1 class="h1">Sign in</h1>
      <div class="field">
        <label class="field-lbl" for="email">email</label>
        <input class="input" id="email" type="email" autocomplete="username">
      </div>
      <div class="field">
        <div class="field-lbl"><label for="pw">password</label><a href="#">Forgot password?</a></div>
        <input class="input is-focus" id="pw" type="password" value="brenlow-desk-2026" autocomplete="current-password">
      </div>
      <a class="key key--orange key--lg key--block" href="02-live-overview.html">sign in</a>
    </form>
  </main>
  <p class="foot" id="foot"></p>
</div>
<script>
  const { K, esc } = Kiku;
  document.querySelector('#email').value = K.people.specialist.email;
  document.querySelector('.key--orange').innerHTML = Kiku.ico('log-in') + 'sign in';
  const [day, dd, mon, yr] = K.hotel.today.split(' ');
  document.querySelector('#plate').innerHTML = `
    <div><span class="badge badge--lg">kiku</span></div>
    <p class="hotel">${esc(K.hotel.name)}, ${esc(K.hotel.city)}</p>
    <p class="tag">${esc(K.product.tagline)}</p>
    <dl class="spec">
      <dt>hotel line</dt><dd>${esc(K.hotel.line)}</dd>
      <dt>local time</dt><dd>${K.hotel.now} ${K.hotel.tz} · ${day.slice(0,3)} ${dd} ${mon.slice(0,3)}</dd>
    </dl>`;
  document.querySelector('#foot').textContent = K.synthetic;
</script>
</body>
</html>
