<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Outbound upsell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .head { margin-bottom: 16px; }
  .offers-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 10px; }
  .offers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 13px; background: #E6E5E0; box-shadow: var(--inset); margin-bottom: 20px; }
  .offer { --h: auto; height: auto; display: grid; grid-template-columns: 12px 1fr; align-items: start; gap: 3px 12px; padding: 12px 16px 13px 14px; text-align: left; white-space: normal; border-radius: 9px; justify-content: stretch; }
  .offer .lamp { margin-top: 5px; }
  .offer > span:not(.lamp) { grid-column: 2; letter-spacing: 0; }
  .offer .nm { font-size: 15px; font-weight: 600; }
  .offer .dt { font-size: 12.5px; font-weight: 500; color: var(--graphite); }
  .offer .pr { font-size: 13.5px; font-weight: 600; margin-top: 3px; }
  .offer .pr i { font-style: normal; font-weight: 500; color: var(--graphite); margin-left: 8px; }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 430px 1fr; gap: 22px; }
  .path { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .path-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 12px; border-bottom: 1px solid var(--rule); }
  .path-head .ico { font-size: 20px; }
  .path-body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
  .path-foot { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-top: 1px solid var(--rule); }
  .path-foot .help { flex: 1; }
  .found { display: flex; gap: 10px; padding: 11px 13px; border-radius: 8px; background: var(--face); box-shadow: var(--inset); }
  .found .ico { font-size: 18px; margin-top: 1px; }
  .found b { display: block; font-size: 13px; font-weight: 600; }
  .found span { font-size: 13.5px; }
  .will { font-size: 13px; color: var(--graphite); }
  .will b { color: var(--dark); font-weight: 600; }
  .cols { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--label); }
  .prev { border-radius: 10px; background: var(--face); border: 1px solid var(--rule-2); overflow: hidden; }
  .prev .tbl th { background: var(--panel); padding-top: 8px; padding-bottom: 7px; }
  .prev .tbl td { font-size: 13px; padding-top: 6px; padding-bottom: 6px; }
  .prev .tbl tr.is-error td { background: #F7EEEA; }
  .prev .why { display: block; font-size: 12px; color: var(--graphite); font-weight: 400; margin-top: 1px; }
  .prev .gap td { text-align: center; color: var(--label); font-size: 12px; padding: 3px; background: var(--panel); }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head">
      <div class="grow head-title"><h1 class="h1">Outbound calls</h1></div>
      <div id="tabs"></div>
    </header>
    <div class="offers-head"><h2 class="h2">Upsell offers</h2><p class="help" style="font-size:13px">Kiku offers what's switched on, on every upsell call from this page.</p></div>
    <div class="offers" id="offers" role="group" aria-label="Offers"></div>
    <div class="paths">
      <section class="display path" id="single" aria-label="Call one booking"></section>
      <section class="display path" id="csv" aria-label="Upload a list"></section>
    </div>
  </main>
</div>
<script>
  const { K, esc, ico, lamp } = Kiku;
  Kiku.shell({ role: 'admin', active: 'out' });
  document.querySelector('#tabs').innerHTML = Kiku.outboundTabs('upsell');
  const u = K.upsellSingle, v = K.upsellCsv;
  const on = new Set(u.offers);

  document.querySelector('#offers').innerHTML = K.offers.map(o => `
    <button class="key offer ${on.has(o.id) ? 'is-down' : ''}" aria-pressed="${on.has(o.id)}">
      ${lamp(on.has(o.id) ? 'green' : null)}<span class="nm">${esc(o.name)}</span>
      <span class="dt">${esc(o.detail)}</span><span class="pr">${esc(o.price)}${o.alt ? `<i>${esc(o.alt)}</i>` : ''}</span>
    </button>`).join('');

  document.querySelector('#single').innerHTML = `
    <div class="path-head">${ico('phone-outcome')}<h2 class="h3">Call one booking</h2></div>
    <div class="path-body">
      <div class="field"><label class="field-lbl" for="ph">guest phone</label><input class="input" id="ph" value="${esc(u.phone)}"></div>
      <div class="field"><label class="field-lbl" for="cf">confirmation number</label><input class="input strong" id="cf" value="${u.confirmation}"></div>
      <div class="found">${ico('check')}<div><b>Booking found</b><span>${esc(u.match)}</span></div></div>
      <p class="will">Kiku will offer <b>${u.offers.map(id => K.offers.find(o => o.id === id).name.toLowerCase()).join(', ').replace(/, ([^,]*)$/, ' and $1')}</b>.</p>
    </div>
    <div class="path-foot"><p class="help">Kiku calls straight away.</p><button class="key key--orange key--lg">${ico('phone-outcome')}call now</button></div>`;

  const rows = v.preview.map((r, i) => {
    const gap = i > 0 && r.row - v.preview[i - 1].row > 1 ? `<tr class="gap"><td colspan="5">rows ${v.preview[i - 1].row + 1}–${r.row - 1} ready</td></tr>` : '';
    const why = r.ok ? '' : r.error === 'Phone number too short'
      ? `<span class="why">"${esc(r.phone)}" has ${r.phone.replace(/\D/g, '').length} digits. Use the full number with its country code.</span>`
      : `<span class="why">Add the BRN confirmation number for this phone.</span>`;
    return gap + `<tr class="${r.ok ? '' : 'is-error'}">
      <td>${r.row}</td><td>${esc(r.phone) || '<span class="muted">empty</span>'}</td><td>${r.confirmation || '<span class="muted">empty</span>'}</td>
      <td>${r.ok ? esc(r.guest) : `<span class="err">${ico('warning-circle')}${esc(r.error)}</span>${why}`}</td>
      <td>${r.ok ? `<span class="ok" aria-label="Ready">${ico('check')}</span>` : ''}</td></tr>`;
  }).join('') + (v.preview.at(-1).row < v.rows ? `<tr class="gap"><td colspan="5">rows ${v.preview.at(-1).row + 1}–${v.rows} ready</td></tr>` : '');
  document.querySelector('#csv').innerHTML = `
    <div class="path-head">${ico('multiple-pages')}<h2 class="h3">Upload a list</h2><span class="cols" style="margin-left:auto">columns<span class="token">phone</span><span class="token">confirmation</span></span></div>
    <div class="path-body">
      <div class="drop">
        <div class="cart"><span class="cart-ico">${ico('page')}</span>
          <div class="grow"><div class="cart-name">${esc(v.file)}</div><div class="tally" style="margin-top:3px"><span class="muted">${v.size} · ${v.rows} rows</span><span>${ico('check')}<b>${v.ready}</b> ready</span><span class="err">${ico('warning-circle')}${v.errors} errors</span></div></div>
          <button class="key key--sm">${ico('upload')}replace</button></div>
      </div>
      <div class="prev"><table class="tbl">
        <colgroup><col style="width:58px"><col style="width:150px"><col style="width:112px"><col><col style="width:44px"></colgroup>
        <thead><tr><th>row</th><th>phone</th><th>confirmation</th><th>booking found</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>
    <div class="path-foot"><p class="help">Rows ${v.preview.filter(r => !r.ok).map(r => r.row).join(' and ')} are skipped. Fix them in the file and upload it again to include them.</p><button class="key key--dark key--lg">${ico('phone-outcome')}start ${v.ready} calls</button></div>`;
</script>
</body>
</html>
