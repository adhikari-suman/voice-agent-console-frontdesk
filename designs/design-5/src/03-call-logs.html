<!doctype html>
<html lang="en">
<head>
<title>Kiku · Call logs</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,CRSV,MONO@-15..0,300..1000,0..1,0..1,0..1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  .filters { width: 220px; flex: none; display: flex; flex-direction: column; gap: 20px; }
  .fgroup h3 { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 6px; }
  .opt { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-m); font-size: 13.5px; }
  .opt .n { margin-left: auto; font-size: 12px; color: var(--ink-3); }
  .opt { height: 30px; }
  .opt:hover { background: var(--surface); }
  .box { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--slate); flex: none; display: grid; place-items: center; }
  .opt.on .box { background: var(--ink); border-color: var(--ink); }
  .opt.on .box::after { content: ""; width: 7px; height: 4px; border: solid #fff; border-width: 0 0 1.6px 1.6px; transform: rotate(-45deg) translate(1px,-1px); }
  .seg { display: flex; background: var(--paper-2); border-radius: var(--r-m); padding: 3px; }
  .seg span { flex: 1; text-align: center; font-size: 12.5px; height: 28px; line-height: 28px; border-radius: 6px; color: var(--ink-2); }
  .seg span.on { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(24,32,58,.12); }

  .tablewrap { flex: 1; min-width: 0; }
  .toolbar { display: flex; align-items: center; gap: 12px; }
  .search { flex: 1; max-width: 360px; }
  table.grid td.g { white-space: nowrap; }
  table.grid td.g b { display: block; font-weight: 650; line-height: 18px; }
  table.grid td.g span { font-size: 12px; color: var(--ink-3); line-height: 16px; }
  table.grid td.p { color: var(--ink-2); max-width: 380px; line-height: 18px; }
  table.grid td.p div { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  table.grid tbody td { height: 41px; }
  table.grid tr.sel td { background: #EEF2FA; border-bottom-color: #D2DBEE; }
  .dirc { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .open-audit { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 650; color: var(--kiku); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: var(--surface); padding-top: 12px !important; z-index: 1; }
</style>
</head>
<body>
<div class="app">
  <div id="shell"></div>
  <main class="main" id="main"></main>
</div>
<script>
const { K, esc, status, STATUS } = D;
D.mount(D.shell({ role: "specialist", active: "logs" }));
const C = K.calls;
const count = s => C.filter(c => c.status === s).length;
const stOpts = ["completed", "in_progress", "escalated", "failed"].map(s => `<div class="opt on"><span class="box"></span>${status(s)}<span class="n num">${count(s)}</span></div>`).join("");
const types = ["Inbound", "Campaign", "Upsell", "Make a call"].map(t => `<div class="opt on"><span class="box"></span>${t}<span class="n num">${C.filter(c => c.type === t).length}</span></div>`).join("");

const rows = C.map(c => {
  const sel = c.id === "KK-24027";
  return `<tr class="${sel ? "sel" : ""}">
    <td class="num">${c.started}</td>
    <td class="g"><b>${esc(c.guest)}</b><span class="num">${c.phone}</span></td>
    <td><span class="dirc"><i data-lucide="${c.direction === "inbound" ? "phone-incoming" : "phone-outgoing"}"></i>${c.direction === "inbound" ? "Inbound" : "Outbound"}</span></td>
    <td style="white-space:nowrap">${c.direction === "inbound" ? '<span class="muted">—</span>' : esc(c.type)}</td>
    <td class="p"><div>${esc(c.purpose)}</div></td>
    <td>${status(c.status)}</td>
    <td class="num">${c.duration}</td>
    <td class="g">${c.specialist ? (c.specialist.includes("(") ? `<b style="font-weight:500">${esc(c.specialist.split(" (")[0])}</b><span>listening now</span>` : esc(c.specialist)) : '<span class="muted">Kiku only</span>'}</td>
    <td style="width:92px">${sel ? `<a class="open-audit" href="04-call-audit.html">Open audit<i data-lucide="chevron-right" style="width:14px;height:14px"></i></a>` : ""}</td>
  </tr>`;
}).join("");

document.getElementById("main").innerHTML = `
<aside class="filters">
  <div><h1 class="page">Call logs</h1><div class="page-sub">${esc(K.hotel.today)}</div></div>
  <div class="fgroup"><h3>Date</h3><div class="input filled" style="justify-content:space-between"><span style="display:flex;gap:8px;align-items:center"><i data-lucide="calendar"></i>Today</span><i data-lucide="chevron-down" style="color:var(--ink-3)"></i></div></div>
  <div class="fgroup"><h3>Status</h3>${stOpts}</div>
  <div class="fgroup"><h3>Direction</h3><div class="seg"><span class="on">All <span class="num">${C.length}</span></span><span>In <span class="num">${C.filter(c=>c.direction==="inbound").length}</span></span><span>Out <span class="num">${C.filter(c=>c.direction==="outbound").length}</span></span></div></div>
  <div class="fgroup"><h3>Type</h3>${types}</div>
</aside>
<section class="tablewrap panel">
  <div class="panel-h" style="gap:12px;padding:10px 14px">
    <div class="input search"><i data-lucide="search" style="color:var(--ink-3)"></i><span class="muted">Search guest, phone, booking or purpose</span></div>
    <span class="sub">Showing all <span class="num">${C.length}</span> calls, newest first</span>
    <span class="end"><button class="btn sm"><i data-lucide="download"></i>Export CSV</button></span>
  </div>
  <div class="scroll" style="padding:0 8px">
    <table class="grid">
      <thead><tr><th>Time</th><th>Guest</th><th>Direction</th><th>Type</th><th>What the call was for</th><th>Status</th><th>Length</th><th>Specialist</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>
</section>`;
D.icons();
</script>
</body>
</html>
