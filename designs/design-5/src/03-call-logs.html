<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Call logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .head { margin-bottom: 16px; }
  .search { width: 290px; }
  .filters { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .filters .grp { display: flex; align-items: center; gap: 8px; }
  .filters .grp > .lbl { font-size: 12px; }
  .filters .end { margin-left: auto; }
  .logs { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .logs .tbl td { font-size: 13px; line-height: 17px; padding-top: 5px; padding-bottom: 5px; height: 44px; }
  .logs .tbl th { background: var(--panel); position: sticky; top: 0; z-index: 1; }
  .logs .tbl .g { font-weight: 600; }
  .logs .tbl .sub { white-space: nowrap; }
  .dir { display: inline-flex; align-items: center; gap: 6px; }
  .dir .ico { font-size: 16px; color: var(--graphite); }
  .purpose { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .none { color: var(--label); }
  .go { visibility: hidden; }
  tr.is-selected .go { visibility: visible; }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head">
      <div class="grow head-title"><h1 class="h1">Call logs</h1><span class="meta" id="count"></span></div>
      <button class="key select" type="button" style="width:150px" id="date">Today</button>
      <button class="key select" type="button" style="width:170px" id="type">All types</button>
      <label class="input-icon search"><i class="iconoir-search ico" aria-hidden="true"></i><input class="input" type="search" placeholder="Search guest, phone or purpose" aria-label="Search calls"></label>
    </header>
    <div class="filters" id="filters"></div>
    <div class="display logs"><div class="scroll" style="flex:1"><table class="tbl" id="tbl"></table></div></div>
  </main>
</div>
<script>
  const { K, esc, ico, status, lamp, STATUS } = Kiku;
  Kiku.shell({ role: 'specialist', active: 'logs' });
  document.querySelector('#date').innerHTML = `<span class="row gap-8">${ico('calendar')}Today</span>${ico('nav-arrow-down', 'ico-chev')}`;
  document.querySelector('#type').innerHTML = `<span class="row gap-8"><span class="lbl">type</span>All types</span>${ico('nav-arrow-down', 'ico-chev')}`;
  const calls = K.calls;
  document.querySelector('#count').innerHTML = `<span>${calls.length} calls</span><span class="sep"></span><span>${K.hotel.today}</span><span class="sep"></span><span>latest first</span>`;

  const count = (s) => calls.filter(c => c.status === s).length;
  const statusKeys = [['all', 'All', null, calls.length], ...Object.entries(STATUS).map(([k, [l, c]]) => [k, l, c, count(k)])];
  const dirs = ['All', 'Inbound', 'Outbound'];
  document.querySelector('#filters').innerHTML = `
    <div class="grp"><span class="lbl">status</span><div class="bank">${statusKeys.map(([k, l, c, n], i) =>
      `<button class="key ${i === 0 ? 'is-down' : ''}" aria-pressed="${i === 0}">${k === 'all' ? '' : lamp(c)}${l}<span class="n">${n}</span></button>`).join('')}</div></div>
    <div class="grp"><span class="lbl">direction</span><div class="bank">${dirs.map((d, i) =>
      `<button class="key ${i === 0 ? 'is-down' : ''}" aria-pressed="${i === 0}">${d === 'Inbound' ? ico('phone-income') : d === 'Outbound' ? ico('phone-outcome') : ''}${d}</button>`).join('')}</div></div>
    <button class="key key--sm end" disabled>${ico('xmark')}clear filters</button>`;

  const cols = [['time', 88], ['guest', 136], ['phone', 134], ['direction', 98], ['type', 102], ['purpose', null], ['status', 114], ['duration', 66], ['specialist', 120], ['', 46]];
  const rows = calls.map(c => {
    const sel = c.id === 'KK-24027';
    const spec = c.specialist ? c.specialist.replace(/ \((.*)\)/, '<span class="sub">$1</span>') : '<span class="none">—</span>';
    const type = c.direction === 'inbound' ? '<span class="none">—</span>' : `${c.type}${c.promo ? `<span class="sub">${c.promo}</span>` : ''}`;
    return `<tr class="${sel ? 'is-selected' : ''}">
      <td>${c.started}<span class="sub">${c.id}</span></td>
      <td class="g clip">${esc(c.guest)}</td>
      <td class="clip">${esc(c.phone)}</td>
      <td><span class="dir">${ico(c.direction === 'inbound' ? 'phone-income' : 'phone-outcome')}${c.direction === 'inbound' ? 'Inbound' : 'Outbound'}</span></td>
      <td>${type}</td>
      <td><span class="purpose">${esc(c.purpose)}</span></td>
      <td>${status(c.status)}</td>
      <td>${c.duration}</td>
      <td>${spec}</td>
      <td><a class="key key--sm key--icon go" href="04-call-audit.html" aria-label="Open audit for ${c.id}">${ico('arrow-right')}</a></td>
    </tr>`;
  }).join('');
  document.querySelector('#tbl').innerHTML = `<colgroup>${cols.map(([, w]) => `<col${w ? ` style="width:${w}px"` : ''}>`).join('')}</colgroup>
    <thead><tr>${cols.map(([l]) => `<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody>`;
</script>
</body>
</html>
