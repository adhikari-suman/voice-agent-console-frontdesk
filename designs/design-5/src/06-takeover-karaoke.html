<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · On the line, KK-24030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/iconoir@7.12.1/css/iconoir.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .face { padding-top: 18px; }
  .head { margin-bottom: 16px; align-items: flex-start; }
  .head .meta { margin-top: 6px; }
  .onair { display: flex; align-items: center; gap: 12px; padding: 8px 14px 8px 12px; border-radius: 10px; background: var(--dark); color: var(--face); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 2px rgba(0,0,0,.3); }
  .onair .lamp { width: 12px; height: 12px; box-shadow: inset 0 -1.5px 1.5px rgba(0,0,0,.3), inset 0 1px 1px rgba(255,255,255,.5), 0 0 0 1.5px rgba(255,255,255,.25); }
  .onair b { font-size: 15px; font-weight: 600; display: block; line-height: 1.2; }
  .onair span { font-size: 12px; color: #D8D7D2; display: block; }
  .onair .t { font-size: 26px; font-weight: 600; margin-left: 8px; letter-spacing: -.01em; }

  .live { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 420px; gap: 22px; }
  .left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .prompter .display-head { padding: 11px 20px 10px; }
  .prompter .display-head .mode { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 500; }
  .pline { padding: 14px 20px 16px; border-bottom: 1px solid var(--rule); display: grid; grid-template-columns: 150px 1fr; gap: 16px; }
  .pline:last-child { border-bottom: 0; }
  .pl-lbl { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--label); padding-top: 5px; }
  .pl-lbl .l1 { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--dark); }
  .ptext { font-size: 21px; line-height: 1.45; letter-spacing: -.005em; }
  .pline--b { background: var(--face); }
  .pline--b .ptext { font-weight: 500; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--orange); vertical-align: -3px; margin-left: 3px; }
  .pline--next .ptext { font-size: 16px; color: var(--graphite); }
  .pend-note { font-size: 12px; color: var(--label); margin-top: 6px; }

  .history { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .history .display-head { padding: 10px 18px 9px; }
  .history .legend { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--graphite); }
  .msgs { flex: 1; }

  .right { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .audio { padding: 14px 16px 16px; }
  .audio-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .audio-top .h3 { font-size: 14px; }
  .speaker { display: grid; grid-template-columns: 1fr 140px 140px; gap: 10px; }
  .speaker .grille { height: 90px; }
  .latched { margin-top: 14px; }
  .latched .key { justify-content: flex-start; padding-left: 20px; }
  .latched .key .lamp { width: 12px; height: 12px; background: #FFE3CF; box-shadow: inset 0 -1.5px 1.5px rgba(0,0,0,.18), 0 0 0 1.5px rgba(90,30,0,.35); }
  .latched .key .sub { margin-left: auto; font-size: 12.5px; font-weight: 500; letter-spacing: .01em; }
  .ctl { display: grid; grid-template-columns: 1fr 1.35fr 1fr; gap: 8px; margin-top: 10px; }
  .ctl .key { padding: 0 10px; }
  .ctl .end { color: var(--red-ink); }
  .ctl .end .ico { color: var(--red); }

  .facts .h3 { margin-bottom: 8px; }
  .reason { display: flex; gap: 8px; font-size: 13.5px; margin-bottom: 14px; }
  .reason .ico { color: #9A6A08; font-size: 17px; margin-top: 1px; }
  .facts .dl { grid-template-columns: 70px 1fr; gap: 6px 12px; font-size: 13.5px; }
  .facts ul { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule-2); }
  .facts li { display: flex; gap: 9px; font-size: 13.5px; padding: 3px 0; }
  .facts li .ico { font-size: 15px; margin-top: 2px; color: var(--graphite); }
</style>
</head>
<body>
<div class="shell">
  <aside class="column" id="column"></aside>
  <main class="face">
    <header class="head" id="head"></header>
    <div class="live">
      <div class="left">
        <section class="display prompter" id="prompter" aria-label="Karaoke prompter"></section>
        <section class="display history">
          <div class="display-head"><h2 class="h3">Call so far</h2><div class="legend" id="legend"></div></div>
          <div class="scroll msgs" id="msgs"></div>
        </section>
      </div>
      <div class="right">
        <section class="display audio" id="audio" aria-label="Call audio and controls"></section>
        <section class="facts" id="facts"></section>
      </div>
    </div>
  </main>
</div>
<script>
  const { K, esc, ico, status, lamp, first, secs, mmss } = Kiku;
  Kiku.shell({ role: 'specialist', active: 'live' });
  const c = K.takeover;
  const g = first(c.guest);
  const liveTurn = c.transcript.find(e => e.live);
  const earlier = c.transcript.filter(e => !e.live);
  const mine = mmss(secs(c.duration) - secs(c.takeoverAt));

  document.querySelector('#head').innerHTML = `
    <a class="key key--icon" href="02-live-overview.html" aria-label="Back to live board">${ico('arrow-left')}</a>
    <div class="grow">
      <div class="head-title"><h1 class="h1">${esc(c.guest)}</h1>${status(c.status)}</div>
      <div class="meta">${ico('phone-income')}<span>Inbound to ${esc(K.hotel.line)}</span><span class="sep"></span><span>${esc(c.phone)}</span><span class="sep"></span><span>${c.id}</span><span class="sep"></span><span>call ${c.duration}</span></div>
    </div>
    <div class="onair" role="status">${lamp('orange')}<div><b>You're on the line</b><span>took over at ${c.takeoverAt}</span></div><span class="t">${mine}</span></div>`;

  document.querySelector('#prompter').innerHTML = `
    <div class="display-head"><h2 class="h3">Prompter</h2><span class="mode">${lamp('green')}karaoke mode on · Kiku writes, you speak</span></div>
    <div class="pline pline--a">
      <div class="pl-lbl"><span class="l1"><span class="trk">A</span>Kiku wrote</span><span>${liveTurn.t}</span></div>
      <div><p class="ptext">${Kiku.diffSide(liveTurn.diff, 'a', { live: true })}</p><p class="pend-note">Grey words are still ahead of you. Struck words you skipped.</p></div>
    </div>
    <div class="pline pline--b">
      <div class="pl-lbl"><span class="l1"><span class="trk trk--b">B</span>You're saying</span><span class="row gap-6">${lamp('green')}live</span></div>
      <p class="ptext">${Kiku.diffSide(liveTurn.diff, 'b').replace(/(\S+)(<\/span>)$/, '<span style="white-space:nowrap">$1<span class="caret" aria-hidden="true"></span></span>$2')}</p>
    </div>
    <div class="pline pline--next">
      <div class="pl-lbl"><span class="l1"><span class="trk">A</span>Next line</span><span>queued</span></div>
      <p class="ptext">${esc(c.nextLine)}</p>
    </div>`;

  document.querySelector('#legend').innerHTML = `<span><span class="k-ins">underlined</span> you improvised</span><span><span class="k-del">struck</span> dropped</span>`;
  const pane = document.querySelector('#msgs');
  pane.innerHTML = Kiku.transcript(earlier, { guest: c.guest, specialist: c.specialist });
  requestAnimationFrame(() => { pane.scrollTop = pane.scrollHeight; });

  document.querySelector('#audio').innerHTML = `
    <div class="audio-top"><h2 class="h3">Line audio</h2><span class="lbl" style="margin-left:auto">${esc(g)} hears you, not Kiku</span></div>
    <div class="speaker">
      <div class="grille" aria-hidden="true"></div>
      ${Kiku.vu({ label: g.toLowerCase(), db: -20, width: 140 })}
      ${Kiku.vu({ label: 'you', db: -2, width: 140 })}
    </div>
    <div class="latched"><button class="key key--orange key--xl key--block is-down" aria-pressed="true">${ico('microphone')}taken over<span class="sub">hand back to release</span></button></div>
    <div class="ctl">
      <button class="key key--lg">${ico('microphone-mute')}mute</button>
      <button class="key key--lg key--dark">${ico('undo')}hand back to Kiku</button>
      <button class="key key--lg end">${ico('phone-xmark')}end call</button>
    </div>`;

  document.querySelector('#facts').innerHTML = `
    <h2 class="h3">Why it escalated</h2>
    <p class="reason">${ico('warning-triangle')}<span>${esc(c.escalationReason)}</span></p>
    <h2 class="h3">Booking</h2>
    <dl class="dl">
      <dt>booking</dt><dd class="strong">${c.booking}</dd>
      <dt>stay</dt><dd>${esc(c.stay)}</dd>
      <dt>purpose</dt><dd>${esc(c.purpose)}</dd>
    </dl>
    <ul>${c.facts.map(f => `<li>${ico('credit-card')}<span>${esc(f)}</span></li>`).join('')}</ul>`;
</script>
</body>
</html>
