<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku, live board</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
.content { display: grid; grid-template-columns: 1fr 392px; }
.board { display: flex; flex-direction: column; min-height: 0; padding: 22px 28px 20px; gap: 18px; }
.today { font-size: 15px; line-height: 1.75; color: var(--muted); max-width: 900px; }
.today b { font: 700 24px/1 var(--f-count); color: var(--text); letter-spacing: .02em; margin: 0 2px; }
.today b.h { color: var(--human); } .today b.f { color: var(--fail); } .today b.o { color: var(--ok); }

.needs { display: grid; grid-template-columns: 1fr auto; background: #fff; border: 1px solid var(--human-edge); border-radius: var(--r); position: relative; overflow: hidden; }
.needs::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 7px; border-top: 3px solid var(--human-hi); border-bottom: 1px solid var(--human-hi); z-index: 1; }
.needs .l, .needs .r { padding-top: 22px !important; }
.needs .l { padding: 18px 22px 18px 20px; }
.needs .kick { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--human); margin-bottom: 10px; }
.needs h2 { font-size: 26px; letter-spacing: -.02em; font-weight: 700; display: flex; align-items: baseline; gap: 12px; }
.needs h2 .id { font-weight: 400; }
.needs .pur { font: 400 18px/1.4 var(--f-voice); margin: 6px 0 12px; max-width: 60ch; }
.needs .meta { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); align-items: center; }
.needs .meta span { white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.needs .reason { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 7px 11px; background: var(--human-bg); border-radius: var(--r); font-size: 13px; font-weight: 500; color: #8e2238; }
.needs .r { display: flex; flex-direction: column; align-items: flex-end; justify-content: space-between; padding: 18px 22px; background: var(--human-bg); background-image: var(--hatch); border-left: 1px solid var(--human-edge); min-width: 250px; }
.needs .wait { text-align: right; }
.needs .wait span { font-size: 12.5px; color: #8e2238; font-weight: 600; }
.needs .wait b { display: block; font: 800 64px/0.9 var(--f-count); color: var(--human); letter-spacing: .01em; }
.needs .btn.lg { height: 46px; font-size: 15px; padding: 0 22px; }

.sec { display: flex; align-items: baseline; gap: 10px; }
.sec h2 { font-size: 15px; font-weight: 700; }
.sec span { color: var(--muted); font-size: 12.5px; }
.live { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.lc { min-height: 84px; display: grid; grid-template-columns: 22px 178px 1fr 164px 56px 196px; gap: 16px; align-items: center; padding: 13px 4px 13px 0; border-bottom: 1px solid var(--line); }
.lc .g b { display: block; font-size: 14.5px; font-weight: 600; }
.lc .g small { color: var(--muted); font-size: 12px; }
.lc .p { font-size: 13.5px; line-height: 1.4; }
.lc .p small { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 3px; }
.lc .on { font-size: 12.5px; display: flex; flex-direction: column; gap: 3px; }
.lc .on span { display: flex; gap: 6px; align-items: center; }
.lc .d { font: 700 20px/1 var(--f-count); letter-spacing: .03em; text-align: right; }
.lc .a { display: flex; justify-content: flex-end; gap: 6px; }
.tracks { display: flex; flex-direction: column; gap: 3px; }
.tracks i { display: block; height: 3px; border-radius: 2px; width: 34px; }

.recent { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.recent .ph { padding: 20px 22px 12px; }
.recent ol { list-style: none; padding: 0 22px; }
.recent li { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.recent li .st { margin-top: 2px; }
.recent li b { font-size: 13.5px; font-weight: 600; }
.recent li p { font-size: 12.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.recent li .tm { text-align: right; font: 600 14px/1.2 var(--f-count); letter-spacing: .04em; color: var(--muted); }
.recent li .tm small { display: block; font: 400 11.5px var(--f-ui); color: var(--faint); letter-spacing: 0; margin-top: 3px; }
.recent li.sel { background: linear-gradient(90deg, transparent, transparent); }
</style></head>
<body>
<div class="app">
  <nav class="spine" id="spine"></nav>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content">
      <div class="board">
        <p class="today" id="today"></p>
        <div class="needs" id="needs"></div>
        <div class="sec"><h2>On the line now</h2><span>Kiku is handling these. Listen in, or join to be ready to take over.</span></div>
        <div class="live" id="live"></div>
      </div>
      <aside class="recent"><div class="ph"><h2>Recently finished</h2><span class="aside"><a href="03-call-logs.html" style="color:var(--kiku);font-weight:600;text-decoration:none">All call logs</a></span></div><ol class="scroll" id="recent"></ol></aside>
    </div>
  </main>
</div>
<script>
const { K, esc, icon, status, shape, shell } = TT; const S = K.stats;
shell({ role: 'specialist', active: 'live', title: 'Live board', after: `<span class="h3" style="font-weight:500">5 calls on the line</span>` });

document.getElementById('today').innerHTML = `Today Kiku has handled <b>${S.callsToday}</b> calls, <b>${S.inbound}</b> in and <b>${S.outbound}</b> out.
  <b class="o">${S.completed}</b> completed, <b>${S.inProgress}</b> in progress, <b class="h">${S.escalated}</b> escalated and <b class="f">${S.failed}</b> failed.
  Specialists took over <b class="h">${S.takeoversToday}</b> times, calls averaged <b>${S.avgHandle}</b>, and upsells added <b>${S.upsellValueToday}</b> to bookings.`;

const c = id => K.calls.find(x => x.id === id);
const o = c('KK-24032');
document.getElementById('needs').innerHTML = `
  <div class="l">
    <div class="kick">${status('escalated', 'Escalated, needs a specialist')}</div>
    <h2>${esc(o.guest)} <span class="id">${o.id}</span></h2>
    <p class="pur">${esc(o.purpose)}</p>
    <div class="meta"><span>${icon('phone-incoming')}Inbound</span><span class="num">${icon('phone')}${esc(o.phone)}</span><span>${icon('clock')}On the line ${o.duration}</span><span>${icon('bot')}Kiku is holding the guest</span></div>
    <div class="reason">${icon('credit-card')}${esc(o.escalationReason)}</div>
  </div>
  <div class="r">
    <div class="wait"><span>Waiting for a person</span><b class="tc">${o.waiting}</b></div>
    <div style="display:flex;gap:8px"><button class="btn lg ghost" style="background:#fff">${icon('headphones')}Listen</button><button class="btn lg human">${icon('mic')}Take over</button></div>
  </div>`;

const rows = [
  [c('KK-24030'), [['doth', 'You took over at 01:10']], ['btn sm human', 'mic', 'Back to call', '06-takeover-karaoke.html'], true],
  [c('KK-24031'), [['dotk', 'Kiku talking'], ['headphones', 'You are listening']], ['btn sm ink', 'log-in', 'Join', '05-live-call-listening.html']],
  [c('KK-24029'), [['dotk', 'Kiku alone']], ['btn sm', 'headphones', 'Listen'], null, ['btn sm', 'log-in', 'Join']],
  [c('KK-24028'), [['dotk', 'Kiku alone']], ['btn sm', 'headphones', 'Listen'], null, ['btn sm', 'log-in', 'Join']],
];
document.getElementById('live').innerHTML = rows.map(([x, on, a, human, b]) => {
  const human2 = human || on.some(p => p[0] === 'headphones');
  return `<div class="lc">
    ${shape(x.status)}
    <div class="g"><b>${esc(x.guest)}</b><small>${TT.LABEL[x.status]}, ${x.id}</small></div>
    <div class="p">${esc(x.purpose)}<small>${x.direction === 'inbound' ? icon('phone-incoming') + 'Inbound' : icon('phone-outgoing') + 'Outbound, ' + x.type}</small></div>
    <div class="on">${on.map(([k, t]) => `<span>${k.startsWith('dot') ? `<span class="${k}"></span>` : icon(k)}${t}</span>`).join('')}</div>
    <div class="d tc">${x.duration}</div>
    <div class="a">${b ? `<button class="${b[0]}">${icon(b[1])}${b[2]}</button>` : ''}<a href="${a[3] || '#'}" class="${a[0]}" style="text-decoration:none">${icon(a[1])}${a[2]}</a></div>
  </div>`;
}).join('');

const done = K.calls.filter(x => x.status === 'completed' || x.status === 'failed');
document.getElementById('recent').innerHTML = done.map(x => `<li>${shape(x.status)}<div><b>${esc(x.guest)}</b><p>${esc(x.outcome)}</p></div><div class="tm">${x.started}<small>${x.status === 'failed' ? 'Failed' : 'Completed'}${x.specialist ? ', ' + x.specialist.split(' ')[0] : ''}</small></div></li>`).join('');
TT.draw();
</script>
</body></html>
