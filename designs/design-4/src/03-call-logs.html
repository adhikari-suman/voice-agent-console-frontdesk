<!doctype html>
<html lang="en">
<head>
<title>Kiku · Call logs</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .logs { height: 100%; display: flex; flex-direction: column; gap: 12px; }
  .filters { display: flex; align-items: center; gap: 12px; flex: none; }
  .filters .sel { width: 168px; }
  .filters .sel select { height: 36px; }
  .filters .end { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .rundown { flex: 1; }
  .rundown .tbl td { height: 52px; }
  .rundown .tbl { table-layout: fixed; }
  .c-time { width: 84px; }
  .c-guest { width: 176px; }
  .c-dir { width: 150px; }
  .c-status { width: 128px; }
  .c-dur { width: 84px; }
  .c-spec { width: 164px; }
  .c-go { width: 116px; }
  .t { font: 600 16px/1 var(--f-cond); letter-spacing: .03em; }
  .t + .sub { font: 600 12px/1.2 var(--f-cond); letter-spacing: .05em; margin-top: 4px; }
  .g { font-weight: 600; white-space: nowrap; }
  .tbl .sub.type { display: flex; align-items: center; gap: 5px; white-space: nowrap; margin-top: 3px; }
  .type i { font-size: 14px; }
  .purpose { line-height: 1.38; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .spec { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .spec i { font-size: 15px; }
  .spec--air i { color: var(--red); }
  .spec--pfl i { color: #3DA5FF; }
  .none { color: var(--text-2); }
  .go { display: flex; justify-content: flex-end; color: var(--text-2); }
  .go i { font-size: 18px; }
  .foot { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); }
  .foot .end { margin-left: auto; display: flex; gap: 6px; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, st, dir, TYPE_ICON, mount } = Kiku;
  const S = K.stats;

  const statusSeg = `<div class="seg" role="radiogroup" aria-label="Status">
    <button class="is-on" role="radio" aria-checked="true">All <span class="n">${S.callsToday}</span></button>
    <button role="radio" aria-checked="false">${ic("check-line")}Completed <span class="n">${S.completed}</span></button>
    <button role="radio" aria-checked="false">${ic("record-circle-line")}In progress <span class="n">${S.inProgress}</span></button>
    <button role="radio" aria-checked="false">${ic("alert-line")}Escalated <span class="n">${S.escalated}</span></button>
    <button role="radio" aria-checked="false">${ic("close-line")}Failed <span class="n">${S.failed}</span></button>
  </div>`;
  const dirSeg = `<div class="seg" role="radiogroup" aria-label="Direction">
    <button class="is-on" role="radio" aria-checked="true">All directions</button>
    <button role="radio" aria-checked="false">${ic("arrow-left-down-line")}Inbound <span class="n">${S.inbound}</span></button>
    <button role="radio" aria-checked="false">${ic("arrow-right-up-line")}Outbound <span class="n">${S.outbound}</span></button>
  </div>`;
  const typeSel = `<label class="sel" aria-label="Type"><i class="ri-filter-3-line lead" aria-hidden="true"></i><select class="input"><option>All types</option><option>Inbound</option><option>Campaign</option><option>Upsell</option><option>Make a call</option></select><i class="ri-arrow-down-s-line chev" aria-hidden="true"></i></label>`;

  const spec = (c) => {
    if (!c.specialist) return `<span class="none" aria-label="Kiku only">—</span>`;
    if (c.specialist.includes("listening")) return `<span class="spec spec--pfl">${ic("headphone-line")}<span>${esc(c.specialist.replace(" (listening)", ""))}<span class="sub">listening</span></span></span>`;
    if (c.status === "escalated") return `<span class="spec spec--air">${ic("mic-line")}<span>${esc(c.specialist)}<span class="sub">on air now</span></span></span>`;
    return `<span class="spec">${ic("user-line")}${esc(c.specialist)}</span>`;
  };

  const rows = K.calls.map((c) => {
    const sel = c.id === "KK-24027";
    return `<tr class="${sel ? "is-sel" : ""}"${sel ? ' aria-selected="true"' : ""}>
      <td><div class="t">${c.started}</div><span class="sub">${c.id}</span></td>
      <td><div class="g">${esc(c.guest)}</div><span class="sub">${esc(c.phone)}</span></td>
      <td>${dir(c.direction)}<span class="sub type">${c.direction === "inbound" ? "Hotel line" : `${ic(TYPE_ICON[c.type])}${esc(c.type)}`}</span></td>
      <td><p class="purpose">${esc(c.purpose)}</p></td>
      <td>${st(c.status)}</td>
      <td class="r"><span class="t" style="font-size:15px">${c.duration}</span></td>
      <td>${spec(c)}</td>
      <td>${sel ? `<a class="key key--sm key--lit" href="04-call-audit.html">Open audit ${ic("arrow-right-s-line")}</a>` : `<span class="go">${ic("arrow-right-s-line")}</span>`}</td>
    </tr>`;
  }).join("");

  mount({
    role: "specialist",
    active: "logs",
    title: "Call logs",
    meta: `Latest <b>${K.calls.length}</b> of <b>${S.callsToday}</b> calls today, newest first`,
    tools: `<div class="inputwrap" style="width:320px">${ic("search-line")}<input class="input" type="search" placeholder="Search guest, phone, booking or call ID" aria-label="Search calls"></div>
      <label class="sel" style="width:150px" aria-label="Date"><i class="ri-calendar-line lead" aria-hidden="true"></i><select class="input"><option>Today</option><option>Yesterday</option><option>Last 7 days</option></select><i class="ri-arrow-down-s-line chev" aria-hidden="true"></i></label>`,
    body: `<div class="logs">
      <div class="filters">${statusSeg}${dirSeg}${typeSel}</div>
      <section class="pane rundown" aria-label="Calls">
        <div class="scroll" style="flex:1">
          <table class="tbl">
            <thead><tr>
              <th class="c-time">Time</th><th class="c-guest">Guest</th><th class="c-dir">Direction · type</th>
              <th>Purpose</th><th class="c-status">Status</th><th class="c-dur r">Duration</th><th class="c-spec">Specialist</th><th class="c-go"><span class="sr-only"></span></th>
            </tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="foot">Showing 1–${K.calls.length} of ${S.callsToday}<div class="end"><button class="key key--sm" disabled>${ic("arrow-left-s-line")}Newer</button><button class="key key--sm">Older${ic("arrow-right-s-line")}</button></div></div>
      </section>
    </div>`,
  });
</script>
</body>
</html>
