<!doctype html>
<html lang="en">
<head>
<title>Kiku · Listening to KK-24031</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .listen { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
  .pgm { height: 100%; }
  .pgm .mon__screen { display: grid; grid-template-columns: minmax(0, 1fr) 92px; }
  .pgm .tx { overflow: auto; padding-bottom: 4px; }
  .pgm .tx__row { grid-template-columns: 46px 70px minmax(0, 1fr); padding: 9px 16px; }
  .pgm .txt { font-size: 15px; line-height: 1.5; }
  .tx__row.is-latest { background: #101B28; box-shadow: inset 0 0 0 1px #1F5C94; }
  .tx__row.is-latest .txt { color: #fff; font-weight: 500; }
  .latest-tag { display: inline-flex; align-items: center; gap: 4px; margin-top: 6px; font: 600 11.5px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: #6FBCFF; }
  .draft { margin: 10px 16px 12px; display: grid; grid-template-columns: 46px 70px minmax(0, 1fr); gap: 0 12px; padding: 12px 0; border: 1px dashed var(--line-2); border-radius: var(--r); background: #0C0D10; }
  .draft .tx__t { padding-left: 12px; }
  .draft .txt { color: var(--text-2); font-size: 15px; line-height: 1.5; padding-right: 14px; }
  .drafting { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; font: 600 12px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--green); }
  .drafting .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 10px; }
  .drafting .bars b { width: 3px; background: var(--green); border-radius: 1px; }
  .bridge { border-left: 1px solid #1F2227; display: flex; justify-content: center; gap: 12px; padding: 14px 0 12px; }
  .bridge__ch { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bridge__ch .meter--v { flex: 1; justify-content: flex-start; }
  .bridge__ch .meter--v b { height: auto; flex: 1; max-height: 14px; }
  .bridge__ch .meter { height: 100%; }
  .bridge__ch .cap { font-size: 11px; writing-mode: horizontal-tb; }

  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .facts { padding: 12px 14px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .facts .full { grid-column: 1 / -1; }
  .facts dt { font: 600 11.5px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin-bottom: 5px; }
  .facts dd { font-size: 14px; line-height: 1.35; }
  .done { padding: 6px 14px 10px; }
  .done li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid #22252B; font-size: 14px; line-height: 1.4; }
  .done li:last-child { border-bottom: 0; }
  .done i { color: var(--green); font-size: 16px; position: relative; top: 1px; }
  .crew { padding: 6px 14px 10px; }
  .crew li { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 14px; }
  .crew li .muted { margin-left: auto; font-size: 13px; }
  .hint { font-size: 12.5px; color: var(--text-2); max-width: 250px; line-height: 1.35; text-align: right; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, st, dir, lamp, meter, mount } = Kiku;
  const L = K.liveCall;
  const who = { agent: ["kiku", "record-circle-line", "Kiku"], guest: ["guest", "user-line", "Guest"] };
  const last = L.transcript.length - 1;
  const rows = L.transcript.map((x, i) => {
    const w = who[x.speaker];
    const latest = i === last && x.speaker === "guest";
    return `<div class="tx__row${latest ? " is-latest" : ""}"><span class="tx__t">${x.t}</span><span class="tx__who tx__who--${w[0]}">${ic(w[1])}${w[2]}</span><div><p class="txt">${esc(x.text)}</p>${latest ? `<span class="latest-tag">${ic("question-line")}Latest question, waiting on Kiku</span>` : ""}</div></div>`;
  }).join("");
  const draft = `<div class="draft" aria-live="polite"><span class="tx__t">${L.duration}</span><span class="tx__who tx__who--kiku">${ic("record-circle-line")}Kiku</span>
    <div><p class="txt">${esc(L.agentDraft)}</p><span class="drafting"><span class="bars"><b style="height:4px"></b><b style="height:9px"></b><b style="height:6px"></b></span>${esc(L.agentState)}</span></div></div>`;

  const chan = (label, lvl, kind) => `<div class="bridge__ch">${meter(lvl, kind, 22, true)}<span class="cap">${label}</span></div>`;

  const facts = `<section class="pane" aria-label="Call facts">
    <div class="pane__head"><h2>Call facts</h2><span class="end">${dir(L.direction)}</span></div>
    <dl class="facts">
      <div><dt>Booking</dt><dd>${esc(L.booking)}</dd></div>
      <div><dt>Phone</dt><dd>${esc(L.phone)}</dd></div>
      <div class="full"><dt>Stay</dt><dd>${esc(L.stay)}</dd></div>
      <div class="full"><dt>Purpose</dt><dd>${esc(L.purpose)}</dd></div>
      <div><dt>Started</dt><dd>${L.started}</dd></div>
      <div><dt>Line</dt><dd>Hotel line</dd></div>
    </dl>
  </section>`;
  const actions = `<section class="pane" aria-label="Actions Kiku already took">
    <div class="pane__head"><h2>Already done by Kiku</h2><span class="end muted">${L.actionsTaken.length} actions</span></div>
    <ul class="done">${L.actionsTaken.map((a) => `<li>${ic("check-line")}<span>${esc(a)}</span></li>`).join("")}</ul>
  </section>`;
  const crew = `<section class="pane" aria-label="On this call">
    <div class="pane__head"><h2>On this call</h2></div>
    <ul class="crew">
      <li>${lamp("live")}<span>Kiku</span><span class="muted">speaking</span></li>
      <li>${lamp("pfl")}<span>${esc(L.listening[0])} (you)</span><span class="muted">listening, muted to guest</span></li>
      <li><span class="lamp lamp--off"></span><span>${esc(L.guest)}</span><span class="muted">guest</span></li>
    </ul>
  </section>`;

  mount({
    role: "specialist",
    active: "live",
    back: { href: "02-live-overview.html", label: "Live board" },
    title: esc(L.guest),
    after: `<span class="id">${L.id}</span>${st(L.status)}`,
    meta: `${esc(L.purpose)} · started <b>${L.started}</b>`,
    tools: `<span class="tc" style="font-size:30px">${L.duration}</span>`,
    body: `<div class="listen">
      <article class="mon pgm" aria-label="Live call">
        <div class="tally tally--live">${ic("record-circle-line")}In progress · Kiku on the line<span class="tally__end">${L.id}<span class="tally__pfl">${ic("headphone-line")}PFL · you're listening</span></span></div>
        <div class="mon__screen">
          <div class="tx" id="live" aria-label="Live transcript">${rows}${draft}</div>
          <div class="bridge" aria-label="Audio levels">${chan("Guest", 0.73, "guest")}${chan("Kiku", 0.09, "kiku")}</div>
        </div>
        <div class="umd">${esc(L.guest)} · Inbound · Hotel line</div>
      </article>
      <div class="side">${facts}${actions}${crew}</div>
    </div>`,
    transport: `<footer class="transport" aria-label="Call controls">
      <div class="xp__group">
        <button class="key key--lg key--pfl" aria-pressed="true"><span class="key__tag">PFL</span>Listening</button>
        <button class="key key--lg" aria-pressed="false">${ic("volume-mute-line")}Mute</button>
      </div>
      <span class="xp__div"></span>
      <div class="xp__group"><div class="meters"><span class="cap">Guest</span>${meter(0.73, "guest", 22)}<span class="cap">Kiku</span>${meter(0.09, "kiku", 22)}</div></div>
      <div class="xp__end">
        <p class="hint">Taking over puts you on air. Kiku keeps writing your lines on the prompter.</p>
        <button class="key key--lg">${ic("logout-box-r-line")}Leave</button>
        <button class="key key--lg key--take" style="min-width:196px">${ic("mic-line")}Take over</button>
      </div>
    </footer>`,
  });
  const lv = document.getElementById("live");
  const toEnd = () => { lv.scrollTop = lv.scrollHeight; };
  toEnd();
  document.fonts.ready.then(toEnd);
</script>
</body>
</html>
