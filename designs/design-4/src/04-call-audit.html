<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku, call audit KK-24027</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
.content { display: grid; grid-template-columns: 330px 1fr; }
/* call sheet */
.sheet { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.sheet section { padding: 16px 22px; border-bottom: 1px solid var(--line); }
.sheet h2 { font-size: 25px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.sheet .tags { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; }
.sheet dl { display: grid; grid-template-columns: 74px 1fr; gap: 6px 10px; font-size: 12.8px; margin-top: 12px; line-height: 1.35; }
.sheet dt { color: var(--muted); }
.sheet h3 { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; gap: 7px; align-items: center; }
.transport { display: flex; align-items: center; gap: 12px; }
.play { width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; flex: none; }
.play svg.lucide { width: 16px; height: 16px; fill: #fff; }
.transport .tm b { font: 700 24px/1 var(--f-count); letter-spacing: .03em; }
.transport .tm span { font: 600 15px/1 var(--f-count); color: var(--muted); letter-spacing: .03em; }
.transport .tm small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.transport .btn { margin-left: auto; }
.ksum { font-size: 13px; line-height: 1.5; }
.ksum b { font: 700 20px/1 var(--f-count); letter-spacing: .02em; }
.ksum .h { color: var(--human); } .ksum .o { color: var(--ok); }
.kept { display: flex; gap: 4px; margin-top: 10px; }
.kept span { flex: 1; text-align: center; padding: 5px 0 4px; font: 700 14px/1 var(--f-count); letter-spacing: .02em; border-top: 2px solid var(--kiku-edge); border-bottom: 2px solid var(--human-hi); color: var(--muted); background: var(--paper); }
.kept span.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.kept span.on { color: var(--ink); background: #fff; outline: 1px solid var(--ink); }
.out li { list-style: none; display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; padding: 6px 0; font-size: 12.8px; align-items: start; line-height: 1.35; }
.out li svg.lucide { width: 15px; height: 15px; margin-top: 1px; }
.out li.added svg { color: var(--ok); } .out li.declined { color: var(--muted); }
.out li .amt { font-variant-numeric: tabular-nums; font-weight: 600; }
.total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 8px; border-top: 1px dashed var(--line); margin-top: 4px; font-weight: 600; font-size: 13px; }
.total b { font: 700 26px/1 var(--f-count); letter-spacing: .02em; }
.note { margin-top: 8px; font-size: 12.5px; color: var(--muted); display: flex; gap: 7px; }
.note svg.lucide { width: 14px; height: 14px; margin-top: 2px; }

/* the score */
.score { display: flex; flex-direction: column; min-height: 0; }
.heads { display: grid; grid-template-columns: 1fr 76px 1fr; padding: 12px 28px 8px; border-bottom: 1px solid var(--line); background: var(--surface); align-items: end; }
.heads > div { font-size: 12.5px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
.heads > div small { font-weight: 400; color: var(--muted); }
.heads .l { justify-content: flex-end; color: var(--kiku); }
.heads .m { justify-content: center; color: var(--muted); font-weight: 600; }
.heads .r { color: var(--human); }
.rows { flex: 1; padding: 6px 28px 24px; position: relative; }
.row { display: grid; grid-template-columns: 1fr 76px 1fr; position: relative; }
.row .sp { position: relative; display: flex; justify-content: center; }
.row .sp::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--kiku); }
.row.after .sp::before { background: var(--human-hi); margin-left: 2px; }
.row.after .sp::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; margin-left: -4px; width: 0; border-left: 2px dashed var(--kiku-edge); }
.tc2 { position: relative; z-index: 1; margin-top: 12px; height: 22px; padding: 0 6px; background: var(--paper); font: 700 14px/22px var(--f-count); letter-spacing: .04em; color: var(--muted); }
.row .cell { padding: 8px 0; display: flex; }
.row .cell.l { justify-content: flex-end; }
.bub { z-index: 1; max-width: 440px; padding: 9px 13px 10px; border-radius: 3px; font-size: 13.5px; line-height: 1.55; position: relative; }
.bub .lab { display: block; font-size: 11.5px; font-weight: 700; margin-bottom: 2px; font-family: var(--f-ui); font-style: normal; }
.bub.kiku { background: var(--kiku-bg); color: #1d4c68; }
.bub.kiku .lab { color: var(--kiku); }
.bub.guest { background: #fff; border: 1px solid var(--line); font: 400 15px/1.45 var(--f-voice); }
.bub.guest .lab { color: var(--text); }
.bub.wrote { background: var(--paper); border: 1.5px dashed var(--kiku-edge); color: #1d4c68; }
.bub.wrote .lab { color: var(--kiku); }
.bub.said { background: #fff; border: 1px solid var(--human-edge); font: 400 15px/1.55 var(--f-voice); }
.bub.said .lab { color: var(--human); }
.bub.said .k { text-decoration-color: var(--human-edge); }
.splice { position: relative; z-index: 1; margin-top: 12px; width: 50px; height: 50px; border-radius: 50%; background: #fff; border: 2px solid var(--human-hi); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1; }
.splice b { font: 700 16px/1 var(--f-count); letter-spacing: .02em; display: block; }
.splice small { font-size: 9.5px; color: var(--muted); font-weight: 600; display: block; margin-top: 1px; }
.splice.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.splice.ok small { color: var(--ok); }
.splice.ok svg.lucide { width: 16px; height: 16px; stroke-width: 2.6; }
.row.sys { grid-template-columns: 1fr; }
.row.sys .band { margin: 6px 0; display: flex; justify-content: center; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--muted); position: relative; }
.row.sys .band span { background: var(--paper); padding: 4px 12px; display: inline-flex; gap: 7px; align-items: center; border: 1px solid var(--line); border-radius: 14px; position: relative; z-index: 1; }
.row.sys .band::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 5px; margin-top: -2px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.row.sys.escalation .band span, .row.sys.takeover .band span { color: var(--human); border-color: var(--human-edge); background: var(--human-bg); }
.row.sys .t { font: 700 13px/1 var(--f-count); letter-spacing: .04em; }
.row.playing::after { content: ""; position: absolute; left: -28px; right: -28px; top: 37px; height: 0; border-top: 1.5px solid var(--ink); z-index: 0; }
.row.playing .splice { box-shadow: 0 0 0 3px var(--paper), 0 0 0 4.5px var(--ink); }
.phead { position: absolute; left: -28px; top: 28px; background: var(--ink); color: #fff; font: 700 12px/18px var(--f-count); letter-spacing: .04em; padding: 0 7px 0 5px; border-radius: 0 9px 9px 0; z-index: 2; display: flex; gap: 3px; align-items: center; }
.phead svg.lucide { width: 10px; height: 10px; fill: #fff; stroke: none; }
.legend { display: flex; gap: 18px; justify-content: center; font-size: 11.5px; color: var(--muted); padding: 8px 0 0; grid-column: 1 / -1; font-weight: 400; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
</style></head>
<body>
<div class="app">
  <nav class="spine" id="spine"></nav>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content">
      <aside class="sheet scroll" id="sheet"></aside>
      <div class="score">
        <div class="heads" id="heads"></div>
        <div class="rows scroll" id="rows"></div>
      </div>
    </div>
  </main>
</div>
<script>
const { K, esc, icon, status, shell, sides } = TT; const A = K.audit;
shell({ role: 'specialist', active: 'logs', crumb: `<a href="03-call-logs.html">Call logs</a>${icon('chevron-right')}`, title: 'Call audit', after: `<span class="id" style="font-size:13px">${A.id}</span>` });
const ks = A.transcript.filter(e => e.karaoke);
document.getElementById('sheet').innerHTML = `
  <section>
    <h2>${esc(A.guest)}</h2>
    <div class="tags">${status('completed')}<span class="dir">${icon('phone-outgoing')}Outbound, Upsell</span></div>
    <dl><dt>Phone</dt><dd class="num">${esc(A.phone)}</dd><dt>Booking</dt><dd>${A.booking}</dd><dt>Stay</dt><dd>${esc(A.stay)}</dd><dt>Purpose</dt><dd>${esc(A.purpose)}</dd><dt>Started</dt><dd>${esc(A.started)}, ${A.duration}</dd><dt>Specialist</dt><dd>${esc(A.specialist)}</dd></dl>
  </section>
  <section><div class="transport"><button class="play" aria-label="Pause">${icon('pause')}</button><div class="tm"><b>01:12</b> <span>/ ${A.duration}</span><small>The playhead runs down the score</small></div><button class="btn sm ghost" aria-label="Download recording">${icon('download')}</button></div></section>
  <section>
    <h3>${icon('audio-lines')}Karaoke</h3>
    <p class="ksum">Kiku prompted <b>${A.karaokeSummary.lines}</b> lines. Tomasz said <b class="o">${A.karaokeSummary.asWritten}</b> as written and improvised <b class="h">${A.karaokeSummary.improvised}</b>.</p>
    <div class="kept">${ks.map(e => `<span class="${e.asWritten ? 'ok' : ''}${e.t === '01:12' ? ' on' : ''}" title="${e.t}">${e.match}</span>`).join('')}</div>
    <p class="help" style="margin-top:6px">Percent of Kiku's words kept, line by line.</p>
  </section>
  <section style="border:0">
    <h3>${icon('receipt')}Outcome</h3>
    <ul class="out">${A.outcome.map(o => `<li class="${o.result}">${icon(o.result === 'added' ? 'circle-check' : 'circle-minus')}<span>${esc(o.item)}</span><span class="amt">${o.result === 'added' ? o.amount : 'Declined'}</span></li>`).join('')}</ul>
    <div class="total"><span>Added to ${A.booking}</span><b>${A.total}</b></div>
    <p class="note">${icon('notebook-pen')}${esc(A.note)}</p>
  </section>`;

document.getElementById('heads').innerHTML = `<div class="l"><small>Written or spoken by</small>Kiku<span class="dotk"></span></div><div class="m">${icon('disc-3')}</div><div class="r"><span class="doth"></span>On the line<small>Eleanor Vance, then Tomasz</small></div>
  <div class="legend"><span><span class="k">matched</span>said as Kiku wrote it</span><span><span class="x">struck</span>Kiku wrote, not said</span><span><span class="n">rose</span>improvised</span><span>${icon('minus').replace('<i', '<i style="color:var(--human-hi)"')}spine turns rose at the takeover</span></div>`;

const sec = t => { const [m, s] = t.split(':').map(Number); return m * 60 + s; };
document.getElementById('rows').innerHTML = A.transcript.map(e => {
  const after = sec(e.t) >= 52 ? ' after' : '';
  if (e.speaker === 'system') {
    const ic = { escalation: 'triangle-alert', join: 'headphones', takeover: 'mic', end: 'phone-off' }[e.kind];
    return `<div class="row sys ${e.kind}"><div class="band"><span><b class="t">${e.t}</b>${icon(ic)}${esc(e.text)}</span></div></div>`;
  }
  if (e.karaoke) {
    const d = sides(e.diff);
    return `<div class="row${after}${e.t === '01:12' ? ' playing' : ''}">${e.t === '01:12' ? `<span class="phead">${icon('play')}01:12</span>` : ''}
      <div class="cell l"><div class="bub wrote"><span class="lab">Kiku wrote, ${e.t}</span>${d.wrote}</div></div>
      <div class="sp"><div class="splice ${e.asWritten ? 'ok' : ''}">${e.asWritten ? `${icon('check')}<small>as<br>written</small>` : `<b>${e.match}%</b><small>kept</small>`}</div></div>
      <div class="cell"><div class="bub said"><span class="lab">Tomasz said</span>${d.said}</div></div></div>`;
  }
  const left = e.speaker === 'agent';
  const b = `<div class="bub ${left ? 'kiku' : 'guest'}"><span class="lab">${left ? 'Kiku said' : 'Eleanor Vance'}</span>${esc(e.text)}</div>`;
  return `<div class="row${after}"><div class="cell l">${left ? b : ''}</div><div class="sp"><span class="tc2">${e.t}</span></div><div class="cell">${left ? '' : b}</div></div>`;
}).join('');
TT.draw();
const r = document.getElementById('rows'); const tgt = [...r.children].find(n => n.classList.contains('escalation'));
r.scrollTop = tgt.offsetTop - 20;
</script>
</body></html>
