<!doctype html>
<html lang="en">
<head>
<title>Kiku · Call audit KK-24027</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .audit { height: 100%; display: grid; grid-template-columns: 344px minmax(0, 1fr); gap: 16px; }
  .col > .pane { flex: none; }
  .col > .hist { flex: 1; }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .pane__head { min-height: 40px; }

  .slate { display: grid; grid-template-columns: 1fr 1.3fr; gap: 12px 16px; padding: 12px 14px 14px; }
  .slate .full { grid-column: 1 / -1; }
  .slate dt { font: 600 11.5px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); margin-bottom: 5px; }
  .slate dd { font-size: 14px; line-height: 1.35; }
  .slate dd .dir, .slate dd .st { font-weight: 500; }

  .ksum { padding: 12px 14px 14px; }
  .ksum__line { font-size: 13.5px; margin: 0; }
  .ksum__line b { font: 600 18px/1 var(--f-cond); letter-spacing: .02em; }
  .bridge { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .bridge__ch { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 6px 0 5px; border: 1px solid transparent; border-radius: var(--r); }
  .bridge__ch.is-sel { background: var(--sel); border-color: var(--blue); }
  .bridge__pct { font: 600 13px/1 var(--f-cond); letter-spacing: .03em; }
  .bridge__t { font: 600 11.5px/1 var(--f-cond); letter-spacing: .04em; color: var(--text-2); }
  .bridge .meter--v b { width: 18px; height: 4px; }
  .bridge .meter b.on { background: var(--text-2); }
  .bridge__ch.is-exact .meter b.on { background: var(--text); }
  .awline { display: flex; gap: 10px; align-items: flex-start; margin-top: 10px; font-size: 13px; color: var(--text-2); line-height: 1.4; }
  .awline .aswritten { flex: none; }
  .bridge__mark { height: 14px; font-size: 14px; color: var(--text); display: grid; place-items: center; }

  .outcome { padding: 4px 14px 12px; }
  .oc { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid #22252B; font-size: 13.5px; }
  .oc i { font-size: 15px; position: relative; top: 2px; }
  .oc--added i { color: var(--text); }
  .oc--declined, .oc--declined .oc__amt { color: var(--text-2); }
  .oc--declined .oc__amt { font: 500 13px/1 var(--f-ui); }
  .oc__amt { font: 600 15px/1 var(--f-cond); letter-spacing: .03em; }
  .oc__res { display: block; font-size: 12px; color: var(--text-2); }
  .total { display: flex; align-items: baseline; gap: 10px; font-size: 13px; }
  .total b { font: 600 22px/1 var(--f-cond); letter-spacing: .02em; color: var(--text); }
  .note { margin-top: 10px; display: flex; gap: 8px; font-size: 13.5px; color: var(--text); background: var(--well); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; }
  .note i { color: var(--text-2); font-size: 16px; }

  .player { flex: none; padding: 12px 14px 10px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; flex-direction: row; }
  .player__ctl { display: flex; flex-direction: column; gap: 10px; padding-right: 16px; border-right: 1px solid var(--line); }
  .events { display: flex; flex-direction: column; gap: 5px; font-size: 13px; }
  .events li { display: flex; align-items: center; gap: 8px; }
  .events b { margin-left: auto; font: 600 14px/1 var(--f-cond); letter-spacing: .04em; }
  .player__row { display: flex; align-items: center; gap: 8px; }
  .player__row .key { width: 36px; padding: 0; }
  .player__row .key--lit { width: 44px; }
  .player__tc { font: 600 24px/1 var(--f-cond); letter-spacing: .03em; margin-left: 8px; white-space: nowrap; }
  .player__tc span { color: var(--text-2); font-size: 18px; }
  .player__row .end { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--text-2); }
  .lg { display: inline-flex; align-items: center; gap: 6px; }
  .lg b { width: 14px; height: 6px; border-radius: 1px; }
  .tl { position: relative; display: grid; grid-template-columns: 58px minmax(0, 1fr); row-gap: 5px; align-content: center; }
  .tl__lab { font: 600 11.5px/10px var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--text-2); }
  .tl__lane { position: relative; height: 10px; background: #0F1114; border-radius: 1px; }
  .tl__lane--tally { height: 6px; margin: 2px 0; }
  .seg-b { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
  .tl__flags { position: relative; height: 18px; }
  .flag { position: absolute; bottom: 0; transform: translateX(-8px); display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .flag span { font: 600 11px/1 var(--f-cond); letter-spacing: .03em; color: var(--text); }
  .tl__ruler { position: relative; height: 14px; }
  .tl__ruler span { position: absolute; font: 600 11px/1 var(--f-cond); letter-spacing: .04em; color: var(--text-2); transform: translateX(-50%); top: 3px; }
  .tl__ruler span:first-child { transform: none; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--blue); pointer-events: none; }
  .playhead::before { content: ""; position: absolute; top: -2px; left: -4px; width: 10px; height: 8px; background: var(--blue); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .mark-line { position: absolute; top: 0; bottom: 0; width: 1px; opacity: .8; }

  .hist { flex: 1; }
  .hist .pane__head .legend { margin-left: auto; }
  .earlier { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; background: var(--bezel); border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--text-2); }
  .earlier i { font-size: 15px; }
  .colhead { position: sticky; top: 30px; z-index: 2; display: grid; grid-template-columns: 46px 1fr 1fr; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .colhead > div { display: flex; align-items: center; gap: 8px; }
  .colhead .cap { color: var(--text); font-size: 13px; }
  .colhead .muted { font-size: 12.5px; }
  .kr { display: grid; grid-template-columns: 46px 1fr 1fr; gap: 12px; padding: 10px 14px; border-bottom: 1px solid #1F2227; align-items: start; }
  .kr .tx__t { display: flex; flex-direction: column; gap: 6px; }
  .kr .match { flex-direction: column; align-items: flex-start; gap: 4px; }
  .kr .match .meter b { width: 3px; }
  .kr__wrote { font-size: 14px; line-height: 1.5; padding: 6px 0 0; }
  .cap-box { background: #000; border-radius: 2px; padding: 6px 10px 7px; font-size: 14px; line-height: 1.5; color: #fff; }
  .cap-box .who { font: 600 13px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--umd); margin-right: 6px; }
  .kr.is-sel { background: var(--sel); box-shadow: inset 0 0 0 1px var(--blue); }
  .kr .aswritten { margin-top: 8px; }
  .tx__row .txt { font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, st, dir, meter, matchMeter, wroteHTML, saidHTML, mount } = Kiku;
  const A = K.audit;
  const secs = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const total = secs(A.duration);
  const pos = (t) => (secs(t) / total) * 100;
  const first = A.specialist.split(" ")[0];
  const karaoke = A.transcript.filter((x) => x.karaoke);
  const selT = "00:54";

  /* slate */
  const slate = `<section class="pane" aria-label="Call details">
    <div class="pane__head"><h2>Call details</h2><span class="end">${st(A.status)}</span></div>
    <dl class="slate">
      <div><dt>Phone</dt><dd>${esc(A.phone)}</dd></div>
      <div><dt>Booking</dt><dd>${esc(A.booking)}</dd></div>
      <div class="full"><dt>Stay</dt><dd>${esc(A.stay)}</dd></div>
      <div><dt>Direction · type</dt><dd>${dir(A.direction)} · ${esc(A.type)}</dd></div>
      <div><dt>Started · duration</dt><dd>${esc(A.started)} · ${A.duration}</dd></div>
      <div class="full"><dt>Specialist</dt><dd>${esc(A.specialist)}, took over from ${esc(A.agent)} at ${A.takeoverAt}</dd></div>
    </dl>
  </section>`;

  /* karaoke summary */
  const bridge = karaoke.map((k) => `<div class="bridge__ch${k.t === selT ? " is-sel" : ""}${k.asWritten ? " is-exact" : ""}" title="${k.t}: ${k.match}% of Kiku's words spoken">
      <span class="bridge__pct">${k.match}%</span>${meter(k.match / 100, "mono", 10, true)}<span class="bridge__t">${k.t}</span>
      <span class="bridge__mark">${k.asWritten ? ic("check-double-line") : ""}</span></div>`).join("");
  const ks = A.karaokeSummary;
  const aw = karaoke.find((k) => k.asWritten);
  const summary = `<section class="pane" aria-label="Karaoke summary">
    <div class="pane__head"><h2>Karaoke</h2><p class="end ksum__line"><b>${ks.lines}</b> lines · <b>${ks.asWritten}</b> as written · <b>${ks.improvised}</b> improvised</p></div>
    <div class="ksum">
      <div class="bridge">${bridge}</div>
      <p class="awline"><span class="aswritten">${ic("check-double-line")}As written</span><span>The ${aw.t} line was read word for word. The other ${ks.improvised} were improvised.</span></p>
    </div>
  </section>`;

  /* outcome */
  const oc = A.outcome.map((o) => `<div class="oc oc--${o.result}">${ic(o.result === "added" ? "check-line" : "close-line")}<span>${esc(o.item)}</span><span class="oc__amt">${o.result === "added" ? esc(o.amount) : "Declined"}</span></div>`).join("");
  const outcome = `<section class="pane" aria-label="Outcome">
    <div class="pane__head"><h2>Outcome</h2><span class="end total"><span class="muted">Added to ${esc(A.booking)}</span><b>${esc(A.total)}</b></span></div>
    <div class="outcome">${oc}
      <p class="note">${ic("sticky-note-line")}<span>${esc(A.note)}</span></p>
    </div>
  </section>`;

  /* player */
  const turns = A.transcript;
  const nextT = (i) => (turns[i + 1] ? turns[i + 1].t : A.duration);
  const laneOf = { agent: "kiku", guest: "guest", specialist: "human" };
  const laneColor = { kiku: "var(--green)", guest: "#3DA5FF", human: "var(--red)" };
  const segs = (lane) => turns.map((x, i) => (laneOf[x.speaker] === lane ? `<span class="seg-b" style="left:${pos(x.t)}%;width:${pos(nextT(i)) - pos(x.t)}%;background:${laneColor[lane]}"></span>` : "")).join("");
  const sysMarks = turns.filter((x) => x.speaker === "system" && x.kind !== "end");
  const markKind = { escalation: ["esc", "var(--amber)"], join: ["pfl", "var(--blue)"], takeover: ["air", "var(--red)"] };
  const flags = sysMarks.map((x) => `<span class="flag" style="left:${pos(x.t)}%">${Kiku.lamp(markKind[x.kind][0], x.text)}</span>`).join("");
  const markLines = sysMarks.map((x) => `<span class="mark-line" style="left:${pos(x.t)}%;background:${markKind[x.kind][1]}"></span>`).join("");
  const ruler = ["00:00", "00:30", "01:00", "01:30", "02:00", "02:30"].map((t) => `<span style="left:${pos(t)}%">${t}</span>`).join("");
  const player = `<section class="pane player" aria-label="Recording">
    <div class="player__ctl">
      <div class="player__row">
        <button class="key" aria-label="Back 5 seconds">${ic("replay-5-line")}</button>
        <button class="key key--lit" aria-label="Play">${ic("play-fill")}</button>
        <button class="key" aria-label="Forward 5 seconds">${ic("forward-5-line")}</button>
        <span class="player__tc">${selT}<span> / ${A.duration}</span></span>
      </div>
      <ul class="events">
        <li>${Kiku.lamp("esc")}Escalated<b>${turns.find((x) => x.kind === "escalation").t}</b></li>
        <li>${Kiku.lamp("pfl")}${esc(first)} joined<b>${turns.find((x) => x.kind === "join").t}</b></li>
        <li>${Kiku.lamp("air")}${esc(first)} took over<b>${A.takeoverAt}</b></li>
      </ul>
    </div>
    <div class="tl">
      <span></span><div class="tl__flags">${flags}</div>
      <span class="tl__lab">On line</span>
      <div class="tl__lane tl__lane--tally"><span class="seg-b" style="left:0;width:${pos(A.takeoverAt)}%;background:var(--green)"></span><span class="seg-b" style="left:${pos(A.takeoverAt)}%;width:${100 - pos(A.takeoverAt)}%;background:var(--red)"></span></div>
      <span class="tl__lab">Kiku</span><div class="tl__lane">${segs("kiku")}</div>
      <span class="tl__lab">Guest</span><div class="tl__lane">${segs("guest")}</div>
      <span class="tl__lab">${esc(first)}</span><div class="tl__lane">${segs("human")}</div>
      <span></span><div class="tl__ruler">${ruler}</div>
      <div style="position:absolute;left:58px;right:0;top:18px;bottom:19px;pointer-events:none">${markLines}<span class="playhead" style="left:${pos(selT)}%"></span></div>
    </div>
  </section>`;

  /* message history */
  const sysIcon = { escalation: "alert-line", join: "headphone-line", takeover: "mic-line", end: "stop-circle-line" };
  const who = { agent: ["kiku", "record-circle-line", "Kiku"], guest: ["guest", "user-line", "Guest"] };
  const rows = turns.map((x) => {
    if (x.speaker === "system") {
      const row = `<div class="tx__row tx__row--sys" data-t="${x.t}"><span class="tx__t">${x.t}</span><span class="sys sys--${x.kind}">${ic(sysIcon[x.kind])}${esc(x.text)}</span></div>`;
      return x.kind === "takeover" ? row + `<div class="colhead" role="row"><span></span>
        <div>${Kiku.lamp("live")}<span class="cap">Prompter</span><span class="muted">Kiku wrote</span></div>
        <div>${Kiku.lamp("air")}<span class="cap">On air</span><span class="muted">${esc(first)} said</span></div></div>` : row;
    }
    if (x.karaoke) {
      return `<div class="kr${x.t === selT ? " is-sel" : ""}" data-t="${x.t}">
        <div class="tx__t">${x.t}${matchMeter(x.match)}</div>
        <p class="kr__wrote">${wroteHTML(x.diff)}</p>
        <div><p class="cap-box"><span class="who">${esc(first)}</span>${saidHTML(x.diff)}</p>${x.asWritten ? `<span class="aswritten">${ic("check-double-line")}Spoken as written</span>` : ""}</div>
      </div>`;
    }
    const w = who[x.speaker];
    return `<div class="tx__row" data-t="${x.t}"><span class="tx__t">${x.t}</span><span class="tx__who tx__who--${w[0]}">${ic(w[1])}${w[2]}</span><p class="txt">${esc(x.text)}</p></div>`;
  }).join("");
  const hist = `<section class="pane hist" aria-label="Message history">
    <div class="pane__head"><h2>Message history</h2><span class="muted">${turns.length} entries</span>
      <span class="legend"><span><s class="skip">struck</s> Kiku wrote, not spoken</span><span><mark class="adlib">underlined</mark> ad-lib</span></span></div>
    <div class="scroll tx" id="tx" style="flex:1;position:relative">
      <div class="earlier">${ic("arrow-up-line")}${turns.findIndex((x) => x.t === "00:31")} earlier entries from 00:00. Scroll up to read the opening.</div>
      ${rows}
    </div>
  </section>`;

  mount({
    role: "specialist",
    active: "logs",
    back: { href: "03-call-logs.html", label: "Call logs" },
    title: esc(A.guest),
    after: `<span class="id">${A.id}</span>${st(A.status)}<span class="dir dir--out" style="color:var(--text-2)">${ic("arrow-right-up-line")}Outbound · ${esc(A.type)}</span>`,
    meta: `${esc(A.purpose)} · <b>${A.duration}</b> · specialist <b>${esc(A.specialist)}</b>`,
    body: `<div class="audit">
      <div class="col">${slate}${summary}${outcome}</div>
      <div class="col">${player}${hist}</div>
    </div>`,
  });
  const tx = document.getElementById("tx");
  const toStart = () => { tx.scrollTop = tx.querySelector('[data-t="00:31"]').offsetTop - tx.querySelector(".earlier").offsetHeight; };
  toStart();
  document.fonts.ready.then(toStart);
</script>
</body>
</html>
