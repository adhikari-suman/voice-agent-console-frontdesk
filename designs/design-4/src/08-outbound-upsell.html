<!doctype html>
<html lang="en">
<head>
<title>Kiku · Upsell calls</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .up { height: 100%; display: grid; grid-template-columns: 468px minmax(0, 1fr); gap: 16px; align-items: start; }
  .offers { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); }
  .offer { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 4px 12px; align-items: start; padding: 11px 12px; border-bottom: 1px solid var(--line); }
  .offer:last-child { border-bottom: 0; }
  .offer .switch { margin-top: 1px; }
  .offer b { font-weight: 600; font-size: 14.5px; }
  .offer p { font-size: 13px; color: var(--text-2); margin-top: 1px; }
  .offer .price { font: 600 15px/1.2 var(--f-cond); letter-spacing: .03em; text-align: right; white-space: nowrap; }
  .offer .alt { font-size: 12.5px; color: var(--text-2); text-align: right; display: block; font-family: var(--f-ui); font-weight: 400; letter-spacing: 0; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip-sw { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--well); font-size: 13.5px; font-weight: 500; }
  .chip-sw .switch { width: 30px; height: 18px; }
  .chip-sw .switch::after { width: 10px; height: 10px; }
  .chip-sw .switch[aria-checked="true"]::after { left: 15px; }
  .cols { color: var(--text-2); font-size: 12.5px; }
  .cols code { font: 600 12.5px/1 var(--f-cond); letter-spacing: .04em; color: var(--text); background: var(--bezel); border: 1px solid var(--line); border-radius: 2px; padding: 2px 5px 1px; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, mount } = Kiku;
  const U = K.upsellSingle, C = K.upsellCsv;
  const byId = Object.fromEntries(K.offers.map((o) => [o.id, o]));
  const [who, ...rest] = U.match.split(" · ");

  const offerRows = U.offers.map((id) => {
    const o = byId[id];
    return `<div class="offer"><button class="switch" role="switch" aria-checked="true" aria-label="Offer ${esc(o.name)}"></button>
      <span><b>${esc(o.name)}</b><p>${esc(o.detail)}</p></span>
      <span class="price">${esc(o.price)}${o.alt ? `<span class="alt">${esc(o.alt)}</span>` : ""}</span></div>`;
  }).join("");

  const single = `<section class="pane path" aria-label="Call one guest">
    <div class="pane__head"><h2>Call one guest</h2><span class="end muted">single call</span></div>
    <div class="path__body">
      <div class="row2">
        <div class="field"><label class="lbl" for="ph">Phone</label><input class="input" id="ph" value="${esc(U.phone)}"></div>
        <div class="field"><label class="lbl" for="cf">Confirmation number</label><input class="input input--code" id="cf" value="${esc(U.confirmation)}"></div>
      </div>
      <div class="match-box">${ic("checkbox-circle-line")}<div><b>Booking found · ${esc(who)}</b><p>${esc(rest.join(" · "))}</p></div></div>
      <div class="field"><span class="lbl">Offers on this call <span class="end">${U.offers.length} of ${K.offers.length} on</span></span><div class="offers">${offerRows}</div></div>
    </div>
    <div class="path__foot"><p class="sum">Kiku calls <b>${esc(who)}</b> now</p><div class="end"><button class="key key--lg key--lit">${ic("phone-line")}Call now</button></div></div>
  </section>`;

  const readyPct = (C.ready / C.rows) * 100;
  const explain = {
    "Phone number too short": (r) => `${r.phone.replace(/\D/g, "").length} digits. A UK mobile needs 11, or use the +44 format.`,
    "Confirmation number missing": () => `Add the BRN number for this phone, or the row is skipped.`,
  };
  const prev = C.preview.map((r) => r.ok
    ? `<tr><td class="rn">${r.row}</td><td>${esc(r.phone)}</td><td>${esc(r.confirmation)}</td><td>${esc(r.guest)}</td><td><span class="ok">${ic("check-line")}Ready</span></td></tr>`
    : `<tr class="is-err"><td class="rn">${r.row}</td><td>${r.error.startsWith("Phone") ? `<span class="bad">${esc(r.phone)}</span>` : esc(r.phone)}</td><td>${r.confirmation ? esc(r.confirmation) : `<span class="empty">empty</span>`}</td>
        <td colspan="2"><div class="errcell">${ic("close-circle-line")}<div><b>${esc(r.error)}</b><span>${explain[r.error](r)}</span></div></div></td></tr>`
  ).join("");

  const batch = `<section class="pane path" aria-label="Call from a file">
    <div class="pane__head"><h2>Call from a file</h2><span class="end cols">Columns <code>${C.columns.join("</code> <code>")}</code></span></div>
    <div class="path__body">
      <div class="drop"><span class="file__icon">${ic("file-text-line")}</span><div class="drop__text"><span class="file__name" style="color:var(--text)">${esc(C.file)}</span><span>${C.size} · ${C.rows} rows · drop another CSV here to replace it</span></div><button class="key key--sm">${ic("upload-2-line")}Choose file</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="vbar" aria-hidden="true"><span style="width:${readyPct}%"></span><span class="err" style="width:${100 - readyPct}%"></span></div>
        <div class="vsum" style="justify-content:space-between"><span class="st st--done">${ic("check-line")}<span><b>${C.ready}</b> ready</span></span><span class="st st--fail">${ic("close-circle-line")}<span><b>${C.errors}</b> rows with errors, shown below</span></span></div>
      </div>
      <div class="field"><span class="lbl">Preview <span class="end">first rows and every error</span></span>
        <div class="preview"><table class="tbl"><thead><tr><th>Row</th><th>Phone</th><th>Confirmation</th><th>Guest</th><th>Check</th></tr></thead><tbody>${prev}</tbody></table></div>
      </div>
      <div class="field"><span class="lbl">Offers on these calls</span>
        <div class="chips">${K.offers.map((o) => `<span class="chip-sw"><button class="switch" role="switch" aria-checked="true" aria-label="Offer ${esc(o.name)}"></button>${esc(o.name)}</span>`).join("")}</div>
      </div>
    </div>
    <div class="path__foot"><p class="sum">${C.errors} rows are skipped until fixed</p><div class="end"><button class="key key--lg">${ic("download-2-line")}Error rows</button><button class="key key--lg key--lit">${ic("phone-line")}Start ${C.ready} calls</button></div></div>
  </section>`;

  mount({
    role: "admin",
    active: "upsell",
    title: "Upsell calls",
    meta: `Kiku offers arrival pickup, breakfast and dinner on an existing booking`,
    body: `<div class="up">${single}${batch}</div>`,
  });
</script>
</body>
</html>
