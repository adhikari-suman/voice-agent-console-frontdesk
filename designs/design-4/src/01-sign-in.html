<!doctype html>
<html lang="en">
<head>
<title>Kiku · Sign in</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .signin { height: 100%; display: grid; grid-template-rows: 72px 1fr 64px; }
  .signin__top { display: flex; align-items: center; justify-content: flex-end; padding: 0 32px; border-bottom: 1px solid var(--line); }
  .signin__top .line { margin-right: auto; display: flex; align-items: center; gap: 10px; color: var(--text-2); font-size: 13px; }
  .signin__mid { display: grid; place-items: center; }
  .stack { width: 420px; display: flex; flex-direction: column; align-items: center; }
  .wordmark--xl { font-size: 46px; padding: 12px 16px 10px 20px; letter-spacing: .12em; }
  .hotel { margin: 14px 0 28px; font-size: 16px; color: var(--text-2); }
  .hotel b { color: var(--text); font-weight: 600; }
  .mon--signin { width: 100%; }
  .signin form { padding: 26px 28px 28px; display: flex; flex-direction: column; gap: 18px; }
  .signin h1 { font: 600 22px/1.2 var(--f-ui); }
  .pw { position: relative; }
  .pw .iconkey { position: absolute; right: 3px; top: 3px; }
  .signin__foot { display: flex; align-items: center; justify-content: center; font-size: 12.5px; color: var(--text-2); gap: 8px; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<div class="signin">
  <div class="signin__top" id="top"></div>
  <div class="signin__mid">
    <div class="stack">
      <span class="wordmark wordmark--xl" id="mark">KIKU</span>
      <p class="hotel" id="hotel"></p>
      <div class="mon mon--signin">
        <div class="tally tally--off"><i class="ri-lock-line" aria-hidden="true"></i>Standby<span class="tally__end">Not signed in</span></div>
        <div class="mon__screen">
          <form onsubmit="return false">
            <h1>Sign in</h1>
            <div class="field">
              <label class="lbl" for="email">Email</label>
              <input class="input" id="email" type="email" autocomplete="username">
            </div>
            <div class="field">
              <label class="lbl" for="pw">Password <a class="end link" href="#">Forgot password?</a></label>
              <div class="pw">
                <input class="input is-focus" id="pw" type="password" value="brenlow-desk-2026" autocomplete="current-password">
                <button class="iconkey" type="button" aria-label="Show password"><i class="ri-eye-line" aria-hidden="true"></i></button>
              </div>
            </div>
            <button class="key key--lit key--lg" type="submit">Sign in <i class="ri-arrow-right-line" aria-hidden="true"></i></button>
          </form>
        </div>
        <div class="umd" id="umd"></div>
      </div>
    </div>
  </div>
  <footer class="signin__foot" id="foot"></footer>
</div>
<script>
  const { K, esc, ic } = Kiku;
  document.getElementById("hotel").innerHTML = `<b>${esc(K.hotel.name)}</b>, ${esc(K.hotel.city)}`;
  document.getElementById("email").value = K.people.specialist.email;
  document.getElementById("umd").textContent = `${K.product.name} · ${K.product.tagline}`;
  document.getElementById("top").innerHTML =
    `<span class="line">${ic("phone-line")}Hotel line ${esc(K.hotel.line)}</span>` +
    `<div class="clock"><span class="clock__t">${esc(K.hotel.now)}</span><span class="clock__z"><b>${esc(K.hotel.tz)}</b><span>${esc(K.hotel.today)}</span></span></div>`;
  document.getElementById("foot").innerHTML = `${ic("information-line")}<span>${esc(K.synthetic)}</span>`;
</script>
</body>
</html>
