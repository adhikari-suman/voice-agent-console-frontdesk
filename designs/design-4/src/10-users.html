<!doctype html>
<html lang="en">
<head>
<title>Kiku · Users</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .users { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; }
  .crew .tbl { table-layout: fixed; }
  .person > div { min-width: 0; }
  .person .sub { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crew .tbl td { height: 60px; }
  .person { display: flex; align-items: center; gap: 12px; }
  .person b { display: block; font-weight: 600; }
  .person .sub { font-size: 13px; color: var(--text-2); }
  .role { display: inline-flex; align-items: center; gap: 6px; }
  .role i { font-size: 15px; color: var(--text-2); }
  .ust { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; white-space: nowrap; }
  .ust i { font-size: 15px; }
  .ust--active i { color: var(--text); }
  .ust--invited i { color: var(--text-2); }
  .ust--deactivated { color: var(--text-2); }
  .last { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
  .tk { font: 600 17px/1 var(--f-cond); letter-spacing: .03em; padding-right: 8px; }
  .tk.zero { color: var(--text-2); }
  .tbl tr.is-off td .person b { color: var(--text-2); font-weight: 500; }
  .crew__foot { margin-top: auto; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-2); display: flex; gap: 16px; }
  .crew__foot b { color: var(--text); }

  .panel { display: flex; flex-direction: column; min-height: 0; border-color: var(--line-2); }
  .panel .pane__head { background: var(--bezel); }
  .panel__body { flex: 1; min-height: 0; overflow: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }
  .rolepick { display: flex; flex-direction: column; gap: 8px; }
  .ropt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--well); cursor: pointer; }
  .ropt:hover { border-color: var(--line-2); }
  .ropt.is-on { background: var(--sel); border-color: var(--blue); }
  .ropt .radio { margin-top: 1px; }
  .ropt b { font-weight: 600; font-size: 15px; }
  .ropt ul { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .ropt li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; font-size: 13.5px; color: var(--text); line-height: 1.35; }
  .ropt:not(.is-on) li { color: var(--text-2); }
  .ropt li i { font-size: 15px; color: var(--text-2); position: relative; top: 1px; }
  .panel__foot { flex: none; padding: 12px 18px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .panel__foot .help { margin-right: auto; max-width: 170px; line-height: 1.35; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, lamp, mount } = Kiku;
  const N = K.newUserDraft;
  const UST = { Active: ["active", "checkbox-circle-line"], Invited: ["invited", "mail-send-line"], Deactivated: ["deactivated", "forbid-line"] };
  const count = (s) => K.users.filter((u) => u.status === s).length;

  const rows = K.users.map((u, i) => {
    const [k, icn] = UST[u.status];
    const onAir = u.lastActive.startsWith("On a call");
    const me = u.email === K.people.admin.email;
    return `<tr class="${u.status === "Deactivated" ? "is-off" : ""}${u.name === "Tomasz Nowak" ? " is-hover" : ""}">
      <td><div class="person"><span class="av av--lg">${esc(u.initials)}${onAir ? '<span class="dot dot--air"></span>' : ""}</span><div><b>${esc(u.name)}${me ? ' <span class="muted" style="font-weight:400">(you)</span>' : ""}</b><span class="sub">${esc(u.email)}</span></div></div></td>
      <td><span class="role">${ic(u.role === "Admin" ? "shield-user-line" : "headphone-line")}${esc(u.role)}</span></td>
      <td><span class="ust ust--${k}">${ic(icn)}${esc(u.status)}</span></td>
      <td><span class="last">${onAir ? lamp("air", "On air") : ""}${esc(u.lastActive)}</span></td>
      <td class="r"><span class="tk${u.takeovers30d ? "" : " zero"}">${u.takeovers30d}</span></td>
    </tr>`;
  }).join("");

  const roleOpt = (r) => `<div class="ropt${N.role === r ? " is-on" : ""}" role="radio" aria-checked="${N.role === r}">
      <span class="radio${N.role === r ? " is-on" : ""}"></span>
      <div><b>${r}</b><ul>${K.roles[r].map((p) => `<li>${ic("check-line")}<span>${esc(p)}</span></li>`).join("")}</ul></div>
    </div>`;

  const panel = `<aside class="pane panel" aria-label="Add user">
    <div class="pane__head"><h2>Add a user</h2><button class="iconkey end" aria-label="Close">${ic("close-line")}</button></div>
    <div class="panel__body">
      <div class="field"><label class="lbl" for="nm">Full name</label><input class="input" id="nm" value="${esc(N.name)}"></div>
      <div class="field"><label class="lbl" for="em">Work email</label><input class="input is-focus" id="em" value="${esc(N.email)}"><span class="help">The invite goes here. They set their own password.</span></div>
      <div class="field"><span class="lbl">Role</span><div class="rolepick" role="radiogroup" aria-label="Role">${roleOpt("Specialist")}${roleOpt("Admin")}</div></div>
      <p class="help">New users show as Invited until their first sign-in.</p>
    </div>
    <div class="panel__foot"><button class="key key--lg" style="margin-left:auto">Cancel</button><button class="key key--lg key--lit">${ic("mail-send-line")}Send invite</button></div>
  </aside>`;

  mount({
    role: "admin",
    active: "users",
    title: "Users",
    meta: `Everyone who can sign in to Kiku at ${esc(K.hotel.name)}`,
    tools: `<div class="inputwrap" style="width:280px">${ic("search-line")}<input class="input" type="search" placeholder="Search name or email" aria-label="Search users"></div><button class="key key--pfl" aria-pressed="true" style="height:38px">${ic("user-add-line")}Add user</button>`,
    body: `<div class="users">
      <section class="pane crew" aria-label="Users">
        <div class="scroll">
          <table class="tbl"><colgroup><col><col style="width:100px"><col style="width:120px"><col style="width:184px"><col style="width:108px"></colgroup><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th class="r">Takeovers (30 d)</th></tr></thead><tbody>${rows}</tbody></table>
        </div>
        <div class="crew__foot"><span><b>${K.users.length}</b> users</span><span><b>${count("Active")}</b> active</span><span><b>${count("Invited")}</b> invited</span><span><b>${count("Deactivated")}</b> deactivated</span></div>
      </section>
      ${panel}
    </div>`,
  });
</script>
</body>
</html>
