<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku, make a call</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
.content { display: grid; grid-template-columns: 520px 1fr; gap: 16px; padding: 20px 28px; }
.pp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; min-height: 0; }
.pp .top2 { padding: 16px 20px 12px; border-bottom: 1px solid var(--line-soft); }
.pp .body { padding: 16px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.pp .foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.pp .foot .sp { flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.purpose { font-size: 14.5px; min-height: 104px; }
.counter { display: flex; justify-content: space-between; }
.tip { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: 12.5px; color: var(--muted); padding: 10px 12px; background: var(--paper); border-radius: var(--r); line-height: 1.45; }
.tip svg.lucide { color: var(--kiku); margin-top: 1px; }
.today { list-style: none; border-top: 1px solid var(--line); }
.today li { display: grid; grid-template-columns: 120px 1fr 46px; gap: 4px 10px; padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 12.5px; align-items: start; }
.today li b { font-weight: 600; }
.today li p { grid-column: 2; color: var(--muted); }
.today li .tc { font: 600 14px/1.2 var(--f-count); color: var(--muted); text-align: right; letter-spacing: .04em; grid-column: 3; grid-row: 1; }
table.prev td.pur { max-width: 380px; line-height: 1.4; }
.tmpl { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border: 1.5px dashed var(--line); border-radius: var(--r); background: var(--hatch), var(--surface); }
.tmpl .fi { width: 40px; height: 40px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); display: grid; place-items: center; }
.tmpl b { font-size: 13.5px; } .tmpl p { font-size: 12.5px; color: var(--muted); }
</style></head>
<body>
<div class="app">
  <nav class="spine" id="spine"></nav>
  <main class="main">
    <header class="top" id="top"></header>
    <div class="content">
      <section class="pp" id="single"></section>
      <section class="pp" id="csv"></section>
    </div>
  </main>
</div>
<script>
const { K, esc, icon, shell, status } = TT; const M = K.makeCallSingle, C = K.makeCallCsv;
shell({ role: 'admin', active: 'out', title: 'Outbound', after: TT.outTabs('make') });
document.getElementById('single').innerHTML = `
  <div class="top2 path"><span class="pn">1</span><h2>Call one person</h2><span class="help">For anything that isn't a campaign or upsell</span></div>
  <div class="body">
    <div class="field"><label>Purpose <small>What should Kiku get done on this call?</small></label>
      <div class="input area purpose focus">${esc(M.purpose)}</div>
      <div class="counter help"><span>Write it the way you'd brief a colleague at the desk.</span></div></div>
    <div class="two"><div class="field"><label>Name <small>Optional</small></label><div class="input">${icon('user')}${esc(M.name)}</div></div>
      <div class="field"><label>Phone</label><div class="input num">${icon('phone')}${esc(M.phone)}</div></div></div>
    <div class="tip">${icon('info')}<span>Name is optional. A phone number and a purpose are enough for Kiku to place the call.</span></div>
    <div style="margin-top:auto"><h3 class="lbl" style="margin-bottom:6px">Made today</h3>
      <ul class="today">${K.calls.filter(c => c.type === 'Make a call').map(c => `<li>${status(c.status)}<b>${esc(c.guest)}</b><span class="tc">${c.started}</span><p>${esc(c.purpose)}${c.outcome ? `. ${esc(c.outcome)}.` : ''}</p></li>`).join('')}</ul></div>
  </div>
  <div class="foot"><span class="help">Kiku calls from ${K.hotel.line}.</span><span class="sp"></span><button class="btn ink lg">${icon('phone-outgoing')}Place call</button></div>`;

document.getElementById('csv').innerHTML = `
  <div class="top2 path"><span class="pn">2</span><h2>Upload a list</h2><span class="help">Columns <span class="cols">${C.columns.map(c => `<code>${c}</code>`).join('')}</span></span></div>
  <div class="body">
    <div class="file"><span class="fi">${icon('file-spreadsheet')}</span><div><b>${C.file}</b><small>${C.size}, ${C.rows} rows</small>
      <div class="ratio"><i style="width:${C.ready / C.rows * 100}%;background:var(--ok)"></i><i style="width:${C.errors / C.rows * 100}%;background:var(--human-hi)"></i></div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><div class="tally"><span class="ok">${icon('check')}${C.ready} ready</span><span class="bad">${icon('x')}${C.errors} error</span></div><button class="btn sm ghost">${icon('refresh-cw')}Replace file</button></div></div>
    <div style="border:1px solid var(--line);border-radius:var(--r);background:#fff">
    <table class="prev"><thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th>Check</th></tr></thead><tbody>
    ${C.preview.map(r => `<tr class="${r.ok ? '' : 'err'}"><td class="r">${r.row}</td><td class="num" style="white-space:nowrap">${r.phone ? esc(r.phone) : '<span class="blank">empty</span>'}</td><td style="white-space:nowrap">${r.name ? esc(r.name) : '<span style="color:var(--faint)">No name</span>'}</td><td class="pur">${esc(r.purpose)}</td>
      <td style="white-space:nowrap">${r.ok ? status('completed', 'Ready').replace('font-weight', '') : `<span class="errmsg">${icon('triangle-alert')}${esc(r.error)}</span>`}</td></tr>`).join('')}
    <tr><td colspan="5" class="help" style="padding:9px 10px">Showing 5 of ${C.rows} rows. Row 6 is skipped until it has a phone number.</td></tr>
    </tbody></table></div>
    <div class="tmpl" style="margin-top:auto"><span class="fi">${icon('file-down')}</span><div><b>Start from the template</b><p>One row per call. Name can be left blank; purpose is written the same way as a single call.</p></div><button class="btn sm">${icon('download')}Download template.csv</button></div>
  </div>
  <div class="foot"><span class="help">Kiku calls each ready row from the hotel line.</span><span class="sp"></span><button class="btn">Download errors</button><button class="btn ink lg">${icon('play')}Start ${C.ready} calls</button></div>`;
TT.draw();
</script>
</body></html>
