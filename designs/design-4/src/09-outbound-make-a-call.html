<!doctype html>
<html lang="en">
<head>
<title>Kiku · Make a call</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .mk { height: 100%; display: grid; grid-template-columns: 468px minmax(0, 1fr); gap: 16px; align-items: start; }
  .purpose { min-height: 132px; font-size: 15px; }
  .count { font: 500 12.5px/1 var(--f-ui); color: var(--text-2); }
  .cols { color: var(--text-2); font-size: 12.5px; }
  .cols code { font: 600 12.5px/1 var(--f-cond); letter-spacing: .04em; color: var(--text); background: var(--bezel); border: 1px solid var(--line); border-radius: 2px; padding: 2px 5px 1px; }
  .tpl { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--well); font-size: 13.5px; }
  .tpl > i { font-size: 18px; color: var(--text-2); }
  .tpl .end { margin-left: auto; }
  .preview td.pp { line-height: 1.4; }
  .preview tr.is-err:not(.errnote) td { border-bottom: 0; }
  .preview tr.errnote td { padding-top: 0; }
  .preview tr.is-err .ok i { color: var(--fail); }
  .brief { font-size: 13px; color: var(--text-2); line-height: 1.45; display: flex; gap: 8px; }
  .brief i { font-size: 16px; }
</style>
</head>
<body>
<script>
  const { K, esc, ic, mount } = Kiku;
  const M = K.makeCallSingle, C = K.makeCallCsv;

  const single = `<section class="pane path" aria-label="Call one person">
    <div class="pane__head"><h2>Call one person</h2><span class="end muted">single call</span></div>
    <div class="path__body">
      <div class="field"><label class="lbl" for="pu">Purpose <span class="end count">${M.purpose.length} characters</span></label>
        <textarea class="input purpose is-focus" id="pu" rows="5">${esc(M.purpose)}</textarea>
        <span class="help">Say what Kiku should tell them and what to ask. Kiku writes the call from this.</span></div>
      <div class="field"><label class="lbl" for="nm">Name <span class="opt">(optional)</span></label><input class="input" id="nm" value="${esc(M.name)}" placeholder="Who Kiku should ask for"></div>
      <div class="field"><label class="lbl" for="ph">Phone</label><input class="input" id="ph" value="${esc(M.phone)}"></div>
    </div>
    <div class="path__foot"><p class="sum">Kiku calls <b>${esc(M.name)}</b> on ${esc(M.phone)}</p><div class="end"><button class="key key--lg key--lit">${ic("phone-line")}Place call</button></div></div>
  </section>`;

  const readyPct = (C.ready / C.rows) * 100;
  const prev = C.preview.map((r) => r.ok
    ? `<tr><td class="rn">${r.row}</td><td style="white-space:nowrap">${esc(r.phone)}</td><td>${r.name ? esc(r.name) : `<span class="empty">no name</span>`}</td><td class="pp">${esc(r.purpose)}</td><td><span class="ok">${ic("check-line")}Ready</span></td></tr>`
    : `<tr class="is-err"><td class="rn">${r.row}</td><td><span class="empty">empty</span></td><td>${esc(r.name)}</td><td class="pp">${esc(r.purpose)}</td>
        <td><span class="ok" style="color:#F6D2CE">${ic("close-circle-line")}Error</span></td></tr>
      <tr class="is-err errnote"><td></td><td colspan="4"><div class="errcell">${ic("close-circle-line")}<div><b>Row ${r.row}: ${esc(r.error)}</b><span>Add a number for ${esc(r.name.split(" ")[0])} in the file, or this row is skipped.</span></div></div></td></tr>`
  ).join("");

  const batch = `<section class="pane path" aria-label="Call from a file">
    <div class="pane__head"><h2>Call from a file</h2><span class="end cols">Columns <code>${C.columns.join("</code> <code>")}</code></span></div>
    <div class="path__body">
      <div class="drop"><span class="file__icon">${ic("file-text-line")}</span><div class="drop__text"><span class="file__name" style="color:var(--text)">${esc(C.file)}</span><span>${C.size} · ${C.rows} rows · drop another CSV here to replace it</span></div><button class="key key--sm">${ic("upload-2-line")}Choose file</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="vbar" aria-hidden="true"><span style="width:${readyPct}%"></span><span class="err" style="width:${100 - readyPct}%"></span></div>
        <div class="vsum" style="justify-content:space-between"><span class="st st--done">${ic("check-line")}<span><b>${C.ready}</b> ready</span></span><span class="st st--fail">${ic("close-circle-line")}<span><b>${C.errors}</b> row with an error, shown below</span></span></div>
      </div>
      <div class="field"><span class="lbl">Preview <span class="end">first rows and every error</span></span>
        <div class="preview"><table class="tbl" style="table-layout:fixed"><colgroup><col style="width:48px"><col style="width:146px"><col style="width:116px"><col><col style="width:92px"></colgroup>
          <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th>Check</th></tr></thead><tbody>${prev}</tbody></table></div>
      </div>
      <div class="tpl">${ic("file-download-line")}<span>Start from the template: one row per call, with <b>phone</b> and <b>purpose</b> filled in. Name can stay empty.</span><a class="end key key--sm" href="#">${ic("download-2-line")}Template CSV</a></div>
    </div>
    <div class="path__foot"><p class="sum">${C.errors} row is skipped until fixed</p><div class="end"><button class="key key--lg key--lit">${ic("phone-line")}Start ${C.ready} calls</button></div></div>
  </section>`;

  mount({
    role: "admin",
    active: "call",
    title: "Make a call",
    meta: `A general call for any purpose. Kiku places it and logs what was said.`,
    body: `<div class="mk">${single}${batch}</div>`,
  });
</script>
</body>
</html>
