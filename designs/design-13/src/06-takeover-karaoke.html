<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku karaoke takeover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
  body::after { content: ""; position: fixed; inset: 0; box-shadow: inset 0 0 0 5px var(--magenta); pointer-events: none; z-index: 10; }
  .top { background: var(--magenta); border-bottom: 0; padding: 14px 28px; }
  .top h1 { font-size: 24px; }
  .top .sub { color: var(--ink); opacity: .8; }
  .top .right { color: var(--ink); }
  .airdot { width: 12px; height: 12px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px rgba(28,22,51,.18); }
  .timer { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .top .pill { border: 1.5px solid var(--ink); border-radius: 16px; padding: 4px 11px; font-weight: 650; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }

  .k6 { display: grid; grid-template-columns: 1fr 320px; gap: 18px; height: 100%; }
  .leftcol { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .prompter { border: 1px solid var(--line); border-radius: var(--r); background: var(--sheet); display: flex; flex-direction: column; }
  .pr-in { padding: 20px 26px 16px; display: flex; flex-direction: column; gap: 16px; }
  .lab { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 650; }
  .lab .d { width: 10px; height: 10px; border-radius: 50%; }
  .lab .t { color: var(--ink-3); font-weight: 500; }
  .lab .r { margin-left: auto; }
  .bigop { font-size: 27px; line-height: 1.85; letter-spacing: -0.01em; max-width: none; }
  .bigop .op-del { font-size: .62em; top: -0.75em; }
  .bigop .op-ins { text-decoration-thickness: 3px; text-underline-offset: 6px; }
  .bigop .op-ahead { font-size: .8em; }
  .bigop .caret { height: 1em; width: 3px; }
  .plain { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 13px; border-top: 3px double var(--line-2); padding-top: 12px; color: var(--ink-2); }
  .plain dt { font-weight: 650; font-size: 12px; padding-top: 1px; }
  .plain dt.k { color: var(--cyan-ink); } .plain dt.h { color: var(--magenta-ink); }
  .livedot { width: 10px; height: 10px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 0 4px var(--magenta-tint); }
  .partial { font-size: 11.5px; font-weight: 600; color: var(--magenta-ink); border: 1px solid #F0B5E1; border-radius: 10px; padding: 0 8px; }
  .next { background: var(--sheet-2); border-top: 1px solid var(--line); padding: 14px 26px; display: grid; grid-template-columns: 150px 1fr; gap: 14px; align-items: baseline; border-radius: 0 0 var(--r) var(--r); }
  .next .lab { color: var(--ink-3); }
  .next p { font-size: 16px; color: var(--ink-2); }

  .dock { display: flex; align-items: center; gap: 18px; padding: 12px 18px; }
  .dock .me2 { display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .dock .me2 b { display: block; font-weight: 650; }
  .dock .me2 span.m { font-size: 12px; color: var(--ink-3); }
  .dock .ctrl { margin-left: auto; display: flex; gap: 8px; }

  .earlier { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .earlier .ph { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  .earlier .scroll { padding: 4px 18px 10px; flex: 1; }

  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .side .panel { padding: 16px 18px; }
  .side h2 { font-size: 15px; font-weight: 650; margin-bottom: 10px; }
  .reason { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
  .reason .st { margin-top: 2px; }
  dl.kv { display: grid; grid-template-columns: 70px 1fr; gap: 8px 12px; font-size: 13px; }
  dl.kv dt { color: var(--ink-3); }
  .facts li { list-style: none; padding: 9px 0; border-top: 1px solid var(--line); font-size: 13px; display: grid; grid-template-columns: 20px 1fr; gap: 8px; }
  .facts li svg { color: var(--ink-3); margin-top: 2px; }
  .timeline li { list-style: none; display: grid; grid-template-columns: 44px 1fr; gap: 8px; font-size: 12.5px; padding: 5px 0; color: var(--ink-2); }
  .timeline li b { font-weight: 600; color: var(--ink-3); }
</style>
</head>
<body>
<script>
const T = K.takeover;
const cur = T.transcript[T.transcript.length - 1];
const body = shell({ role: "specialist", page: "live",
  title: `You're on the line with ${T.guest}`,
  sub: `The guest hears you, not Kiku. Kiku is writing each line for you. ${T.id}, inbound.`,
  right: `<span class="pill">${ic("mic")}Karaoke mode</span><span class="airdot"></span><span class="timer">${T.duration}</span>` });

const earlier = T.transcript.slice(0, -1);

body.innerHTML = `<div class="k6">
  <div class="leftcol">
    <section class="prompter" aria-label="Karaoke prompter">
      <div class="pr-in">
        <div class="lab"><span class="livedot"></span><span style="color:var(--magenta-ink)">You're reading Kiku's line from ${cur.t}</span><span class="partial">Live, partial</span>
          <span class="r match">${venn(cur.match, 24)}${cur.match}% shared so far</span></div>
        <p class="op bigop">${overprint(cur.diff, { live: true })}</p>
        <dl class="plain"><dt class="k">Kiku wrote</dt><dd>${esc(cur.wrote)}</dd><dt class="h">You, so far</dt><dd>${esc(cur.said)}</dd></dl>
        <div style="display:flex;justify-content:flex-end">${opLegend("You")}</div>
      </div>
      <div class="next">
        <div class="lab"><span class="d" style="background:var(--cyan);opacity:.5"></span>Kiku's next line</div>
        <p>${T.nextLine}</p>
      </div>
    </section>
    <section class="panel dock">
      <div class="me2"><span class="av lg">PR</span><div><b>Priya Raman, speaking</b><span class="m">Mic on. Took over at ${T.takeoverAt}</span></div></div>
      ${meter("h", 26, .62, 5)}
      <div class="ctrl">
        <button class="btn">${ic("mic-off")}Mute</button>
        <button class="btn kiku">${ic("bot")}Hand back to Kiku</button>
        <button class="btn danger">${ic("phone-off")}End call</button>
      </div>
    </section>
    <section class="panel earlier">
      <div class="ph"><h2>Earlier in this call</h2><span class="aside">Scroll up for Kiku's part of the call</span></div>
      <div class="scroll" id="tx"><div class="tx">${transcript(earlier, { guest: "Margaret Doyle", specialist: "Priya (you)" })}</div></div>
    </section>
  </div>

  <aside class="side">
    <section class="panel">
      <h2>Why it was escalated</h2>
      <div class="reason">${st("escalated")}</div>
      <p style="font-size:13.5px;margin-top:6px">${T.escalationReason}</p>
    </section>
    <section class="panel">
      <h2>Booking</h2>
      <dl class="kv">
        <dt>Guest</dt><dd>${T.guest}</dd>
        <dt>Phone</dt><dd>${T.phone}</dd>
        <dt>Booking</dt><dd>${T.booking}</dd>
        <dt>Stay</dt><dd>${T.stay.replace(/ · /g, ", ")}</dd>
        <dt>About</dt><dd>${T.purpose}</dd>
      </dl>
    </section>
    <section class="panel">
      <h2>Payment facts</h2>
      <ul class="facts">${T.facts.map((f, i) => `<li>${ic(["receipt", "clock-3", "credit-card"][i])}<span>${f}</span></li>`).join("")}</ul>
    </section>
    <section class="panel" style="flex:1">
      <h2>Handover</h2>
      <ul class="timeline">${T.transcript.filter(x => x.speaker === "system").map(x => `<li><b>${x.t}</b><span>${x.text}</span></li>`).join("")}</ul>
    </section>
  </aside>
</div>`;
done();
const p = document.getElementById("tx"); p.scrollTop = p.scrollHeight;
</script>
</body>
</html>
