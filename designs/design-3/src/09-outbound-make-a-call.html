<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Outbound, make a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@400;500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons-300-outline.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 540px minmax(0, 1fr); gap: 0 32px; padding: 16px 24px 0; }
  .path { min-height: 0; overflow: auto; padding-bottom: 12px; }
  .path + .path { border-left: 1px solid var(--rule); padding-left: 32px; }
  .frow { grid-template-columns: 110px minmax(0, 1fr); }
  .purpose { font: 400 16px/1.5 var(--serif); height: 128px; }
  .cols code { font: 500 12px/1 var(--sans); background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; }
  .tbl td.rn { color: var(--ink-2); width: 44px; }
  .tbl td.pp { white-space: normal; font: italic 400 14px/1.3 var(--serif); padding-top: 7px; padding-bottom: 7px; }
  .tbl.sm td { height: 38px; }
  .tbl td.errmsg { white-space: nowrap; }
  .tpl { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 10px 12px; background: var(--panel); border-radius: 4px; font-size: 14px; }
  .tpl .ti { font-size: 18px; color: var(--ink-2); }
  .tpl .link { margin-left: auto; white-space: nowrap; }
</style>
</head>
<body data-role="admin">
<header id="top"></header>
<main class="page">
  <header class="phead ohead">
    <h1>Outbound</h1>
    <nav class="tabs" aria-label="Outbound call types">
      <a class="tab" href="07-outbound-campaign.html"><i class="ti ti-speakerphone"></i>Campaign</a>
      <a class="tab" href="08-outbound-upsell.html"><i class="ti ti-list-details"></i>Upsell</a>
      <a class="tab is-active" href="09-outbound-make-a-call.html" aria-current="page"><i class="ti ti-phone-call"></i>Make a call</a>
    </nav>
    <p class="lede" style="margin:4px 0 0 auto">A general call for any purpose. Tell Kiku what the call is for.</p>
  </header>
  <div class="paths">
    <section class="path" id="single"></section>
    <section class="path" id="csv"></section>
  </div>
</main>
<script>
(function () {
  const { K, esc, ic, $ } = Kiku;
  Kiku.shell({ active: 'out' });
  const M = K.makeCallSingle;
  $('#single').innerHTML = `
    <div class="col-h"><h2>One call</h2><span class="help">Fill in the form</span></div>
    <div class="frow"><span class="label">Purpose</span><div class="ctl"><textarea class="textarea purpose">${esc(M.purpose)}</textarea>
      <span class="help">Say what the call is for and what you need back from the guest.</span></div></div>
    <div class="frow"><span class="label">Name<small>Optional</small></span><div class="ctl"><input class="input" value="${esc(M.name)}" placeholder="Who Kiku should ask for"></div></div>
    <div class="frow"><span class="label">Phone</span><div class="ctl"><input class="input tnum" value="${esc(M.phone)}"></div></div>
    <div class="acts-bar" style="padding-left:130px"><button class="btn btn-primary btn-lg">${ic('phone-outgoing')}Place call</button><span class="help">Kiku rings ${esc(M.name.split(' ')[0])} now.</span></div>`;

  const V = K.makeCallCsv;
  const rows = V.preview.map(r => `<tr class="${r.ok ? '' : 'err'}">
      <td class="rn tnum">${r.row}</td>
      <td class="tnum">${r.phone ? esc(r.phone) : '<span class="empty">Empty</span>'}</td>
      <td>${r.name ? esc(r.name) : '<span class="empty">No name</span>'}</td>
      <td class="pp">${esc(r.purpose)}${r.ok ? '' : ''}</td>
      <td class="${r.ok ? 'r' : 'errmsg'}" style="width:${r.ok ? 60 : 160}px">${r.ok ? ic('check') : `${ic('x')}${esc(r.error)}. Row skipped.`}</td>
    </tr>`).join('');
  $('#csv').innerHTML = `
    <div class="col-h"><h2>A list of calls</h2><span class="help">Upload a CSV</span></div>
    <div class="drop" style="margin-top:12px"><span class="fi">${ic('file-spreadsheet')}</span>
      <span><b>${esc(V.file)}</b><span class="help">${esc(V.size)}, ${V.rows} rows. Columns: <span class="cols">${V.columns.map(c => `<code>${c}</code>`).join(' ')}</span></span></span>
      <span class="acts"><button class="btn btn-sm">${ic('replace')}Replace</button><button class="btn btn-sm btn-quiet" aria-label="Remove file">${ic('trash')}</button></span></div>
    <div class="tpl">${ic('download')}<span>Start from the template: a CSV with the three columns, name left blank where you don't know it.</span><a class="link" href="#">Download template</a></div>
    <div class="tally" style="margin-top:12px"><span class="ok">${ic('check')}<b style="font-weight:500">${V.ready}</b> ready</span><span class="bad">${ic('x')}<b style="font-weight:500">${V.errors}</b> needs fixing</span></div>
    <table class="tbl sm" style="margin-top:10px"><thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th class="r">Check</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="help" style="margin-top:6px">Showing the first 4 rows and every row with an error.</p>
    <div class="acts-bar"><button class="btn btn-primary btn-lg">${ic('phone-outgoing')}Place ${V.ready} calls</button><span class="help">Row ${V.preview.filter(r => !r.ok).map(r => r.row).join(', ')} is skipped until it has a phone number.</span></div>`;
})();
</script>
</body>
</html>
