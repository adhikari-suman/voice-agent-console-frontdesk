<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku: On the line with Margaret Doyle</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  /* On the line: the top band turns rust while a person is speaking */
  .topbar { background: var(--human); color: #fff; border-bottom: 0; padding-top: 16px; padding-bottom: 14px; align-items: center; position: relative; }
  .topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 7px; background: repeating-linear-gradient(var(--slant), var(--human) 0 4px, transparent 4px 8px); }
  .topbar h1 { font-size: 34px; color: #fff; }
  .onair { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: var(--human-ink); height: 36px; padding: 0 14px 0 12px; font-weight: 700; font-size: 14.5px; }
  .onair .rec { width: 10px; height: 10px; border-radius: 50%; background: var(--human); animation: pulse 1.3s ease-in-out infinite; }
  .mic { display: inline-flex; gap: 2px; align-items: flex-end; height: 18px; margin-left: 4px; }
  .mic i { width: 3px; background: var(--human); display: block; animation: lv 1s ease-in-out infinite alternate; transform-origin: bottom; }
  @keyframes lv { from { transform: scaleY(.5); } to { transform: scaleY(1); } }
  .topbar .ctx { padding-bottom: 0; }
  .topbar .right .btn { height: 40px; border: 0; }
  .topbar .right .btn.mute { background: rgba(255,255,255,.16); color: #fff; }
  .topbar .right .btn.hand { background: #fff; color: var(--ink); }
  .topbar .right .btn.end { background: var(--ink); color: #fff; }
  .tclock { text-align: right; line-height: 1.05; color: #fff; }
  .tclock .num { font-size: 30px; display: block; }
  .tclock span { font-size: 12px; font-weight: 600; opacity: .9; }

  .content { display: grid; grid-template-columns: minmax(0,1fr) 336px; gap: 24px; padding-top: 24px; }
  .left { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  .sheet { background: var(--paper); padding: 18px 28px 20px; }
  .guestsaid { display: grid; grid-template-columns: 60px 1fr; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .t { font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--text-3); }
  .guestsaid p { font-size: 17px; margin-top: 2px; }
  .ph { display: flex; align-items: center; gap: 14px; margin: 14px 0 2px; }
  .ph .lbl2 { font-size: 13px; font-weight: 700; color: var(--kiku); }
  .ph .gauge { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-left: auto; }
  .ph .gauge .g { width: 60px; height: 8px; background: repeating-linear-gradient(to right, var(--rule-2) 0 1px, transparent 1px 5px); position: relative; }
  .ph .gauge .g i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .big { display: grid; grid-template-columns: 60px 1fr; gap: 14px; }
  .big .proof { font-size: 25px; line-height: 2.25; max-width: none; }
  .big .proof .p-del.ahead { box-shadow: inset 0 -2px 0 var(--kiku-tint); background: var(--kiku-tint); padding: 0 3px; }
  .caret { display: inline-block; width: 3px; height: .95em; background: var(--human); margin-left: 3px; vertical-align: -2px; animation: pulse 1s steps(2) infinite; font-style: normal; }
  .keyrow { display: flex; gap: 20px; margin: 4px 0 0 74px; font-size: 12.5px; color: var(--text-2); align-items: center; flex-wrap: wrap; }
  .keyrow .sw { display: inline-block; width: 22px; height: 12px; vertical-align: -1px; margin-right: 6px; }
  .youare { display: grid; grid-template-columns: 60px 1fr; gap: 14px; margin-top: 14px; padding: 12px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .youare .lb { font-size: 12.5px; font-weight: 700; color: var(--human-ink); }
  .youare p { font-size: 18px; line-height: 1.45; color: var(--human-ink); }
  .next { display: grid; grid-template-columns: 60px 1fr; gap: 14px; margin-top: 12px; }
  .next .lb { font-size: 12.5px; font-weight: 700; color: var(--kiku); }
  .next p { font-family: var(--f-voice); font-size: 19px; color: var(--text-2); }
  .next .hint { margin-top: 2px; }

  .earlier { flex: 1; min-height: 0; background: var(--paper); display: flex; flex-direction: column; }
  .earlier .panel-h .h2 { font-size: 20px; }
  .earlier .scroll { padding: 0 28px 14px; }
  .kt { display: grid; grid-template-columns: 60px 1fr; gap: 0 14px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .kt .proof { font-size: 15.5px; line-height: 2.2; }
  .kt .said { font-size: 13px; color: var(--text-2); }
  .kt .said b { color: var(--human-ink); font-size: 12px; margin-right: 6px; }
  .kt .gp { font-size: 15px; margin-top: 2px; }
  .collapsed { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); padding: 10px 0; }
  .collapsed b { color: var(--text); }

  aside.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .box { background: var(--paper); padding: 15px 18px; }
  .box .h2 { font-size: 20px; margin-bottom: 8px; }
  .esc p { font-size: 14px; display: flex; gap: 9px; }
  .esc p svg { width: 15px; height: 15px; flex: none; margin-top: 2px; }
  .fact { display: grid; grid-template-columns: 20px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 13.5px; }
  .fact:last-child { border-bottom: 0; }
  .fact svg { width: 16px; height: 16px; color: var(--text-2); margin-top: 1px; }
  dl.kv { display: grid; grid-template-columns: 62px 1fr; gap: 7px 10px; font-size: 13.5px; }
  dl.kv dt { color: var(--text-2); font-weight: 600; font-size: 12.5px; }
  .who-on { display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
  .who-on div { display: flex; align-items: center; gap: 10px; }
  .who-on .avatar { width: 28px; height: 28px; font-size: 13px; }
  .who-on .r { margin-left: auto; font-size: 12.5px; color: var(--text-2); }
  .who-on .you .avatar { background: var(--human); color: #fff; }
  .who-on .you .r { color: var(--human-ink); font-weight: 700; }
</style>
</head>
<body>
<script>
const { K, status, icon, shell, esc, proof, heard } = V;
const T = K.takeover;
const mic = Array.from({ length: 7 }, (_, i) => `<i style="height:${6 + (i * 5 % 12)}px;animation-delay:${i * .13}s"></i>`).join("");
const c = shell({ role: "specialist", active: "live", title: T.guest,
  ctx: `<span class="onair"><span class="rec"></span>You're on the line<span class="mic">${mic}</span></span>`,
  right: `<div class="tclock"><span class="num">${T.duration}</span><span>you took over at ${T.takeoverAt}</span></div>
    <button class="btn mute">${icon("mic")}Mute</button>
    <button class="btn hand">${icon("bot")}Hand back to Kiku</button>
    <button class="btn end">${icon("phone-off")}End call</button>` });
const tx = T.transcript;
const cur = tx[tx.length - 1];
const lastGuest = tx[tx.length - 2];
const tkIdx = tx.findIndex(x => x.kind === "takeover");
const after = tx.slice(tkIdx + 1, tx.length - 2).reverse();

c.innerHTML = `
<div class="left">
  <section class="sheet">
    <div class="guestsaid"><span class="t">${lastGuest.t}</span><div><span class="who-tag guest"><span class="glyph"></span>${T.guest} just said</span><p>${esc(lastGuest.text)}</p></div></div>
    <div class="ph"><span class="t">${cur.t}</span><span class="lbl2">Kiku wrote this line for you</span><span class="live" style="color:var(--human)">Marking as you speak</span><span class="gauge"><span class="g"><i style="width:${cur.match}%"></i></span>${cur.match}% of the line kept so far</span></div>
    <div class="big"><span></span>${proof(cur.diff, { live: true, caret: `<span class="caret"></span>` })}</div>
    <div class="keyrow"><span><span class="p-del" style="text-decoration:line-through;text-decoration-color:var(--human)">Struck</span>: you skipped it</span><span><span style="color:var(--human);font-style:italic;font-family:var(--f-voice);font-size:15px">Raised</span>: your own words</span><span><span class="sw" style="background:var(--kiku-tint)"></span>Rest of Kiku's line, not said yet</span></div>
    <div class="youare"><span class="lb">You're saying</span><p>${esc(cur.said)}<span class="caret"></span></p></div>
    <div class="next"><span class="lb">Next line</span><div><p>${esc(T.nextLine)}</p><div class="hint">Queued. Kiku rewrites it if the guest changes course.</div></div></div>
  </section>
  <section class="earlier">
    <div class="panel-h"><span class="h2">Earlier on this call</span><span class="faint small">Newest first</span></div>
    <div class="scroll">
      ${after.map(x => x.karaoke
        ? `<div class="kt"><span class="t">${x.t}</span><div>${proof(x.diff)}<div class="said"><b>You said</b>${esc(x.said)}</div></div></div>`
        : `<div class="kt"><span class="t">${x.t}</span><div><span class="who-tag guest"><span class="glyph"></span>${T.guest}</span><p class="gp">${esc(x.text)}</p></div></div>`).join("")}
      <div class="collapsed">${icon("chevrons-up-down")}<span><b>${tkIdx + 1} entries before you took over</b>: Kiku with the guest, escalated at 00:44, you joined at 01:02</span></div>
    </div>
  </section>
</div>
<aside class="side">
  <div class="box esc">
    <div class="h2">Why you're on this call</div>
    <p>${V.STATUS.escalated.svg.replace("<svg", '<svg style="color:var(--human)"')}${T.escalationReason}</p>
  </div>
  <div class="box">
    <div class="h2">Booking ${T.booking}</div>
    <dl class="kv"><dt>Phone</dt><dd>${T.phone}</dd><dt>Stay</dt><dd>${T.stay}</dd><dt>Issue</dt><dd>${T.purpose}</dd><dt>Status</dt><dd>${status(T.status)}</dd></dl>
  </div>
  <div class="box">
    <div class="h2">What Kiku found</div>
    ${T.facts.map((f, i) => `<div class="fact">${icon(["receipt", "clock-3", "credit-card"][i])}<span>${f}</span></div>`).join("")}
  </div>
  <div class="box">
    <div class="who-on">
      <div class="you"><span class="avatar">PR</span>You, ${T.specialist}<span class="r">Speaking</span></div>
      <div><span class="avatar" style="background:var(--kiku);color:#fff">K</span>Kiku<span class="r">Writing your lines, silent</span></div>
    </div>
  </div>
</aside>`;
</script>
</body>
</html>
