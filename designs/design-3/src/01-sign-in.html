<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@400;500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons-300-outline.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  body { display: block; }
  .plate { position: absolute; inset: 24px; border: 1px solid var(--staff); display: flex; flex-direction: column; align-items: center; }
  .plate::before { content: ""; position: absolute; inset: 4px; border: 1px solid var(--rule); pointer-events: none; }
  .title { margin-top: 118px; text-align: center; display: grid; justify-items: center; }
  .title svg { width: 44px; height: 44px; }
  .title h1 { font: 500 40px/1 var(--serif); margin-top: 14px; letter-spacing: -.01em; }
  .title .sub { font: italic 400 20px/1.3 var(--serif); color: var(--ink-2); margin-top: 8px; }
  .title .for { font: 500 16px/1 var(--sc); letter-spacing: .08em; margin-top: 18px; color: var(--ink); }
  .orn { width: 160px; height: 17px; margin: 30px 0 30px; background: repeating-linear-gradient(to bottom, var(--staff) 0 1px, transparent 1px 4px); position: relative; border-left: 1px solid var(--ink); }
  .orn::after { content: ""; position: absolute; right: 0; top: 0; width: 7px; height: 17px; border-left: 1px solid var(--ink); border-right: 3px solid var(--ink); box-sizing: border-box; }
  form { width: 360px; display: grid; gap: 16px; }
  .rowx { display: flex; justify-content: space-between; align-items: baseline; }
  form .btn { width: 100%; }
  .foot { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font: italic 400 14px/1.4 var(--serif); color: var(--ink-2); }
  .foot b { font: 500 12px/1 var(--sc); letter-spacing: .04em; font-style: normal; color: var(--ink); margin-right: 6px; }
</style>
</head>
<body>
<main class="plate">
  <div class="title" id="title"></div>
  <i class="orn" aria-hidden="true"></i>
  <form onsubmit="return false">
    <label class="field"><span class="label">Email</span><input class="input" id="email" type="text" inputmode="email" autocomplete="username"></label>
    <label class="field"><span class="rowx"><span class="label">Password</span><a class="link" href="#" style="font-size:14px">Forgot password?</a></span><input class="input" type="password" value="brenlow-demo-pass" autocomplete="current-password"></label>
    <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
  </form>
  <p class="foot" id="foot"></p>
</main>
<script>
(function () {
  const { K, esc, G, $ } = Kiku;
  $('#title').innerHTML = `${G.mark}<h1>${esc(K.product.name)}</h1><p class="sub">${esc(K.product.tagline)}</p><p class="for">${esc(K.hotel.name)}, ${esc(K.hotel.city)}</p>`;
  $('#foot').innerHTML = `<b>Demo data</b>${esc(K.synthetic.replace(/^Demo data\.\s*/, ''))}`;
  const e = $('#email'); e.value = K.people.specialist.email;
  Kiku.ready(() => { e.focus(); e.setSelectionRange(e.value.length, e.value.length); });
})();
</script>
</body>
</html>
