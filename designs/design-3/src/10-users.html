<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@400;500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons-300-outline.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .us { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 460px; }
  .main { min-height: 0; overflow: auto; padding: 18px 24px; }
  .uh { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 16px; }
  .uh .btn { margin-left: auto; }
  .tbl td.nm { display: flex; align-items: center; gap: 10px; height: 52px; }
  .tbl td { height: 52px; }
  .tbl td.nm b { font-weight: 500; }
  .tbl td.em { color: var(--ink-2); }
  .tbl tr.off td { color: var(--ink-2); }
  .tbl tr.off td.nm b { font-weight: 400; }
  .ust { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; }
  .ust .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
  .ust .ti { font-size: 16px; }
  .ust.inv { color: var(--ink); }
  .ust.off { color: var(--ink-2); font-weight: 400; }
  .role { font: 500 14px/1 var(--sc); letter-spacing: .04em; }
  .role.admin { color: var(--ink); }
  .tk { display: inline-flex; align-items: center; gap: 10px; }
  .tk .meter { width: 64px; height: 4px; }
  .panel { min-height: 0; overflow: auto; border-left: 1px solid var(--staff); padding: 18px 28px 18px; background: var(--paper); }
  .ph { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
  .ph .btn { margin-left: auto; }
  .fld { display: grid; gap: 6px; margin-top: 14px; }
  .roles { display: grid; gap: 10px; margin-top: 8px; }
  .ro { border: 1px solid var(--staff); border-radius: 4px; padding: 12px 14px; cursor: pointer; }
  .ro.on { border-color: var(--cobalt); background: var(--cobalt-wash); }
  .ro .nh-radio b { font: 500 16px/1.2 var(--serif); }
  .ro ul { margin: 8px 0 0 23px; display: grid; gap: 3px; }
  .ro li { display: flex; gap: 7px; font-size: 14px; color: var(--ink); }
  .ro li .ti { font-size: 15px; color: var(--ink-2); margin-top: 2px; }
  .ro.on li .ti { color: var(--cobalt); }
  .pact { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .pact .help { font-size: 12px; }
</style>
</head>
<body data-role="admin">
<header id="top"></header>
<main class="page">
  <div class="us">
    <section class="main">
      <div class="uh">
        <div><h1>Users</h1><p class="lede" id="lede"></p></div>
        <button class="btn btn-lg is-pressed"><i class="ti ti-user-plus"></i>Invite user</button>
      </div>
      <table class="tbl">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Last active</th><th>Takeovers, 30 days</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <aside class="panel" aria-label="Invite a user">
      <div class="ph"><h2>Invite a user</h2><button class="btn btn-quiet btn-sm" aria-label="Close"><i class="ti ti-x"></i></button></div>
      <div id="form"></div>
    </aside>
  </div>
</main>
<script>
(function () {
  const { K, esc, ic, $, avatar } = Kiku;
  Kiku.shell({ active: 'users' });
  const U = K.users;
  const count = s => U.filter(u => u.status === s).length;
  $('#lede').textContent = `${U.length} people: ${count('Active')} active, ${count('Invited')} invited, ${count('Deactivated')} deactivated.`;
  const max = Math.max(...U.map(u => u.takeovers30d));
  const st = s => s === 'Active' ? `<span class="ust"><i class="dot"></i>Active</span>`
    : s === 'Invited' ? `<span class="ust inv">${ic('mail')}Invited</span>`
    : `<span class="ust off">${ic('ban')}Deactivated</span>`;
  $('#rows').innerHTML = U.map(u => `<tr class="${u.status === 'Deactivated' ? 'off' : ''}${u.name === 'Tomasz Nowak' ? ' is-hover' : ''}">
    <td class="nm">${avatar(u, u.status === 'Deactivated' ? 'off' : u.name === K.people.admin.name ? 'me' : '')}<b>${esc(u.name)}</b>${u.name === K.people.admin.name ? '<span class="help">(you)</span>' : ''}</td>
    <td class="em">${esc(u.email)}</td>
    <td><span class="role ${u.role === 'Admin' ? 'admin' : ''}">${esc(u.role)}</span></td>
    <td>${st(u.status)}</td>
    <td class="${u.lastActive.startsWith('On a call') ? 'cobalt' : ''}">${esc(u.lastActive)}</td>
    <td><span class="tk"><span class="meter"><i style="width:${(u.takeovers30d / max * 100).toFixed(1)}%"></i></span><span class="tnum">${u.takeovers30d}</span></span></td>
  </tr>`).join('');

  const D = K.newUserDraft;
  const roleBox = r => `<div class="ro${D.role === r ? ' on' : ''}" role="radio" aria-checked="${D.role === r}">
      <span class="nh-radio${D.role === r ? ' on' : ''}"><i class="dot"></i><b>${r}</b></span>
      <ul>${K.roles[r].map(p => `<li>${ic('check')}<span>${esc(p)}</span></li>`).join('')}</ul></div>`;
  $('#form').innerHTML = `
    <label class="fld"><span class="label">Full name</span><input class="input" value="${esc(D.name)}"></label>
    <label class="fld"><span class="label">Work email</span><input class="input" value="${esc(D.email)}"></label>
    <label class="fld"><span class="label">Job title <span class="opt">optional</span></span><input class="input" id="title" placeholder="For example, Guest Services"></label>
    <div class="fld"><span class="label">Role</span><div class="roles">${roleBox('Specialist')}${roleBox('Admin')}</div></div>
    <div class="pact"><button class="btn btn-primary btn-lg">${ic('send')}Send invite</button><button class="btn btn-lg">Cancel</button></div>
    <p class="help" style="margin-top:10px">${esc(D.name.split(' ')[0])} gets an email at ${esc(D.email)} with a link to set a password. The invite shows as Invited until then.</p>`;
  Kiku.ready(() => $('#title').focus());
})();
</script>
</body>
</html>
