<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku: Listening to KK-24031</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .content { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 24px; padding-top: 16px; }
  .timer { display: flex; align-items: center; gap: 12px; }
  .timer .num { font-size: 30px; line-height: 1; }
  .left { display: flex; flex-direction: column; min-height: 0; gap: 14px; }
  .console { background: var(--ink); color: #EFE8E0; display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 16px 20px; align-items: center; }
  .console .state { display: flex; flex-direction: column; gap: 10px; }
  .console .state .line1 { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: #fff; }
  .console .state .line1 svg { color: #8FA2F0; }
  .console .state .line2 { font-size: 13px; color: #BFB3A6; }
  .meters { display: flex; gap: 22px; }
  .meter { display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 12.5px; color: #D9CFC4; font-weight: 600; }
  .meter .bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; }
  .meter .bars i { width: 3px; background: #5E4D3D; display: block; }
  .meter .bars i.on { background: #8FA2F0; }
  .meter.guest .bars i.on { background: #EFE8E0; }
  .meter.you .bars i { height: 3px !important; }
  .meter .bars i { animation: lv 1.1s ease-in-out infinite alternate; transform-origin: bottom; }
  @keyframes lv { from { transform: scaleY(.55); } to { transform: scaleY(1); } }
  .console .ctl { display: flex; gap: 10px; align-items: center; }
  .console .btn:not(.take) { background: transparent; color: #EFE8E0; border-color: #6E5E4F; }
  .console .btn.take { height: 52px; font-size: 17px; padding-right: 24px; padding-left: 28px; }
  .console .btn.take small { font-weight: 500; font-size: 12px; display: block; }

  .tx { flex: 1; min-height: 0; background: var(--paper); border: 1px solid var(--rule); display: flex; flex-direction: column; }
  .tx .panel-h .h2 { font-size: 20px; }
  .txs { padding: 0 20px 20px; }
  .turn { border-bottom: 1px solid var(--rule); }
  .turn .voice { font-size: 15.5px; }
  .turn.latest { background: #fff; margin: 8px -8px 0; padding: 14px 8px; border: 1px solid var(--ink); }
  .turn.latest .voice { font-size: 19px; }
  .turn.latest .qtag { font-size: 12px; font-weight: 700; color: var(--text); background: var(--stone); padding: 1px 7px; margin-left: 8px; }
  .gapnote { font-size: 12.5px; color: var(--text-2); padding: 8px 0 8px 72px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rule); }
  .gapnote::before { content: ""; width: 40px; height: 7px; background: repeating-linear-gradient(to right, var(--rule-2) 0 1px, transparent 1px 5px); }
  .draft { display: grid; grid-template-columns: 58px 1fr; gap: 0 14px; padding: 14px 0 4px; }
  .draft .t { font-family: var(--f-display); font-weight: 600; font-size: 15px; color: var(--kiku); }
  .draft .card { border: 1.5px dashed var(--kiku); background: var(--kiku-tint); padding: 10px 14px; }
  .draft .card .voice { color: var(--kiku-deep); font-style: italic; margin-top: 4px; }
  .caret { display: inline-block; width: 2px; height: 1.05em; background: var(--kiku); vertical-align: -2px; margin-left: 2px; animation: pulse 1s steps(2) infinite; }
  .draft .hint { margin-top: 6px; }

  aside.side { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .box { background: var(--paper); border: 1px solid var(--rule); padding: 16px 18px; }
  .box .h2 { font-size: 20px; margin-bottom: 12px; }
  dl.kv { display: grid; grid-template-columns: 78px 1fr; gap: 8px 12px; font-size: 13.5px; }
  dl.kv dt { color: var(--text-2); font-weight: 600; font-size: 12.5px; padding-top: 1px; }
  .acts { display: flex; flex-direction: column; gap: 10px; }
  .act { display: grid; grid-template-columns: 18px 1fr; gap: 9px; font-size: 13.5px; }
  .act svg { color: var(--ok); width: 17px; height: 17px; }
  .people { display: flex; flex-direction: column; gap: 12px; }
  .p { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
  .p .avatar { width: 30px; height: 30px; font-size: 14px; }
  .p .avatar.kk { background: var(--kiku); color: #fff; }
  .p .avatar.g { background: var(--stone); border: 1px solid var(--rule-2); }
  .p span.r { margin-left: auto; font-size: 12.5px; color: var(--text-2); display: inline-flex; gap: 5px; align-items: center; }
  .p span.r svg { width: 14px; height: 14px; }
</style>
</head>
<body>
<script>
const { K, status, icon, shell, esc } = V;
const L = K.liveCall;
const c = shell({ role: "specialist", active: "live", title: L.guest, ctx: `${L.id}, inbound on the hotel line, since ${L.started}`,
  right: `<div class="timer">${status(L.status, true)}<span class="num">${L.duration}</span></div>` });
const bars = (n, lvl, seed) => Array.from({ length: n }, (_, i) => { const h = Math.round(4 + 18 * Math.abs(Math.sin(i * 1.3 + seed))); return `<i class="${i < lvl ? "on" : ""}" style="height:${h}px;animation-delay:${(i * 0.13 + seed) % 1}s"></i>`; }).join("");
const tx = L.transcript;
const last = tx.length - 1;
c.innerHTML = `
<div class="left">
  <div class="console">
    <div class="state">
      <div class="line1">${icon("headphones")}You are listening. Kiku is still handling the call.</div>
      <div class="line2">Your microphone is off, so the guest can't hear you. Take over to speak with Kiku prompting you.</div>
      <div class="meters">
        <span class="meter guest">Guest<span class="bars">${bars(14, 11, 0.4)}</span></span>
        <span class="meter">Kiku<span class="bars">${bars(14, 3, 1.7)}</span></span>
        <span class="meter you">You, muted<span class="bars">${bars(14, 0, 0)}</span></span>
      </div>
    </div>
    <div class="ctl">
      <button class="btn">${icon("mic-off")}Muted</button>
      <button class="btn">${icon("log-out")}Leave</button>
      <button class="btn take">${icon("mic")}<span>Take over</span></button>
    </div>
  </div>
  <section class="tx">
    <div class="panel-h"><span class="h2">Live transcript</span><span class="live" style="color:var(--kiku)">Live</span><span class="faint small" style="margin-left:auto">Kiku alone since ${L.started}. You joined to listen.</span></div>
    <div class="scroll txs">
      ${tx.map((x, i) => {
        const who = x.speaker === "agent" ? `<span class="who-tag agent"><span class="glyph"></span>Kiku</span>` : `<span class="who-tag guest"><span class="glyph"></span>${L.guest}</span>`;
        const gap = i === last ? `<div class="gapnote">No speech for 1 min 45 s</div>` : "";
        return `${gap}<div class="turn ${x.speaker}${i === last ? " latest" : ""}"><span class="t">${x.t}</span><div class="body">${who}${i === last ? `<span class="qtag">Latest question</span>` : ""}<p class="voice">${esc(x.text)}</p></div></div>`;
      }).join("")}
      <div class="draft"><span class="t">now</span><div class="card"><span class="who-tag agent"><span class="glyph"></span>Kiku is drafting a reply</span><p class="voice">${esc(L.agentDraft)}<span class="caret"></span></p></div></div>
    </div>
  </section>
</div>
<aside class="side">
  <div class="box">
    <div class="h2">Call facts</div>
    <dl class="kv">
      <dt>Phone</dt><dd>${L.phone}</dd>
      <dt>Booking</dt><dd>${L.booking}</dd>
      <dt>Stay</dt><dd>${L.stay}</dd>
      <dt>Purpose</dt><dd>${L.purpose}</dd>
      <dt>Status</dt><dd>${status(L.status)}</dd>
    </dl>
  </div>
  <div class="box">
    <div class="h2">Kiku has already</div>
    <div class="acts">${L.actionsTaken.map(a => `<div class="act">${icon("circle-check")}<span>${a}</span></div>`).join("")}</div>
  </div>
  <div class="box">
    <div class="h2">On this call</div>
    <div class="people">
      <div class="p"><span class="avatar g">RK</span>${L.guest}<span class="r">${icon("audio-lines")}Speaking</span></div>
      <div class="p"><span class="avatar kk">K</span>Kiku<span class="r">${icon("pen-line")}${L.agentState}</span></div>
      <div class="p"><span class="avatar">PR</span>You, ${L.listening[0]}<span class="r">${icon("headphones")}Listening</span></div>
    </div>
  </div>
</aside>`;
const s = document.querySelector(".txs"); s.scrollTop = s.scrollHeight;
</script>
</body>
</html>
