<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Listening to KK-24031</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@400;500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons-300-outline.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .phead { padding: 14px 24px 14px; }
  .phead-row { gap: 14px; }
  .ctrls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .subtitle { font: italic 400 16px/1.3 var(--serif); color: var(--ink-2); margin: 4px 0 12px 102px; }
  .meta { display: flex; gap: 10px 30px; margin-left: 102px; flex-wrap: wrap; }
  .meta div { display: grid; gap: 3px; }
  .meta dt { font: 500 12px/1 var(--sc); letter-spacing: .04em; color: var(--ink-2); }
  .meta dd { font-size: 14px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta dd .ti { font-size: 16px; color: var(--ink-2); }
  .meta dd.live { color: var(--cobalt); font-weight: 500; }
  .ab { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .scol { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--rule); }
  .scol-head { display: flex; align-items: center; gap: 16px; padding: 12px 24px 10px; border-bottom: 1px solid var(--rule); }
  .lstate { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
  .lstate .ti { color: var(--cobalt); font-size: 18px; }
  .spane { flex: 1; min-height: 0; overflow: auto; padding: 18px 24px 8px 12px; }
  .side { min-height: 0; overflow: auto; padding: 16px 24px; }
  .side section + section { margin-top: 20px; }
  .side h2 { padding-bottom: 7px; border-bottom: 1px solid var(--ink); }
  .party { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .party b { font-weight: 500; display: block; }
  .party small { font-size: 12px; color: var(--ink-2); display: block; }
  .party .lv { display: grid; justify-items: end; gap: 3px; }
  .party .lv span { font-size: 12px; color: var(--ink-2); }
  .kmark { width: 28px; height: 28px; border: 1px solid var(--ink-2); border-radius: 50%; display: grid; place-items: center; }
  .kmark i { width: 8px; height: 8px; background: var(--ink); transform: rotate(45deg); border-radius: 1px; }
  .facts { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin-top: 10px; }
  .facts dt { font: 500 12px/1.5 var(--sc); letter-spacing: .04em; color: var(--ink-2); }
  .facts dd { font-size: 14px; }
  .acts li { display: flex; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .acts li .ti { font-size: 16px; margin-top: 2px; }
  .draft { margin-top: 10px; font: italic 400 16px/1.4 var(--serif); color: var(--ink-2); }
</style>
</head>
<body data-role="specialist">
<header id="top"></header>
<main class="page">
  <header class="phead">
    <div class="phead-row">
      <a class="btn btn-quiet" href="02-live-overview.html" style="width:80px;justify-content:flex-start"><i class="ti ti-arrow-left"></i>Live</a>
      <h1 id="title"></h1>
      <span id="st"></span>
      <span class="idtag" id="cid"></span>
      <div class="ctrls">
        <button class="btn btn-lg" disabled title="Your microphone stays off while you listen"><i class="ti ti-microphone-off"></i>Mic off</button>
        <a class="btn btn-lg" href="02-live-overview.html"><i class="ti ti-logout"></i>Leave</a>
        <a class="btn btn-lg btn-primary" href="06-takeover-karaoke.html"><i class="ti ti-microphone"></i>Take over</a>
      </div>
    </div>
    <p class="subtitle" id="purpose"></p>
    <dl class="meta" id="meta"></dl>
  </header>
  <div class="ab">
    <section class="scol">
      <div class="scol-head">
        <h2>Live score</h2>
        <div class="legend">
          <span><i class="ti ti-player-play" style="font-size:14px;color:var(--cobalt)"></i>Playhead is now</span>
          <span>Hollow note: not spoken yet</span>
        </div>
        <span class="lstate"><i class="ti ti-headphones"></i>You are listening. Rashid and Kiku can't hear you.</span>
      </div>
      <div class="spane" id="spane"><div class="score" id="score"></div></div>
    </section>
    <aside class="side">
      <section>
        <h2>On the line</h2>
        <ul id="parties"></ul>
      </section>
      <section>
        <h2>Kiku is drafting</h2>
        <p class="draft" id="draft"></p>
      </section>
      <section>
        <h2>Call facts</h2>
        <dl class="facts" id="facts"></dl>
      </section>
      <section>
        <h2>Kiku has already</h2>
        <ul class="acts" id="acts"></ul>
      </section>
    </aside>
  </div>
</main>
<script>
(function () {
  const { K, esc, ic, status, secs, $, renderSystems } = Kiku;
  const L = K.liveCall;
  Kiku.shell({ active: 'live', alert: true });
  $('#title').textContent = L.guest;
  $('#st').innerHTML = status(L.status);
  $('#cid').textContent = L.id;
  $('#purpose').textContent = L.purpose;
  $('#meta').innerHTML = [
    ['Phone', `<span class="tnum">${esc(L.phone)}</span>`],
    ['Booking', `<span class="tnum">${esc(L.booking)}</span>`],
    ['Stay', esc(L.stay)],
    ['Call', `${ic('phone-incoming')}Inbound to ${esc(K.hotel.line)}`],
    ['Started', `<span class="tnum">${esc(L.started)}</span>`],
    ['On the line', `<span class="tnum">${esc(L.duration)}</span>`, 'live']
  ].map(([k, v, c]) => `<div><dt>${k}</dt><dd class="${c || ''}">${v}</dd></div>`).join('');

  const lvl = (n, c) => `<span class="level${c ? ' c' : ''}">${Array.from({ length: 12 }, (_, i) => `<i class="${i < n ? 'on' : ''}" style="height:${4 + i * .85}px"></i>`).join('')}</span>`;
  $('#parties').innerHTML = `
    <li class="party"><span class="av">RK</span><span><b>${esc(L.guest)}</b><small>Guest</small></span><span class="lv">${lvl(5)}<span>Line level</span></span></li>
    <li class="party"><span class="kmark"><i></i></span><span><b>Kiku</b><small>${esc(L.agentState)}</small></span><span class="lv">${lvl(0)}<span>Silent</span></span></li>
    <li class="party"><span class="av me">PR</span><span><b>${esc(L.listening[0])} (you)</b><small>Listening, mic off</small></span><span class="lv">${lvl(0, true)}<span>Mic off</span></span></li>`;
  $('#draft').textContent = L.agentDraft;
  $('#facts').innerHTML = [['Booking', L.booking], ['Stay', L.stay], ['Purpose', L.purpose], ['Phone', L.phone]]
    .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  $('#acts').innerHTML = L.actionsTaken.map(a => `<li>${ic('check')}<span>${esc(a)}</span></li>`).join('');

  Kiku.ready(() => {
    const now = secs(L.duration);
    renderSystems($('#score'), L.transcript, {
      specialist: L.listening[0],
      names: { guest: L.guest },
      specLabel: 'Priya',
      specSub: 'Specialist, you',
      fonts: { lyric: '400 14px Alegreya', ossia: '400 12px Alegreya', mark: 'italic 400 12px Alegreya', draft: 'italic 400 14px Alegreya' },
      extra: [
        { kind: 'draft', t: now, lane: 'agent', text: L.agentDraft },
        { kind: 'listen', t: now, lane: 'spec', sameX: true, text: 'You are listening. Take over to speak.' }
      ],
      now, liveEnd: now + 42, curBar: true
    });
    $('#spane').scrollTop = $('#spane').scrollHeight;
  });
})();
</script>
</body>
</html>
