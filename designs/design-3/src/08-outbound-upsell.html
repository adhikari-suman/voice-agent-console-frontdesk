<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Outbound upsell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+Sans+SC:wght@400;500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.35.0/dist/tabler-icons-300-outline.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 14px 24px 0; }
  .offers { display: grid; grid-template-columns: 124px repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .offers > .label { text-align: right; padding: 12px 20px 0 0; }
  .of { padding: 10px 16px 11px; border-left: 1px solid var(--rule); display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .of h3 { font-size: 16px; }
  .of .pr { font: 500 16px/1.25 var(--serif); font-variant-numeric: tabular-nums lining-nums; text-align: right; }
  .of p { font-size: 14px; color: var(--ink-2); }
  .of .alt { font-size: 12px; color: var(--ink-2); text-align: right; }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 0 32px; margin-top: 16px; }
  .path { min-height: 0; overflow: auto; padding-bottom: 12px; }
  .path + .path { border-left: 1px solid var(--rule); padding-left: 32px; }
  .col-h .n { font: 500 12px/1 var(--sc); letter-spacing: .04em; color: var(--ink-2); }
  .frow { grid-template-columns: 110px minmax(0, 1fr); }
  .tg { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--rule); }
  .tg:last-child { border-bottom: 0; }
  .tg b { font-weight: 500; }
  .tg span.p { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums lining-nums; }
  .cols { display: flex; gap: 6px; align-items: center; }
  .cols code { font: 500 12px/1 var(--sans); background: var(--panel); border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px; }
  .pv { margin-top: 12px; }
  .tbl td.rn { color: var(--ink-2); width: 44px; }
</style>
</head>
<body data-role="admin">
<header id="top"></header>
<main class="page">
  <header class="phead ohead">
    <h1>Outbound</h1>
    <nav class="tabs" aria-label="Outbound call types">
      <a class="tab" href="07-outbound-campaign.html"><i class="ti ti-speakerphone"></i>Campaign</a>
      <a class="tab is-active" href="08-outbound-upsell.html" aria-current="page"><i class="ti ti-list-details"></i>Upsell</a>
      <a class="tab" href="09-outbound-make-a-call.html"><i class="ti ti-phone-call"></i>Make a call</a>
    </nav>
    <p class="lede" style="margin:4px 0 0 auto">Kiku calls guests with a booking and offers extras for their stay.</p>
  </header>
  <div class="body">
    <div class="offers" id="offers"></div>
    <div class="paths">
      <section class="path" id="single"></section>
      <section class="path" id="csv"></section>
    </div>
  </div>
</main>
<script>
(function () {
  const { K, esc, ic, $ } = Kiku;
  Kiku.shell({ active: 'out' });
  $('#offers').innerHTML = `<span class="label">Offers<small style="display:block;font:italic 400 12px/1.3 var(--sans);letter-spacing:0;margin-top:2px">What Kiku can add</small></span>` +
    K.offers.map(o => `<div class="of"><h3>${esc(o.name)}</h3><span class="pr">${esc(o.price)}</span><p>${esc(o.detail)}</p><span class="alt">${esc(o.alt || '')}</span></div>`).join('');

  const U = K.upsellSingle;
  const on = id => U.offers.includes(id);
  $('#single').innerHTML = `
    <div class="col-h"><h2>Call one booking</h2><span class="help">Phone and confirmation number</span></div>
    <div class="frow"><span class="label">Phone</span><div class="ctl"><input class="input tnum" value="${esc(U.phone)}"></div></div>
    <div class="frow"><span class="label">Confirmation</span><div class="ctl"><input class="input tnum" value="${esc(U.confirmation)}">
      <div class="found">${ic('circle-check')}<span><b>Booking found</b>${esc(U.match)}</span></div></div></div>
    <div class="frow"><span class="label">Offers</span><div class="ctl" style="gap:0">
      ${K.offers.map(o => `<div class="tg"><span class="toggle${on(o.id) ? ' on' : ''}" role="switch" aria-checked="${on(o.id)}"><i></i></span><b>${esc(o.name)}</b><span class="p">${esc(o.price)}</span></div>`).join('')}
    </div></div>
    <div class="acts-bar"><button class="btn btn-primary btn-lg">${ic('phone-outgoing')}Call now</button><span class="help">Kiku calls ${esc(U.phone)} straight away.</span></div>`;

  const V = K.upsellCsv;
  const rows = V.preview.map(r => `<tr class="${r.ok ? '' : 'err'}">
      <td class="rn tnum">${r.row}</td>
      <td class="tnum">${r.phone ? esc(r.phone) : '<span class="empty">Empty</span>'}</td>
      <td class="tnum">${r.confirmation ? esc(r.confirmation) : '<span class="empty">Empty</span>'}</td>
      ${r.ok ? `<td>${esc(r.guest)}</td><td class="r">${ic('check')}</td>` : `<td class="errmsg" colspan="2">${ic('x')}${esc(r.error)}. Row skipped.</td>`}
    </tr>`).join('');
  $('#csv').innerHTML = `
    <div class="col-h"><h2>Call a list of bookings</h2><span class="help">Upload a CSV</span></div>
    <div class="drop" style="margin-top:12px"><span class="fi">${ic('file-spreadsheet')}</span>
      <span><b>${esc(V.file)}</b><span class="help">${esc(V.size)}, ${V.rows} rows. Columns: <span class="cols" style="display:inline-flex">${V.columns.map(c => `<code>${c}</code>`).join('')}</span></span></span>
      <span class="acts"><button class="btn btn-sm">${ic('replace')}Replace</button><button class="btn btn-sm btn-quiet" aria-label="Remove file">${ic('trash')}</button></span></div>
    <div class="tally" style="margin-top:10px"><span class="ok">${ic('check')}<b style="font-weight:500">${V.ready}</b> ready</span><span class="bad">${ic('x')}<b style="font-weight:500">${V.errors}</b> need fixing</span><span class="help" style="font-size:14px">Bookings matched to guests by confirmation number.</span></div>
    <div class="pv">
      <table class="tbl sm"><thead><tr><th>Row</th><th>Phone</th><th>Confirmation</th><th>Guest</th><th class="r">Check</th></tr></thead><tbody>${rows}</tbody></table>
      <p class="help" style="margin-top:6px">Showing the first 4 rows and every row with an error.</p>
    </div>
    <div class="acts-bar"><button class="btn btn-primary btn-lg">${ic('phone-outgoing')}Start ${V.ready} calls</button><span class="help">Rows ${V.preview.filter(r => !r.ok).map(r => r.row).join(' and ')} are skipped. Fix them in the file and upload it again to include them.</span></div>`;
})();
</script>
</body>
</html>
