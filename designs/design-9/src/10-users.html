<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Users</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .users { table-layout: fixed; }
  .users td { height: 60px; }
  .users th { vertical-align: bottom; }
  .who { display: flex; align-items: center; gap: 12px; }
  .who b { display: block; font-weight: 600; font-size: 14px; }
  .who span { font-size: 12.5px; color: var(--ivory-2); }
  .users tr.off .who b, .users tr.off td { color: var(--ivory-2); }
  .ust { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; }
  .ust i { font-size: 16px; }
  .ust.active i { color: var(--sage); }
  .ust.invited i { color: var(--brass); }
  .ust.deactivated i { color: var(--ivory-2); }
  .role-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .role-pill i { font-size: 15px; color: var(--brass); }

  .drawer { width: 372px; flex: none; display: flex; flex-direction: column; padding: 22px 24px 20px; gap: 16px; }
  .drawer-h { display: flex; align-items: center; justify-content: space-between; }
  .drawer-h h2 { font: 600 18px/1.2 var(--sans); }
  .x { width: 32px; height: 32px; border-radius: 3px; display: grid; place-items: center; color: var(--ivory-2); font-size: 17px; border: 1px solid transparent; }
  .x:hover { border-color: var(--line); color: var(--ivory); }
  .roles { display: flex; flex-direction: column; gap: 10px; }
  .ro { display: flex; gap: 12px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 3px; cursor: pointer; }
  .ro .rad { margin-top: 2px; }
  .ro.on { border-color: var(--brass); background: var(--brass-wash); }
  .ro b { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
  .perm { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .perm div { display: flex; gap: 8px; align-items: flex-start; }
  .perm i { font-size: 14px; color: var(--sage); margin-top: 3px; }
  .ro:not(.on) .perm { color: var(--ivory-2); }
  .ro:not(.on) .perm i { color: var(--ivory-2); }
  .drawer .foot { margin-top: auto; display: flex; gap: 10px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); }
  .drawer .foot .help { margin-right: auto; }
</style>
</head>
<body>
<script>
  const { K, icon, avatar } = KK;
  const g = K.newUserDraft;
  const ST = { Active: "check", Invited: "envelope-simple", Deactivated: "prohibit" };
  const rows = K.users.map((u) => `
    <tr class="${u.status === "Deactivated" ? "off" : ""}${u.name === "Tomasz Nowak" ? " is-hover" : ""}">
      <td><div class="who">${avatar(u.initials)}<div><b>${u.name}</b><span>${u.email}</span></div></div></td>
      <td><span class="role-pill">${icon(u.role === "Admin" ? "key" : "headphones")}${u.role}</span></td>
      <td><span class="ust ${u.status.toLowerCase()}">${icon(ST[u.status])}${u.status}</span></td>
      <td>${u.lastActive.replace(/\((.*?)\)/, '<span style="white-space:nowrap">($1)</span>')}</td>
      <td class="num">${u.takeovers30d}</td>
    </tr>`).join("");

  KK.mount("admin", "users", `
    <header class="ph">
      <div class="ph-l"><h1 class="title">Users</h1></div>
      <div class="ph-r"><span class="muted small">${K.users.length} people · ${K.users.filter((u) => u.status === "Active").length} active</span><button class="btn is-pressed">${icon("user-plus")}Add user</button></div>
    </header>
    <div class="dbl"></div>
    <div class="body" style="gap:28px">
      <section class="col grow scroll">
        <table class="tbl users">
          <colgroup><col><col style="width:112px"><col style="width:128px"><col style="width:132px"><col style="width:96px"></colgroup>
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th class="num" style="white-space:normal;line-height:1.3">Takeovers<br>30 days</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>

      <aside class="panel drawer" aria-label="Add user">
        <div class="drawer-h"><h2>Add a user</h2><button class="x" aria-label="Close">${icon("x")}</button></div>
        <div class="field"><label class="label" for="un">Full name</label><input class="input" id="un" value="${g.name}"></div>
        <div class="field"><label class="label" for="ue">Work email</label><input class="input is-focus" id="ue" value="${g.email}"></div>
        <div class="field">
          <span class="label">Role</span>
          <div class="roles">
            ${["Specialist", "Admin"].map((r) => `
              <label class="ro${r === g.role ? " on" : ""}">
                <input class="rad" type="radio" name="role"${r === g.role ? " checked" : ""}>
                <div><b>${r}</b><div class="perm">${K.roles[r].map((p) => `<div>${icon("check")}<span>${p}</span></div>`).join("")}</div></div>
              </label>`).join("")}
          </div>
        </div>
        <p class="help" style="margin-top:auto">${g.name.split(" ")[0]} gets an email invite to set a password and sign in.</p>
        <div class="foot" style="margin-top:0;justify-content:flex-end">
          <button class="btn btn-quiet">Cancel</button>
          <button class="btn btn-primary">${icon("envelope-simple")}Send invite</button>
        </div>
      </aside>
    </div>`);
</script>
</body>
</html>
