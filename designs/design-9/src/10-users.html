<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Users</title>
<link rel="stylesheet" href="styles.css">
<style>
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 440px; gap: 16px; }
  .list { display: flex; flex-direction: column; }
  td { vertical-align: middle; padding: 12px; }
  .u { display: flex; align-items: center; gap: 10px; }
  .u .av { width: 32px; height: 32px; background: var(--fail-tint); color: var(--ink); }
  .u b { font-weight: 600; display: block; }
  .u span.e { font-size: 12px; color: var(--ink-3); }
  .role { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .role svg { width: 14px; height: 14px; color: var(--ink-3); }
  .us { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .us svg { width: 13px; height: 13px; }
  .us.active { color: var(--ok); }
  .us.invited { color: var(--kiku); }
  .us.deact { color: var(--fail); }
  tr.off td { color: var(--ink-3); }
  tr.off .av { opacity: .5; }
  .tk { display: flex; align-items: center; gap: 8px; }
  .tk .bar { width: 80px; height: 6px; background: var(--line-2); border-radius: 1px; overflow: hidden; }
  .tk .bar i { display: block; height: 100%; background: var(--human); }
  tr.new td { background: #F1F6F9; }
  tr.new td:first-child { box-shadow: inset 3px 0 0 var(--kiku); }

  .drawer { display: flex; flex-direction: column; border-color: var(--ink); }
  .drawer .ph { background: var(--ink); color: #fff; border-bottom: 0; }
  .drawer .ph .sp { color: #93A1AD; }
  .drawer .body { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
  .roles { display: grid; gap: 10px; }
  .rc { border: 1px solid var(--line); border-radius: var(--r); background: var(--white); padding: 12px 14px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; }
  .rc.on { border-color: var(--kiku); box-shadow: 0 0 0 1px var(--kiku); }
  .radio { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; margin-top: 1px; }
  .rc.on .radio { border-color: var(--kiku); }
  .rc.on .radio::after { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--kiku); }
  .rc b { font-weight: 600; }
  .rc ul { grid-column: 2; list-style: none; display: grid; gap: 3px; margin-top: 4px; }
  .rc li { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 7px; align-items: center; }
  .rc li svg { width: 13px; height: 13px; color: var(--ok); }
  .invite-note { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; }
  .invite-note svg { color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="main" id="main"></main>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<script>
shell("admin", "users");
const N = K.newUserDraft;
const max = Math.max(...K.users.map(u => u.takeovers30d));
const us = s => s === "Active" ? `<span class="us active">${STATUS.completed.svg}Active</span>`
  : s === "Invited" ? `<span class="us invited">${icon("mail")}Invited</span>`
  : `<span class="us deact">${icon("circle-slash")}Deactivated</span>`;
const rows = K.users.map(u => `<tr class="${u.status === "Deactivated" ? "off" : ""}">
  <td><div class="u"><span class="av">${u.initials}</span><div><b>${esc(u.name)}</b><span class="e">${u.email}</span></div></div></td>
  <td><span class="role">${icon(u.role === "Admin" ? "shield" : "headset")}${u.role}</span></td>
  <td>${us(u.status)}</td>
  <td class="small">${esc(u.lastActive)}</td>
  <td>${u.role === "Specialist" ? `<div class="tk"><span class="bar"><i style="width:${u.takeovers30d / max * 100}%"></i></span><span class="tn">${u.takeovers30d}</span></div>` : `<span class="faint">—</span>`}</td>
  <td style="text-align:right"><button class="btn sm ghost" aria-label="More">${icon("more-horizontal")}</button></td>
</tr>`).join("");
const newRow = `<tr class="new"><td><div class="u"><span class="av" style="background:var(--kiku-tint)">GM</span><div><b>${esc(N.name)}</b><span class="e">${N.email}</span></div></div></td>
  <td><span class="role">${icon("headset")}${N.role}</span></td><td><span class="us invited">${icon("pen-line")}Not sent</span></td><td class="small faint">Being added</td><td></td><td></td></tr>`;

const roleCard = r => `<div class="rc ${r === N.role ? "on" : ""}"><span class="radio"></span><b>${r}</b>
  <ul>${K.roles[r].map(p => `<li>${icon("check")}${esc(p)}</li>`).join("")}</ul></div>`;

document.getElementById("main").innerHTML = `
<div class="head"><h1>Users</h1><p>${K.users.length} people can sign in to Kiku for The Brenlow.</p>
  <div class="sp"><button class="btn pri">${icon("user-plus")}Add user</button></div></div>
<div class="grid">
  <section class="panel list">
    <div class="ph">Team<span class="sp">Takeovers count the last 30 days</span></div>
    <div class="scroll" style="flex:1">
      <table><thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th>Takeovers, 30 days</th><th></th></tr></thead>
      <tbody>${rows}${newRow}</tbody></table>
    </div>
  </section>
  <section class="panel drawer">
    <div class="ph">${icon("user-plus")}Add a user<span class="sp"><button class="btn sm ghost" style="color:#fff;border-color:#34414D" aria-label="Close">${icon("x")}</button></span></div>
    <div class="body scroll">
      <div class="field"><label>Full name</label><div class="input">${esc(N.name)}</div></div>
      <div class="field"><label>Work email</label><div class="input focus">${icon("mail")}${N.email}</div></div>
      <div class="field"><label>Role</label><div class="roles">${roleCard("Specialist")}${roleCard("Admin")}</div></div>
      <p class="invite-note">${icon("info")}${esc(N.name.split(" ")[0])} gets an email to set a password. The invite shows as Invited until she signs in.</p>
    </div>
    <div class="formfoot"><span class="sp"></span><button class="btn">Cancel</button><button class="btn pri">${icon("send")}Send invite</button></div>
  </section>
</div>`;
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
