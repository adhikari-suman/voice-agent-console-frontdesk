<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Upsell calls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .left { width: 432px; flex: none; gap: 22px; }
  .tariff { border-top: 1px solid var(--line); }
  .tf { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .tf b { font-weight: 600; font-size: 14px; }
  .tf .p { text-align: right; font-weight: 600; color: var(--brass); font-size: 13.5px; }
  .tf .d { font-size: 12.5px; color: var(--ivory-2); }
  .tf .a { text-align: right; font-size: 12.5px; color: var(--ivory-2); }
  .path { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .path-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .path-h h2 { font: 600 17px/1.2 var(--sans); }
  .path-h span { font-size: 12.5px; color: var(--ivory-2); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid rgba(140, 196, 158, 0.45); border-radius: 3px; background: var(--lacquer-deep); }
  .match > i { color: var(--sage); font-size: 18px; margin-top: 1px; }
  .match .t { font-size: 12.5px; color: var(--ivory-2); }
  .match .g { font-weight: 600; font-size: 14px; margin: 2px 0 3px; display: flex; align-items: center; gap: 10px; }
  .match .x { font-size: 13px; color: var(--ivory); }
  .togs { display: flex; flex-direction: column; }
  .togs .tog { justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; width: 100%; }
  .togs .tog:first-child { border-top: 1px solid var(--line); }
  .togs .tog span.n { flex: 1; }
  .togs .tog span.p { color: var(--ivory-2); font-size: 12.5px; }
  .act { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .csvp { flex: 1; min-width: 0; }
  .csvp .tbl-wrap { flex: 1; min-height: 0; overflow: auto; }
  .act .note { font-size: 12.5px; color: var(--ivory-2); margin-right: auto; }
</style>
</head>
<body>
<script>
  const { K, icon, fob, csvTable } = KK;
  const u = K.upsellSingle, c = K.upsellCsv;
  const [mName, ...mRest] = u.match.split(" · ");
  const offer = (id) => K.offers.find((o) => o.id === id);

  KK.mount("admin", "upsell", `
    <header class="ph">
      <div class="ph-l"><h1 class="title">Upsell calls</h1></div>
    </header>
    <div class="dbl"></div>
    <div class="body">
      <section class="col left">
        <div>
          <div class="h2-row" style="margin-bottom:8px"><h2 class="h2">Offers Kiku makes</h2><span class="muted small">On an existing booking</span></div>
          <div class="tariff">
            ${K.offers.map((o) => `<div class="tf"><b>${o.name}</b><span class="p">${o.price}</span><span class="d">${o.detail}</span><span class="a">${o.alt || ""}</span></div>`).join("")}
          </div>
        </div>
        <div class="panel path">
          <div class="path-h"><h2>Call one guest</h2><span>Phone and confirmation number</span></div>
          <div class="two">
            <div class="field"><label class="label" for="ph">Phone</label><input class="input ok" id="ph" value="${u.phone}"></div>
            <div class="field"><label class="label" for="cf">Confirmation number</label><div class="input-icon"><input class="input ok" id="cf" value="${u.confirmation}" style="padding-left:12px"><i class="ph-light ph-check trail"></i></div></div>
          </div>
          <div class="match">${icon("check-circle")}<div><div class="t">Booking found</div><div class="g">${mName}${fob(u.confirmation)}</div><div class="x">${mRest.join(" · ")}</div></div></div>
          <div class="field">
            <span class="label">Offers to make on this call</span>
            <div class="togs">${u.offers.map((id) => `<label class="tog"><span class="n">${offer(id).name}</span><span class="p">${offer(id).price}</span><input type="checkbox" checked><span class="tog-t"></span></label>`).join("")}</div>
          </div>
          <div class="act"><button class="btn btn-primary">${icon("phone-outgoing")}Call now</button></div>
        </div>
      </section>

      <section class="panel path csvp">
        <div class="path-h"><h2>Call from a list</h2><span>CSV with columns <b style="color:var(--ivory);font-weight:500">${c.columns.join(", ")}</b></span></div>
        <div class="drop">${icon("file-csv")}<div><div class="drop-name">${c.file}</div><div class="drop-meta">${c.size} · ${c.rows} rows · drop a new file here to replace it</div></div><button class="btn btn-sm btn-quiet">${icon("upload-simple")}Replace</button></div>
        <div class="tally"><span class="ok">${icon("check")}<b>${c.ready}</b>&nbsp;ready</span><span class="bad">${icon("x")}<b>${c.errors}</b>&nbsp;errors</span><span class="muted small" style="margin-left:auto">Showing the first rows and every error</span></div>
        <div class="tbl-wrap">${csvTable([
          { key: "phone", label: "Phone" },
          { key: "confirmation", label: "Confirmation" },
          { key: "guest", label: "Matched booking", emptyText: "No match" },
        ], c.preview, c.rows)}</div>
        <div class="act"><span class="note">${c.errors} rows will be skipped. The other ${c.ready} guests get a call each.</span><button class="btn btn-primary">${icon("phone-outgoing")}Start ${c.ready} calls</button></div>
      </section>
    </div>`);
</script>
</body>
</html>
