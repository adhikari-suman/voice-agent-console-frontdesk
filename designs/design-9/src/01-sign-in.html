<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Sign in</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { flex-direction: row; }
  .side { width: 560px; background: var(--ink); color: #DCE3E9; padding: 48px 56px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .wm { display: flex; align-items: center; gap: 16px; }
  .wm .mark { width: 44px; height: 44px; gap: 6px; }
  .wm b { font-size: 44px; font-weight: 700; color: #fff; letter-spacing: -0.03em; }
  .hotel { margin-top: 18px; font-size: 17px; color: #fff; }
  .hotel span { display: block; color: #93A1AD; font-size: 13px; margin-top: 4px; }
  .tracks { margin-top: auto; display: grid; gap: 22px; }
  .tr { display: grid; grid-template-columns: 90px 1fr; align-items: center; gap: 16px; font-size: 12px; }
  .tr .ln { height: 12px; position: relative; }
  .tr .ln i { position: absolute; top: 0; bottom: 0; border-radius: 1px; }
  .tr.k { color: #8FC0DC; } .tr.k i { background: #4F87A8; }
  .tr.h { color: var(--human); } .tr.h i { background: var(--human); }
  .seamline { height: 6px; border-top: 1px solid #34414D; border-bottom: 1px solid #34414D; margin-left: 106px; }
  .caption { margin-top: 28px; font-size: 12px; color: #7D8E9C; max-width: 380px; }
  .form-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 0 0 140px; }
  form { width: 380px; display: flex; flex-direction: column; gap: 18px; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { color: var(--ink-2); margin-top: -10px; }
  .input { height: 42px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  .row a { font-size: 13px; color: var(--kiku-deep); font-weight: 500; }
  .btn.pri { height: 44px; font-size: 15px; font-weight: 600; margin-top: 4px; }
  .fn { position: absolute; right: 32px; bottom: 28px; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
  .fn svg { width: 13px; height: 13px; }
</style>
</head>
<body>
<aside class="side">
  <div class="wm"><span class="mark"><i></i><i></i></span><b>Kiku</b></div>
  <p class="hotel">The Brenlow, Edinburgh<span>Voice agent console · hotel line <span id="line" style="display:inline;margin:0"></span></span></p>
  <div class="tracks">
    <div class="tr k"><span>Kiku writes</span><div class="ln"><i style="left:0;width:18%"></i><i style="left:20%;width:9%"></i><i style="left:31%;width:24%"></i><i style="left:57%;width:12%"></i><i style="left:71%;width:21%"></i></div></div>
    <div class="seamline"></div>
    <div class="tr h"><span>You speak</span><div class="ln"><i style="left:0;width:12%"></i><i style="left:20%;width:9%"></i><i style="left:31%;width:10%"></i><i style="left:44%;width:18%"></i><i style="left:71%;width:14%"></i></div></div>
  </div>
  <p class="caption">When you take over a call, Kiku keeps writing each line. You read it, or say it your own way.</p>
</aside>
<div class="form-wrap">
  <form>
    <h1>Sign in</h1>
    <p class="sub">Use your Brenlow staff account.</p>
    <div class="field"><label for="e">Email</label><div class="input focus"><i data-lucide="mail"></i><span id="em"></span></div></div>
    <div class="field"><label for="p">Password</label><div class="input"><i data-lucide="lock"></i><span style="letter-spacing:3px">••••••••••••</span><i data-lucide="eye" style="margin-left:auto;color:var(--ink-3)"></i></div></div>
    <div class="row"><label style="display:flex;gap:8px;align-items:center;font-size:13px"><span class="check on"><i data-lucide="check"></i></span>Keep me signed in on this device</label><a href="#">Forgot password?</a></div>
    <button class="btn pri" type="button">Sign in</button>
  </form>
</div>
<div class="fn"><i data-lucide="info"></i><span id="syn"></span></div>
<script src="../../_shared/data.js"></script>
<script>
  const K = window.KIKU;
  document.getElementById("em").textContent = K.people.specialist.email;
  document.getElementById("line").textContent = K.hotel.line;
  document.getElementById("syn").textContent = K.synthetic;
</script>
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body>
</html>
