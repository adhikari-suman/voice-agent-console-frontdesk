<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Sign in</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  body { align-items: center; justify-content: center; }
  .frame { position: fixed; inset: 22px; border: 1px solid rgba(143, 118, 68, 0.55); pointer-events: none; }
  .frame::after { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(143, 118, 68, 0.55); }
  .si { display: flex; flex-direction: column; align-items: center; gap: 22px; position: relative; }
  .si-card { width: 408px; padding: 40px 40px 36px; }
  .si-brand { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .si-brand .mono { width: 40px; height: 40px; outline-offset: 3px; margin: 10px 0 22px; }
  .si-brand .mono span { font-size: 25px; }
  .si-word { font: 500 46px/1 var(--serif); color: var(--ivory); letter-spacing: 0.005em; }
  .si-prop { color: var(--ivory-2); font-size: 14px; margin-top: 10px; }
  .si-card .dbl { margin: 26px 0 26px; }
  .si-form { display: flex; flex-direction: column; gap: 18px; }
  .si-form .btn { width: 100%; margin-top: 6px; }
  .si-foot { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ivory-2); }
  .si-foot i { color: var(--brass-dim); font-size: 15px; }
  .si-line { position: fixed; left: 44px; bottom: 40px; font-size: 12.5px; color: var(--ivory-2); display: flex; align-items: center; gap: 8px; }
  .si-line i { color: var(--brass-dim); font-size: 15px; }
</style>
</head>
<body>
<script>
  const { K, icon, monogram } = KK;
  document.body.innerHTML = `
  <div class="frame"></div>
  <main class="si">
    <div class="si-card panel">
      <div class="si-brand">
        ${monogram()}
        <div class="si-word">${K.product.name}</div>
        <div class="si-prop">${K.hotel.name}, ${K.hotel.city}</div>
      </div>
      <div class="dbl"></div>
      <form class="si-form" onsubmit="return false">
        <div class="field">
          <label class="label" for="em">Email</label>
          <div class="input-icon">${icon("envelope-simple")}<input class="input" id="em" type="email" value="${K.people.specialist.email}" autocomplete="username"></div>
        </div>
        <div class="field">
          <div class="label"><label for="pw">Password</label><a class="link" href="#">Forgot password?</a></div>
          <div class="input-icon">${icon("lock-simple")}<input class="input is-focus" id="pw" type="password" value="nightdesk2026" autocomplete="current-password"></div>
        </div>
        <button class="btn btn-primary btn-lg" type="submit">Sign in</button>
      </form>
    </div>
    <p class="si-foot">${icon("info")}${K.synthetic}</p>
  </main>
  <div class="si-line">${icon("phone")}Hotel line ${K.hotel.line}</div>`;
  document.getElementById("pw").focus();
</script>
</body>
</html>
