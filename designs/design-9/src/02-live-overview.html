<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Live board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .today { font-size: 14px; color: var(--ivory-2); max-width: 780px; line-height: 1.6; }
  .today b { color: var(--ivory); font-weight: 600; }
  .clock { display: flex; align-items: center; gap: 12px; text-align: right; }
  .clock .timer { font-size: 30px; }
  .clock small { display: block; font-size: 12.5px; color: var(--ivory-2); line-height: 1.4; text-align: left; }

  .need { padding: 18px 24px 18px; }
  .need-top { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
  .need-name { font: 500 28px/1.1 var(--serif); margin-bottom: 10px; }
  .wait { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .wait-t { font: 500 32px/1 var(--sans); color: var(--coral); display: flex; align-items: center; gap: 9px; }
  .wait-t i { font-size: 24px; }
  .wait-l { font-size: 12.5px; color: var(--ivory-2); }
  .need .hair { margin: 12px 0; }
  .need-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; }
  .need .kv { grid-template-columns: 110px 1fr; gap: 6px 14px; }
  .need .kv dd i { color: var(--coral); font-size: 15px; vertical-align: -2px; margin-right: 5px; }
  .need-act { display: flex; gap: 10px; flex: none; }

  .lines { display: flex; flex-direction: column; }
  .ln { display: grid; grid-template-columns: 196px 1fr 176px 128px; gap: 18px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .lines .ln:first-child { border-top: 1px solid var(--line); }
  .ln-name { font-weight: 600; font-size: 14.5px; display: block; }
  .ln-meta { font-size: 12.5px; color: var(--ivory-2); display: flex; white-space: nowrap; align-items: center; gap: 6px; margin-top: 3px; }
  .ln-meta i { color: var(--brass); font-size: 14px; }
  .ln-meta.ph { padding-left: 20px; margin-top: 1px; }
  .ln-purpose { font-size: 13.5px; line-height: 1.45; color: var(--ivory); }
  .ln-state { display: flex; flex-direction: column; gap: 7px; }
  .ln-state .st { font-size: 13px; }
  .ln-state .d { color: var(--ivory-2); font-weight: 400; margin-left: 2px; }
  .ln-who { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ivory-2); }
  .ln-who b { color: var(--ivory); font-weight: 500; }
  .ln-act { display: flex; justify-content: flex-end; }

  .fin { display: flex; flex-direction: column; }
  .fin a { display: grid; grid-template-columns: 44px 1fr auto; gap: 4px 10px; padding: 11px 4px 12px; border-bottom: 1px solid var(--line); }
  .fin a:first-child { border-top: 1px solid var(--line); }
  .fin a:hover { background: var(--ivory-wash); }
  .fin .t { color: var(--ivory-2); font-size: 12.5px; padding-top: 1px; }
  .fin .n { font-weight: 600; font-size: 13.5px; }
  .fin .o { grid-column: 2 / 4; font-size: 12.5px; color: var(--ivory-2); line-height: 1.45; }
  .fin .st { font-size: 12.5px; }
</style>
</head>
<body>
<script>
  const { K, icon, status, dir, avatar, monogram, fob } = KK;
  const s = K.stats;
  const c = (id) => K.calls.find((x) => x.id === id);
  const owen = c("KK-24032");
  const typeLabel = (x) => (x.direction === "inbound" ? `${icon("arrow-down-left")}Inbound` : `${icon("arrow-up-right")}Outbound · ${x.type}`);

  const lineRows = [
    { call: c("KK-24030"), who: `${avatar("PR", "xs")}<b>You took over</b> at 01:10`, act: `<a class="btn btn-sm" href="06-takeover-karaoke.html">${icon("microphone")}Return to call</a>` },
    { call: c("KK-24031"), who: `${avatar("PR", "xs")}<b>You're listening</b>`, act: `<button class="btn btn-sm" disabled>${icon("headphones")}Listening</button>` },
    { call: c("KK-24029"), who: `${monogram("sm")}<b>Kiku</b> alone`, act: `<a class="btn btn-sm is-hover" href="05-live-call-listening.html">${icon("headphones")}Listen</a>` },
    { call: c("KK-24028"), who: `${monogram("sm")}<b>Kiku</b> alone`, act: `<a class="btn btn-sm" href="05-live-call-listening.html">${icon("headphones")}Listen</a>` },
  ];

  const finished = K.calls.filter((x) => x.status === "completed" || x.status === "failed").slice(0, 7);

  KK.mount("specialist", "live", `
    <header class="ph">
      <div class="ph-l">
        <h1 class="title">Live board</h1>
        <p class="today"><b>${s.callsToday}</b> calls today, <b>${s.inbound}</b> inbound and <b>${s.outbound}</b> outbound. <b>${s.completed}</b> completed, <b>${s.inProgress}</b> in progress, <b>${s.escalated}</b> escalated, <b>${s.failed}</b> failed. <b>${s.takeoversToday}</b> takeovers, average handle <b>${s.avgHandle}</b>, <b>${s.upsellValueToday}</b> added from upsells.</p>
      </div>
      <div class="ph-r clock"><span class="timer">${K.hotel.now}</span><small>${K.hotel.tz}<br>${K.hotel.today}</small></div>
    </header>
    <div class="dbl"></div>
    <div class="body">
      <section class="col grow">
        <div class="h2-row"><h2 class="h2">Needs a specialist <span class="n">1 waiting</span></h2></div>
        <article class="panel need">
          <div class="need-top">
            <div>
              <div class="need-name">${owen.guest}</div>
              <div class="ph-line">${status(owen.status)}<span class="sep"></span>${dir(owen.direction)}<span class="sep"></span><span>${owen.phone}</span><span class="sep"></span><span>${owen.id}</span><span class="sep"></span><span>Started <b>${owen.started}</b></span></div>
            </div>
            <div class="wait"><span class="wait-t">${icon("clock")}${owen.waiting}</span><span class="wait-l">waiting for a specialist</span></div>
          </div>
          <div class="hair"></div>
          <div class="need-row">
            <dl class="kv">
              <dt>Purpose</dt><dd>${owen.purpose}</dd>
              <dt>Why escalated</dt><dd>${icon("bell")}${owen.escalationReason}</dd>
              <dt>With Kiku</dt><dd>${owen.duration} on the line</dd>
            </dl>
            <div class="need-act">
              <a class="btn" href="05-live-call-listening.html">${icon("headphones")}Listen first</a>
              <a class="btn btn-primary" href="06-takeover-karaoke.html">${icon("hand")}Take over</a>
            </div>
          </div>
        </article>

        <div class="h2-row" style="margin-top:24px"><h2 class="h2">On the line <span class="n">${lineRows.length} calls</span></h2></div>
        <div class="lines">
          ${lineRows.map(({ call, who, act }) => `
            <div class="ln">
              <div><span class="ln-name">${call.guest}</span><span class="ln-meta">${typeLabel(call)}</span><span class="ln-meta ph">${call.phone}</span></div>
              <div class="ln-purpose">${call.purpose}</div>
              <div class="ln-state">${status(call.status).replace(/<\/span>$/, `<span class="d">${call.duration}</span></span>`)}<span class="ln-who">${who}</span></div>
              <div class="ln-act">${act}</div>
            </div>`).join("")}
        </div>
      </section>

      <aside class="col" style="width:318px">
        <div class="h2-row"><h2 class="h2">Recently finished</h2><a class="link small" href="03-call-logs.html">All call logs${icon("arrow-right")}</a></div>
        <div class="fin">
          ${finished.map((f) => `
            <a href="${f.id === "KK-24027" ? "04-call-audit.html" : "03-call-logs.html"}">
              <span class="t">${f.started}</span>
              <span class="n">${f.guest}</span>
              ${status(f.status)}
              <span class="o">${f.outcome}${f.specialist ? ` · with ${f.specialist}` : ""}</span>
            </a>`).join("")}
        </div>
      </aside>
    </div>`, ["microphone", "On a call · KK-24030"]);
</script>
</body>
</html>
