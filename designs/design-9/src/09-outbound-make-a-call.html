<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Make a call</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .left { width: 432px; flex: none; gap: 24px; }
  .path { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; }
  .path-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .path-h h2 { font: 600 17px/1.2 var(--sans); }
  .path-h span { font-size: 12.5px; color: var(--ivory-2); }
  .act { display: flex; align-items: center; justify-content: flex-end; gap: 12px; }
  .act .note { font-size: 12.5px; color: var(--ivory-2); margin-right: auto; }
  .csvp { flex: 1; min-width: 0; }
  .cols { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ivory-2); }
  .colname { padding: 3px 9px; border: 1px solid var(--line); border-radius: 3px; background: var(--lacquer-deep); color: var(--ivory); font-size: 12.5px; }
  .tpl { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border: 1px solid var(--line); border-radius: 3px; font-size: 13px; }
  .tpl i.lead { font-size: 20px; color: var(--brass); }
  .tpl .link { margin-left: auto; }
  .recent a { display: grid; grid-template-columns: 44px 1fr auto; gap: 3px 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .recent a:first-child { border-top: 1px solid var(--line); }
  .recent a:hover { background: var(--ivory-wash); }
  .recent .t { color: var(--ivory-2); }
  .recent .n { font-weight: 600; }
  .recent .o { grid-column: 2 / 4; color: var(--ivory-2); font-size: 12.5px; }
  .csv td:last-child { white-space: normal; line-height: 1.4; padding-top: 6px; padding-bottom: 6px; }
  .csv td:nth-child(2), .csv td:nth-child(3) { white-space: nowrap; }
</style>
</head>
<body>
<script>
  const { K, icon, csvTable, status } = KK;
  const m = K.makeCallSingle, c = K.makeCallCsv;
  const recent = K.calls.filter((x) => x.type === "Make a call");

  KK.mount("admin", "make", `
    <header class="ph">
      <div class="ph-l"><h1 class="title">Make a call</h1></div>
    </header>
    <div class="dbl"></div>
    <div class="body">
      <section class="col left">
        <div class="panel path">
          <div class="path-h"><h2>Call one person</h2><span>Any purpose, any number</span></div>
          <div class="field">
            <label class="label" for="pu">Purpose</label>
            <textarea class="input is-focus" id="pu" rows="4">${m.purpose}</textarea>
            <p class="help">Write what Kiku should find out or pass on. It works from this on the call.</p>
          </div>
          <div class="field"><label class="label" for="nm">Name <span class="opt">Optional</span></label><input class="input" id="nm" value="${m.name}" placeholder="Who Kiku should ask for"></div>
          <div class="field"><label class="label" for="pn">Phone</label><input class="input" id="pn" value="${m.phone}"></div>
          <div class="act"><button class="btn btn-primary">${icon("phone-outgoing")}Place call</button></div>
        </div>
        <div>
          <div class="h2-row" style="margin-bottom:8px"><h2 class="h2">Placed today</h2><a class="link small" href="03-call-logs.html">Call logs${icon("arrow-right")}</a></div>
          <div class="recent">${recent.map((x) => `<a href="03-call-logs.html"><span class="t">${x.started}</span><span class="n">${x.guest}</span>${status(x.status)}<span class="o">${x.purpose}${x.outcome ? ` · ${x.outcome}` : ""}</span></a>`).join("")}</div>
        </div>
      </section>

      <section class="panel path csvp">
        <div class="path-h"><h2>Call from a list</h2><span>One call per row</span></div>
        <div class="cols">Columns ${c.columns.map((x) => `<span class="colname">${x}</span>`).join("")}</div>
        <div class="tpl">${icon("file-arrow-down", "lead")}<span>Not sure of the format? Start from the template, one row per call.</span><a class="link" href="#">${icon("download-simple")}Download template</a></div>
        <div class="drop">${icon("file-csv")}<div><div class="drop-name">${c.file}</div><div class="drop-meta">${c.size} · ${c.rows} rows · drop a new file here to replace it</div></div><button class="btn btn-sm btn-quiet">${icon("upload-simple")}Replace</button></div>
        <div class="tally"><span class="ok">${icon("check")}<b>${c.ready}</b>&nbsp;ready</span><span class="bad">${icon("x")}<b>${c.errors}</b>&nbsp;error</span></div>
        <div>${csvTable([
          { key: "phone", label: "Phone" },
          { key: "name", label: "Name", emptyText: "No name given" },
          { key: "purpose", label: "Purpose" },
        ], c.preview, c.rows)}</div>
        <div class="act" style="margin-top:auto"><span class="note">${c.errors} row will be skipped.</span><button class="btn btn-primary">${icon("phone-outgoing")}Place ${c.ready} calls</button></div>
      </section>
    </div>`);
</script>
</body>
</html>
