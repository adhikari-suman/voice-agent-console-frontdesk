<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Call logs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .filters { display: flex; align-items: center; gap: 8px; padding: 18px 0 16px; flex: none; }
  .filters .vr { width: 1px; height: 22px; background: var(--line); margin: 0 10px; }
  .filters .count { margin-left: auto; font-size: 13px; color: var(--ivory-2); }
  .filters .count b { color: var(--ivory); font-weight: 600; }
  .search { width: 300px; }
  .datesel { width: 150px; }
  .logs { table-layout: fixed; font-size: 13px; }
  .logs td { height: 36px; padding: 5px 8px; line-height: 1.35; }
  .logs th { padding-left: 8px; padding-right: 8px; }
  .logs .g { font-weight: 600; }
  .logs .dir { font-size: 13px; }
  .logs .dir .ty { color: var(--ivory-2); margin-left: 2px; }
  .logs .sp-note { color: var(--ivory-2); }
  .logs .go { text-align: right; color: var(--ivory-2); font-size: 16px; }
  .logs tr.is-sel .go { color: var(--brass); }
  .logs tr.is-sel .g { color: var(--ivory); }
  .open-audit { display: inline-flex; align-items: center; gap: 4px; color: var(--brass); font-weight: 600; font-size: 12.5px; }
  .open-audit i { font-size: 15px; }
</style>
</head>
<body>
<script>
  const { K, icon, status, statusMark } = KK;
  const calls = K.calls;
  const count = (st) => calls.filter((c) => c.status === st).length;
  const chip = (key, label, on) =>
    `<button class="chip${on ? " is-on" : ""}">${key ? `<span class="st st-${key === "in_progress" ? "progress" : key}" style="gap:0">${statusMark(key)}</span>` : ""}${label}<span class="n">${key ? count(key) : calls.length}</span></button>`;

  const rows = calls.map((c) => {
    const sel = c.id === "KK-24027";
    const dirCell = KK.dir(c.direction);
    const typeCell = c.direction === "inbound" ? `<span class="dim">—</span>` : c.type;
    let sp = `<span class="sp-note">Kiku only</span>`;
    if (c.specialist) {
      const m = c.specialist.match(/^(.*?) \((.*)\)$/);
      sp = m ? `${m[1]}<br><span class="sp-note">${m[2]}</span>` : c.specialist;
    }
    return `<tr class="${sel ? "is-sel" : ""}" ${sel ? 'onclick="location.href=\'04-call-audit.html\'"' : ""}>
      <td>${c.started}</td>
      <td class="g">${c.guest}</td>
      <td class="dim" style="white-space:nowrap">${c.phone}</td>
      <td>${dirCell}</td>
      <td>${typeCell}</td>
      <td>${c.purpose}</td>
      <td>${status(c.status)}</td>
      <td>${c.duration}</td>
      <td>${sel ? `${sp}<br><a class="open-audit" href="04-call-audit.html">Open audit${icon("arrow-right")}</a>` : sp}</td>
    </tr>`;
  }).join("");

  KK.mount("specialist", "logs", `
    <header class="ph">
      <div class="ph-l"><h1 class="title">Call logs</h1></div>
      <div class="ph-r">
        <div class="input-icon search">${icon("magnifying-glass")}<input class="input" type="search" placeholder="Search guest, phone or purpose"></div>
        <label class="sel lead datesel">${icon("calendar-blank")}<select class="input"><option>Today</option><option>Yesterday</option><option>Last 7 days</option></select>${icon("caret-down", "caret")}</label>
      </div>
    </header>
    <div class="dbl"></div>
    <div class="filters">
      ${chip(null, "All", true)}
      ${chip("completed", "Completed")}
      ${chip("in_progress", "In progress")}
      ${chip("escalated", "Escalated")}
      ${chip("failed", "Failed")}
      <span class="vr"></span>
      <div class="seg"><button class="is-on">All</button><button>${icon("arrow-down-left")}Inbound</button><button>${icon("arrow-up-right")}Outbound</button></div>
      <span class="vr"></span>
      <label class="sel" style="width:150px"><select class="input" style="height:34px"><option>All types</option><option>Inbound</option><option>Campaign</option><option>Upsell</option><option>Make a call</option></select>${icon("caret-down", "caret")}</label>
    </div>
    <div class="scroll grow" style="padding-bottom:20px">
      <table class="tbl logs">
        <colgroup><col style="width:54px"><col style="width:128px"><col style="width:140px"><col style="width:106px"><col style="width:98px"><col><col style="width:114px"><col style="width:82px"><col style="width:132px"></colgroup>
        <thead><tr><th>Time</th><th>Guest</th><th>Phone</th><th>Direction</th><th>Type</th><th>Purpose</th><th>Status</th><th>Duration</th><th>Specialist</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`, ["microphone", "On a call · KK-24030"]);
</script>
</body>
</html>
