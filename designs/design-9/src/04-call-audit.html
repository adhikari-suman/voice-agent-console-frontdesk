<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Call audit KK-24027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/light/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .main { padding-top: 24px; }
  .ttl { display: flex; align-items: center; gap: 16px; }
  .back { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center; color: var(--ivory-2); font-size: 17px; }
  .back:hover { border-color: var(--brass-dim); color: var(--ivory); }
  .ph-line .av { margin-right: 2px; }
  .spec { margin-left: auto; display: flex; align-items: center; gap: 11px; font-size: 13.5px; }
  .spec b { display: block; font-weight: 600; }
  .spec span { font-size: 12.5px; color: var(--ivory-2); }

  .player { display: flex; align-items: center; gap: 18px; padding: 12px 0 8px; flex: none; }
  .play { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--brass); display: grid; place-items: center; color: var(--brass); font-size: 18px; flex: none; }
  .play:hover { background: var(--brass-wash-2); }
  .ptime { font-size: 13.5px; color: var(--ivory-2); white-space: nowrap; width: 96px; }
  .ptime b { color: var(--ivory); font-weight: 600; }
  .tl { position: relative; flex: 1; height: 60px; }
  .tl-track { position: absolute; left: 0; right: 0; top: 34px; height: 2px; background: var(--line); }
  .tl-played { position: absolute; left: 0; top: 34px; height: 2px; background: var(--brass); }
  .tl-band { position: absolute; top: 28px; height: 14px; border: 1px solid var(--brass-dim); border-radius: 2px; background: var(--brass-wash); }
  .tl-tick { position: absolute; top: 44px; width: 1px; height: 5px; background: var(--ivory-2); opacity: .6; }
  .tl-tick.k { background: var(--brass); opacity: .9; }
  .tl-head { position: absolute; top: 25px; width: 12px; height: 20px; margin-left: -6px; }
  .tl-head::before { content: ""; position: absolute; left: 5px; top: 0; bottom: 0; width: 2px; background: var(--ivory); border-radius: 1px; }
  .tl-mk { position: absolute; top: 0; display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; color: var(--ivory); white-space: nowrap; }
  .tl-mk i { font-size: 14px; }
  .tl-mk::after { content: ""; position: absolute; top: 18px; width: 1px; height: 12px; background: currentColor; }
  .tl-mk.esc { transform: translateX(-100%); padding-right: 6px; }
  .tl-mk.esc::after { right: 0; background: var(--coral); }
  .tl-mk.esc i { color: var(--coral); }
  .tl-mk.tk { padding-left: 6px; }
  .tl-mk.tk::after { left: 0; background: var(--brass); }
  .tl-mk.tk i { color: var(--brass); }
  .tl-lbl { position: absolute; top: 52px; font-size: 11px; color: var(--ivory-2); transform: translateX(-50%); }
  .tl-lbl:first-of-type { transform: none; }
  .tl-band-l { position: absolute; top: 12px; font-size: 11.5px; color: var(--brass); right: 0; }

  .ledger .is-now .lg-t { color: var(--brass); }
  .ledger .is-now .lg-t::after { content: ""; display: inline-block; width: 5px; height: 5px; background: var(--brass); transform: rotate(45deg); margin-left: 8px; vertical-align: 2px; }
  .pane-h { display: flex; align-items: center; justify-content: space-between; padding-bottom: 2px; flex: none; }
  .side { width: 318px; flex: none; gap: 18px; overflow: auto; }
  .side .h2 { margin-bottom: 10px; }
  .side .kv { grid-template-columns: 78px 1fr; font-size: 13px; gap: 8px 12px; }
  .side .kv dd i { color: var(--coral); font-size: 14px; vertical-align: -2px; margin-right: 4px; }
  .sum-line { font-size: 13.5px; color: var(--ivory-2); margin-bottom: 10px; }
  .sum-line b { color: var(--ivory); font-weight: 600; }
  .mt { display: grid; grid-template-columns: 40px 1fr 56px; gap: 10px; align-items: center; font-size: 12px; height: 17px; }
  .mt .t { color: var(--ivory-2); }
  .mt .bar { height: 5px; }
  .mt .p { text-align: right; color: var(--ivory); display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
  .mt .p .seal { width: 16px; height: 16px; }
  .mt.sealed .bar span { background: var(--brass); }
  .mt .bar span { background: var(--brass-dim); }

  .folio { border-top: 1px solid var(--line); }
  .fl { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; line-height: 1.4; align-items: baseline; }
  .fl i { font-size: 14px; color: var(--sage); position: relative; top: 2px; }
  .fl.declined { color: var(--ivory-2); }
  .fl.declined i { color: var(--ivory-2); }
  .fl .amt { text-align: right; white-space: nowrap; }
  .fl .res { display: block; font-size: 12px; color: var(--ivory-2); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0 8px; font-weight: 600; font-size: 14px; }
  .total span:last-child { font-size: 17px; }
  .note { display: flex; gap: 9px; font-size: 13px; color: var(--ivory); margin-top: 12px; line-height: 1.45; }
  .note i { color: var(--brass); font-size: 16px; flex: none; margin-top: 1px; }
</style>
</head>
<body>
<script>
  const { K, icon, status, dir, fob, avatar, ledger, legend, seal } = KK;
  const a = K.audit;
  const secs = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const total = secs(a.duration);
  const at = "00:31";
  const pct = (t) => ((secs(t) / total) * 100).toFixed(2) + "%";
  const esc = a.transcript.find((e) => e.kind === "escalation");
  const karaoke = a.transcript.filter((e) => e.karaoke);
  const ticks = a.transcript.filter((e) => e.speaker !== "system").map((e) => `<span class="tl-tick${e.karaoke ? " k" : ""}" style="left:${pct(e.t)}"></span>`).join("");
  const labels = ["00:00", "00:30", "01:00", "01:30", "02:00", "02:30"].map((t) => `<span class="tl-lbl" style="left:${pct(t)}">${t}</span>`).join("");

  KK.mount("specialist", "logs", `
    <header class="ph" style="display:block">
      <div class="ttl">
        <a class="back" href="03-call-logs.html" aria-label="Back to call logs">${icon("arrow-left")}</a>
        <h1 class="title guest">${a.guest}</h1>
        ${status(a.status)}
        <span class="muted small">${a.id} · ${a.started}</span>
        <div class="spec">${avatar("TN", "lg")}<div><b>${a.specialist}</b><span>Specialist · took over at ${a.takeoverAt}</span></div></div>
      </div>
      <div class="ph-line" style="margin-top:10px">
        <span class="dt">${dir(a.direction)}<span>· ${a.type}</span></span><span class="sep"></span>
        <span>${a.phone}</span><span class="sep"></span>
        ${fob(a.booking)}<span>${a.stay}</span><span class="sep"></span>
        <span>Duration <b>${a.duration}</b></span>
      </div>
    </header>
    <div class="dbl"></div>

    <div class="player">
      <button class="play" aria-label="Pause recording">${icon("pause")}</button>
      <span class="ptime"><b>${at}</b> / ${a.duration}</span>
      <div class="tl">
        <span class="tl-band" style="left:${pct(a.takeoverAt)};right:0"></span>
        <span class="tl-track"></span>
        <span class="tl-played" style="width:${pct(at)}"></span>
        ${ticks}
        <span class="tl-head" style="left:${pct(at)}"></span>
        <span class="tl-mk esc" style="left:${pct(esc.t)}">${icon("bell")}Escalated ${esc.t}</span>
        <span class="tl-mk tk" style="left:${pct(a.takeoverAt)}">${icon("hand")}${a.specialist.split(" ")[0]} took over ${a.takeoverAt}</span>
        <span class="tl-band-l">Karaoke mode · ${karaoke.length} lines</span>
        ${labels}
        <span class="tl-lbl" style="left:100%;transform:translateX(-100%)">${a.duration}</span>
      </div>
      <button class="btn btn-sm btn-quiet">1×</button>
      <button class="btn btn-sm btn-quiet" aria-label="Volume">${icon("speaker-simple-high")}</button>
    </div>
    <div class="hair"></div>

    <div class="body" style="padding-top:16px">
      <section class="col grow">
        <div class="pane-h"><h2 class="h2">Message history <span class="n">${a.transcript.length} entries · following playback</span></h2>${legend()}</div>
        <div class="scroll grow" id="hist" style="margin-top:6px">${ledger(a.transcript, { guest: a.guest, specialist: a.specialist })}</div>
      </section>

      <aside class="col side">
        <div>
          <h2 class="h2">Call details</h2>
          <dl class="kv">
            <dt>Purpose</dt><dd>${a.purpose}</dd>
            <dt>Escalated</dt><dd>${icon("bell")}${a.escalationReason}</dd>
          </dl>
        </div>
        <div class="dbl dim"></div>
        <div>
          <h2 class="h2">Karaoke</h2>
          <p class="sum-line"><b>${a.karaokeSummary.lines}</b> lines · <b>${a.karaokeSummary.asWritten}</b> spoken as written · <b>${a.karaokeSummary.improvised}</b> improvised</p>
          ${karaoke.map((k) => `<div class="mt${k.asWritten ? " sealed" : ""}"><span class="t">${k.t}</span><span class="bar"><span style="width:${k.match}%"></span></span><span class="p">${k.asWritten ? seal() : ""}${k.match}%</span></div>`).join("")}
        </div>
        <div class="dbl dim"></div>
        <div>
          <h2 class="h2">Outcome</h2>
          <div class="folio">
            ${a.outcome.map((o) => `<div class="fl ${o.result}">${icon(o.result === "added" ? "check" : "x")}<span>${o.item}<span class="res">${o.result === "added" ? "Added to booking" : "Declined"}</span></span><span class="amt">${o.amount}</span></div>`).join("")}
          </div>
          <div class="total"><span>Added to ${a.booking}</span><span>${a.total}</span></div>
          <div class="dbl"></div>
          <p class="note">${icon("note-pencil")}${a.note}</p>
        </div>
      </aside>
    </div>`, ["microphone", "On a call · KK-24030"]);
  document.fonts.ready.then(() => {
  const hist = document.getElementById("hist");
  const rows = [...hist.querySelectorAll(".lg-row")];
  const first = rows.find((r) => r.querySelector(".lg-t").textContent === at);
  first.classList.add("is-now");
  const y0 = first.offsetTop;
  const room = 900 - 24 - hist.getBoundingClientRect().top;
  const last = rows.filter((r) => r.offsetTop + r.offsetHeight - y0 <= room).pop();
  hist.style.flex = "none";
  hist.style.height = (last.offsetTop + last.offsetHeight - y0) + "px";
  hist.scrollTop = y0;
  });
</script>
</body>
</html>
