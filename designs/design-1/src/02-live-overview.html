<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Live · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, status, topbar, mount, esc } = UI;
const me = K.people.specialist.name;
const live = K.calls.filter((c) => c.status === "in_progress" || c.status === "escalated");
const needs = live.filter((c) => c.status === "escalated" && !c.specialist);
const withYou = live.filter((c) => c.specialist && c.specialist.startsWith(me)).sort((a, b) => (a.status === "escalated" ? -1 : 1));
const alone = live.filter((c) => !c.specialist && c.status === "in_progress");
const done = K.calls.filter((c) => c.status === "completed" || c.status === "failed").slice(0, 5);
const S = K.stats;

const dir = (c) => c.direction === "inbound"
  ? `${ic("phone-incoming", "i12")}Inbound`
  : `${ic("phone-outgoing", "i12")}Outbound · ${esc(c.type)}`;

function urgentRow(c) {
  return `<article class="tt-row urgent">
    <span class="t">${c.started}</span>
    <div>
      <div class="g">${esc(c.guest)}</div>
      <p class="p">${esc(c.purpose)}</p>
      <div class="meta"><span class="mono">${esc(c.phone)}</span><span class="st">${dir(c)}</span><span class="mono">${c.id}</span></div>
      <p class="reason">${ic("hand")}<span><span class="strong">Why Kiku handed over:</span> ${esc(c.escalationReason)}</span></p>
    </div>
    <div class="state">${status(c.status)}<span class="wait">${c.waiting}</span><span class="t12 muted">waiting · no one has joined</span></div>
    <div class="acts"><a class="btn primary lg" href="06-takeover-karaoke.html">${ic("mic")}Take over</a><a class="btn" href="05-live-call-listening.html">${ic("headphones")}Listen first</a></div>
  </article>`;
}

function row(c) {
  const mode = !c.specialist ? "none" : c.specialist.includes("listening") ? "listen" : "on";
  const onIt = {
    none: [ic("audio-lines"), "Kiku alone", "No one listening"],
    listen: [ic("headphones"), "You’re listening", "Guest can’t hear you"],
    on: [ic("mic"), "You took over", `At ${K.takeover.takeoverAt} · karaoke mode`],
  }[mode];
  const act = {
    none: `<a class="btn" href="05-live-call-listening.html">${ic("headphones")}Listen</a>`,
    listen: `<a class="btn" href="05-live-call-listening.html">${ic("arrow-right")}Open call</a>`,
    on: `<a class="btn solid" href="06-takeover-karaoke.html">${ic("mic")}Return to call</a>`,
  }[mode];
  return `<article class="tt-row">
    <span class="t">${c.started}</span>
    <div>
      <div class="g">${esc(c.guest)}</div>
      <p class="p">${esc(c.purpose)}</p>
      <div class="meta"><span class="mono">${esc(c.phone)}</span><span class="st">${dir(c)}</span></div>
    </div>
    <div class="state">${status(c.status)} <span class="dur">${c.duration}</span><div class="on">${onIt[0]}<span>${onIt[1]}<small>${onIt[2]}</small></span></div></div>
    <div class="acts">${act}</div>
  </article>`;
}

const fin = (c) => `<a class="fin" href="${c.id === K.audit.id ? "04-call-audit.html" : "03-call-logs.html"}">
  <span class="mono">${c.started}</span>
  <span class="strong">${esc(c.guest)}</span>
  ${status(c.status)}
  <span class="o">${esc(c.outcome)}</span>
</a>`;

mount(`
${topbar("specialist", "Live", { liveDot: true })}
<main class="page">
  <header class="ph"><h1 class="h52">${live.length} live <span class="cnt">·</span> ${needs.length} needs you</h1></header>
  <section class="col panel tt" style="grid-column:1/9;margin-bottom:24px">
    <h2 class="sec-h h20 pad">Needs a specialist <span class="cnt">${needs.length}</span></h2>
    ${needs.map(urgentRow).join("")}
    <h2 class="sec-h h20 pad">With you <span class="cnt">${withYou.length}</span></h2>
    ${withYou.map(row).join("")}
    <h2 class="sec-h h20 pad">Kiku alone <span class="cnt">${alone.length}</span></h2>
    ${alone.map(row).join("")}
  </section>
  <aside class="col" style="grid-column:9/13">
    <h2 class="sec-h h20">Today <span class="cnt">${esc(K.hotel.today)}</span></h2>
    <p class="today"><b>${S.callsToday}</b> calls so far: <b>${S.inbound}</b> inbound, <b>${S.outbound}</b> outbound. <b>${S.completed}</b> completed, <b>${S.inProgress}</b> in progress, <b>${S.escalated}</b> escalated, <b>${S.failed}</b> failed. <b>${S.takeoversToday}</b> takeovers. Average handle <b>${S.avgHandle}</b>. <b>${S.upsellValueToday}</b> added through upsells.</p>
    <h2 class="sec-h h20">Recently finished <span class="cnt">${done.length}</span><a class="right link" href="03-call-logs.html">All call logs</a></h2>
    <div>${done.map(fin).join("")}</div>
  </aside>
</main>
`);
</script>
</body>
</html>
