<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Users · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, topbar, mount, esc, firstName } = UI;
const users = K.users;
const N = K.newUserDraft;
const me = K.people.admin;
const by = (s) => users.filter((u) => u.status === s).length;
const U_ST = { Active: "circle-check", Invited: "mail", Deactivated: "circle-slash" };

const last = (u) => esc(u.lastActive).replace(/(KK-\d+)/, '<span class="mono">$1</span>');
const rows = users.map((u) => `<tr class="${u.status === "Deactivated" ? "off" : ""}">
  <td><div class="u-cell"><span class="avatar${u.name === me.name ? " ink" : ""}">${u.initials}</span><div><div class="nm">${esc(u.name)}${u.name === me.name ? ' <span class="muted" style="font-weight:400">(you)</span>' : ""}</div><div class="em">${esc(u.email)}</div></div></div></td>
  <td>${u.role}</td>
  <td><span class="st">${ic(U_ST[u.status])}${u.status}</span>${u.status === "Invited" ? `<a class="link t12" style="display:block;margin-top:2px" href="#">Resend invite</a>` : ""}</td>
  <td class="wrap">${last(u)}</td>
  <td class="r"><span class="num strong">${u.takeovers30d}</span></td>
</tr>`).join("");

const roleOpt = (r) => `<label class="roleopt${N.role === r ? " on" : ""}">
  <span class="radio${N.role === r ? " on" : ""}" role="radio" aria-checked="${N.role === r}"></span>
  <span class="rn">${r}<span class="cnt t14">${K.roles[r].length} permissions</span></span>
  <ul>${K.roles[r].map((p) => `<li>${ic("check", "i12")}${esc(p)}</li>`).join("")}</ul>
</label>`;

mount(`
${topbar("admin", "Users")}
<main class="page" style="grid-template-rows:minmax(0,1fr)">
  <div class="col" style="grid-column:1/9;min-height:0">
    <header class="ph" style="padding-bottom:24px"><h1 class="h52">Users</h1>
      <span class="t20 cnt" style="padding-bottom:6px">${users.length} people · ${by("Active")} active · ${by("Invited")} invited · ${by("Deactivated")} deactivated</span>
      <button class="btn pressed aside" aria-pressed="true" style="margin-bottom:4px">${ic("user-plus")}New user</button></header>
    <section class="panel" style="margin-bottom:24px;overflow:auto">
      <table class="tbl users">
        <colgroup><col><col style="width:112px"><col style="width:144px"><col style="width:208px"><col style="width:128px"></colgroup>
        <thead><tr><th>Name and email</th><th>Role</th><th>Status</th><th>Last active</th><th class="r">Takeovers, 30 days</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </section>
  </div>

  <aside class="side" style="grid-column:9/13" aria-label="New user">
    <div style="display:flex;align-items:center;justify-content:space-between"><h2 class="h32">New user</h2><button class="icon-btn" aria-label="Close panel">${ic("x", "i20")}</button></div>
    <div class="field"><label class="label" for="n">Full name</label><input class="input" id="n" value="${esc(N.name)}"></div>
    <div class="field"><label class="label" for="e">Work email</label><input class="input" id="e" type="email" value="${esc(N.email)}"></div>
    <div class="field" role="radiogroup" aria-label="Role"><span class="label">Role</span>
      <div class="rolepick">${["Specialist", "Admin"].map(roleOpt).join("")}</div></div>
    <div class="side-foot"><p class="help">${esc(firstName(N.name))} gets an email invite and shows as Invited until she sets a password.</p>
      <div style="display:flex;gap:8px"><button class="btn primary lg">${ic("send")}Send invite</button><button class="btn ghost lg">Cancel</button></div></div>
  </aside>
</main>
`);
</script>
</body>
</html>
