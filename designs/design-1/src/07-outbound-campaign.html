<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Outbound campaigns · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, topbar, mount, esc, outboundHead, fileBlock } = UI;
const D = K.campaignDraft;
const camps = K.campaigns;

const stIcon = (s) => (s.startsWith("Paused") ? "pause" : s.startsWith("Scheduled") ? "calendar-clock" : "pencil-line");

function camp(c) {
  const sel = c.code === D.code;
  const prog = c.contacts
    ? `<div class="ratio" aria-hidden="true"><span class="ok" style="width:${((c.called / c.contacts) * 100).toFixed(1)}%"></span></div>
       <div class="nums">${[["contacts", c.contacts], ["called", c.called], ["answered", c.answered], ["booked", c.booked], ["failed", c.failed]]
         .map(([l, v]) => `<div><b>${v}</b><span>${l}</span></div>`).join("")}</div>`
    : "";
  const meta = sel
    ? `<span class="st">${ic("arrow-right")}Open for setup</span>`
    : `<span class="st">${ic("clock", "i12")}${esc(c.window)}</span><span class="mono">${esc(c.audience)}</span>`;
  return `<article class="camp${sel ? " is-selected" : ""}"${sel ? ' aria-current="true"' : ""}>
    <div class="top"><span class="code">${c.code}</span><span class="cst">${ic(stIcon(c.status))}${esc(c.status)}</span></div>
    <div class="t16 strong">${esc(c.name)}</div>
    <p class="muted">${esc(c.offer)}</p>
    ${prog}
    <div class="t12 muted" style="display:flex;gap:16px;align-items:center">${meta}</div>
  </article>`;
}

const draft = camps.find((c) => c.code === D.code);
const [lead, token, rest] = (() => {
  const i = D.opening.indexOf("{first_name}");
  return [D.opening.slice(0, i), "{first_name}", D.opening.slice(i + 12)];
})();
const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const onDays = ["Mon", "Tue", "Wed", "Thu", "Fri"];
const [winFrom, winTo] = D.window.split(", ")[1].split("–");

mount(`
${topbar("admin", "Outbound")}
<main class="page">
  ${outboundHead("Campaign")}
  <section class="col panel" style="grid-column:1/5;margin-bottom:24px;overflow:auto">
    <h2 class="sec-h h20 pad">Campaigns <span class="cnt">${camps.length}</span></h2>
    ${camps.map(camp).join("")}
  </section>

  <section class="col panel form-panel" style="grid-column:5/13;margin-bottom:24px">
    <div class="sec-h pad" style="align-items:center;min-height:64px">
      <h2 class="h32">${esc(draft.name)}</h2><span class="chip flat">${ic("pencil-line", "i12")}Draft</span>
      <span class="right"><button class="btn ghost sm">Save draft</button></span>
    </div>
    <div class="formgrid pad" style="padding-top:8px">
      <div class="field" style="grid-column:1/4"><label class="label" for="code">Promo code</label><input class="input mono" id="code" value="${D.code}"></div>
      <div class="field" style="grid-column:4/9"><label class="label" for="offer">Offer Kiku describes</label><input class="input" id="offer" value="${esc(draft.offer)}"></div>

      <div class="field" style="grid-column:1/9"><span class="label">Audience list</span>
        ${fileBlock({ file: D.file, rows: D.rows, ready: D.ready, errors: D.errors }, { note: `The ${D.errors} rows with errors are skipped. <a class="link" href="#">Download them</a> to fix.` })}
      </div>

      <div class="field" style="grid-column:1/6"><span class="label">Call window</span>
        <div style="display:flex;gap:16px;align-items:center">
          <div class="days">${days.map((d) => `<button class="${onDays.includes(d) ? "on" : ""}" aria-pressed="${onDays.includes(d)}">${d}</button>`).join("")}</div>
          <div class="select mono" style="width:96px">${winFrom}${ic("chevron-down")}</div><span class="muted">to</span><div class="select mono" style="width:96px">${winTo}${ic("chevron-down")}</div>
        </div>
      </div>
      <div class="field" style="grid-column:6/9"><span class="label">Max attempts per guest</span>
        <div class="seg">${[1, 2, 3, 4, 5].map((n) => `<button class="${n === D.maxAttempts ? "on" : ""}" style="width:44px;justify-content:center">${n}</button>`).join("")}</div>
      </div>

      <div class="field" style="grid-column:1/9"><label class="label">Opening line <span class="opt">Kiku says this first</span></label>
        <div class="textarea" role="textbox" aria-multiline="true">${esc(lead)}<span class="token">${token}</span>${esc(rest)}</div>
        <span class="help"><span class="mono">{first_name}</span> is filled in from each row of the audience list.</span>
      </div>
    </div>
    <footer class="form-foot pad">
      <button class="btn primary lg">${ic("calendar-clock")}Schedule campaign</button>
      <span class="muted">${D.ready} guests · ${esc(D.window)} · up to ${D.maxAttempts} attempts each</span>
    </footer>
  </section>
</main>
`);
</script>
</body>
</html>
