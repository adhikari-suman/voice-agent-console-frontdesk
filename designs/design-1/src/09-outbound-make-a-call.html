<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Outbound: make a call · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, topbar, mount, esc, outboundHead, fileBlock, xmark, firstName } = UI;
const S = K.makeCallSingle;
const C = K.makeCallCsv;
const RECOVER = { "Phone number missing": "Add a phone number, or delete the row. Kiku can’t place this call without one." };

function previewRows() {
  const out = [];
  let prev = 0;
  const gap = (from, to) => `<tr class="gaprow"><td colspan="4">${from === to ? `Row ${from}` : `Rows ${from}–${to}`} · ${to - from + 1} more ready</td></tr>`;
  C.preview.forEach((r) => {
    if (r.row > prev + 1) out.push(gap(prev + 1, r.row - 1));
    const name = r.name ? esc(r.name) : '<span class="muted">No name</span>';
    out.push(r.ok
      ? `<tr><td class="mono">${r.row}</td><td class="mono">${esc(r.phone)}</td><td>${name}</td><td class="wrap">${esc(r.purpose)}</td></tr>`
      : `<tr class="errrow"><td class="mono">${r.row}</td><td class="mono"><span class="muted">empty</span></td><td>${name}</td>
          <td class="wrap"><div class="err">${xmark()}<div><b>${esc(r.error)}</b><small>${esc(RECOVER[r.error] || "")} Purpose: ${esc(r.purpose)}</small></div></div></td></tr>`);
    prev = r.row;
  });
  if (prev < C.rows) out.push(gap(prev + 1, C.rows));
  return out.join("");
}

mount(`
${topbar("admin", "Outbound")}
<main class="page">
  ${outboundHead("Make a call")}
  <section class="col panel path pad" style="grid-column:1/6;margin-bottom:24px">
    <h2 class="sec-h h20">One call <span class="cnt">for any purpose</span></h2>
    <div class="field"><label class="label" for="pu">Purpose <span class="opt">What Kiku should say and find out</span></label>
      <textarea class="textarea" id="pu" rows="4">${esc(S.purpose)}</textarea></div>
    <div class="field"><label class="label" for="nm">Name <span class="opt">Optional</span></label><input class="input" id="nm" value="${esc(S.name)}"></div>
    <div class="field"><label class="label" for="ph">Phone</label><input class="input mono" id="ph" value="${esc(S.phone)}"></div>
    <div class="foot"><button class="btn primary lg">${ic("phone-outgoing")}Place call</button><span class="muted">Kiku calls ${esc(firstName(S.name))} now.</span></div>
  </section>

  <section class="col panel path pad" style="grid-column:6/13;margin-bottom:24px">
    <h2 class="sec-h h20">A list of calls <span class="cnt">CSV upload</span><a class="right link" href="#">${ic("download")}Download template</a></h2>
    <p class="help" style="margin-top:-8px">The template has three columns: ${C.columns.map((c) => `<span class="mono">${esc(c)}</span>`).join(", ")}. One row per call.</p>
    ${fileBlock({ ...C, columns: null })}
    <div class="preview">
      <table class="tbl prev">
        <colgroup><col style="width:56px"><col style="width:168px"><col style="width:128px"><col></colgroup>
        <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th></tr></thead>
        <tbody>${previewRows()}</tbody>
      </table>
    </div>
    <div class="foot"><button class="btn primary lg">${ic("phone-outgoing")}Place ${C.ready} calls</button><span class="muted">The row with an error will be skipped.</span></div>
  </section>
</main>
`);
</script>
</body>
</html>
