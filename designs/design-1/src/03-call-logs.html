<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Call logs · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, status, shape, topbar, mount, esc, STATUS } = UI;
const calls = K.calls;
const count = (s) => calls.filter((c) => c.status === s).length;
const SELECTED = K.audit.id;
const HOVER = "KK-24029";

const stabs = `<nav class="stabs" aria-label="Status">
  <a class="stab on" href="#">All <b>${calls.length}</b></a>
  ${Object.keys(STATUS).map((s) => `<a class="stab" href="#">${`<span class="st">${shape(s)}</span>`}${STATUS[s]} <b>${count(s)}</b></a>`).join("")}
</nav>`;

const spec = (c) => {
  if (!c.specialist) return `<span class="muted">Kiku only</span>`;
  const m = c.specialist.match(/^(.*?)\s*\((.*)\)$/);
  return m ? `<span class="st">${esc(m[1])}<span class="muted" title="${esc(m[2])}">${ic("headphones")}</span></span>` : esc(c.specialist);
};
const dirCell = (c) => c.direction === "inbound"
  ? `<span class="st">${ic("phone-incoming")}Inbound</span>`
  : `<span class="st">${ic("phone-outgoing")}Outbound <span class="muted">·</span> ${esc(c.type)}</span>`;

const rows = calls.map((c) => {
  const cls = c.id === SELECTED ? "is-selected" : c.id === HOVER ? "is-hover" : "";
  return `<tr class="${cls}"${c.id === SELECTED ? ' aria-selected="true"' : ""}>
    <td><span class="mono" style="font-size:14px">${c.started}</span></td>
    <td class="strong">${esc(c.guest)}</td>
    <td><span class="mono">${esc(c.phone)}</span></td>
    <td>${dirCell(c)}</td>
    <td class="clip" title="${esc(c.purpose)}">${esc(c.purpose)}</td>
    <td>${status(c.status)}</td>
    <td class="r"><span class="mono" style="font-size:14px">${c.duration}</span></td>
    <td>${spec(c)}</td>
    <td class="r">${c.id === SELECTED ? `<a class="go" href="04-call-audit.html">Audit${ic("arrow-right")}</a>` : ""}</td>
  </tr>`;
}).join("");

mount(`
${topbar("specialist", "Call logs")}
<main class="page">
  <header class="ph logs-ph">
    <h1 class="h52" style="grid-column:1/4">Call logs</h1>
    <div class="field" style="grid-column:4/7"><label class="label" for="q">Search</label>
      <div class="input-icon">${ic("search")}<input class="input" id="q" placeholder="Guest, phone, booking or call ID"></div></div>
    <div class="field" style="grid-column:7/10"><span class="label">Direction</span>
      <div class="seg"><button class="on">All</button><button>${ic("phone-incoming")}Inbound</button><button>${ic("phone-outgoing")}Outbound</button></div></div>
    <div class="field" style="grid-column:10/11"><span class="label">Type</span>
      <div class="select">All${ic("chevron-down")}</div></div>
    <div class="field" style="grid-column:11/13"><span class="label">Date</span>
      <div class="select"><span class="st">${ic("calendar")}Today, 27 Sep</span>${ic("chevron-down")}</div></div>
  </header>
  <section class="panel logs-panel">
    <div class="logs-strip">${stabs}
      <div class="pager"><span class="muted">Page 1 of 1</span>
        <button class="btn sm" disabled aria-label="Previous page">${ic("chevron-left")}</button>
        <button class="btn sm" disabled aria-label="Next page">${ic("chevron-right")}</button></div>
    </div>
    <div class="logs-scroll">
      <table class="tbl logs">
        <colgroup><col style="width:68px"><col style="width:144px"><col style="width:144px"><col style="width:188px"><col><col style="width:124px"><col style="width:80px"><col style="width:132px"><col style="width:72px"></colgroup>
        <thead><tr><th>Time</th><th>Guest</th><th>Phone</th><th>Direction · type</th><th>What the call was for</th><th>Status</th><th class="r">Duration</th><th>Specialist</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </section>
</main>
`);
</script>
</body>
</html>
