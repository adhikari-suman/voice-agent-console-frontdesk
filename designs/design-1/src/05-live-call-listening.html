<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku · Listening to KK-24031</title>
<meta name="viewport" content="width=1440">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; }
  .left { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .band { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 20px; align-items: center; padding: 14px 20px; border-radius: var(--r-l); background: var(--violet-wash); border: 1px solid #D9D1F7; }
  .band .who { display: flex; align-items: center; gap: 12px; }
  .band .who .ic { width: 38px; height: 38px; border-radius: 50%; background: var(--violet); color: #fff; display: flex; align-items: center; justify-content: center; }
  .band .who .ic .i { width: 18px; height: 18px; }
  .band b { display: block; font-size: 14.5px; }
  .band .who span { font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  .meters { display: flex; gap: 20px; justify-content: center; }
  .meter { display: flex; align-items: center; gap: 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .bars { display: flex; align-items: center; gap: 2px; height: 28px; }
  .bars i { width: 3px; border-radius: 2px; background: var(--ink-2); animation: lv 1.1s ease-in-out infinite alternate; transform-origin: center; }
  .m-kiku .bars i { background: var(--violet); opacity: .35; animation: none; }
  @keyframes lv { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
  .band .dur { text-align: right; white-space: nowrap; }
  .band .dur b { font: 500 28px/1 var(--voice); color: var(--violet); }
  .band .dur span { font-size: 12px; color: var(--muted); }

  .tpanel { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .tpanel .scroll { -webkit-mask-image: linear-gradient(transparent 0, #000 24px); mask-image: linear-gradient(transparent 0, #000 24px); flex: 1; padding: 0 24px 16px 8px; position: relative; }
  .tl-row.latest .tl-text { background: var(--surface); padding: 8px 14px; background: var(--sunk); border-radius: 12px; font-size: 18px; }
  .tl-row.latest .tl-who .aside { color: var(--ink-2); }
  .gap { display: flex; align-items: center; gap: 10px; padding: 6px 0 6px 86px; font-size: 12px; color: var(--faint); }
  .draft .tl-dot span { background: var(--surface); border: 2px dashed var(--violet); }
  .draft .tl-who { color: var(--violet); }
  .draft .tl-text { color: var(--violet-soft); font-style: italic; border: 1.5px dashed #C9BEF3; border-radius: 12px; padding: 8px 14px; display: inline-block; }
  .dots { display: inline-flex; gap: 3px; margin-left: 2px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--violet); animation: dt 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes dt { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .ctl { padding: 18px 20px 18px; }
  .ctl .btn-human { width: 100%; height: 52px; font-size: 16px; }
  .ctl .btn-human .i { width: 18px; height: 18px; }
  .ctl p { font-size: 12.5px; color: var(--muted); margin: 10px 2px 14px; line-height: 1.45; }
  .ctl .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ctl .row .btn { width: 100%; }
  .muted-state { color: var(--rose); border-color: #EBC3BF; background: var(--rose-wash); }
  .facts { padding: 16px 20px; flex: 1; min-height: 0; overflow: auto; }
  .facts dl { display: grid; grid-template-columns: 76px 1fr; row-gap: 9px; column-gap: 12px; margin-top: 12px; font-size: 13.5px; }
  .facts dt { color: var(--muted); }
  .facts dd { font-weight: 500; }
  .facts .purpose { font: 400 15px/1.4 var(--voice); }
  .acts { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--rule); }
  .acts h3 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .acts li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 6px; font-size: 13.5px; padding: 5px 0; }
  .acts li .i { width: 16px; height: 16px; color: var(--green); margin-top: 1px; }
</style>
</head>
<body>
<script>
const { K, icon, status, mount, dir, wave } = Kiku;
const L = K.liveCall;
const lv = (n, seed, h) => wave(n, seed).map((v, i) => `<i style="height:${Math.round(v * h)}px;animation-delay:${(i % 5) * .13}s"></i>`).join('');

const tr = L.transcript;
const rows = tr.map((t, i) => {
  const isLast = i === tr.length - 1;
  const who = t.speaker === 'agent' ? 'Kiku' : L.guest;
  const gap = isLast ? `<div class="gap">Quiet on the line from 01:06 to 02:51</div>` : '';
  return `${gap}<div class="tl-row ${t.speaker === 'agent' ? 'tl-kiku' : 'tl-guest'} ${isLast ? 'latest' : ''}"><div class="tl-t">${t.t}</div><div class="tl-dot"><span></span></div><div><div class="tl-who">${who}${isLast ? '<span class="aside">Latest question</span>' : ''}</div><div class="tl-text">${t.text}</div></div></div>`;
}).join('') + `<div class="tl-row draft tl-kiku"><div class="tl-t">now</div><div class="tl-dot"><span></span></div><div><div class="tl-who">Kiku<span class="aside">${L.agentState}</span><span class="dots"><i></i><i></i><i></i></span></div><div class="tl-text">${L.agentDraft}</div></div></div>`;

mount({ role: 'specialist', active: 'live', crumb: 'Live board', title: L.guest, sub: `${L.id}, started ${L.started}`,
  topRight: status(L.status) + dir(L.direction) }, `
<div class="grid">
  <div class="left">
    <section class="band">
      <div class="who"><span class="ic">${icon('headphones')}</span><div><b>You're listening</b><span>${L.guest.split(' ')[0]} and Kiku can't hear you</span></div></div>
      <div class="meters">
        <span class="meter m-guest">${L.guest.split(' ')[0]}<span class="bars">${lv(14, 3, 26)}</span>speaking</span>
        <span class="meter m-kiku">Kiku<span class="bars">${lv(14, 9, 12)}</span>quiet</span>
      </div>
      <div class="dur"><b>${L.duration}</b><span style="display:block;margin-top:4px">on the line</span></div>
    </section>
    <section class="panel tpanel">
      <div class="panel-h"><h2>Live transcript</h2><span class="hint">Updates as people speak</span></div>
      <div class="scroll" id="ts"><div class="tl">${rows}</div></div>
    </section>
  </div>
  <aside class="side">
    <section class="panel ctl">
      <a class="btn btn-human" href="06-takeover-karaoke.html">${icon('mic')}Take over</a>
      <p>Kiku goes quiet and you speak. Kiku keeps writing each line for you to read or put in your own words.</p>
      <div class="row">
        <button class="btn muted-state">${icon('micoff')}Muted</button>
        <a class="btn" href="02-live-overview.html">${icon('logout')}Leave</a>
      </div>
    </section>
    <section class="panel facts">
      <h2 class="h2">Call facts</h2>
      <dl>
        <dt>Phone</dt><dd>${L.phone}</dd>
        <dt>Booking</dt><dd>${L.booking}</dd>
        <dt>Stay</dt><dd>${L.stay}</dd>
        <dt>Purpose</dt><dd class="purpose">${L.purpose}</dd>
        <dt>Listening</dt><dd>${L.listening.join(', ')} (you)</dd>
      </dl>
      <div class="acts">
        <h3>Kiku already did</h3>
        <ul>${L.actionsTaken.map(a => `<li>${icon('check')}<span>${a}</span></li>`).join('')}</ul>
      </div>
    </section>
  </aside>
</div>
`);
const ts = document.getElementById('ts');
const end = () => ts.scrollTop = ts.scrollHeight; end(); document.fonts.ready.then(() => requestAnimationFrame(end));
</script>
</body>
</html>
