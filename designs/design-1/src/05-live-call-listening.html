<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Listening: Rashid Karimi · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&family=Geist+Mono:wght@400;500&display=block">
<script src="https://cdn.jsdelivr.net/npm/lucide@1.48.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<script>
const { K, ic, status, topbar, mount, esc, spineEntry, meter, firstName } = UI;
const L = K.liveCall;
const me = K.people.specialist;
const lastGuest = [...L.transcript].reverse().find((e) => e.speaker === "guest");
lastGuest._latest = true;

const ctx = { guest: L.guest, specialistFirst: firstName(me.name) };
const lines = L.transcript.map((e) => spineEntry(e, ctx)).join("");
const draft = `<div class="sp-row">
  <div class="sp-l"><div class="draft"><span class="who-lbl">${esc(K.product.name)} · ${esc(L.agentState.toLowerCase())}<span class="dots"><i></i><i></i><i></i></span></span><p class="sp-text">${esc(L.agentDraft)}</p></div></div>
  <div class="sp-c"><span class="tc now">${L.duration}</span><span class="match">now</span></div>
  <div class="sp-r"><p class="empty-r">If you take over, Kiku’s next line becomes your script on the left, and what you say appears here.</p></div>
</div>`;

mount(`
${topbar("specialist", "Live", { liveDot: true })}
<main class="page" style="grid-template-rows:auto minmax(0,1fr)">
  <div class="band listen">
    <span class="badge">${ic("headphones", "i20")}</span>
    <div class="state"><span class="h20">You’re listening</span><span class="muted">${esc(firstName(L.guest))} can’t hear you. Kiku is on the line.</span></div>
    <div class="ctrls">
      <div class="timer"><span class="st">${UI.shape("in_progress")}${L.duration}</span><small>call time, live</small></div>
      <button class="btn">${ic("volume-x")}Mute audio</button>
      <button class="btn">${ic("log-out")}Leave</button>
      <button class="btn primary lg">${ic("mic")}Take over</button>
    </div>
  </div>

  <section class="col panel" style="grid-column:1/9;margin:24px 0">
    <div class="transcript" id="tx">
      <div class="sp-head"><div class="l"><span></span><span class="st">${ic("audio-lines")}Kiku</span></div><div class="c">Time</div><div class="r"><span class="st">${ic("headphones")}You, listening</span><span></span></div></div>
      <div class="spine">${lines}${draft}</div>
    </div>
  </section>

  <aside class="rail" style="grid-column:9/13">
    <div class="blk">
      <h1 class="h32">${esc(L.guest)}</h1>
      <div class="audit-chips" style="padding:0">${status(L.status, { chip: true })}<span class="chip flat">${ic("phone-incoming", "i12")}Inbound</span><span class="chip flat mono">${L.id}</span></div>
    </div>
    <dl class="facts">
      <div><dt>Phone</dt><dd class="mono">${esc(L.phone)}</dd></div>
      <div><dt>Booking</dt><dd class="mono">${L.booking}</dd></div>
      <div class="w"><dt>Stay</dt><dd>${esc(L.stay)}</dd></div>
      <div class="w"><dt>Why they called</dt><dd>${esc(L.purpose)}</dd></div>
      <div><dt>Started</dt><dd class="mono">${L.started}</dd></div>
      <div><dt>Listening</dt><dd>${L.listening.map((n) => (n === me.name ? `${esc(n)} (you)` : esc(n))).join(", ")}</dd></div>
    </dl>
    <section>
      <h2 class="sec-h h20">Kiku already did <span class="cnt">${L.actionsTaken.length}</span></h2>
      <ul class="acts-list">${L.actionsTaken.map((a) => `<li>${ic("check")}<span>${esc(a)}</span></li>`).join("")}</ul>
    </section>
    <section>
      <h2 class="sec-h h20">Audio</h2>
      <div class="meter-row"><span class="who-l">${esc(firstName(L.guest))}<small>just spoke</small></span>${meter(9, 32)}</div>
      <div class="meter-row"><span class="who-l">Kiku<small>drafting, silent</small></span>${meter(1, 32)}</div>
      <div class="meter-row"><span class="who-l">You<small>mic off</small></span>${meter(0, 32)}</div>
    </section>
  </aside>
</main>
`, () => {
  const tx = document.getElementById("tx");
  const { spine, avail, h } = UI.fitTail(tx, 48);
  spine.style.paddingBottom = avail - h + "px";
  tx.scrollTop = tx.scrollHeight;
});
</script>
</body>
</html>
