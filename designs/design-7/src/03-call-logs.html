<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Call logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .main { display: grid; grid-template-columns: 284px 1fr; gap: 24px; }
  .rail { padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }
  .rail .sub { margin-top: 6px; }
  .grp { display: grid; gap: 8px; }
  .keys1 { display: grid; gap: 5px; }
  .fk {
    display: flex; align-items: center; gap: 9px; height: 36px; padding: 0 12px 0 9px;
    background: var(--white); border-radius: 4px; font-size: 13.5px; font-weight: 600; text-align: left;
    box-shadow: 0 1px 1px rgba(42, 11, 56, .2), 0 4px 10px -6px rgba(42, 11, 56, .5);
  }
  .fk .n { margin-left: auto; font-weight: 700; }
  .fk:hover { background: var(--lilac); }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--white); border-radius: 5px; padding: 3px; gap: 3px; box-shadow: 0 1px 1px rgba(42, 11, 56, .2); }
  .seg button { height: 32px; border-radius: 3px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .seg button .n { color: var(--ink-2); font-weight: 600; }
  .seg button.on { background: var(--plum); color: var(--white); }
  .seg button.on .n { color: var(--on-plum-2); }
  .has-ico input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; height: 100%; font-size: 14px; }
  .rail .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }

  .right { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 44px; }
  .picked { display: flex; align-items: center; gap: 12px; font-size: 13.5px; font-weight: 500; }
  .sheet { flex: 1; }
  .sheet .pane { flex: 1; }
  .tbl td { padding: 5px 12px; line-height: 1.3; }
  .tbl td.pur { max-width: 0; }
  .tbl .two { margin-top: 1px; }
  .tbl .dirc { display: flex; gap: 6px; align-items: center; font-weight: 600; }
  .go { margin-left: auto; width: 28px; height: 28px; border-radius: 4px; display: grid; place-items: center; color: var(--ink-2); }
  tr.is-sel .go { background: var(--plum); color: var(--violet); }
</style>
</head>
<body>
<header class="band"></header>
<main class="main">
  <aside class="panel rail on-violet" aria-label="Filters">
    <div>
      <h1 class="h1">Call logs</h1>
      <p class="sub" id="day"></p>
    </div>
    <label class="field"><span class="lbl">Search</span>
      <span class="input has-ico"><i class="bi bi-search" aria-hidden="true"></i><input type="search" placeholder="Guest, phone or KK number"></span>
    </label>
    <div class="field"><span class="lbl">Date</span>
      <button class="input select"><span class="row" style="gap:8px"><i class="bi bi-calendar3" aria-hidden="true"></i>Today</span><i class="bi bi-chevron-down" aria-hidden="true"></i></button>
    </div>
    <div class="grp"><span class="lbl">Status</span><div class="keys1" id="f-status"></div></div>
    <div class="grp"><span class="lbl">Direction</span><div class="seg" id="f-dir"></div></div>
    <div class="field"><span class="lbl">Type</span>
      <button class="input select" title="Inbound, Campaign, Upsell, Make a call"><span>All types <span class="muted num" id="types-n"></span></span><i class="bi bi-chevron-down" aria-hidden="true"></i></button>
    </div>
    <div class="foot"><span id="showing" class="num"></span><a class="link" href="#">Reset filters</a></div>
  </aside>

  <section class="right">
    <div class="sheet"><div class="pane"><table class="tbl vh" id="logs"></table></div></div>
  </section>
</main>
<script>
  const { K, esc, icon, status, tile, STATUS } = UI;
  UI.mountBand("specialist", "logs");
  const calls = K.calls;
  document.getElementById("day").textContent = K.hotel.today;

  const count = (fn) => calls.filter(fn).length;
  document.getElementById("f-status").innerHTML = Object.keys(STATUS).map((s) =>
    `<button class="fk" aria-pressed="true"><span class="check on">${icon("check")}</span>${tile(s)}<span>${STATUS[s].label}</span><span class="n num">${count((c) => c.status === s)}</span></button>`
  ).join("");
  document.getElementById("f-dir").innerHTML =
    `<button class="on">All <span class="n num">${calls.length}</span></button>` +
    `<button>${icon("telephone-inbound-fill")}In <span class="n num">${count((c) => c.direction === "inbound")}</span></button>` +
    `<button>${icon("telephone-outbound-fill")}Out <span class="n num">${count((c) => c.direction === "outbound")}</span></button>`;
  document.getElementById("types-n").textContent = `(${calls.length})`;
  document.getElementById("showing").textContent = `Showing ${calls.length} of ${calls.length}`;

  const sel = calls.find((c) => c.id === K.audit.id);

  const spec = (c) => {
    if (!c.specialist) return `<span class="muted">Kiku only</span>`;
    const m = c.specialist.match(/^(.*?) \((.*)\)$/);
    return m ? `${esc(m[1])}<span class="two">${esc(m[2])}</span>` : esc(c.specialist);
  };
  document.getElementById("logs").innerHTML =
    `<colgroup><col style="width:84px"><col style="width:172px"><col style="width:124px"><col><col style="width:134px"><col style="width:74px"><col style="width:132px"><col style="width:104px"></colgroup>
    <thead><tr><th>Time</th><th>Guest</th><th>Direction</th><th>Purpose</th><th>Status</th><th class="r">Length</th><th>Specialist</th><th><span class="sr">Open</span></th></tr></thead><tbody>` +
    calls.map((c) => `<tr class="${c.id === sel.id ? "is-sel" : ""}">
      <td class="num"><span class="strong">${c.started}</span><span class="two">${c.id}</span></td>
      <td><span class="strong">${esc(c.guest)}</span><span class="two num">${esc(c.phone)}</span></td>
      <td><span class="dirc">${icon(c.direction === "inbound" ? "telephone-inbound-fill" : "telephone-outbound-fill")}${c.direction === "inbound" ? "Inbound" : "Outbound"}</span>${c.direction === "outbound" ? `<span class="two">${c.type}</span>` : ""}</td>
      <td class="pur"><span class="clamp2">${esc(c.purpose)}</span></td>
      <td>${status(c.status)}</td>
      <td class="r num">${c.duration}</td>
      <td>${spec(c)}</td>
      <td class="r">${c.id === sel.id ? `<a class="btn btn-pri btn-sm" href="04-call-audit.html">Audit${icon("arrow-right")}</a>` : `<a class="go" href="#" aria-label="Open ${c.id}">${icon("chevron-right")}</a>`}</td>
    </tr>`).join("") + `</tbody>`;
</script>
</body>
</html>
