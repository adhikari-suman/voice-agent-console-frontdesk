<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Make a call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .purpose { min-height: 150px; font-size: 15px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .brief { display: grid; gap: 10px; background: var(--white); border-radius: 6px; padding: 14px 16px; font-size: 13.5px; font-weight: 500; }
  .brief li { display: flex; gap: 9px; align-items: flex-start; }
  .brief .bi { margin-top: 2px; }
  .tpl { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 6px; background: var(--lilac); font-size: 13px; font-weight: 500; }
  .tpl .bi { font-size: 18px; }
  .drop .filerow { flex: 1; }
  .noname { color: var(--ink-2); font-style: italic; }
  .bulk .tbl td.pur { line-height: 1.35; }
</style>
</head>
<body>
<header class="band"></header>
<main class="main out-main">
  <div class="subnav">
    <h1 class="h1">Outbound</h1>
    <nav class="selectors" id="subnav" aria-label="Outbound call types"></nav>
  </div>
  <div class="split">
    <section class="panel single on-violet" id="single" aria-label="Make one call"></section>
    <section class="sheet bulk" id="bulk" aria-label="Make calls from a CSV"></section>
  </div>
</main>
<script>
  const { K, esc, icon, fileRow } = UI;
  UI.mountBand("admin", "out");
  document.getElementById("subnav").innerHTML = UI.outSub("Make a call");
  const S = K.makeCallSingle, C = K.makeCallCsv;

  document.getElementById("single").innerHTML = `
    <div><h2 class="h1">One call</h2><p class="intro">Tell Kiku who to call and what the call is for.</p></div>
    <label class="field"><span class="lbl">Purpose</span><textarea class="input purpose">${esc(S.purpose)}</textarea></label>
    <div class="g2">
      <label class="field"><span class="lbl">Name <span class="opt">(optional)</span></span><input class="input" value="${esc(S.name)}" placeholder="Leave blank if unknown"></label>
      <label class="field"><span class="lbl">Phone</span><input class="input num is-focus" value="${esc(S.phone)}"></label>
    </div>
    <ul class="brief">
      <li>${icon("person-fill")}<span>Name is optional. Leave it blank if you don't know who will answer.</span></li>
      <li>${icon("journal-text")}<span>The call shows in Call logs as Outbound · Make a call, with this purpose.</span></li>
    </ul>
    <div class="foot">
      <p>Ready to call ${esc(S.name)}.</p>
      <button class="btn btn-pri btn-lg">${icon("telephone-outbound-fill")}Place call</button>
    </div>`;

  const rows = [];
  C.preview.forEach((r, i) => {
    const prev = i ? C.preview[i - 1].row : 0;
    if (r.row - prev > 1) rows.push(`<tr class="gap-row"><td colspan="5">${r.row - prev - 1 === 1 ? `Row ${prev + 1} ready` : `Rows ${prev + 1}–${r.row - 1} ready`}</td></tr>`);
    const name = r.name ? `<span class="strong">${esc(r.name)}</span>` : `<span class="noname">No name</span>`;
    rows.push(r.ok
      ? `<tr><td class="num">${r.row}</td><td class="num">${esc(r.phone)}</td><td>${name}</td><td class="pur">${esc(r.purpose)}</td><td><span class="oktxt"><span class="tile ok">${icon("check-lg")}</span>Ready</span></td></tr>`
      : `<tr class="err"><td class="num">${r.row}</td><td><span class="muted">empty</span></td><td>${name}</td><td class="pur">${esc(r.purpose)}</td>
         <td><span class="errtxt"><span class="tile fail">${icon("x-lg")}</span><span>${esc(r.error)}<small>Add a number to row ${r.row}.</small></span></span></td></tr>`);
  });
  const last = C.preview[C.preview.length - 1].row;
  if (last < C.rows) rows.push(`<tr class="gap-row"><td colspan="5">Rows ${last + 1}–${C.rows} ready</td></tr>`);

  document.getElementById("bulk").innerHTML = `
    <div class="row between" style="align-items:flex-start">
      <div><h2 class="h1">A list of calls</h2><p class="intro">One call per row, each with its own purpose. <a class="link" href="#">${icon("download")} Download the template</a></p></div>
      <div class="colchips">Columns <code>${C.columns.join("</code><code>")}</code></div>
    </div>
    <div class="drop">${fileRow(C, `<button class="btn btn-sec btn-sm">${icon("arrow-repeat")}Replace</button><button class="iconbtn" style="box-shadow:none" aria-label="Remove file">${icon("trash3")}</button>`)}</div>
    <div class="tally num">
      <span class="oktxt"><span class="tile ok">${icon("check-lg")}</span>${C.ready} ready</span>
      <span class="oktxt"><span class="tile fail">${icon("x-lg")}</span>${C.errors} error</span>
      <div class="bar" role="img" aria-label="${C.ready} of ${C.rows} rows ready"><i style="width:${(C.ready / C.rows * 100).toFixed(1)}%;background:var(--plum)"></i><i style="left:${(C.ready / C.rows * 100).toFixed(1)}%;width:${(C.errors / C.rows * 100).toFixed(1)}%;background:var(--red)"></i></div>
    </div>
    <table class="tbl">
      <colgroup><col style="width:52px"><col style="width:152px"><col style="width:118px"><col><col style="width:214px"></colgroup>
      <thead><tr><th>Row</th><th>Phone</th><th>Name</th><th>Purpose</th><th>Check</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>
    <div class="foot">
      <p>Row ${C.preview.find((r) => !r.ok).row} will be skipped until it has a phone number.</p>
      <button class="btn btn-pri btn-lg">${icon("telephone-outbound-fill")}Place ${C.ready} calls</button>
    </div>`;
</script>
</body>
</html>
