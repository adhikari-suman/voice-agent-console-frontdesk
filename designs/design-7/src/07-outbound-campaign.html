<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Outbound campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .main { display: grid; grid-template-rows: auto 1fr; gap: 16px; }
  .subnav { display: flex; align-items: center; gap: 24px; }
  .body { display: grid; grid-template-columns: 520px 1fr; gap: 22px; min-height: 0; }
  .list { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .camp .half.a { padding: 14px 18px 16px; display: grid; gap: 5px; }
  .camp .half.b { padding: 16px 18px 14px; display: grid; gap: 9px; }
  .camp .code { font-size: 26px; line-height: 1; }
  .camp .name { font-weight: 700; font-size: 14px; }
  .camp .offer { font-size: 13px; color: var(--ink-2); }
  .funnel { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; font-weight: 500; }
  .funnel b { font-weight: 700; }
  .funnel span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .bar { height: 12px; }
  .note { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 500; }

  .setup { padding: 20px 24px 22px; display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .setup .head { display: flex; justify-content: space-between; align-items: flex-start; }
  .setup .head p { font-size: 13.5px; font-weight: 600; margin-top: 6px; }
  .g3 { display: grid; grid-template-columns: 1fr 1.4fr 150px; gap: 16px; }
  .file { display: grid; gap: 10px; background: var(--white); border-radius: 6px; padding: 14px 16px; }
  .file .top { display: flex; align-items: center; gap: 12px; }
  .file .fn { font-weight: 700; font-size: 14px; }
  .file .fm { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .file .errs { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; font-weight: 500; padding-top: 10px; border-top: 1px solid var(--line); }
  .file .errs .tile { margin-top: 1px; }
  .opening { min-height: 90px; font-size: 15px; font-weight: 500; line-height: 1.55; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; padding-top: 14px; border-top: 2px dotted var(--plum); }
  .foot p { flex: 1; font-size: 13.5px; font-weight: 600; }
</style>
</head>
<body>
<header class="band"></header>
<main class="main">
  <div class="subnav">
    <h1 class="h1">Outbound</h1>
    <nav class="selectors" id="subnav" aria-label="Outbound call types"></nav>
  </div>
  <div class="body">
    <section class="list" aria-labelledby="camps-h">
      <div class="row between"><h2 class="h2" id="camps-h">Campaigns</h2><button class="btn btn-sec btn-sm"><i class="bi bi-plus-lg" aria-hidden="true"></i>New campaign</button></div>
      <div id="camps" style="display:grid;gap:14px"></div>
    </section>
    <section class="panel setup on-violet" id="setup" aria-label="Campaign setup"></section>
  </div>
</main>
<script>
  const { K, esc, icon, status, tile } = UI;
  UI.mountBand("admin", "out");
  document.getElementById("subnav").innerHTML = UI.outSub("Campaign");

  const D = K.campaignDraft;
  const cstate = (c) => {
    if (c.status.startsWith("Paused")) return `<span class="st"><span class="st-i" style="background:var(--plum)">${icon("pause-fill")}</span>${esc(c.status)}</span>`;
    if (c.status.startsWith("Scheduled")) return `<span class="st"><span class="st-i" style="background:var(--plum)">${icon("calendar-event-fill")}</span>${esc(c.status)}</span>`;
    return `<span class="st"><span class="st-i" style="background:var(--off);color:var(--plum)">${icon("pencil-fill")}</span>${esc(c.status)}</span>`;
  };
  const pct = (n, of) => (n / of * 100).toFixed(1) + "%";
  document.getElementById("camps").innerHTML = K.campaigns.map((c) => {
    const draft = c.code === D.code;
    let b;
    if (c.called > 0) {
      b = `<div class="bar" role="img" aria-label="${c.called} of ${c.contacts} called">
          <i style="width:${pct(c.called, c.contacts)};background:var(--mark)"></i>
          <i style="width:${pct(c.answered, c.contacts)};background:var(--violet)"></i>
          <i style="width:${pct(c.booked, c.contacts)};background:var(--plum)"></i></div>
        <div class="funnel num">
          <span><i class="sw" style="background:var(--mark);box-shadow:inset 0 0 0 1px var(--violet)"></i><b>${c.called}</b> called</span>
          <span><i class="sw" style="background:var(--violet)"></i><b>${c.answered}</b> answered</span>
          <span><i class="sw" style="background:var(--plum)"></i><b>${c.booked}</b> booked</span>
          <span><span class="tile fail" style="width:14px;height:14px;font-size:9px">${icon("x-lg")}</span><b>${c.failed}</b> failed</span>
          <span class="muted">of <b>${c.contacts}</b> contacts</span>
        </div>
        <div class="note"><span class="muted">Picks up again when the pause ends.</span><button class="btn btn-sec btn-sm">${icon("play-fill")}Resume now</button></div>`;
    } else if (!draft) {
      b = `<div class="note"><span><b class="num">${c.contacts}</b> contacts · nobody called yet</span><button class="btn btn-sec btn-sm">${icon("pencil-fill")}Edit</button></div>`;
    } else {
      b = `<div class="note"><span>${icon("pencil-fill")} Open for setup on the right</span><span class="chip dark">Editing</span></div>`;
    }
    return `<article class="strip camp${draft ? " is-sel" : ""}">
      <div class="half a">
        <div class="row between"><span class="code">${c.code}</span>${cstate(c)}</div>
        <span class="name">${esc(c.name)}</span>
        <p class="offer">${esc(c.offer)}</p>
      </div>
      <div class="tear"><span class="tear-tag l">${icon("file-earmark-spreadsheet-fill")}${esc(c.audience)} · ${esc(c.window)}</span></div>
      <div class="half b">${b}</div>
    </article>`;
  }).join("");

  const draftC = K.campaigns.find((c) => c.code === D.code);
  const opening = esc(D.opening).replace("{first_name}", `<span class="token">{first_name}</span>`);
  document.getElementById("setup").innerHTML = `
    <div class="head">
      <div><h2 class="h1">Set up ${D.code}</h2><p>${esc(draftC.name)} · not scheduled yet</p></div>
      ${cstate(draftC)}
    </div>
    <div class="g3">
      <label class="field"><span class="lbl">Promo code</span><input class="input code" value="${D.code}"></label>
      <div class="field"><span class="lbl">Call window</span><button class="input select"><span class="row" style="gap:8px">${icon("clock-fill")}${esc(D.window)}</span>${icon("chevron-down")}</button></div>
      <div class="field"><span class="lbl">Max attempts</span><div class="stepper"><button aria-label="Fewer">${icon("dash-lg")}</button><span class="num">${D.maxAttempts}</span><button aria-label="More">${icon("plus-lg")}</button></div></div>
    </div>
    <label class="field"><span class="lbl">Offer</span><input class="input" value="${esc(draftC.offer)}"></label>
    <div class="field"><span class="lbl">Audience list</span>
      <div class="file">
        <div class="top">
          <span class="fileico">CSV</span>
          <div class="grow"><div class="fn">${esc(D.file)}</div><div class="fm num">${D.rows} rows · checked just now</div></div>
          <div class="counts num"><span><span class="tile ok">${icon("check-lg")}</span>${D.ready} ready</span><span><span class="tile fail">${icon("x-lg")}</span>${D.errors} errors</span></div>
          <button class="btn btn-sec btn-sm">${icon("arrow-repeat")}Replace</button>
        </div>
        <p class="errs"><span class="tile fail">${icon("x-lg")}</span><span>${D.errors} rows can't be called, so Kiku will skip them. Fix those rows in ${esc(D.file)} and upload it again to include them, or schedule with the ${D.ready} that are ready.</span></p>
      </div>
    </div>
    <div class="field"><span class="lbl">Opening line</span>
      <div class="input area opening" role="textbox" aria-multiline="true">${opening}</div>
      <p class="help">Kiku fills in <span class="token">{first_name}</span> for each contact on the list.</p>
    </div>
    <div class="foot">
      <p class="num">Kiku will call ${D.ready} contacts, ${esc(D.window)}, up to ${D.maxAttempts} attempts each.</p>
      <button class="btn btn-line">Save draft</button>
      <button class="btn btn-pri btn-lg">${icon("calendar-event-fill")}Schedule campaign</button>
    </div>`;
</script>
</body>
</html>
