<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Outbound upsell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=block">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .found .half.a { padding: 12px 16px 12px; display: flex; align-items: center; gap: 12px; }
  .found .half.b { padding: 12px 16px 12px; font-size: 13.5px; font-weight: 500; }
  .found .nm { font-stretch: 68%; font-weight: 800; font-size: 22px; text-transform: uppercase; line-height: 1; }
  .offers { padding: 6px 16px 4px; }
  .offers .lbl { padding: 10px 0 6px; display: block; }
  .of { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 11px 0; border-top: 1px solid var(--line); }
  .of .n { font-weight: 700; font-size: 14.5px; display: flex; align-items: center; gap: 8px; }
  .of .n .bi { font-size: 15px; }
  .of .d { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
  .of .p { text-align: right; font-weight: 700; font-size: 14px; }
  .of .p small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .drop .filerow { flex: 1; }
</style>
</head>
<body>
<header class="band"></header>
<main class="main out-main">
  <div class="subnav">
    <h1 class="h1">Outbound</h1>
    <nav class="selectors" id="subnav" aria-label="Outbound call types"></nav>
  </div>
  <div class="split">
    <section class="panel single on-violet" id="single" aria-label="Upsell one booking"></section>
    <section class="sheet bulk" id="bulk" aria-label="Upsell from a CSV"></section>
  </div>
</main>
<script>
  const { K, esc, icon, fileRow } = UI;
  UI.mountBand("admin", "out");
  document.getElementById("subnav").innerHTML = UI.outSub("Upsell");
  const S = K.upsellSingle, C = K.upsellCsv;
  const [who, ...rest] = S.match.split(" · ");
  const OI = { pickup: "car-front-fill", breakfast: "cup-hot-fill", dinner: "egg-fried" };

  document.getElementById("single").innerHTML = `
    <div><h2 class="h1">One booking</h2><p class="intro">Enter the guest's phone and confirmation number, then choose the offers.</p></div>
    <div class="g2">
      <label class="field"><span class="lbl">Phone</span><input class="input num" value="${esc(S.phone)}"></label>
      <label class="field"><span class="lbl">Confirmation number</span><input class="input num" value="${S.confirmation}"></label>
    </div>
    <article class="strip found">
      <div class="half a"><span class="tile ok lg">${icon("check-lg")}</span><div><span class="lbl">Booking found · ${S.confirmation}</span><div class="nm" style="margin-top:5px">${esc(who)}</div></div></div>
      <div class="tear"></div>
      <div class="half b">${rest.map(esc).join(" · ")}</div>
    </article>
    <div class="strip offers">
      <span class="lbl">Offers Kiku will make</span>
      ${K.offers.map((o, i) => `<div class="of">
        <span class="tog${S.offers.includes(o.id) ? " on" : ""}${i === 2 ? " is-focus" : ""}" role="switch" aria-checked="${S.offers.includes(o.id)}"><span class="tog-track"><span class="tog-knob">${S.offers.includes(o.id) ? icon("check") : ""}</span></span></span>
        <div><div class="n">${icon(OI[o.id])}${esc(o.name)}</div><div class="d">${esc(o.detail)}</div></div>
        <div class="p">${esc(o.price)}${o.alt ? `<small>${esc(o.alt)}</small>` : ""}</div>
      </div>`).join("")}
    </div>
    <div class="foot">
      <p>Kiku calls ${esc(who.split(" ")[0])} now with ${S.offers.length} offers.</p>
      <button class="btn btn-pri btn-lg">${icon("telephone-outbound-fill")}Call now</button>
    </div>`;

  const okRows = C.preview.filter((r) => r.ok).map((r) => r.row);
  const errRows = C.preview.filter((r) => !r.ok);
  const FIX = { "Phone number too short": "Use the full number with the country code.", "Confirmation number missing": "Add the guest's BRN confirmation number." };
  const rows = [];
  C.preview.forEach((r, i) => {
    const prev = i ? C.preview[i - 1].row : 0;
    if (r.row - prev > 1) rows.push(`<tr class="gap-row"><td colspan="5">Rows ${prev + 1}–${r.row - 1} ready</td></tr>`);
    rows.push(r.ok
      ? `<tr><td class="num">${r.row}</td><td class="num">${esc(r.phone)}</td><td class="num">${r.confirmation}</td><td class="strong">${esc(r.guest)}</td><td><span class="oktxt"><span class="tile ok">${icon("check-lg")}</span>Ready</span></td></tr>`
      : `<tr class="err"><td class="num">${r.row}</td><td class="num">${r.phone ? esc(r.phone) : '<span class="muted">empty</span>'}</td><td class="num">${r.confirmation || '<span class="muted">empty</span>'}</td><td class="muted">No match</td>
         <td><span class="errtxt"><span class="tile fail">${icon("x-lg")}</span><span>${esc(r.error)}<small>${FIX[r.error] || ""}</small></span></span></td></tr>`);
  });
  const last = C.preview[C.preview.length - 1].row;
  if (last < C.rows) rows.push(`<tr class="gap-row"><td colspan="5">Rows ${last + 1}–${C.rows} ready</td></tr>`);

  document.getElementById("bulk").innerHTML = `
    <div class="row between" style="align-items:flex-start">
      <div><h2 class="h1">A list of bookings</h2><p class="intro">One call per row. Kiku makes all ${K.offers.length} offers on each call.</p></div>
      <div class="colchips">Columns <code>${C.columns.join("</code><code>")}</code></div>
    </div>
    <div class="drop">${fileRow(C, `<button class="btn btn-sec btn-sm">${icon("arrow-repeat")}Replace</button><button class="iconbtn" style="box-shadow:none" aria-label="Remove file">${icon("trash3")}</button>`)}</div>
    <div class="tally num">
      <span class="oktxt"><span class="tile ok">${icon("check-lg")}</span>${C.ready} ready</span>
      <span class="oktxt"><span class="tile fail">${icon("x-lg")}</span>${C.errors} errors</span>
      <div class="bar" role="img" aria-label="${C.ready} of ${C.rows} rows ready"><i style="width:${(C.ready / C.rows * 100).toFixed(1)}%;background:var(--plum)"></i><i style="left:${(C.ready / C.rows * 100).toFixed(1)}%;width:${(C.errors / C.rows * 100).toFixed(1)}%;background:var(--red)"></i></div>
    </div>
    <table class="tbl">
      <colgroup><col style="width:56px"><col style="width:170px"><col style="width:130px"><col style="width:140px"><col></colgroup>
      <thead><tr><th>Row</th><th>Phone</th><th>Confirmation</th><th>Guest</th><th>Check</th></tr></thead>
      <tbody>${rows.join("")}</tbody>
    </table>
    <div class="foot">
      <p>Rows ${errRows.map((r) => r.row).join(" and ")} will be skipped until they're fixed.</p>
      <button class="btn btn-pri btn-lg">${icon("telephone-outbound-fill")}Start ${C.ready} calls</button>
    </div>`;
</script>
</body>
</html>
