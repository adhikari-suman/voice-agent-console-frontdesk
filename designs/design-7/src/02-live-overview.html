<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku, live board</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
.today { font: 400 21px/1.45 var(--display); letter-spacing: -0.01em; color: var(--ink-3); max-width: 1100px; margin-bottom: 20px; }
.today b { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
.today .up { color: var(--done); }
.g2 { display: grid; grid-template-columns: 1fr 356px; gap: 16px; height: calc(100% - 82px); }
.col { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
.need { background: var(--panel); border: 1px solid #F3B999; border-radius: 12px; display: grid; grid-template-columns: 190px 1fr auto; overflow: hidden; }
.need .wait { background: var(--apricot); color: var(--aub); padding: 18px 20px; display: flex; flex-direction: column; }
.need .wait .l { font-size: 12.5px; font-weight: 600; }
.need .wait .n { font: 700 48px/1 var(--display); letter-spacing: -0.03em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.need .wait .s { font-size: 12px; margin-top: auto; opacity: .85; }
.need .mid { padding: 18px 22px; min-width: 0; }
.need .who { display: flex; align-items: center; gap: 12px; }
.need .who h2 { font: 700 22px/1.1 var(--display); letter-spacing: -0.015em; }
.need .purpose { font-size: 15px; margin: 10px 0 10px; max-width: 58ch; }
.need .reason { font-size: 13px; color: #8A3A0C; display: flex; gap: 7px; align-items: flex-start; }
.need .reason svg { width: 15px; height: 15px; margin-top: 2px; }
.need .act { padding: 18px 22px; display: flex; flex-direction: column; gap: 8px; justify-content: center; border-left: 1px solid var(--hair); }
.lines { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.lrow { display: grid; grid-template-columns: 124px 1.25fr 1.5fr 148px 52px 124px; align-items: center; gap: 14px; padding: 19px 18px; border-top: 1px solid var(--hair); }
.lrow .g { font-weight: 600; }
.lrow .p { font-size: 13px; color: var(--ink-2); }
.lrow .dur { font: 600 15px/1 var(--display); font-variant-numeric: tabular-nums; }
.lanes { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.lanes span { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
.lanes i { width: 18px; height: 4px; border-radius: 1px; display: inline-block; }
.lanes .k i { background: var(--mauve); }
.lanes .h i { background: var(--apricot); }
.lanes .off i { background: var(--hair-2); }
.lanes .off { color: var(--ink-3); }
.fin { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.frow { padding: 11px 18px; border-top: 1px solid var(--hair); display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
.frow .g { font-weight: 600; font-size: 13.5px; }
.frow .o { grid-column: 1 / -1; font-size: 12.5px; color: var(--ink-2); }
.frow .tm { font-size: 12px; color: var(--ink-3); }
.lrow .small svg.lucide, .need .small svg.lucide { width: 13px; height: 13px; }
</style>
</head><body>
<script>
const { K, esc, status, ic, topbar, mount, live } = UI;
const s = K.stats;
const owen = live.find(c => c.status === "escalated" && !c.specialist);
const others = live.filter(c => c !== owen);
const order = ["KK-24030", "KK-24031", "KK-24029", "KK-24028"];
others.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
const dir = c => `${ic(c.direction === "inbound" ? "phone-incoming" : "phone-outgoing")}${c.direction === "inbound" ? "Inbound" : c.type}`;
const lanes = c => {
  if (c.status === "escalated" && c.specialist) return `<div class="lanes"><span class="h"><i></i>Priya speaking</span><span class="k"><i></i>Kiku writing lines</span></div>`;
  if (c.specialist && /listening/.test(c.specialist)) return `<div class="lanes"><span class="k"><i></i>Kiku speaking</span><span class="h"><i></i>Priya listening</span></div>`;
  return `<div class="lanes"><span class="k"><i></i>Kiku speaking</span><span class="off"><i></i>No one listening</span></div>`;
};
const action = c => {
  if (c.status === "escalated" && c.specialist) return `<button class="btn sm btn-human">${ic("mic")}Back to call</button>`;
  if (c.specialist) return `<button class="btn sm btn-ink">${ic("headphones")}Open</button>`;
  return `<button class="btn sm btn-line">${ic("headphones")}Listen</button>`;
};
const rows = others.map(c => `<div class="lrow">
  ${status(c.status)}
  <div><div class="g">${esc(c.guest)}</div><div class="small muted num">${c.phone}</div><div class="small muted" style="display:flex;gap:5px;align-items:center;margin-top:1px">${dir(c)}</div></div>
  <div class="p">${esc(c.purpose)}</div>
  ${lanes(c)}
  <div class="dur">${c.duration}</div>
  <div style="text-align:right">${action(c)}</div>
</div>`).join("");
const finished = K.calls.filter(c => c.status === "completed" || c.status === "failed").slice(0, 7);
const fin = finished.map(c => `<div class="frow"><div class="g">${esc(c.guest)}</div><span class="tm num">${c.started}</span>
  <div>${status(c.status, true)}</div><span class="tm num">${c.duration}</span><div class="o">${esc(c.outcome || c.purpose)}</div></div>`).join("");

mount("specialist", "live", `
${topbar(`<h1>Live board</h1>`)}
<div class="body">
  <p class="today">Today so far: <b>${s.callsToday}</b> calls, <b>${s.inbound}</b> in and <b>${s.outbound}</b> out. <b>${s.completed}</b> completed, <b>${s.inProgress}</b> in progress, <b>${s.escalated}</b> escalated and <b>${s.failed}</b> failed. Specialists took over <b>${s.takeoversToday}</b> times, calls averaged <b>${s.avgHandle}</b>, and upsells added <b>${s.upsellValueToday}</b>.</p>
  <div class="g2">
    <div class="col">
      <section class="need">
        <div class="wait"><span class="l">Needs a specialist</span><span class="n">${owen.waiting}</span><span class="s">waiting for a person</span></div>
        <div class="mid">
          <div class="who"><h2>${esc(owen.guest)}</h2>${status(owen.status)}</div><div class="small muted" style="margin-top:4px;display:flex;gap:6px;align-items:center">${ic("phone-incoming")}Inbound, <span class="num">${owen.phone}</span></div>
          <p class="purpose">${esc(owen.purpose)}</p>
          <div class="reason">${ic("triangle-alert")}<span>${esc(owen.escalationReason)} Kiku is holding the line, call ${owen.id}, ${owen.duration} so far.</span></div>
        </div>
        <div class="act">
          <button class="btn lg btn-human">${ic("hand")}Take over</button>
          <button class="btn btn-ghost">${ic("headphones")}Listen first</button>
        </div>
      </section>
      <section class="panel lines">
        <div class="panel-h"><h2>On the line</h2><span class="aside">${others.length} more calls live</span></div>
        <div class="scroll" style="flex:1">${rows}</div>
        <div class="small muted" style="padding:12px 18px;border-top:1px solid var(--hair);display:flex;gap:8px;align-items:center">${ic("info")}Listening is silent. The guest only hears you after you take over.</div>
      </section>
    </div>
    <section class="panel fin">
      <div class="panel-h"><h2>Recently finished</h2><a class="link small" href="#" style="margin-left:auto">All call logs</a></div>
      <div class="scroll">${fin}</div>
    </section>
  </div>
</div>`);
</script>
</body></html>
