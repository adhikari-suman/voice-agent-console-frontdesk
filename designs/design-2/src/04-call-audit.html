<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kiku, call audit</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .content { display: grid; grid-template-columns: 356px minmax(0,1fr); gap: 20px; }
  /* dossier: everything about the call, read top to bottom */
  .dossier { background: var(--sheet); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .d-sec { padding: 14px 20px; border-bottom: 1px solid var(--line-soft); }
  .d-sec:last-child { border-bottom: 0; }
  .gname { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
  .chips { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .kv2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 16px; }
  .kv2 .wide { grid-column: 1 / -1; }
  .k { font-size: 11.5px; color: var(--ink-mute); }
  .v { font-size: 13.5px; line-height: 1.4; }
  .lenses { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
  .lenses div { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 10.5px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .lenses svg { width: 100%; height: 26px; }
  .lenses b { font-size: 12px; color: var(--ink); }
  .lenses .ex b { color: #fff; background: var(--kiku); padding: 0 4px; }
  .ks { font-size: 13.5px; color: var(--ink-2); margin-top: 4px; }
  .ks b { font-weight: 900; }
  .oc { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; padding: 5px 0; font-size: 13px; align-items: start; }
  .oc svg { margin-top: 2px; width: 15px; height: 15px; }
  .oc .amt { font-variant-numeric: tabular-nums; font-weight: 700; }
  .oc.declined { color: var(--ink-mute); }
  .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
  .total b { font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .note { margin-top: 8px; display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .note svg { width: 14px; height: 14px; margin-top: 2px; }

  /* score: the transcript is the recording timeline */
  .score { background: var(--sheet); border: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .s-head { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex: none; }
  .play { width: 38px; height: 38px; background: var(--ink); display: grid; place-items: center; }
  .play svg { fill: #fff; stroke: none; width: 15px; height: 15px; margin-left: 2px; }
  .ptime { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink-soft); white-space: nowrap; }
  .ptime b { color: var(--ink); font-size: 16px; }
  .legend { margin-left: auto; display: flex; gap: 16px; font-size: 12px; color: var(--ink-soft); align-items: center; }
  .legend span { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .legend i { display: block; }
  .mini-lens { width: 30px; height: 16px; }
  .rows { padding: 0 20px 0 0; }
  .row { display: grid; grid-template-columns: 58px 28px minmax(0,1fr); gap: 0 14px; }
  .row .t { font-size: 12px; color: var(--ink-mute); font-variant-numeric: tabular-nums; text-align: right; padding-top: 13px; }
  .spine { position: relative; display: flex; justify-content: center; align-items: flex-start; }
  .spine::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; margin-left: -1.5px; background: var(--kiku); }
  .row.h .spine::before { background: var(--human); }
  .row.x .spine::before { background: repeating-linear-gradient(180deg, var(--kiku) 0 6px, var(--human) 6px 12px); }
  .row.first .spine::before { top: 14px; }
  .row.last .spine::before { bottom: auto; height: 14px; }
  .node { position: relative; z-index: 1; margin-top: 9px; width: 24px; height: 24px; display: grid; place-items: center; background: var(--sheet); }
  .node .kiku-chip { width: 20px; height: 20px; font-size: 9.5px; }
  .node .g { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink-soft); background: var(--sheet); }
  .node .s { width: 22px; height: 22px; border-radius: 50%; background: var(--human); color: #fff; font-family: var(--round); font-size: 9px; font-weight: 700; display: grid; place-items: center; }
  .node .s svg { width: 13px; height: 13px; }
  .node > svg { width: 15px; height: 15px; }
  .body { padding: 10px 0 12px; min-width: 0; }
  .who { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; display: flex; gap: 10px; align-items: center; }
  .tx { font-size: 14px; line-height: 1.55; max-width: 76ch; }
  .guest .tx { font-family: var(--round); }
  .sysline { font-size: 13px; font-weight: 700; padding: 13px 0 9px; }
  .escalation .sysline { color: var(--esc); }
  .takeover .sysline { color: var(--human-deep); }
  .join .sysline, .end .sysline { color: var(--ink-soft); }
  .kar .body { padding-bottom: 18px; }
  .kar .who { color: var(--ink); font-family: var(--round); margin-bottom: 8px; }
  .impro { color: var(--human-deep); }
  .exact-badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 12px; background: var(--kiku); color: #fff; padding: 1px 8px; font-family: var(--sans); }
  .exact-badge svg { width: 13px; height: 13px; }
  .pct { font-variant-numeric: tabular-nums; font-family: var(--sans); font-weight: 500; color: var(--ink-soft); }
</style>
</head>
<body>
<script>
  const { K, icon, status, dir, mount, braid, SHAPE } = UI;
  const a = K.audit;
  const secs = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const tk = secs(a.takeoverAt), esc = 36;
  const kLines = a.transcript.filter(x => x.karaoke);
  const first = a.specialist.split(" ")[0];
  const last = a.transcript.length - 1;

  /* a lens glyph: how much of Kiku's line was kept, drawn as the rails opening */
  const lensGlyph = (pct, cls = "") => {
    const w = Math.max(18, pct * 0.9), x0 = 50 - w / 2, x1 = 50 + w / 2;
    return `<svg class="${cls}" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 11 H${x0} C${x0 + 5} 11 ${x0 + 3} 2 ${x0 + 9} 2 H${x1 - 9} C${x1 - 3} 2 ${x1 - 5} 11 ${x1} 11 H100" fill="none" stroke="var(--kiku)" stroke-width="2" vector-effect="non-scaling-stroke"/>
      <path d="M0 15 H${x0} C${x0 + 5} 15 ${x0 + 3} 24 ${x0 + 9} 24 H${x1 - 9} C${x1 - 3} 24 ${x1 - 5} 15 ${x1} 15 H100" fill="none" stroke="var(--human)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  };

  let n = 0;
  const rows = a.transcript.map((x, i) => {
    const s = secs(x.t);
    const phase = s > tk ? "h" : s >= esc && s < tk ? "x" : s === tk ? "x" : "";
    const pos = `${i === 0 ? "first" : ""} ${i === last ? "last" : ""}`;
    if (x.speaker === "system") {
      const ic = { escalation: SHAPE.escalated, join: icon("headphones"), takeover: `<span class="s">${icon("hand")}</span>`, end: icon("hangup") }[x.kind];
      const col = { escalation: "var(--esc)", join: "var(--ink-soft)", takeover: "#fff", end: "var(--ink-soft)" }[x.kind];
      return `<div class="row ${phase} ${pos} ${x.kind}"><span class="t">${x.t}</span><span class="spine"><span class="node" style="color:${col}">${ic}</span></span><div class="sysline">${x.text}</div></div>`;
    }
    if (x.speaker === "agent") return `<div class="row ${phase} ${pos}"><span class="t">${x.t}</span><span class="spine"><span class="node"><span class="kiku-chip">K</span></span></span><div class="body"><div class="who">Kiku</div><div class="tx">${x.text}</div></div></div>`;
    if (x.speaker === "guest") return `<div class="row guest ${phase} ${pos}"><span class="t">${x.t}</span><span class="spine"><span class="node"><span class="g"></span></span></span><div class="body"><div class="who">${a.guest}</div><div class="tx">${x.text}</div></div></div>`;
    n++;
    const head = x.asWritten ? `<span class="exact-badge">${icon("check")}Spoken as written</span>` : `<span class="impro">Improvised</span>`;
    return `<div class="row kar ${phase} ${pos}"><span class="t">${x.t}</span><span class="spine"><span class="node"><span class="s">TN</span></span></span><div class="body">
      <div class="who">${a.specialist}<span class="faint" style="font-weight:400;font-family:var(--sans)">karaoke line ${n} of ${kLines.length}</span>${head}<span style="flex:1"></span><span class="pct">${x.match}% of Kiku's words kept</span></div>
      ${braid(x.diff, { who: first })}
    </div></div>`;
  }).join("");

  const outcome = a.outcome.map(o => `<div class="oc ${o.result}">${o.result === "added" ? `<span style="color:var(--ok)">${icon("check")}</span>` : `<span>${icon("x")}</span>`}<span>${o.item}${o.result === "declined" ? ", declined" : ""}</span><span class="amt">${o.amount}</span></div>`).join("");
  const lenses = kLines.map(x => `<div class="${x.asWritten ? "ex" : ""}">${lensGlyph(x.match)}<b>${x.match}%</b><span>${x.t}</span></div>`).join("");

  mount({ role: "specialist", active: "logs", title: `Audit of ${a.id}`, crumb: "Call logs" }, `
    <aside class="dossier">
      <div class="d-sec">
        <div class="gname">${a.guest}</div>
        <div class="chips">${status(a.status)}${dir(a.direction)}<span class="tag">${a.type}</span></div>
      </div>
      <div class="d-sec kv2">
        <div><div class="k">Phone</div><div class="v num">${a.phone}</div></div>
        <div><div class="k">Booking</div><div class="v">${a.booking}</div></div>
        <div class="wide"><div class="k">Stay</div><div class="v">${a.stay}</div></div>
        <div class="wide"><div class="k">Purpose</div><div class="v">${a.purpose}</div></div>
        <div><div class="k">Started</div><div class="v num">${a.started}</div></div>
        <div><div class="k">Length</div><div class="v num">${a.duration}</div></div>
        <div class="wide"><div class="k">Handled by</div><div class="v">Kiku, then ${a.specialist} from ${a.takeoverAt}</div></div>
      </div>
      <div class="d-sec">
        <div class="h2">Karaoke</div>
        <p class="ks"><b>${a.karaokeSummary.lines}</b> lines written for ${first}. <b>${a.karaokeSummary.asWritten}</b> spoken as written, <b>${a.karaokeSummary.improvised}</b> improvised.</p>
        <div class="lenses">${lenses}</div>
      </div>
      <div class="d-sec" style="flex:1">
        <div class="h2">Outcome</div>
        <div style="margin-top:4px">${outcome}</div>
        <div class="total"><span class="small muted">Added to ${a.booking}</span><b>${a.total}</b></div>
        <div class="note">${icon("note")}<span>${a.note}</span></div>
      </div>
    </aside>
    <section class="score">
      <div class="s-head">
        <button class="play" aria-label="Play recording">${icon("play")}</button>
        <span class="ptime"><b>00:00</b> / ${a.duration}</span>
        <div class="legend">
          <span><i style="width:3px;height:16px;background:var(--kiku)"></i>Kiku on the line</span>
          <span><i style="width:3px;height:16px;background:repeating-linear-gradient(180deg,var(--kiku) 0 4px,var(--human) 4px 8px)"></i>Handing over</span>
          <span><i style="width:3px;height:16px;background:var(--human)"></i>${first} on the line</span>
          <span>${lensGlyph(100, "mini-lens")}Words both said</span>
        </div>
        <button class="btn sm">${icon("download")}Recording</button>
      </div>
      <div class="scroll rows">${rows}</div>
    </section>`);
  const pane = document.querySelector(".rows");
  pane.scrollTop = document.querySelector(".row.escalation").offsetTop - pane.offsetTop;
</script>
</body>
</html>
