<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Campaign calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .spread { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 492px; gap: 32px; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: var(--rule); }
  .col-head .aside { margin-left: auto; }
  .camp { padding: 16px 12px 16px 0; border-bottom: 1px solid var(--hair); display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; }
  .camp.sel { background: var(--blue-22); padding-left: 12px; margin: 0 0 0 -12px; }
  .camp .code { display: flex; align-items: baseline; gap: 12px; }
  .camp .code b { font: 600 19px var(--mono); letter-spacing: -.03em; }
  .camp .code span { font-weight: 600; font-size: 15px; }
  .camp .offer { font-size: 14px; grid-column: 1; }
  .camp .meta { grid-column: 1 / -1; display: flex; gap: 18px; font-size: 12.5px; color: var(--moss); flex-wrap: wrap; }
  .camp.sel .meta { color: var(--ink); }
  .camp .meta span { display: inline-flex; gap: 6px; align-items: center; }
  .cst { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; justify-self: end; }
  .cst i { width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 13px; }
  .cst.paused i { background: var(--ink); color: var(--paper); }
  .cst.sched i { border: 1.5px solid var(--ink); }
  .cst.draft i { background: var(--pink); }
  .prog { grid-column: 1 / -1; margin-top: 6px; }
  .pbar { position: relative; height: 16px; border: var(--rule); background: var(--paper); }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; display: block; }
  .pbar .called { background: var(--hair); }
  .pbar .ans { background: var(--ink); }
  .pbar .booked { background: var(--pink); }
  .pnums { display: flex; gap: 16px; margin-top: 7px; font-size: 13px; align-items: center; flex-wrap: wrap; }
  .pnums b { font: 600 13.5px var(--mono); }
  .pnums .k { width: 10px; height: 10px; display: inline-block; margin-right: 5px; }
  .camp .acts { grid-column: 2; grid-row: 2; justify-self: end; align-self: start; }

  .recent { margin-top: 22px; }
  .recent .r { display: grid; grid-template-columns: 50px 1fr auto auto; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--hair); align-items: center; font-size: 13.5px; }
  .recent .r .t { font: 500 12.5px var(--mono); color: var(--moss); }

  .panel { background: var(--paper-2); border: var(--rule); display: flex; flex-direction: column; min-height: 0; margin-bottom: 20px; }
  .panel-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: var(--rule); }
  .panel-head .h2 { font-size: 20px; }
  .panel-head .h2 .mono { text-transform: none; font-size: 18px; font-weight: 600; }
  .panel-head .icon-btn { margin-left: auto; }
  .panel-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 15px; overflow: auto; flex: 1; min-height: 0; }
  .two { display: grid; grid-template-columns: 1fr 150px; gap: 14px; }
  .opening { background: var(--paper); border: var(--rule); padding: 10px 12px; font-size: 14px; line-height: 1.5; }
  .token { font: 500 12.5px var(--mono); background: var(--pink-35); padding: 1px 4px; }
  .errs { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; background: var(--pink-15); padding: 8px 10px; }
  .errs .st-mark { margin-top: 1px; }
  .panel-foot { border-top: var(--rule); padding: 14px 18px; display: flex; gap: 10px; align-items: center; }
  .panel-foot .hint { margin-left: 4px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const { K, esc, ic, mis, status, dir } = Kiku;
  const D = K.campaignDraft;
  const cstatus = (c) => {
    if (c.status.startsWith("Paused")) return `<span class="cst paused">${ic("pause")}${esc(c.status)}</span>`;
    if (c.status.startsWith("Scheduled")) return `<span class="cst sched">${ic("calendar-blank")}${esc(c.status)}</span>`;
    return `<span class="cst draft">${ic("pencil-simple")}${esc(c.status)}</span>`;
  };
  const pct = (n, of) => ((n / of) * 100).toFixed(1) + "%";
  const camps = K.campaigns.map((c) => {
    const sel = c.code === D.code;
    const prog = c.called ? `<div class="prog">
        <div class="pbar" role="img" aria-label="${c.called} of ${c.contacts} contacts called"><i class="called" style="width:${pct(c.called, c.contacts)}"></i><i class="ans" style="width:${pct(c.answered, c.contacts)}"></i><i class="booked" style="width:${pct(c.booked, c.contacts)}"></i></div>
        <div class="pnums"><span><i class="k" style="background:var(--hair)"></i><b>${c.called}</b> called</span><span><i class="k" style="background:var(--ink)"></i><b>${c.answered}</b> answered</span><span><i class="k" style="background:var(--pink)"></i><b>${c.booked}</b> booked</span><span>${ic("x")} <b>${c.failed}</b> failed</span><span class="moss">of <b>${c.contacts}</b> contacts</span></div>
      </div>` : "";
    const act = sel ? `<span class="tag fill">${ic("pencil-simple")}open below</span>`
      : c.called ? `<button class="btn sm">${ic("play")}resume now</button>` : `<button class="btn sm">${ic("pencil-simple")}edit</button>`;
    return `<article class="camp ${sel ? "sel" : ""}">
      <div class="code"><b>${c.code}</b><span>${esc(c.name)}</span></div>
      ${cstatus(c)}
      <div class="offer">${esc(c.offer)}</div>
      <div class="acts">${sel ? "" : act}</div>
      <div class="meta"><span>${ic("file-csv")}<span class="mono">${esc(c.audience)}</span>${c.contacts ? ` · ${c.contacts} contacts` : ""}</span><span>${ic("clock")}${esc(c.window)}</span></div>
      ${prog}
    </article>`;
  }).join("");

  const recent = K.calls.filter((c) => c.type === "Campaign").map((c) => `
    <div class="r"><span class="t">${c.started}</span><span><b style="font-weight:600">${esc(c.guest)}</b> <span class="mono moss" style="font-size:11.5px">${c.promo}</span><br><span class="moss" style="font-size:12.5px">${esc(c.outcome || c.purpose)}</span></span>${status(c.status)}<span class="mono" style="font-size:12.5px">${c.duration}</span></div>`).join("");

  const draftCamp = K.campaigns.find((c) => c.code === D.code);
  const opening = esc(D.opening).replace("{first_name}", `<span class="token">{first_name}</span>`);

  Kiku.shell({
    role: "admin", active: "campaign", html: `
    <header class="page-head">
      ${mis("campaigns")}
      <span class="moss" style="padding-bottom:6px;font-size:14px">Promotional calls, each tied to a promo code</span>
      <div class="head-meta"><button class="btn">${ic("plus")}new campaign</button></div>
    </header>
    <div class="spread">
      <section class="col">
        <div class="col-head"><h2 class="h2">all campaigns</h2><span class="moss" style="font-size:12.5px">${K.campaigns.length}</span></div>
        <div>${camps}</div>
        <div class="recent">
          <div class="col-head"><h2 class="h2">latest campaign calls</h2><a class="aside link" href="03-call-logs.html" style="font-size:13px">call logs ${ic("arrow-right")}</a></div>
          ${recent}
        </div>
      </section>
      <section class="panel" aria-label="Set up ${D.code}">
        <div class="panel-head"><h2 class="h2">set up <span class="mono">${D.code}</span></h2><span class="tag">${esc(draftCamp.status)}</span><button class="icon-btn bare" aria-label="Close">${ic("x")}</button></div>
        <div class="panel-body">
          <div class="two">
            <div class="field"><label>promo code</label><input class="input mono" value="${D.code}"></div>
            <div class="field"><label>max attempts</label><div class="stepper"><button aria-label="Fewer">${ic("minus")}</button><span class="v">${D.maxAttempts}</span><button aria-label="More">${ic("plus")}</button></div></div>
          </div>
          <div class="field"><label>offer</label><input class="input" value="${esc(draftCamp.offer)}"></div>
          <div class="field"><label>audience</label>
            <div class="slip">${ic("file-csv")}<div><div class="slip-name">${esc(D.file)}</div><div class="slip-meta">${D.rows} rows</div></div>
              <div class="counts-line" style="margin-left:auto"><span class="st st-done"><span class="st-mark">${ic("check")}</span><span><b>${D.ready}</b> ready</span></span><span class="st st-esc"><span class="st-mark">${ic("exclamation-mark")}</span><span><b>${D.errors}</b> errors</span></span></div></div>
            <div class="errs"><span class="st st-esc"><span class="st-mark">${ic("exclamation-mark")}</span></span><span>${D.errors} rows can't be called and will be skipped. <a class="link" href="#" style="font-size:13px">review ${D.errors} rows</a></span></div>
            <div class="drop">${ic("upload-simple")}<span>Drop a new CSV here to replace it, or <a class="link" href="#" style="color:var(--ink)">choose a file</a></span></div>
          </div>
          <div class="field"><label>call window</label><div class="select"><span>${esc(D.window)}</span>${ic("caret-down")}</div></div>
          <div class="field"><label>opening line <span class="opt">what Kiku says first</span></label>
            <div class="opening">${opening}</div>
            <span class="hint"><span class="token">{first_name}</span> is filled in for each contact.</span></div>
        </div>
        <div class="panel-foot">
          <button class="btn pink big">${ic("calendar-blank")}schedule campaign</button>
          <button class="btn">save draft</button>
        </div>
      </section>
    </div>`
  });
})();
</script>
</body>
</html>
