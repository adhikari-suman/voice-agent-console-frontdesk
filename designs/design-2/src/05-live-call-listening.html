<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kiku, live call</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .content { padding: 0; display: flex; flex-direction: column; }
  .lhead { background: var(--sheet); border-bottom: 1px solid var(--line); padding: 16px 32px; display: flex; align-items: center; gap: 14px; flex: none; }
  .lhead .gname { font-size: 26px; font-weight: 900; letter-spacing: -0.02em; }
  .timer { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
  .rec { width: 10px; height: 10px; background: var(--fail); border-radius: 50%; animation: blink 1.6s steps(1) infinite; }
  .listen-chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--round); font-weight: 700; font-size: 13px; background: var(--human-tint); color: var(--human-deep); padding: 4px 12px 4px 4px; border-radius: 999px; }
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 20px; padding: 18px 32px 20px; }
  .left { display: flex; flex-direction: column; min-height: 0; background: var(--sheet); border: 1px solid var(--line); }
  .sec-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-bottom: 1px solid var(--line); flex: none; }
  .msgs { flex: 1; padding: 8px 20px 12px; }
  .m { display: grid; grid-template-columns: 44px 28px 1fr; gap: 12px; padding: 9px 0; align-items: start; }
  .m .t { font-size: 12px; color: var(--ink-mute); font-variant-numeric: tabular-nums; padding-top: 4px; }
  .m .who { font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-bottom: 2px; }
  .m .tx { font-size: 14px; line-height: 1.55; max-width: 74ch; }
  .m.guest .tx { font-family: var(--round); }
  .m.latest .tx { font-size: 17px; font-weight: 500; }
  .m.latest { background: var(--paper); margin: 4px -20px 0; padding: 12px 20px; }
  .latest-tag { font-size: 11.5px; color: var(--ink-soft); font-weight: 700; margin-left: 8px; }
  .draft { display: grid; grid-template-columns: 44px 28px 1fr; gap: 12px; padding: 12px 0 4px; align-items: start; }
  .draft .box { border: 1.5px dashed var(--kiku); background: var(--kiku-tint); padding: 10px 14px; font-size: 15px; color: var(--kiku); }
  .draft .state { font-size: 12px; font-weight: 700; color: var(--kiku); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dots { display: inline-flex; gap: 3px; }
  .dots i { width: 5px; height: 5px; background: var(--kiku); display: block; animation: blink 1.2s steps(1) infinite; }
  .dots i:nth-child(2) { animation-delay: .4s; } .dots i:nth-child(3) { animation-delay: .8s; }

  .dock { flex: none; background: var(--ink); color: #fff; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; padding: 16px 20px; }
  .levels { display: grid; grid-template-columns: 64px 1fr; gap: 8px 12px; align-items: center; font-size: 12px; color: #B7CAC3; }
  .lv { display: flex; gap: 3px; height: 22px; align-items: center; }
  .lv i { width: 4px; height: 100%; display: block; transform-origin: center; animation: lvl 1.1s ease-in-out infinite; }
  .lv.g i { background: #fff; border-radius: 2px; }
  .lv.k i { background: #A99CF0; }
  .lv.off i { animation: none; transform: scaleY(.12); background: #48625A; }
  .dock .ctl { display: flex; gap: 10px; align-items: center; }
  .dock .btn.ghost { background: transparent; border-color: #3A5A51; color: #fff; }
  .dock .btn.human { height: 52px; padding: 0 28px; font-size: 16px; }

  .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .card { background: var(--sheet); border: 1px solid var(--line); padding: 16px 18px; }
  .kv { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; margin-top: 10px; font-size: 13.5px; }
  .kv .k { color: var(--ink-mute); font-size: 12.5px; padding-top: 1px; }
  .act { display: grid; grid-template-columns: 22px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .act:last-child { border-bottom: 0; }
  .act .sq { width: 18px; height: 18px; background: var(--ok); color: #fff; display: grid; place-items: center; }
  .act .sq svg { width: 12px; height: 12px; stroke-width: 2.5; }
  .hint-box { font-size: 13px; color: var(--ink-2); line-height: 1.55; }
</style>
</head>
<body>
<script>
  const { K, icon, status, dir, mount } = UI;
  const c = K.liveCall;
  const tr = c.transcript;
  const msgs = tr.map((x, i) => {
    const latest = i === tr.length - 1;
    if (x.speaker === "agent") return `<div class="m agent"><span class="t">${x.t}</span><span class="kiku-chip">K</span><div><div class="who">Kiku</div><div class="tx">${x.text}</div></div></div>`;
    return `<div class="m guest ${latest ? "latest" : ""}"><span class="t">${x.t}</span><span class="avatar sm muted">RK</span><div><div class="who">${c.guest}${latest ? '<span class="latest-tag">Just asked</span>' : ""}</div><div class="tx">${x.text}</div></div></div>`;
  }).join("");
  const bars = (n, seed) => Array.from({ length: n }, (_, i) => `<i style="animation-delay:${((i * seed) % 11) / 10}s;animation-duration:${0.8 + ((i * 7) % 5) / 10}s"></i>`).join("");

  mount({ role: "specialist", active: "live", title: "Live call", crumb: "Live board" }, `
    <div class="lhead">
      <span class="gname">${c.guest}</span>${status(c.status)}${dir(c.direction)}<span class="faint small">${c.id}</span>
      <span style="flex:1"></span>
      <span class="listen-chip"><span class="avatar sm">PR</span>You're listening. The guest can't hear you.</span>
      <span class="timer"><span class="rec" aria-hidden="true"></span>${c.duration}</span>
    </div>
    <div class="body">
      <div class="left">
        <div class="sec-head"><span class="h2">Live transcript <span class="aside">since ${c.started}</span></span><span class="small faint">Kiku is talking with the guest</span></div>
        <div class="scroll msgs">
          ${msgs}
          <div class="draft"><span class="m t" style="font-size:12px;color:var(--ink-mute);padding-top:4px">now</span><span class="kiku-chip">K</span>
            <div><div class="state">${c.agentState}<span class="dots"><i></i><i></i><i></i></span></div><div class="box">${c.agentDraft}</div></div></div>
        </div>
        <div class="dock">
          <div class="levels">
            <span>${c.guest.split(" ")[0]}</span><div class="lv g">${bars(34, 3)}</div>
            <span>Kiku</span><div class="lv k off">${bars(34, 5)}</div>
          </div>
          <div class="ctl">
            <button class="btn ghost pill">${icon("micoff")}Muted</button>
            <button class="btn ghost">${icon("signout")}Leave</button>
            <button class="btn human">${icon("hand")}Take over</button>
          </div>
        </div>
      </div>
      <div class="right">
        <section class="card">
          <div class="h2">Call facts</div>
          <div class="kv">
            <span class="k">Phone</span><span class="num">${c.phone}</span>
            <span class="k">Booking</span><span>${c.booking}</span>
            <span class="k">Stay</span><span>${c.stay}</span>
            <span class="k">Purpose</span><span>${c.purpose}</span>
            <span class="k">Started</span><span class="num">${c.started}, inbound on the hotel line</span>
          </div>
        </section>
        <section class="card">
          <div class="h2">Kiku already did</div>
          <div style="margin-top:6px">${c.actionsTaken.map(a => `<div class="act"><span class="sq">${icon("check")}</span><span>${a}</span></div>`).join("")}</div>
        </section>
        <section class="card" style="flex:1">
          <div class="h2">If you take over</div>
          <p class="hint-box" style="margin-top:8px">Kiku goes quiet and keeps writing the next line for you in karaoke mode. Say it as written or in your own words; both are kept for the audit.</p>
        </section>
      </div>
    </div>`);
  const pane = document.querySelector(".msgs"); pane.scrollTop = pane.scrollHeight;
</script>
</body>
</html>
