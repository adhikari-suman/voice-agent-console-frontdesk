<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Kiku, upsell calls</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .content { display: flex; flex-direction: column; gap: 16px; }
  .offers { display: grid; grid-template-columns: 150px repeat(3, 1fr); background: var(--sheet); border: 1px solid var(--line); flex: none; }
  .offers .lead { padding: 14px 18px; border-right: 1px solid var(--line); }
  .offer { padding: 14px 18px; border-right: 1px solid var(--line-soft); display: grid; grid-template-columns: 36px 1fr; gap: 12px; }
  .offer:last-child { border-right: 0; }
  .offer .ic { width: 36px; height: 36px; background: var(--kiku-tint); color: var(--kiku); display: grid; place-items: center; }
  .offer .n { font-weight: 700; font-size: 15px; }
  .offer .dt { font-size: 12.5px; color: var(--ink-soft); }
  .offer .pr { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .offer .alt { font-weight: 400; color: var(--ink-soft); }
  .paths { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 36px 1.25fr; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match { display: grid; grid-template-columns: 22px 1fr; gap: 10px; background: var(--ok-tint); padding: 10px 12px; font-size: 13.5px; }
  .match .k { font-size: 11.5px; color: var(--ok); font-weight: 700; }
  .toggles { border: 1px solid var(--line); }
  .tg { display: grid; grid-template-columns: 1fr auto 40px; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line-soft); font-size: 13.5px; }
  .tg:last-child { border-bottom: 0; }
  .tg .p { color: var(--ink-soft); font-size: 12.5px; }
  .sw { width: 36px; height: 20px; background: var(--ink); position: relative; }
  .sw::after { content: ""; position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; background: #fff; }
  .sw.off { background: var(--line); }
  .sw.off::after { right: auto; left: 3px; }
  .prev .r { grid-template-columns: 36px 1fr 1fr 1fr; }
</style>
</head>
<body>
<script>
  const { K, icon, mount, SHAPE } = UI;
  const s = K.upsellSingle, u = K.upsellCsv;
  const offIc = { pickup: "call", breakfast: "clock", dinner: "bed" };
  const offIcons = { pickup: '<path d="M5 17h14M6 17l1.5-6h9L18 17M8 11l1-4h6l1 4"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="18" r="1.5"/>', breakfast: '<path d="M4 10h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17M8 3v3M12 3v3"/>', dinner: '<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/>' };
  const offers = K.offers.map(o => `<div class="offer"><span class="ic"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px">${offIcons[o.id]}</svg></span><div><div class="n">${o.name}</div><div class="dt">${o.detail}</div><div class="pr">${o.price}${o.alt ? ` <span class="alt">or accessible vehicle ${o.alt.replace("Accessible vehicle ", "")}</span>` : ""}</div></div></div>`).join("");
  const toggles = K.offers.map(o => `<div class="tg"><span>${o.name}</span><span class="p">${o.price}</span><span class="sw ${s.offers.includes(o.id) ? "" : "off"}" role="switch" aria-checked="true"></span></div>`).join("");
  const sm = (k) => SHAPE[k].replace("<svg", '<svg width="11" height="11"');
  const prev = u.preview.map((r, i) => {
    const gap = i > 0 && r.row - u.preview[i - 1].row > 1 ? `<div class="gap">Rows ${u.preview[i - 1].row + 1}–${r.row - 1} ready</div>` : "";
    return gap + (r.ok
      ? `<div class="r"><span class="faint num">${r.row}</span><span class="num">${r.phone}</span><span>${r.confirmation}</span><span style="display:flex;gap:6px;align-items:center;color:var(--ok)">${sm("completed")}<span style="color:var(--ink)">${r.guest}</span></span></div>`
      : `<div class="r bad"><span class="faint num">${r.row}</span><span class="num">${r.phone || '<span class="faint">empty</span>'}</span><span>${r.confirmation || '<span class="faint">empty</span>'}</span><span class="err">${sm("failed")}${r.error}</span></div>`);
  }).join("") + `<div class="gap">Rows 28–${u.rows} ready</div>`;

  mount({ role: "admin", active: "upsell", title: "Upsell calls", crumb: "Outbound" }, `
    <section class="offers">
      <div class="lead"><div class="h2">Offers</div><p class="small muted" style="margin-top:4px">What Kiku can add to a booking</p></div>
      ${offers}
    </section>
    <div class="paths">
      <section class="pane">
        <div class="pane-head"><span class="path">1</span><span class="t">Call one guest</span></div>
        <div class="pane-body">
          <div class="two">
            <div class="field"><label>Phone</label><div class="input num">${s.phone}</div></div>
            <div class="field"><label>Confirmation number</label><div class="input">${s.confirmation}</div></div>
          </div>
          <div class="match"><span style="color:var(--ok)">${icon("check")}</span><div><div class="k">Booking found</div>${s.match}</div></div>
          <div class="field"><label>Offers to make</label><div class="toggles">${toggles}</div></div>
        </div>
        <div class="pane-foot"><span class="small faint">Kiku calls straight away from the hotel line.</span><span style="flex:1"></span><button class="btn ink">${icon("call")}Call now</button></div>
      </section>
      <div class="or">or</div>
      <section class="pane">
        <div class="pane-head"><span class="path">2</span><span class="t">Call a list</span><span style="flex:1"></span><span class="cols">Columns ${u.columns.map(c => `<span class="col-chip">${c}</span>`).join("")}</span></div>
        <div class="pane-body">
          <div class="filecard"><span class="fic">${icon("file")}</span>
            <div><div class="fname">${u.file} <span class="faint" style="font-weight:400">${u.size}, ${u.rows} rows</span></div>
              <div class="qbar"><span style="width:${u.ready / u.rows * 100}%;background:var(--ok)"></span><span style="width:${u.errors / u.rows * 100}%;background:var(--fail)"></span></div>
              <div class="qlegend"><span style="color:var(--ok)">${sm("completed")}<b class="num">${u.ready}</b>&nbsp;ready</span><span style="color:var(--fail)">${sm("failed")}<b class="num">${u.errors}</b>&nbsp;errors, fix or skip</span></div></div>
            <button class="btn sm">${icon("upload")}Replace</button></div>
          <div class="prev scroll">
            <div class="r h"><span>Row</span><span>Phone</span><span>Confirmation</span><span>Matched booking</span></div>
            ${prev}
          </div>
        </div>
        <div class="pane-foot"><span class="small faint">Same offers as the single call. Rows with errors are skipped.</span><span style="flex:1"></span><button class="btn ink">${icon("call")}Start ${u.ready} calls</button></div>
      </section>
    </div>`);
</script>
</body>
</html>
