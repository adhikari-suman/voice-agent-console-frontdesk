<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Call logs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .filters { display: flex; gap: 12px; align-items: center; padding-bottom: 10px; }
  .filters .seg .st-mark { width: 16px; height: 16px; }
  .filters .seg .on .st-done, .filters .seg .on .st { color: var(--paper); }
  .date { width: 212px; white-space: nowrap; }
  .filters .seg > * { text-transform: none; }
  .page-head { padding-bottom: 10px; }
  .search { width: 290px; }
  .type { width: 150px; }
  .tablewrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  table.logs { table-layout: fixed; }
  .logs td { padding: 4px 10px; font-size: 13px; line-height: 1.28; height: 42px; }
  .logs td.g b { font-weight: 600; font-size: 13.5px; display: block; }
  .logs .ph { font: 400 11.5px var(--mono); color: var(--moss); }
  .logs .id { font: 500 12px var(--mono); }
  .logs .tm { font: 500 12.5px var(--mono); }
  .logs .typ { display: block; padding-left: 21px; font-size: 12.5px; color: var(--moss); }
  .logs .typ .mono { font-size: 11px; color: var(--ink); }
  .logs .pp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .logs .len { font: 500 12.5px var(--mono); text-align: right; }
  .logs .go { text-align: right; }
  .logs .go a { display: inline-grid; place-items: center; width: 26px; height: 26px; background: var(--ink); color: var(--paper); font-size: 14px; }
  .logs thead th { position: sticky; top: 0; background: var(--paper); z-index: 1; }
  .foot { display: flex; align-items: center; gap: 12px; border-top: var(--rule); padding: 8px 0 10px; font-size: 13px; color: var(--moss); }
  .foot .pg { margin-left: auto; display: flex; gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const { K, esc, ic, status, av, mis, clock, specialistOf } = Kiku;
  const s = K.stats;
  const seg = (on, inner) => `<span class="${on ? "on" : ""}">${inner}</span>`;
  const mark = (st) => status(st).replace(/<span>[^<]*<\/span><\/span>$/, "</span>");

  const rows = K.calls.map((c) => {
    const inbound = c.direction === "inbound";
    const sel = c.id === K.audit.id;
    const type = inbound ? "" : `<span class="typ">${esc(c.type)}</span>`;
    return `<tr class="${sel ? "sel" : ""}">
      <td class="tm">${c.started}</td>
      <td class="id">${c.id}</td>
      <td class="g"><b>${esc(c.guest)}</b><span class="ph">${esc(c.phone)}</span></td>
      <td><span class="dir">${ic(inbound ? "phone-incoming" : "phone-outgoing")}${inbound ? "Inbound" : "Outbound"}</span>${type}</td>
      <td><span class="pp">${esc(c.purpose)}</span></td>
      <td>${status(c.status)}</td>
      <td class="len">${c.duration}</td>
      <td>${specialistOf(c)}</td>
      <td class="go">${sel ? `<a href="04-call-audit.html" aria-label="Open audit for ${c.id}">${ic("arrow-right")}</a>` : ""}</td>
    </tr>`;
  }).join("");

  Kiku.shell({
    role: "specialist", active: "logs", html: `
    <header class="page-head">
      ${mis("call logs")}
      <div class="head-meta">
        <div class="select date"><span style="display:flex;gap:8px;align-items:center">${ic("calendar-blank")}Today · <span class="mono">Sun 27 Sep</span></span>${ic("caret-down")}</div>
        <div class="input-wrap search">${ic("magnifying-glass")}<input class="input" placeholder="Search guest, phone or KK- number" aria-label="Search calls"></div>
      </div>
    </header>
    <div class="filters">
      <div class="seg" role="tablist" aria-label="Status">
        ${seg(true, `All <span class="n">${s.callsToday}</span>`)}
        ${seg(false, `${mark("completed")}Completed <span class="n">${s.completed}</span>`)}
        ${seg(false, `${mark("in_progress")}In progress <span class="n">${s.inProgress}</span>`)}
        ${seg(false, `${mark("escalated")}Escalated <span class="n">${s.escalated}</span>`)}
        ${seg(false, `${mark("failed")}Failed <span class="n">${s.failed}</span>`)}
      </div>
      <div class="seg" aria-label="Direction">
        ${seg(true, "Both")}
        ${seg(false, `${ic("phone-incoming")}Inbound <span class="n">${s.inbound}</span>`)}
        ${seg(false, `${ic("phone-outgoing")}Outbound <span class="n">${s.outbound}</span>`)}
      </div>
      <div class="select type" style="height:34px"><span>All types</span>${ic("caret-down")}</div>
    </div>
    <div class="tablewrap">
      <div class="pane" style="flex:1">
        <table class="ruled logs">
          <colgroup><col style="width:58px"><col style="width:92px"><col style="width:168px"><col style="width:128px"><col><col style="width:124px"><col style="width:66px"><col style="width:190px"><col style="width:44px"></colgroup>
          <thead><tr><th>time</th><th>call</th><th>guest</th><th>direction</th><th>purpose</th><th>status</th><th class="num">length</th><th>specialist</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <div class="foot">
        <span>Latest <span class="mono">15</span> of <span class="mono">${s.callsToday}</span> calls today. Select a row to open its audit.</span>
        <div class="pg">
          <button class="btn sm" disabled>${ic("caret-left")}newer</button>
          <button class="btn sm">older${ic("caret-right")}</button>
        </div>
      </div>
    </div>`
  });
})();
</script>
</body>
</html>
