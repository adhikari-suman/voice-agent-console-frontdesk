<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Live now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=block">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .spread { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 372px; gap: 32px; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .needs { padding: 20px 24px 22px; }
  .needs-top { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1.5px solid var(--ink); }
  .needs-top .h2 { font-size: 21px; }
  .wait { margin-left: auto; display: flex; align-items: baseline; gap: 8px; font-weight: 600; font-size: 13.5px; text-transform: lowercase; }
  .wait b { font: 600 34px/1 var(--mono); letter-spacing: -.03em; }
  .needs-body { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding-top: 16px; align-items: end; }
  .guest-name { font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: -.03em; font-stretch: 90%; }
  .needs .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 10px; font-size: 13.5px; }
  .needs .purpose { font-size: 17px; line-height: 1.35; margin-top: 12px; max-width: 46ch; font-weight: 500; }
  .needs .reason { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 13.5px; }
  .needs .reason i { font-size: 16px; }
  .needs .acts { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
  .needs .btn:not(.blue) { background: transparent; }

  .sec-head { display: flex; align-items: baseline; gap: 12px; padding: 26px 0 8px; border-bottom: var(--rule); }
  .sec-head .aside { margin-left: auto; font-size: 12.5px; color: var(--moss); }
  .line-row { display: grid; grid-template-columns: 118px 1fr 52px 58px 142px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--hair); }
  .line-row .nm { font-weight: 700; font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .line-row .nm > .moss { font-weight: 400; font-size: 12.5px; }
  .line-row .nm .mono { font-weight: 400; font-size: 12px; color: var(--moss); }
  .line-row .pp { font-size: 13px; color: var(--moss); margin-top: 3px; line-height: 1.35; }
  .line-row .sub { display: flex; gap: 12px; align-items: center; font-size: 12.5px; margin-top: 4px; }
  .line-row .dur { font: 500 13px var(--mono); text-align: right; }
  .line-row .act { display: flex; justify-content: flex-end; }
  .yours { display: inline-flex; gap: 6px; align-items: center; background: var(--blue-22); padding: 2px 7px; font-size: 12px; font-weight: 600; }
  .yours i { font-size: 13px; }

  .today { padding: 20px 22px 22px; }
  .today .h2 { color: var(--paper); display: flex; justify-content: space-between; align-items: baseline; }
  .today .h2 span { font: 500 12px var(--mono); color: var(--paper); opacity: .75; letter-spacing: 0; text-transform: none; }
  .today p { font-size: 19.5px; line-height: 1.45; letter-spacing: -.01em; margin-top: 12px; }
  .today b { font: 600 18px var(--mono); color: var(--pink); letter-spacing: -.02em; }
  .fin { display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); align-items: start; text-decoration: none; }
  .fin .t { font: 500 12.5px/1.6 var(--mono); color: var(--moss); }
  .fin .g { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .fin .o { font-size: 12.5px; color: var(--moss); line-height: 1.35; margin-top: 2px; }
  .fin .st { font-size: 12.5px; padding-top: 1px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  const { K, esc, ic, status, dir, av, mis, clock } = Kiku;
  const byId = (id) => K.calls.find((c) => c.id === id);
  const owen = K.calls.find((c) => c.status === "escalated" && !c.specialist);
  const s = K.stats;

  const onLine = [
    { c: byId("KK-24030"), note: `<span class="yours">${ic("microphone")}You took over at ${K.takeover.takeoverAt}</span>`, who: ["kiku", "spec"], act: `<a class="btn ink sm" href="06-takeover-karaoke.html">${ic("arrow-u-up-left")}back to call</a>` },
    { c: byId("KK-24031"), note: `<span class="yours">${ic("headphones")}You're listening</span>`, who: ["kiku", "spec"], act: `<a class="btn sm" href="05-live-call-listening.html">${ic("arrow-right")}open call</a>` },
    { c: byId("KK-24029"), note: `<span class="moss">Kiku alone on the call</span>`, who: ["kiku"], act: `<button class="btn sm is-hover">${ic("headphones")}join to listen</button>` },
    { c: byId("KK-24028"), note: `<span class="moss">Kiku alone on the call</span>`, who: ["kiku"], act: `<button class="btn sm">${ic("headphones")}join to listen</button>` },
  ];
  const rows = onLine.map(({ c, note, who, act }) => `
    <div class="line-row">
      <div>${status(c.status)}</div>
      <div>
        <div class="nm">${esc(c.guest)}<span class="mono">${c.id}</span>${note}</div>
        <div class="pp">${esc(c.purpose)}</div>
        <div class="sub">${dir(c)}<span class="mono">${esc(c.phone)}</span></div>
      </div>
      <div class="dur">${c.duration}</div>
      <div class="stack">${who.map((w) => (w === "kiku" ? av("", "kiku", "sm") : av(K.people.specialist.name, "spec", "sm"))).join("")}</div>
      <div class="act">${act}</div>
    </div>`).join("");

  const finished = K.calls.filter((c) => c.status === "completed" || c.status === "failed").slice(0, 7);
  const fin = finished.map((c) => `
    <a class="fin" href="${c.id === K.audit.id ? "04-call-audit.html" : "03-call-logs.html"}">
      <span class="t">${c.started}</span>
      <span><span class="g">${esc(c.guest)}</span><div class="o">${esc(c.outcome || c.purpose)}</div></span>
      ${status(c.status)}
    </a>`).join("");

  Kiku.shell({
    role: "specialist", active: "live", html: `
    <header class="page-head">
      ${mis("live now")}
      <span class="moss" style="padding-bottom:6px;font-size:14px">5 calls on the line, 1 waiting for a specialist</span>
      <div class="head-meta">${clock()}</div>
    </header>
    <div class="spread">
      <div class="col">
        <section class="needs block-pink on-pink" aria-label="Needs a specialist">
          <div class="needs-top">
            <h2 class="h2">needs a specialist</h2><span class="stamp">1</span>
            <span class="wait">waiting <b>${owen.waiting}</b></span>
          </div>
          <div class="needs-body">
            <div>
              <div class="guest-name">${esc(owen.guest)}</div>
              <div class="meta">${status(owen.status)}${dir(owen)}<span class="mono">${esc(owen.phone)}</span><span class="mono">${owen.id}</span><span>on the line <span class="mono">${owen.duration}</span></span></div>
              <p class="purpose">${esc(owen.purpose)}</p>
              <p class="reason">${ic("warning")}<span>${esc(owen.escalationReason)} Kiku is holding the line.</span></p>
            </div>
            <div class="acts">
              <button class="btn blue">${ic("hand-grabbing")}take over</button>
              <button class="btn">${ic("headphones")}listen first</button>
            </div>
          </div>
        </section>
        <div class="sec-head"><h2 class="h2">on the line</h2><span class="moss" style="font-size:12.5px">4 calls</span><span class="aside">yours first</span></div>
        <div class="pane">${rows}</div>
      </div>
      <aside class="col">
        <section class="today block-ink" aria-label="Today">
          <h2 class="h2">today so far <span>${esc(K.hotel.now)} ${esc(K.hotel.tz)}</span></h2>
          <p><b>${s.callsToday}</b> calls, <b>${s.inbound}</b> in and <b>${s.outbound}</b> out. <b>${s.completed}</b> completed, <b>${s.inProgress}</b> in progress, <b>${s.escalated}</b> escalated and <b>${s.failed}</b> failed. Specialists took over <b>${s.takeoversToday}</b> times; calls took <b>${s.avgHandle}</b> on average. Upsells added <b>${s.upsellValueToday}</b> to bookings.</p>
        </section>
        <div class="sec-head" style="padding-top:22px"><h2 class="h2">just finished</h2><a class="aside link" href="03-call-logs.html" style="color:var(--ink)">call logs ${ic("arrow-right")}</a></div>
        <div class="pane">${fin}</div>
      </aside>
    </div>`
  });
})();
</script>
</body>
</html>
