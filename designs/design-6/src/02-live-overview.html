<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku, live board</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
  .page { height: 100%; display: grid; grid-template-rows: auto auto 1fr; }
  .today { font-size: 14px; color: var(--ink-2); max-width: 820px; line-height: 1.5; padding: 0 28px 16px; margin-top: -6px; }
  .today b { color: var(--ink); font-weight: 600; }
  .board { display: grid; grid-template-columns: 500px 1fr 1fr; grid-template-rows: auto auto; gap: 12px; padding: 0 28px; }
  .tile { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
  .tile .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tile .nm { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .tile .id { font-size: 12px; color: var(--ink-3); }
  .tile > div:has(.chip) { margin-bottom: 4px; }
  .tile .pu { font-family: var(--serif); font-size: 15px; line-height: 1.4; color: var(--ink); }
  .tile .foot { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .tile .foot .who { font-size: 12.5px; margin-right: auto; display: inline-flex; gap: 6px; align-items: center; color: var(--ink-3); }
  .tile .foot .who svg.lucide { width: 14px; height: 14px; }
  .tile.mine { background: var(--human-soft); border-color: #b5dde4; }
  .lead { grid-row: 1 / 3; background: var(--warn-soft); border-color: #efcf9f; padding: 22px 24px; gap: 14px; }
  .lead .wait { display: flex; align-items: baseline; gap: 10px; }
  .lead .wait b { font-size: 56px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: var(--warn); font-variant-numeric: tabular-nums; }
  .lead .wait span { color: var(--ink-2); font-size: 13px; line-height: 1.3; }
  .lead .nm { font-size: 24px; }
  .lead .pu { font-size: 18px; }
  .lead .why { display: flex; gap: 8px; font-size: 13px; color: var(--warn); font-weight: 500; }
  .lead .why svg.lucide { margin-top: 1px; }
  .lead .acts { display: flex; gap: 8px; margin-top: 6px; }
  .lead .acts .btn.human { flex: 1; }
  .dur { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-2); }

  .recent { margin: 16px 28px 16px; display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .recent-h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 8px; }
  .recent-h a { color: var(--kiku); font-size: 12.5px; font-weight: 500; text-decoration: none; }
  .fin { display: grid; grid-template-columns: 60px 180px 120px 1fr 150px; gap: 14px; align-items: center; padding: 8px 14px; font-size: 13px; text-decoration: none; color: inherit; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  .fin + .fin { margin-top: 6px; }
  .fin .g { font-weight: 500; }
  .fin .o { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<script>
const S = K.stats;
const live = K.calls.filter(c => c.status === "in_progress" || c.status === "escalated");
const lead = live.find(c => c.status === "escalated" && !c.specialist);
const others = live.filter(c => c !== lead);
function who(c) {
  if (c.specialist === "Priya Raman") return `<span class="who who-h">${ic("mic")}You took over</span>`;
  if (c.specialist) return `<span class="who" style="color:var(--kiku)">${ic("headphones")}You're listening</span>`;
  return `<span class="who">${ic("audio-lines")}Kiku alone</span>`;
}
function acts(c) {
  if (c.specialist === "Priya Raman") return `<a class="btn sm human" href="06-takeover-karaoke.html">${ic("mic")}Back to call</a>`;
  if (c.specialist) return `<a class="btn sm" href="05-live-call-listening.html">${ic("headphones")}Open</a><button class="btn sm">${ic("mic")}Join</button>`;
  return `<button class="btn sm">${ic("headphones")}Listen</button><button class="btn sm">${ic("mic")}Join</button>`;
}
const tiles = others.map(c => `
  <article class="tile ${c.specialist === "Priya Raman" ? "mine" : ""}">
    <div class="top">${status(c.status)}<span class="dur">${c.duration}</span></div>
    <div><div class="nm">${c.guest}</div><div class="id">${c.id}, ${c.phone}</div></div>
    <p class="pu">${c.purpose}</p>
    <div>${c.direction === "inbound" ? dirChip(c) : typeChip(c)}</div>
    <div class="foot">${who(c)}${acts(c)}</div>
  </article>`).join("");
const fin = K.calls.filter(c => c.status === "completed" || c.status === "failed").slice(0, 5).map(c => `
  <a class="fin" href="${c.id === "KK-24027" ? "04-call-audit.html" : "03-call-logs.html"}">
    <span class="muted">${c.started}</span><span class="g">${c.guest}</span>${status(c.status)}<span class="o">${c.outcome}</span><span class="muted" style="text-align:right">${c.type}${c.specialist ? `, ${c.specialist.split(" ")[0]}` : ""}</span>
  </a>`).join("");

shell("specialist", "live", `
<div class="page">
  <div>
    <div class="ph"><h1>Live now</h1><span class="sub">${live.length} calls on the line at ${K.hotel.now}</span></div>
    <p class="today">Today Kiku has handled <b>${S.callsToday} calls</b>, ${S.inbound} in and ${S.outbound} out: <b>${S.completed}</b> completed, <b>${S.inProgress}</b> in progress, <b>${S.escalated}</b> escalated, <b>${S.failed}</b> failed. Specialists took over <b>${S.takeoversToday}</b> times, calls average <b>${S.avgHandle}</b>, and upsells added <b>${S.upsellValueToday}</b>.</p>
  </div>
  <div class="board">
    <article class="tile lead" aria-label="Needs a specialist">
      <div class="top">${status("escalated", "Needs a specialist")}<span class="dur">${lead.id}</span></div>
      <div class="wait"><b>${lead.waiting}</b><span>waiting for<br>a specialist</span></div>
      <div><div class="nm">${lead.guest}</div><div class="id">${lead.phone}, on the line ${lead.duration}</div></div>
      <p class="pu">${lead.purpose}</p>
      <div class="why">${ic("shield-alert")}${lead.escalationReason}</div>
      <div>${dirChip(lead)}</div>
      <div class="acts"><button class="btn lg human">${ic("mic")}Take over</button><button class="btn lg">${ic("headphones")}Listen first</button></div>
    </article>
    ${tiles}
  </div>
  <section class="recent">
    <div class="recent-h"><h2>Recently finished</h2><a href="03-call-logs.html">All call logs</a></div>
    <div class="scroll">${fin}</div>
  </section>
</div>`);
finish();
</script>
</body>
</html>
