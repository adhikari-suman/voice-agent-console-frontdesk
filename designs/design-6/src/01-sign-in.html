<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">

<body>
<script>
(() => {
  const { K, ic, esc, pad, live } = Kiku;
  const keys = [1, 2, 3, 4, 5].map(n => `<span class="si-key"><span class="mono">CH ${pad(n)}</span><i></i></span>`).join('');
  document.body.innerHTML = `
  <div class="si">
    <aside class="si-booth">
      <div class="brand" style="padding:0;height:auto">
        <svg width="36" height="36" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="6" fill="#1B3F8F"/><rect x="6" y="9" width="18" height="4" rx="1.5" fill="#3D7BFF"/><rect x="6" y="17" width="12" height="4" rx="1.5" fill="#F2A900"/></svg>
        <span class="brand-name" style="font-size:28px">Kiku</span>
      </div>
      <div class="si-hotel">
        <p class="si-h">${esc(K.hotel.name)}, ${esc(K.hotel.city)}</p>
        <p class="si-line">${ic('call')}<span>Hotel line</span><span class="mono">${esc(K.hotel.line)}</span></p>
        <div class="si-keys" aria-hidden="true">${keys}</div>
        <p class="si-off">${ic('mic_off')}Channels open once you sign in</p>
      </div>
    </aside>
    <main class="si-main">
      <form class="si-form" onsubmit="return false">
        <h1>Sign in to Kiku</h1>
        <p class="muted" style="margin-top:6px">${esc(K.hotel.name)}, ${esc(K.hotel.city)}</p>
        <div class="field" style="margin-top:28px">
          <label for="em">Work email</label>
          <input class="input" id="em" type="email" autocomplete="username" value="${esc(K.people.specialist.email)}">
        </div>
        <div class="field" style="margin-top:18px">
          <div class="flabel" style="justify-content:space-between"><label for="pw">Password</label><a class="lnk" href="#" style="font-size:13px;font-weight:700">Forgot password?</a></div>
          <input class="input is-focus" id="pw" type="password" autocomplete="current-password" value="brenlowdesk" style="border-color:var(--booth)">
        </div>
        <button class="btn btn-pri btn-lg" style="width:100%;margin-top:26px">${ic('login')}Sign in</button>
        <p class="hint" style="margin-top:14px">Admins and specialists sign in here. Your role decides what you see.</p>
      </form>
      <p class="si-foot">${ic('info')}${esc(K.synthetic)}</p>
    </main>
  </div>`;
})();
</script>
</body>
