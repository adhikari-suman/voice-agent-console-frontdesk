<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>On mic: Margaret Doyle · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, st, key, chNum, lane, vu, first, transcript, wrote, said } = Kiku;
  const t = K.takeover;
  const ch = chNum(t.id);
  const me = first(t.specialist);
  const liveTurn = t.transcript.find(e => e.live);
  const before = t.transcript.filter(e => !e.live);
  const ev = k => t.transcript.find(e => e.kind === k);

  const con = Kiku.consoleBar({
    ch: t.id, live: true,
    monitorLabel: `Levels · CH ${ch}`,
    monitor: vu('You', 'interp', 10) + vu('Guest', 'guest', 2),
    relay: `<div class="relay"><span class="relay-k is-on">${ic('subtitles')}</span><span class="relay-t"><b>Kiku’s script · on</b><span>Next line queued</span></span></div>`,
    mic: `<button class="mic is-live" aria-pressed="true">${ic('mic')}<b>MIC ON</b><small>Press to mute</small></button>`,
    hand: `<button class="btn btn-dk">${ic('undo')}Hand back to Kiku</button><button class="btn btn-dk btn-end">${ic('call_end')}End call</button>`,
  });

  const desk = Kiku.shell({
    role: 'Specialist', nav: 'live', ch: t.id, micLive: true, console: con,
    title: esc(t.guest), deskClass: 'tight',
    after: `<span class="lamp lamp-ch is-mic">CH ${ch}</span>${st(t.status, 'on-dark')}<span class="strip-id">On call <span class="mono">${t.duration}</span></span>`,
    right: `<span class="lamp lamp-mic">${ic('mic')}You’re on the line</span><span class="sep"></span>`,
  });

  const nextLine = `<div class="prm-row"><span class="prm-t">Next</span>${lane('ln-next', 'Floor', 'Kiku queued', esc(t.nextLine))}</div>`;

  desk.innerHTML = `
    <div class="tk">
      <div class="col tk-main">
        <section class="panel txp tk-hist" aria-labelledby="hs">
          <div class="ph ph-c"><h2 id="hs">Call so far</h2><div class="ph-r">${Kiku.legend(me)}</div></div>
          <div class="scroll txs">${transcript(before, { guest: t.guest, spec: me })}</div>
        </section>
        <section class="panel prm" aria-labelledby="pr">
          <div class="ph ph-c prm-h"><h2 id="pr">Prompter</h2><span class="ph-sub">Kiku writes the line. You say it your way.</span>
            <div class="ph-r"><span class="onair">${ic('mic', 'fill')}Live · ${esc(t.guest)} can hear you</span></div></div>
          <div class="prm-b">
            <div class="prm-row"><span class="prm-t mono">${liveTurn.t}</span>${lane('ln-floor ln-wrote prm-ln', 'Floor', 'Kiku wrote', wrote(liveTurn.diff, true))}</div>
            <div class="prm-row"><span class="prm-t prm-live">${ic('mic', 'fill')}Now</span>${lane('ln-interp prm-ln is-live', 'Interpretation', `${esc(me)} · speaking`, said(liveTurn.diff, true), `<b>${liveTurn.match}%</b> match so far`)}</div>
            ${nextLine}
          </div>
        </section>
      </div>
      <div class="col">
        <section class="panel" aria-labelledby="es">
          <div class="ph ph-c need-h">${key('back_hand', 'esc')}<h2 id="es">Escalation</h2></div>
          <div class="pb">
            <p class="esc-r">${esc(t.escalationReason)}</p>
            <ol class="steps">
              <li><span class="mono">${ev('escalation').t}</span>${key('back_hand', 'esc')}Kiku escalated</li>
              <li><span class="mono">${ev('join').t}</span>${key('headphones', 'booth')}You joined to listen</li>
              <li><span class="mono">${ev('takeover').t}</span>${key('mic', 'mic')}You took over</li>
            </ol>
          </div>
        </section>
        <section class="panel tk-bk" aria-labelledby="bf">
          <div class="ph ph-c"><h2 id="bf">Booking</h2><span class="ph-r code">${t.booking}</span></div>
          <div class="pb">
            <ul class="facts">${t.facts.map((f, i) => `<li>${ic(['payments', 'lock_clock', 'credit_card'][i] || 'info')}<span>${esc(f)}</span></li>`).join('')}</ul>
            <div class="divh"></div>
            <dl class="dl">
              <dt>Stay</dt><dd>${esc(t.stay)}</dd>
              <dt>Phone</dt><dd class="mono">${esc(t.phone)}</dd>
              <dt>Purpose</dt><dd>${esc(t.purpose)}</dd>
              <dt>Call ID</dt><dd class="mono">${t.id}</dd>
            </dl>
          </div>
        </section>
      </div>
    </div>`;
  const panel = desk.querySelector('.tk-hist'), pane = panel.querySelector('.txs'), prm = desk.querySelector('.prm');
  Kiku.afterFonts(() => {
    const pb = prm.querySelector('.prm-b');
    panel.style.flex = ''; panel.style.height = ''; prm.style.flex = ''; pb.style.gap = ''; pb.style.paddingTop = '';
    const rows = [...pane.querySelectorAll('.tx > *')];
    const last = rows[rows.length - 1];
    const bottom = last.offsetTop + last.offsetHeight;
    const pad = 20, avail = pane.clientHeight - pad, panelH = panel.offsetHeight;
    const top = rows.find(r => bottom - r.offsetTop <= avail) || last;
    const spare = avail - (bottom - top.offsetTop);
    panel.style.flex = 'none'; panel.style.height = (panelH - spare) + 'px';
    prm.style.flex = '1';
    const g = Math.floor(spare / 3);
    pb.style.gap = (8 + g) + 'px'; pb.style.paddingTop = (12 + g) + 'px';
    pane.scrollTop = top.offsetTop - 6;
  });
})();
</script>
</body>
</html>
