<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku, make a call</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
  .page { height: 100%; display: grid; grid-template-rows: auto auto; align-content: center; max-width: 1360px; margin: 0 auto; padding-bottom: 12px; }
  .split { display: grid; grid-template-columns: 1fr 56px 1.25fr; align-content: start; padding: 0 28px 16px; min-height: 0; }
  .or { display: grid; grid-template-rows: 1fr auto 1fr; justify-items: center; }
  .or::before, .or::after { content: ""; width: 1px; background: var(--line); }
  .or span { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--ground); display: grid; place-items: center; font-size: 12px; color: var(--ink-3); margin: 8px 0; }
  .pane { display: grid; grid-template-rows: auto auto auto; align-content: start; min-height: 0; }
  .pane-h { display: flex; align-items: baseline; gap: 10px; padding-bottom: 12px; }
  .pane-h h2 { font-size: 18px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: grid; gap: 16px; align-content: start; min-height: 0; overflow: hidden; }
  .pane-f { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 12px; }
  .pane-f .sum { margin-right: auto; font-size: 13px; color: var(--ink-2); }
  textarea.purpose { font-family: var(--serif); font-size: 18px; line-height: 1.55; }
  .brief { display: flex; gap: 10px; background: var(--kiku-soft); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--kiku-deep); }
  .brief svg.lucide { margin-top: 2px; }
  .tmpl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .tmpl code { font-family: var(--sans); font-weight: 600; color: var(--ink); background: var(--sheet-2); border: 1px solid var(--line); padding: 0 6px; border-radius: 4px; }
  .tmpl a { margin-left: auto; color: var(--kiku); font-weight: 500; text-decoration: none; display: inline-flex; gap: 5px; align-items: center; }
  .file { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; }
  .file .fi { width: 34px; height: 40px; border-radius: 4px; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); }
  .file .counts { display: flex; gap: 12px; font-size: 12.5px; }
  .okc { color: var(--ok); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
  .badc { color: var(--fail); font-weight: 500; display: inline-flex; gap: 4px; align-items: center; }
  .okc svg.lucide, .badc svg.lucide { width: 13px; height: 13px; }
  .pr-row { display: grid; grid-template-columns: 34px 146px 100px 1fr 18px; gap: 10px; align-items: start; padding: 9px 0; font-size: 13px; border-top: 1px solid var(--line-2); }
  .pr-row.h { font-size: 12px; color: var(--ink-3); border-top: 0; padding-top: 0; }
  .pr-row .rn { color: var(--ink-3); }
  .pr-row .pp { font-family: var(--serif); font-size: 14px; line-height: 1.4; }
  .pr-row.err { background: var(--fail-soft); margin: 0 -20px; padding: 9px 20px; }
  .pr-row.err .rn { color: var(--fail); font-weight: 600; }
  .pr-row svg.lucide { width: 15px; height: 15px; }
  .gap { font-size: 12px; color: var(--ink-3); padding: 5px 0; border-top: 1px dashed var(--line); }
  .missing { color: var(--fail); font-style: italic; }
  .noname { color: var(--ink-3); font-style: italic; }
</style>
</head>
<body>
<script>
const M = K.makeCallSingle, V = K.makeCallCsv;
let rows = "", last = 0;
V.preview.forEach(r => {
  if (r.row - last > 1) rows += `<div class="gap">Row ${last + 1} ready</div>`;
  last = r.row;
  rows += `<div class="pr-row ${r.ok ? "" : "err"}"><span class="rn">${r.row}</span><span>${r.phone || '<span class="missing">empty</span>'}</span><span>${r.name || '<span class="noname">No name</span>'}</span><span><span class="pp">${r.purpose}</span>${r.ok ? "" : `<br><span class="badc">${ic("circle-x")}${r.error}</span>`}</span><span style="color:${r.ok ? "var(--ok)" : "var(--fail)"}">${ic(r.ok ? "circle-check" : "circle-x")}</span></div>`;
});
if (last < V.rows) rows += `<div class="gap">Rows ${last + 1}–${V.rows} ready</div>`;

shell("admin", "make", `
<div class="page">
  <div class="ph"><h1>Make a call</h1><span class="sub">Tell Kiku who to call and why. It places the call and logs the outcome.</span></div>
  <div class="split">
    <section class="pane">
      <div class="pane-h"><h2>One call</h2><span class="sub">Kiku calls straight away</span></div>
      <div class="card">
        <div class="field"><label for="pu">What the call is for</label><textarea id="pu" class="input purpose" rows="4">${M.purpose}</textarea><span class="hint">Brief Kiku the way you'd brief a colleague.</span></div>
        <div class="field"><label for="nm">Name <span class="opt">Optional</span></label><span class="input">${ic("user")}<input id="nm" value="${M.name}"></span></div>
        <div class="field"><label for="ph">Phone</label><span class="input">${ic("phone")}<input id="ph" value="${M.phone}"></span></div>
      </div>
      <div class="pane-f"><span class="sum">Calling ${M.name}</span><button class="btn primary">${ic("phone-outgoing")}Place call</button></div>
    </section>
    <div class="or" aria-hidden="true"><span>or</span></div>
    <section class="pane">
      <div class="pane-h"><h2>Many calls from CSV</h2><span class="sub">One row per call</span></div>
      <div class="card">
        <div class="tmpl">${ic("table")}Columns ${V.columns.map(c => `<code>${c}</code>`).join("")}<a href="#">${ic("download")}Download template</a></div>
        <div class="file"><span class="fi">${ic("file-spreadsheet")}</span><div><b style="font-weight:500">${V.file}</b> <span class="cap">${V.size}</span><div class="counts"><span class="muted">${V.rows} rows</span><span class="okc">${ic("circle-check")}${V.ready} ready</span><span class="badc">${ic("circle-x")}${V.errors} error</span></div></div><button class="btn sm">${ic("refresh-cw")}Replace file</button></div>
        <div><div class="pr-row h"><span>Row</span><span>Phone</span><span>Name</span><span>What the call is for</span><span></span></div>${rows}</div>
      </div>
      <div class="pane-f"><span class="sum">Row ${V.preview.find(r => !r.ok).row} is skipped until it has a phone number</span><button class="btn primary">${ic("phone-outgoing")}Start ${V.ready} calls</button></div>
    </section>
  </div>
</div>`);
finish();
</script>
</body>
</html>
