<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Make a call · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, key, fileChip, meter } = Kiku;
  const one = K.makeCallSingle, csv = K.makeCallCsv;
  const desk = Kiku.shell({ role: 'Admin', nav: 'make', title: 'Make a call', after: `<span class="strip-id">Kiku calls anyone, for a purpose you describe</span>` });

  const prev = csv.preview.map(r => r.ok
    ? `<tr><td class="mono">${r.row}</td><td class="mono nowrap">${esc(r.phone)}</td><td>${r.name ? esc(r.name) : '<span class="nil">No name</span>'}</td><td class="pp">${esc(r.purpose)}</td><td><span class="okc">${ic('check_circle')}Ready</span></td></tr>`
    : `<tr class="is-err"><td class="mono">${r.row}</td><td><span class="nil">empty</span></td><td>${esc(r.name)}</td><td class="pp">${esc(r.purpose)}</td><td><span class="err">${ic('error')}<span>${esc(r.error)}<span class="err-x">Add a number for ${esc(r.name.split(' ')[0])}, or delete the row.</span></span></span></td></tr>`).join('');

  desk.innerHTML = `
    <div class="paths mk">
      <section class="panel path" aria-labelledby="p1">
        <div class="ph"><span class="path-k">${ic('call')}</span><h2 id="p1">One call</h2><span class="ph-sub">Kiku calls now</span></div>
        <div class="path-b">
          <div class="field"><label for="pu">Purpose</label>
            <textarea class="textarea" id="pu" rows="4">${esc(one.purpose)}</textarea>
            <span class="hint">Say what the call is for and what you need back. Kiku works from this.</span></div>
          <div class="field"><label for="nm">Name <span class="opt">(optional)</span></label><input class="input" id="nm" value="${esc(one.name)}"><span class="hint">Kiku asks for this person by name</span></div>
          <div class="field"><label for="pn">Phone</label><input class="input mono" id="pn" value="${esc(one.phone)}"></div>
        </div>
        <div class="path-f"><span class="hint">Kiku rings <span class="mono">${esc(one.phone)}</span> straight away</span><button class="btn btn-pri">${ic('call')}Place call</button></div>
      </section>
      <section class="panel path" aria-labelledby="p2">
        <div class="ph"><span class="path-k">${ic('table_rows')}</span><h2 id="p2">Many calls</h2><span class="ph-sub">CSV upload</span>
          <div class="ph-r"><a class="lnk small" href="#">${ic('download')}Download CSV template</a></div></div>
        <div class="path-b">
          <div class="cols">Columns ${csv.columns.map(c => `<span class="col-chip">${esc(c)}</span>`).join('')}<span>· one call per row, purpose in plain words</span></div>
          <div class="drop">
            ${fileChip(csv.file, `${esc(csv.size)} · <span class="mono">${csv.rows}</span> rows`, `<button class="btn btn-ghost btn-sm">${ic('sync')}Replace</button><button class="icb" aria-label="Remove file">${ic('close')}</button>`)}
          </div>
          ${meter(csv.ready, csv.errors)}
          <div class="prev">
            <table class="tbl">
              <colgroup><col style="width:46px"><col style="width:152px"><col style="width:112px"><col><col style="width:176px"></colgroup>
              <thead><tr><th>Row</th><th>phone</th><th>name</th><th>purpose</th><th>Check</th></tr></thead>
              <tbody>${prev}</tbody>
            </table>
            <p class="prev-more">Showing ${csv.preview.length} of ${csv.rows} rows, including the row with an error.</p>
          </div>
        </div>
        <div class="path-f"><span class="hint" style="margin-left:auto"><span class="mono">${csv.errors}</span> row skipped</span><button class="btn btn-pri">${ic('call')}Start ${csv.ready} calls</button></div>
      </section>
    </div>`;
})();
</script>
</body>
</html>
