<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Campaign calls · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, key, fileChip, meter } = Kiku;
  const d = K.campaignDraft;
  const draftC = K.campaigns.find(c => c.code === d.code);
  const desk = Kiku.shell({ role: 'Admin', nav: 'campaign', title: 'Campaign calls', after: `<span class="strip-id">Promotional calls, each tied to a promo code</span>` });

  const cst = s => /^Paused/.test(s) ? key('pause', 'quiet') : /^Scheduled/.test(s) ? key('schedule', 'booth') : key('edit', 'quiet');
  const list = K.campaigns.map(c => {
    const sel = c.code === d.code;
    const started = c.contacts > 0 && c.called > 0;
    const prog = c.contacts
      ? `<div class="cp-prog"><div class="bar" role="img" aria-label="${c.called} of ${c.contacts} called"><i style="width:${(c.called / c.contacts * 100).toFixed(1)}%"></i></div><span><b class="mono">${c.called}</b> of <b class="mono">${c.contacts}</b> called</span></div>`
      : '';
    const nums = started ? `<div class="cp-n"><span><b class="mono">${c.answered}</b> answered</span><span><b class="mono">${c.booked}</b> booked</span><span><b class="mono">${c.failed}</b> failed</span></div>` : '';
    const act = /^Paused/.test(c.status) ? `<button class="btn btn-sec btn-sm">${ic('play_arrow')}Resume now</button>`
      : /^Scheduled/.test(c.status) ? `<button class="btn btn-sec btn-sm">${ic('edit')}Edit</button>`
      : `<span class="editing">${ic('edit_note')}Open below</span>`;
    return `<article class="cp${sel ? ' is-sel' : ''}"${sel ? ' aria-current="true"' : ''}>
      <div class="cp-1"><span class="code">${c.code}</span><b>${esc(c.name)}</b></div>
      <div class="cp-st">${cst(c.status)}<span>${esc(c.status)}</span><span class="cp-a">${act}</span></div>
      <p class="cp-o">${esc(c.offer)}</p>
      ${prog}${nums}
      <div class="cp-f"><span class="cp-m">${ic('description')}<span class="${c.contacts ? 'mono' : ''}">${esc(c.audience)}</span></span><span class="cp-m">${ic('schedule')}${esc(c.window)}</span></div>
    </article>`;
  }).join('');

  const opening = esc(d.opening).replace('{first_name}', '<span class="tok">{first_name}</span>');
  const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((x, i) => `<button class="${i < 5 ? 'is-on' : ''}" aria-pressed="${i < 5}">${x}</button>`).join('');
  const [from, to] = d.window.split(', ')[1].split('–');

  desk.innerHTML = `
    <div class="cps">
      <section class="panel cpl" aria-labelledby="cl">
        <div class="ph"><h2 id="cl">Campaigns</h2><span class="ph-sub">${K.campaigns.length}</span><div class="ph-r"><button class="btn btn-sec btn-sm">${ic('add')}New campaign</button></div></div>
        <div class="cp-list">${list}</div>
      </section>
      <section class="panel cpf" aria-labelledby="cf">
        <div class="ph"><span class="code">${d.code}</span><h2 id="cf">${esc(draftC.name)}</h2><span class="st">${key('edit', 'quiet')}<span class="st-l">${esc(draftC.status)}</span></span></div>
        <div class="cpf-b">
          <div class="row2">
            <div class="field"><label for="cn">Campaign name</label><input class="input" id="cn" value="${esc(draftC.name)}"></div>
            <div class="field"><label for="pc">Promo code</label><input class="input mono" id="pc" value="${d.code}"></div>
          </div>
          <div class="field"><label for="of">Offer</label><input class="input" id="of" value="${esc(draftC.offer)}"></div>
          <div class="field">
            <span class="flabel">Audience</span>
            <div class="drop">
              ${fileChip(d.file, `<span class="mono">${d.rows}</span> rows · uploaded just now`, `<button class="btn btn-ghost btn-sm">${ic('sync')}Replace</button><button class="icb" aria-label="Remove file">${ic('close')}</button>`)}
              <div class="drop-h">${ic('upload_file')}Drop a new CSV here to replace it</div>
            </div>
            ${meter(d.ready, d.errors)}
            <p class="hint">${d.errors} rows have problems and won’t be called. <a class="lnk" href="#">${ic('download')}Download the ${d.errors} rows</a> to fix them, then upload again.</p>
          </div>
          <div class="cpf-3">
            <div class="field"><span class="flabel">Call window <span class="opt">hotel time, ${K.hotel.tz}</span></span>
              <div class="win"><div class="daykeys" role="group" aria-label="Days">${days}</div>
              <span class="win-t"><input class="input mono" value="${from}" aria-label="From"><span>to</span><input class="input mono" value="${to}" aria-label="To"></span></div></div>
            <div class="field"><span class="flabel">Max attempts <span class="opt">per contact</span></span><span class="stepper"><button aria-label="Fewer">${ic('remove')}</button><span>${d.maxAttempts}</span><button aria-label="More">${ic('add')}</button></span></div>
          </div>
          <div class="field"><label>Opening line</label>
            <div class="textarea opening" role="textbox" aria-multiline="true">${opening}</div>
            <span class="hint">Kiku opens every call with this. <span class="tok tok-sm">{first_name}</span> is filled from the CSV.</span>
          </div>
        </div>
        <div class="cpf-f">
          <span class="muted small"><b class="mono" style="color:var(--ink)">${d.ready}</b> contacts · ${esc(d.window)} · up to <span class="mono">${d.maxAttempts}</span> attempts</span>
          <span class="ph-r"><button class="btn btn-sec">Save draft</button><button class="btn btn-pri">${ic('event_available')}Schedule campaign</button></span>
        </div>
      </section>
    </div>`;
})();
</script>
</body>
</html>
