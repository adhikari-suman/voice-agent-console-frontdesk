<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Upsell calls · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, key, fileChip, meter, toggle } = Kiku;
  const one = K.upsellSingle, csv = K.upsellCsv;
  const desk = Kiku.shell({ role: 'Admin', nav: 'upsell', title: 'Upsell calls', after: `<span class="strip-id">Kiku calls guests with a booking and offers extras</span>` });

  const rate = K.offers.map(o => `<div class="rate-i"><b>${esc(o.name)}</b><span class="muted">${esc(o.detail)}</span><span class="rate-p mono">${esc(o.price)}${o.alt ? `<span class="rate-alt">${esc(o.alt)}</span>` : ''}</span></div>`).join('');
  const offerRows = K.offers.map(o => { const on = one.offers.includes(o.id); return `<li>${toggle(on, o.name)}<span class="ofr-t"><b>${esc(o.name)}</b><span>${esc(o.detail)}</span></span><span class="mono ofr-p">${esc(o.price.split(' ')[0])}</span></li>`; }).join('');
  const offerKeys = K.offers.map(o => `<label class="okey is-on">${toggle(true, o.name)}${esc(o.name)}</label>`).join('');

  const prev = csv.preview.map(r => r.ok
    ? `<tr><td class="mono">${r.row}</td><td class="mono">${esc(r.phone)}</td><td class="mono">${esc(r.confirmation)}</td><td>${esc(r.guest)}</td><td><span class="okc">${ic('check_circle')}Ready</span></td></tr>`
    : `<tr class="is-err"><td class="mono">${r.row}</td><td class="mono">${r.phone ? esc(r.phone) : '<span class="nil">empty</span>'}</td><td class="mono">${r.confirmation ? esc(r.confirmation) : '<span class="nil">empty</span>'}</td><td><span class="nil">No booking matched</span></td><td><span class="err">${ic('error')}<span>${esc(r.error)}<span class="err-x">${/short/.test(r.error) ? 'Use the full number with its country code.' : 'Add the BRN number so Kiku can find the booking.'}</span></span></span></td></tr>`).join('');

  desk.innerHTML = `
    <div class="ups">
      <section class="panel rate" aria-labelledby="ofh">
        <h2 id="ofh" class="rate-h">Offers</h2>
        <div class="rate-l">${rate}</div>
      </section>
      <div class="paths">
        <section class="panel path" aria-labelledby="p1">
          <div class="ph"><span class="path-k">${ic('call')}</span><h2 id="p1">One booking</h2><span class="ph-sub">Call one guest now</span></div>
          <div class="path-b">
            <div class="field"><label for="ph1">Guest phone</label><input class="input mono" id="ph1" value="${esc(one.phone)}"></div>
            <div class="field"><label for="cf1">Confirmation number</label><input class="input mono" id="cf1" value="${esc(one.confirmation)}"></div>
            <div class="match">${key('check', 'ok')}<span><b>Booking found · <span class="mono">${esc(one.confirmation)}</span></b><span>${esc(one.match)}</span></span></div>
            <div class="field"><span class="flabel">Offer on this call</span><ul class="ofr">${offerRows}</ul></div>
          </div>
          <div class="path-f"><span class="hint">Kiku rings <span class="mono">${esc(one.phone)}</span> straight away</span><button class="btn btn-pri">${ic('call')}Call now</button></div>
        </section>
        <section class="panel path" aria-labelledby="p2">
          <div class="ph"><span class="path-k">${ic('table_rows')}</span><h2 id="p2">A list of bookings</h2><span class="ph-sub">CSV upload</span>
            <div class="ph-r cols">Columns ${csv.columns.map(c => `<span class="col-chip">${esc(c)}</span>`).join('')}</div></div>
          <div class="path-b">
            <div class="drop">
              ${fileChip(csv.file, `${esc(csv.size)} · <span class="mono">${csv.rows}</span> rows`, `<button class="btn btn-ghost btn-sm">${ic('sync')}Replace</button><button class="icb" aria-label="Remove file">${ic('close')}</button>`)}
            </div>
            ${meter(csv.ready, csv.errors)}
            <div class="prev">
              <table class="tbl">
                <colgroup><col style="width:52px"><col style="width:150px"><col style="width:112px"><col><col style="width:236px"></colgroup>
                <thead><tr><th>Row</th><th>phone</th><th>confirmation</th><th>Booking</th><th>Check</th></tr></thead>
                <tbody>${prev}</tbody>
              </table>
              <p class="prev-more">Showing ${csv.preview.length} of ${csv.rows} rows: the first four and both rows with errors.</p>
            </div>
          </div>
          <div class="path-f"><div class="okeys"><span class="hint">Offer</span>${offerKeys}</div><span class="hint"><span class="mono">${csv.errors}</span> rows skipped</span><button class="btn btn-pri">${ic('call')}Start ${csv.ready} calls</button></div>
        </section>
      </div>
    </div>`;
})();
</script>
</body>
</html>
