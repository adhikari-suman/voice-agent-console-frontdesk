<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Call audit KK-24027 · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, st, key, av, sec, first, transcript, legend, select } = Kiku;
  const a = K.audit;
  const spec = first(a.specialist);
  const dur = sec(a.duration);
  const pct = t => (sec(t) / dur * 100).toFixed(2) + '%';
  const playAt = '00:54';

  const desk = Kiku.shell({
    role: 'Specialist', nav: 'logs',
    lead: `<a class="back" href="03-call-logs.html">${ic('arrow_back')}Call logs</a><span class="slash" aria-hidden="true">/</span>`,
    title: esc(a.guest), deskClass: 'tight',
    after: `<span class="strip-id mono">${a.id}</span>${st(a.status, 'on-dark')}<span class="tag on-dark">${ic('call_made')}Outbound · ${esc(a.type)}</span>`,
  });

  const tr = a.transcript;
  const segs = { floor: [], interp: [], guest: [] };
  tr.forEach((e, i) => {
    if (e.speaker === 'system') return;
    const nx = tr[i + 1]; const s = sec(e.t); const end = nx ? sec(nx.t) : dur;
    const w = Math.max(end - s - 1, 1);
    if (e.speaker === 'agent') segs.floor.push([s, w, '']);
    if (e.speaker === 'guest') segs.guest.push([s, w, '']);
    if (e.karaoke) { segs.interp.push([s, w, '']); segs.floor.push([s, w, 'is-script']); }
  });
  const seg = ([s, w, c]) => `<i class="${c}" style="left:${(s / dur * 100).toFixed(2)}%;width:${(w / dur * 100).toFixed(2)}%"></i>`;
  const esc_ = tr.find(e => e.kind === 'escalation');
  const take = tr.find(e => e.kind === 'takeover');
  const ticks = [0, 30, 60, 90, 120, 150].map(t => `<span style="left:${(t / dur * 100).toFixed(2)}%">${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}</span>`).join('') + `<span class="end" style="left:100%">${a.duration}</span>`;

  const player = `
    <section class="panel pl" aria-label="Recording">
      <div class="pl-top">
        <button class="pl-play" aria-label="Play recording">${ic('play_arrow', 'fill')}</button>
        <button class="icb" aria-label="Back 10 seconds">${ic('replay_10')}</button>
        <button class="icb" aria-label="Forward 10 seconds">${ic('forward_10')}</button>
        <span class="pl-time mono"><b>${playAt}</b> / ${a.duration}</span>
        <div class="pl-meta">
          <span>Started <b class="mono">${esc(a.started)}</b></span>
          <span>Agent <b>${esc(a.agent)}</b></span>
          <span class="who">Specialist ${av(a.specialist, 'av-sm')}<b>${esc(a.specialist)}</b></span>
        </div>
        <div class="pl-r">${select(['1× speed', '1.5× speed', '2× speed'], 'speed', 'Playback speed')}</div>
      </div>
      <div class="pl-tl">
        <div class="pl-lbs"><span><i style="background:var(--floor)"></i>Floor · Kiku</span><span><i style="background:var(--amber)"></i>Interp. · ${esc(spec)}</span><span><i style="background:var(--ink-3)"></i>Guest</span></div>
        <div class="pl-area">
          <div class="pl-flags">
            <span class="flag flag-l" style="right:calc(100% - ${pct(esc_.t)})">${key('back_hand', 'esc')}Escalated <b class="mono">${esc_.t}</b></span>
            <span class="flag flag-r" style="left:${pct(take.t)}">${key('mic', 'esc')}${esc(spec)} took over <b class="mono">${take.t}</b></span>
          </div>
          <div class="pl-band" style="left:${pct(take.t)}"></div>
          <div class="pl-trk t-floor">${segs.floor.map(seg).join('')}</div>
          <div class="pl-trk t-interp">${segs.interp.map(seg).join('')}</div>
          <div class="pl-trk t-guest">${segs.guest.map(seg).join('')}</div>
          <div class="pl-ruler mono">${ticks}</div>
          <span class="pl-mk" style="left:${pct(esc_.t)}"></span>
          <span class="pl-mk" style="left:${pct(take.t)}"></span>
          <span class="pl-ph" style="left:${pct(playAt)}"><i></i></span>
        </div>
      </div>
    </section>`;

  const kt = tr.filter(e => e.karaoke);
  const ks = a.karaokeSummary;
  const ksBars = kt.map(e => `<div class="ksb${e.asWritten ? ' is-aw' : ''}"><span class="ksb-v mono">${e.match}%</span><span class="ksb-bar"><i style="height:${Math.max(e.match, 4)}%"></i></span><span class="ksb-t mono">${e.t}</span></div>`).join('');

  const out = a.outcome.map(o => o.result === 'added'
    ? `<li>${key('add', 'ok')}<span>${esc(o.item)}</span><b class="mono">${esc(o.amount)}</b></li>`
    : `<li class="is-dec">${key('remove', 'quiet')}<span>${esc(o.item)} <em>Declined</em></span><b class="mono">${esc(o.amount)}</b></li>`).join('');

  desk.innerHTML = `
    <div class="au">
      ${player}
      <div class="au-b">
        <section class="panel txp" aria-labelledby="mh">
          <div class="ph"><h2 id="mh">Message history</h2><div class="ph-r">${legend(spec)}</div></div>
          <div class="scroll txs">${transcript(tr, { guest: a.guest, spec, play: playAt })}</div>
        </section>
        <div class="col au-side">
          <section class="panel" aria-labelledby="ks">
            <div class="ph ph-c"><h2 id="ks">Karaoke</h2><span class="ph-sub"><b class="mono">${ks.lines}</b> lines · <b class="mono">${ks.asWritten}</b> as written · <b class="mono">${ks.improvised}</b> improvised</span></div>
            <div class="pb">
              <div class="ks-ch" role="img" aria-label="Share of Kiku's line ${esc(spec)} kept, per line">${ksBars}</div>
            </div>
          </section>
          <section class="panel" aria-labelledby="bk">
            <div class="ph ph-c"><h2 id="bk">Booking</h2><span class="ph-r code">${a.booking}</span></div>
            <dl class="dl pb">
              <dt>Phone</dt><dd class="mono">${esc(a.phone)}</dd>
              <dt>Stay</dt><dd>${esc(a.stay)}</dd>
              <dt>Purpose</dt><dd>${esc(a.purpose)}</dd>
            </dl>
          </section>
          <section class="panel oc-p" aria-labelledby="oc">
            <div class="ph ph-c"><h2 id="oc">Outcome</h2>${st('completed')}</div>
            <div class="pb">
              <ul class="oc">${out}</ul>
              <div class="oc-tot"><span>Added to <span class="mono">${a.booking}</span></span><b class="mono">${esc(a.total)}</b></div>
              <p class="oc-note">${ic('sticky_note_2')}${esc(a.note)}</p>
            </div>
          </section>
        </div>
      </div>
    </div>`;
  const pane = desk.querySelector('.txs');
  Kiku.alignScroll(pane, esc_.t);
})();
</script>
</body>
</html>
