<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Listening: Rashid Karimi · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, st, key, av, chNum, lane, vu, first } = Kiku;
  const c = K.liveCall;
  const ch = chNum(c.id);
  const me = K.people.specialist;

  const con = Kiku.consoleBar({
    ch: c.id, live: false,
    monitorLabel: `Headset · CH ${ch}<button class="btn btn-dk btn-sm con-mute">${ic('volume_off')}Mute</button>`,
    monitor: vu('Kiku', 'floor', 3) + vu('Guest', 'guest', 9),
    relay: `<div class="relay"><span class="relay-k">${ic('subtitles')}</span><span class="relay-t"><b>Kiku’s script · standby</b><span>Starts when you take over</span></span></div>`,
    mic: `<button class="mic">${ic('mic')}<b>Take over</b><small>Opens your mic</small></button>`,
    hand: `<button class="btn btn-dk is-dis" disabled title="Available after you take over">${ic('undo')}Hand back to Kiku</button><button class="btn btn-dk">${ic('logout')}Leave call</button>`,
  });

  const desk = Kiku.shell({
    role: 'Specialist', nav: 'live', ch: c.id, console: con,
    title: esc(c.guest),
    after: `<span class="lamp lamp-ch">CH ${ch}</span>${st(c.status, 'on-dark')}<span class="lamp lamp-listen">${ic('headphones')}You’re listening</span><span class="strip-id">On call <span class="mono">${c.duration}</span></span>`,
  });

  const tx = c.transcript;
  const last = tx[tx.length - 1];
  const rows = tx.map(e => {
    const isLast = e === last;
    const body = e.speaker === 'agent'
      ? lane('ln-floor', 'Floor', 'Kiku', esc(e.text))
      : lane(`ln-guest${isLast ? ' is-latest' : ''}`, 'Guest', esc(c.guest), esc(e.text), isLast ? `<span class="latest">${ic('help')}Latest question</span>` : '');
    return `<div class="tr${isLast ? ' tr-latest' : ''}"><span class="tr-t">${e.t}</span><div class="tr-b">${body}</div></div>`;
  }).join('');
  const draft = `<div class="tr tr-draft"><span class="tr-t">${c.duration}</span><div class="tr-b">${lane('ln-floor ln-draft', 'Floor', 'Kiku · drafting', `${esc(c.agentDraft)}<span class="typing" aria-hidden="true"><i></i><i></i><i></i></span>`, `<span class="drafting">${ic('edit_note')}${esc(c.agentState)}</span>`)}</div></div>`;

  desk.innerHTML = `
    <div class="lv2">
      <section class="panel txp" aria-labelledby="lt">
        <div class="ph"><h2 id="lt">Live transcript</h2><span class="ph-sub">${ic('call_received', 'ph-ic')}Inbound on the hotel line · started <span class="mono">${c.started}</span></span>
          <div class="ph-r"><span class="micoff">${ic('mic_off')}Your mic is off. ${esc(first(c.guest))} can’t hear you.</span></div></div>
        <div class="scroll txs"><div class="tx">${rows}${draft}</div></div>
      </section>
      <div class="col">
        <section class="panel" aria-labelledby="cf">
          <div class="ph ph-c"><h2 id="cf">Call</h2><span class="ph-r code">${c.booking}</span></div>
          <dl class="dl pb">
            <dt>Guest</dt><dd>${esc(c.guest)}</dd>
            <dt>Phone</dt><dd class="mono">${esc(c.phone)}</dd>
            <dt>Stay</dt><dd>${esc(c.stay)}</dd>
            <dt>Purpose</dt><dd>${esc(c.purpose)}</dd>
            <dt>Call ID</dt><dd class="mono">${c.id}</dd>
          </dl>
        </section>
        <section class="panel" aria-labelledby="kd">
          <div class="ph ph-c"><h2 id="kd">Kiku already did</h2><span class="ph-sub">${c.actionsTaken.length} actions</span></div>
          <ul class="checks pb">${c.actionsTaken.map(a => `<li>${ic('check_circle')}<span>${esc(a)}</span></li>`).join('')}</ul>
        </section>
        <section class="panel" aria-labelledby="oc">
          <div class="ph ph-c"><h2 id="oc">On this channel</h2></div>
          <ul class="onch pb">
            <li><svg class="av" viewBox="0 0 28 28" aria-hidden="true" style="border:0"><rect width="28" height="28" rx="6" fill="#EEF2F9" stroke="#D9DFEA"/><rect x="6" y="9" width="16" height="3.5" rx="1.2" fill="#3D7BFF"/><rect x="6" y="15.5" width="10" height="3.5" rx="1.2" fill="#C3CADA"/></svg><span><b>Kiku</b><span>${esc(c.agentState)}</span></span>${Kiku.bars(2, 'floor', 6, 'lv-low')}</li>
            ${c.listening.map(n => `<li>${av(n)}<span><b>${esc(n)}${n === me.name ? ' (you)' : ''}</b><span>Listening, mic off</span></span>${ic('headphones', 'onch-ic')}</li>`).join('')}
            <li>${av(c.guest, 'av-muted')}<span><b>${esc(c.guest)}</b><span>Guest, talking to Kiku</span></span>${Kiku.bars(5, 'guest', 6)}</li>
          </ul>
        </section>
      </div>
    </div>`;
  const pane = desk.querySelector('.txs');
  Kiku.alignScroll(pane, 'bottom');
})();
</script>
</body>
</html>
