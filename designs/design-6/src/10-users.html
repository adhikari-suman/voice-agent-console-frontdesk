<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Users · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, key, av, first } = Kiku;
  const u = K.users, draft = K.newUserDraft;
  const desk = Kiku.shell({ role: 'Admin', nav: 'users', title: 'Users', after: `<span class="strip-id">Who can sign in to Kiku at ${esc(K.hotel.name)}</span>` });

  const US = { Active: ['check', 'ok'], Invited: ['mail', 'booth'], Deactivated: ['block', 'quiet'] };
  const RI = { Admin: 'admin_panel_settings', Specialist: 'headset_mic' };
  const rows = u.map(x => `
    <tr class="${x.status === 'Deactivated' ? 'is-off' : ''}">
      <td><span class="who">${av(x.name, x.status === 'Deactivated' ? 'av-muted' : '')}<span><span class="who-n">${esc(x.name)}${x.email === K.people.admin.email ? ' <span class="you">you</span>' : ''}</span><span class="who-s">${esc(x.email)}</span></span></span></td>
      <td><span class="tag">${ic(RI[x.role])}${x.role}</span></td>
      <td><span class="st">${key(...US[x.status])}<span class="st-l">${x.status}</span></span></td>
      <td class="small">${esc(x.lastActive).replace(/\((KK-\d+)\)/, '<span class="nowrap">(<span class="mono">$1</span>)</span>')}</td>
      <td class="num mono tko">${x.takeovers30d}</td>
    </tr>`).join('');

  const roleCard = (r, on) => `
    <label class="rc${on ? ' is-on' : ''}">
      <span class="radio${on ? ' is-on' : ''}" role="radio" aria-checked="${on}"></span>
      <span class="rc-b"><span class="rc-h">${ic(RI[r])}<b>${r}</b></span>
        <ul class="rc-p">${K.roles[r].map(p => `<li>${ic('check')}${esc(p)}</li>`).join('')}</ul></span>
    </label>`;

  desk.innerHTML = `
    <div class="usr">
      <section class="panel usp" aria-labelledby="uh">
        <div class="ph"><h2 id="uh">Everyone</h2><span class="ph-sub">${u.length} people · ${u.filter(x => x.role === 'Specialist').length} specialists, ${u.filter(x => x.role === 'Admin').length} admin</span>
          <div class="ph-r"><button class="btn btn-sec is-on" aria-expanded="true">${ic('person_add')}Create user</button></div></div>
        <table class="tbl ut">
          <colgroup><col><col style="width:120px"><col style="width:128px"><col style="width:132px"><col style="width:84px"></colgroup>
          <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th class="num">Takeovers, 30 days</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>
      <aside class="panel side" aria-labelledby="cu">
        <div class="ph"><span class="path-k">${ic('person_add')}</span><h2 id="cu">Create user</h2><button class="icb ph-r" aria-label="Close">${ic('close')}</button></div>
        <div class="side-b">
          <div class="field"><label for="fn">Full name</label><input class="input" id="fn" value="${esc(draft.name)}"></div>
          <div class="field"><label for="fe">Work email</label><input class="input" id="fe" type="email" value="${esc(draft.email)}"></div>
          <div class="field"><label for="fj">Job title <span class="opt">(optional)</span></label><input class="input is-focus" id="fj" placeholder="For example, ${esc(K.people.specialist.title)}" style="border-color:var(--booth)"></div>
          <div class="field" role="radiogroup" aria-labelledby="rl"><span class="flabel" id="rl">Role</span>
            ${roleCard('Specialist', draft.role === 'Specialist')}
            ${roleCard('Admin', draft.role === 'Admin')}
          </div>
        </div>
        <div class="path-f"><span class="hint">${esc(first(draft.name))} gets an email invite</span><span class="ph-r"><button class="btn btn-ghost">Cancel</button><button class="btn btn-pri">${ic('send')}Send invite</button></span></div>
      </aside>
    </div>`;
})();
</script>
</body>
</html>
