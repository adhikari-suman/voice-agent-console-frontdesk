<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kiku, users</title>
<link rel="stylesheet" href="styles.css">
<script src="../../_shared/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<script src="app.js"></script>
<style>
  .page { height: 100%; display: grid; grid-template-columns: 1fr 440px; }
  .list { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; }
  .groups { padding: 0 28px; display: flex; gap: 8px; margin-bottom: 14px; }
  .groups .chip svg { width: 11px; height: 11px; }
  .roster { padding: 0 28px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .person { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: start; }
  .person .av { width: 40px; height: 40px; font-size: 13px; }
  .person b { font-weight: 600; font-size: 15px; display: block; }
  .person .em { font-size: 12.5px; color: var(--ink-3); }
  .person .meta { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
  .person .meta svg.lucide { width: 13px; height: 13px; }
  .role { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
  .ust { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; }
  .ust svg { width: 12px; height: 12px; }
  .ust.active { color: var(--ok); } .ust.invited { color: var(--kiku); } .ust.deactivated { color: var(--ink-3); }
  .tk { text-align: right; }
  .tk b { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .tk span { display: block; font-size: 11px; color: var(--ink-3); }
  .person.off { background: var(--sheet-2); }
  .person.off b, .person.off .tk b { color: var(--ink-3); }
  .person.new { border-style: dashed; border-color: var(--kiku); background: var(--kiku-soft); }

  .drawer { background: #fff; border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .d-h { padding: 22px 24px 14px; display: flex; justify-content: space-between; align-items: flex-start; }
  .d-h h2 { font-size: 20px; }
  .d-h button { border: 0; background: transparent; color: var(--ink-3); }
  .d-b { padding: 4px 24px 16px; display: grid; gap: 16px; align-content: start; }
  .rc { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; font-weight: 400 !important; justify-content: stretch !important; }
  .rc.on { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .rc input { margin-top: 3px; width: 16px; height: 16px; }
  .rc b { font-weight: 600; font-size: 14px; }
  .rc ul { list-style: none; margin-top: 6px; display: grid; gap: 4px; }
  .rc li { display: flex; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
  .rc li svg.lucide { width: 14px; height: 14px; color: var(--ok); margin-top: 1px; }
  .rc li.no { color: var(--ink-3); }
  .rc li.no svg.lucide { color: var(--ink-3); }
  .d-f { padding: 14px 24px; border-top: 1px solid var(--line-2); display: flex; gap: 10px; align-items: center; }
  .d-f .hint { margin-right: auto; }
</style>
</head>
<body>
<script>
const USG = {
  Active: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>`,
  Invited: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 1.6"/></svg>`,
  Deactivated: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.3 10.7l7.4-7.4" stroke="currentColor" stroke-width="1.6"/></svg>`,
};
const N = K.newUserDraft;
const people = K.users.map(u => `
  <article class="person ${u.status === "Deactivated" ? "off" : ""}">
    <span class="av">${u.initials}</span>
    <div><b>${u.name}</b><span class="em">${u.email}</span>
      <div class="meta"><span class="role">${ic(u.role === "Admin" ? "shield" : "headphones")}${u.role}</span><span class="ust ${u.status.toLowerCase()}">${USG[u.status]}${u.status}</span><span class="muted">${u.lastActive}</span></div>
    </div>
    <div class="tk"><b>${u.takeovers30d}</b><span>takeovers<br>in 30 days</span></div>
  </article>`).join("") + `
  <article class="person new">
    <span class="av" style="background:#fff">GM</span>
    <div><b>${N.name}</b><span class="em">${N.email}</span><div class="meta"><span class="role">${ic("headphones")}${N.role}</span><span class="ust invited">${ic("pencil-line")}Invite not sent yet</span></div></div>
    <span></span>
  </article>`;
const all = [...new Set([...K.roles.Admin, ...K.roles.Specialist])];
const roleCard = r => `<label class="rc ${N.role === r ? "on" : ""}"><input type="radio" name="role" ${N.role === r ? "checked" : ""}><div><b>${r}</b><ul>${all.map(p => K.roles[r].includes(p) ? `<li>${ic("check")}${p}</li>` : `<li class="no">${ic("minus")}No: ${p.charAt(0).toLowerCase() + p.slice(1)}</li>`).join("")}</ul></div></label>`;
const cnt = s => K.users.filter(u => u.status === s).length;

shell("admin", "users", `
<div class="page">
  <section class="list">
    <div class="ph"><h1>Users</h1><span class="sub">${K.users.length} people at ${K.hotel.name}</span></div>
    <div class="groups"><span class="chip" style="color:var(--ok)">${USG.Active}&nbsp;${cnt("Active")} active</span><span class="chip" style="color:var(--kiku)">${USG.Invited}&nbsp;${cnt("Invited")} invited</span><span class="chip">${USG.Deactivated}&nbsp;${cnt("Deactivated")} deactivated</span></div>
    <div class="roster scroll">${people}</div>
  </section>
  <aside class="drawer" aria-label="Add a user">
    <div class="d-h"><div><h2>Add a user</h2><p class="sub">They get an email invite to set a password.</p></div><button aria-label="Close">${ic("x")}</button></div>
    <div class="d-b scroll">
      <div class="field"><label for="n">Full name</label><span class="input"><input id="n" value="${N.name}"></span></div>
      <div class="field"><label for="e">Work email</label><span class="input">${ic("mail")}<input id="e" value="${N.email}"></span></div>
      <div class="field"><span class="lab">Role</span>${roleCard("Specialist")}${roleCard("Admin")}</div>
    </div>
    <div class="d-f"><span class="hint">Invite goes to their work email.</span><button class="btn">Cancel</button><button class="btn primary">${ic("send")}Send invite</button></div>
  </aside>
</div>`);
finish();
</script>
</body>
</html>
