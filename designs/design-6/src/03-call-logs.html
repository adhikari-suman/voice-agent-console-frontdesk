<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Call logs · Kiku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:wght@400..800&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,400,0..1,0&icon_names=add,add_call,admin_panel_settings,arrow_back,arrow_forward,back_hand,block,calendar_today,call,call_end,call_made,call_received,campaign,category,check,check_circle,chevron_right,close,credit_card,description,download,edit,edit_note,error,event_available,expand_more,forward_10,graphic_eq,group,headphones,headset_mic,help,hourglass_top,info,list_alt,lock_clock,login,logout,mail,mic,mic_off,more_horiz,pause,payments,person_add,play_arrow,record_voice_over,remove,replay_10,room_service,schedule,search,send,sensors,smart_toy,speed,sticky_note_2,subtitles,sync,table_rows,undo,upload_file,volume_off&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
</head>
<body>
<script>
(() => {
  const { K, ic, esc, st, key, av, ST, select, specName } = Kiku;
  const calls = K.calls;
  const desk = Kiku.shell({ role: 'Specialist', nav: 'logs', title: 'Call logs', after: `<span class="strip-id">Every call Kiku answered or placed today</span>` });

  const count = s => calls.filter(c => c.status === s).length;
  const fkeys = [`<button class="fk is-on" aria-pressed="true"><span class="fk-l">All</span><span class="fk-n mono">${calls.length}</span></button>`]
    .concat(Object.keys(ST).map(s => `<button class="fk" aria-pressed="false">${key(ST[s][1], ST[s][2])}<span class="fk-l">${ST[s][0]}</span><span class="fk-n mono">${count(s)}</span></button>`)).join('');

  const kikuAv = `<svg class="av av-sm" viewBox="0 0 24 24" aria-hidden="true" style="border:0"><rect width="24" height="24" rx="5" fill="#EEF2F9" stroke="#D9DFEA"/><rect x="5" y="8" width="14" height="3" rx="1" fill="#3D7BFF"/><rect x="5" y="13.5" width="8" height="3" rx="1" fill="#C3CADA"/></svg>`;
  const spec = c => {
    if (!c.specialist) return `<span class="who">${kikuAv}<span class="who-n muted" style="font-weight:600">Kiku only</span></span>`;
    const n = specName(c); const listening = /listening/.test(c.specialist);
    return `<span class="who">${av(n, 'av-sm')}<span><span class="who-n">${esc(n)}</span>${listening ? '<span class="who-s">Listening now</span>' : (c.status === 'escalated' ? '<span class="who-s">Took over</span>' : '')}</span></span>`;
  };
  const rows = calls.map(c => {
    const sel = c.id === 'KK-24027';
    return `<tr class="${sel ? 'is-sel' : ''}">
      <td class="cell2"><b class="mono">${c.started}</b><span class="mono">${c.id}</span></td>
      <td class="cell2"><b>${esc(c.guest)}</b><span class="mono">${esc(c.phone)}</span></td>
      <td class="cell2"><b class="dir">${ic(c.direction === 'inbound' ? 'call_received' : 'call_made')}${c.direction === 'inbound' ? 'Inbound' : 'Outbound'}</b><span style="padding-left:24px">${c.direction === 'inbound' ? 'Hotel line' : esc(c.type)}</span></td>
      <td><span class="purp">${esc(c.purpose)}</span></td>
      <td>${st(c.status)}</td>
      <td class="num mono">${c.duration}</td>
      <td>${spec(c)}</td>
      <td class="num">${sel ? `<a class="btn btn-pri btn-sm" href="04-call-audit.html">Open audit${ic('arrow_forward')}</a>` : `<a class="icb" href="#" aria-label="Open ${c.id}">${ic('chevron_right')}</a>`}</td>
    </tr>`;
  }).join('');

  desk.innerHTML = `
    <div class="logs">
      <div class="filters" role="search">
        <label class="search" style="flex:1;max-width:420px">${ic('search')}<input class="input" type="search" placeholder="Search guest, phone or call ID" aria-label="Search calls"></label>
        <div class="seg" role="group" aria-label="Direction"><button class="is-on" aria-pressed="true">All</button><button aria-pressed="false">${ic('call_received')}Inbound</button><button aria-pressed="false">${ic('call_made')}Outbound</button></div>
        ${select(['All types', 'Inbound', 'Campaign', 'Upsell', 'Make a call'], 'category', 'Call type')}
        ${select(['Today', 'Yesterday', 'Last 7 days'], 'calendar_today', 'Date')}
        <span class="filters-n"><b class="mono">${calls.length}</b> calls · ${esc(K.hotel.today)}</span>
      </div>
      <section class="panel tblp" aria-label="Calls">
        <div class="tbl-bar" role="group" aria-label="Status">${fkeys}</div>
        <table class="tbl logs-tbl">
          <colgroup><col style="width:92px"><col style="width:176px"><col style="width:150px"><col><col style="width:132px"><col style="width:84px"><col style="width:156px"><col style="width:128px"></colgroup>
          <thead><tr><th>Time · ID</th><th>Guest · phone</th><th>Direction · type</th><th>Purpose</th><th>Status</th><th class="num">Duration</th><th>Specialist</th><th><span class="sr-only">Open</span></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </section>
    </div>`;
})();
</script>
</body>
</html>
