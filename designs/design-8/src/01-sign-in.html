<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .signin { flex: 1; display: grid; place-items: center; position: relative; }
  .si-wrap { width: 940px; display: flex; flex-direction: column; gap: 22px; margin-top: -30px; }
  .si-mark { display: flex; align-items: center; gap: 16px; }
  .si-mark b { font-size: 44px; letter-spacing: .24em; font-weight: 700; line-height: 1; }
  .si-mark .hl { margin-left: 8px; padding-left: 20px; border-left: 1px solid var(--rail); display: flex; flex-direction: column; gap: 3px; }
  .si-mark .hl strong { font-size: 17px; }
  .si-mark .hl span { color: var(--on-bay-2); font-size: 12.5px; }
  .si-rail { padding: 12px; gap: 9px; }
  .si-strip .tab { width: 38px; }
  .si-strip .box { padding: 10px 14px; gap: 5px; }
  .si-strip .inp { height: 38px; font-size: 14px; }
  .si-strip .kbox { justify-content: center; padding: 10px 14px; }
  .si-foot { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
  .si-foot a { color: var(--on-bay); font-weight: 700; font-size: 12.5px; }
  .si-foot span { color: var(--on-bay-2); font-size: 12.5px; }
  .demo { position: absolute; left: 18px; bottom: 16px; display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--on-bay-2); }
  .demo .ms { font-size: 16px; }
  .slot.faint { opacity: .7; }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<main class="signin">
  <div class="si-wrap">
    <div class="si-mark" id="mark"></div>
    <div>
      <div class="plate">
        <span class="ms" aria-hidden="true">login</span>Sign in
        <span class="c" id="plate-time"></span>
      </div>
      <form class="rail si-rail" onsubmit="return false">
        <div class="slot faint"></div>
        <div class="strip si-strip on-paper">
          <div class="tab"><span class="ms" aria-hidden="true">lock</span></div>
          <div class="sbody">
            <div class="srow">
              <label class="box grow">
                <span class="lb">Email</span>
                <input class="inp" type="email" id="email" autocomplete="username">
              </label>
              <label class="box grow">
                <span class="lb">Password</span>
                <input class="inp mono is-focus" type="password" value="shift-bay-0400" autocomplete="current-password">
              </label>
              <div class="box kbox">
                <button class="key key-primary key-lg" type="submit"><span class="ms" aria-hidden="true">arrow_forward</span>Sign in</button>
              </div>
            </div>
          </div>
        </div>
        <div class="slot faint"></div>
      </form>
    </div>
    <div class="si-foot">
      <a href="#">Forgot password?</a>
      <span>Use your Brenlow staff email. Your admin sets your role.</span>
    </div>
  </div>
  <p class="demo" id="demo"></p>
</main>
<script>
  const { D, glyph, icon, esc } = KK;
  const h = D.hotel;
  document.getElementById("tower").innerHTML = `
    <div class="hotel" style="border-left:0;padding-left:0"><b>${esc(h.name)}, ${esc(h.city)}</b><span>LINE ${esc(h.line)}</span></div>
    <div class="gap"></div>
    <div class="clock" style="border-right:0"><span class="t">${h.now}</span><span class="z"><b>${h.tz}</b>SUN 27 SEP</span></div>`;
  document.getElementById("mark").innerHTML = `${glyph(64)}<b>KIKU</b><span class="hl"><strong>${esc(h.name)}, ${esc(h.city)}</strong><span>${esc(D.product.tagline)}</span></span>`;
  document.getElementById("email").value = D.people.specialist.email;
  document.getElementById("plate-time").textContent = `${h.now} ${h.tz}`;
  document.getElementById("demo").innerHTML = `${icon("info")}${esc(D.synthetic)}`;
  KK.finish();
</script>
</body>
</html>
