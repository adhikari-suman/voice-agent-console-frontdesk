<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Call audit KK-24027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .page { gap: 10px; padding-top: 10px; }
  .pagehead { min-height: 26px; gap: 14px; }
  .pagehead h1 { font-size: 18px; }
  .hdr .tab { width: 38px; justify-content: center; gap: 4px; font-size: 11px; }
  .hdr .tab .ms { font-size: 22px; }
  .hdr .box { padding: 5px 11px; }
  .hdr .v { font-size: 13.5px; }
  .hdr .v.big { font-size: 15px; font-weight: 700; }

  .player { display: flex; align-items: stretch; gap: 12px; flex: none; }
  .ctrl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; width: 132px; }
  .ctrl .row { display: flex; gap: 6px; }
  .ctrl .key-play { width: 46px; height: 46px; padding: 0; }
  .ctrl .key-play .ms { font-size: 28px; margin: 0; }
  .ctrl .tt { font-family: var(--f-mono); font-size: 13px; color: var(--on-bay-2); }
  .ctrl .tt b { color: var(--on-bay); }
  .tape { flex: 1; position: relative; height: 84px; padding: 0; }
  .tape .area { position: absolute; left: 14px; right: 14px; top: 0; bottom: 0; }
  .tape .wave { position: absolute; left: 0; right: 0; top: 30px; height: 30px; width: 100%; }
  .tape .ticks { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; border-top: 1px solid var(--rule); }
  .tape .tk { position: absolute; bottom: 0; width: 1px; background: var(--rule-strong); height: 4px; }
  .tape .tk.maj { height: 8px; background: var(--ink); }
  .tape .tl { position: absolute; bottom: 5px; transform: translateX(4px); font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); }
  .tape .mk { position: absolute; top: 4px; bottom: 18px; width: 0; }
  .tape .mk .line { position: absolute; top: 20px; bottom: 0; left: -1px; width: 2px; border-radius: 1px; }
  .tape .mk .lab { position: absolute; top: 3px; left: -1px; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 3px; }
  .tape .mk .lab .ms { font-size: 14px; }
  .tape .mk.esc .line { background: var(--red); }
  .tape .mk.esc .lab .ms { color: var(--red); }
  .tape .mk.join .line { background: var(--ink-2); width: 1px; }
  .tape .mk.take .line { background: var(--pen); }
  .tape .mk.take .lab { color: var(--ink); }
  .tape .mk.take .lab .hand { font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 700; }
  .tape .span { position: absolute; top: 22px; height: 6px; border: 1.5px solid var(--pen); border-bottom: 0; border-radius: 2px 2px 0 0; }
  .tape .span .hand { position: absolute; right: 0; top: -19px; font-size: 13.5px; line-height: 1; background: var(--paper); padding: 0 4px; }
  .tape .head { position: absolute; top: 22px; bottom: 18px; width: 2px; background: var(--ink); margin-left: -1px; }
  .tape .head::before { content: ""; position: absolute; top: -4px; left: -4px; width: 10px; height: 8px; background: var(--key); border: 1px solid var(--ink); border-radius: 1px; }
  .tlegend { display: flex; flex-direction: column; justify-content: center; gap: 5px; font-size: 11.5px; color: var(--on-bay-2); width: 84px; }
  .tlegend span { display: inline-flex; align-items: center; gap: 6px; }
  .tlegend i { width: 14px; height: 10px; border-radius: 1px; border: 2px solid var(--paper); }

  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 410px; gap: 14px; }
  .txpane { display: flex; flex-direction: column; min-height: 0; }
  .txhead { display: flex; align-items: center; gap: 10px; }
  .txhead .jump { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .txhead .jump .key { height: 26px; font-size: 11px; }
  .txrail { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 8px; gap: 0; position: relative; }
  .txr { grid-template-columns: 50px 112px 1fr; }
  .txr.k { grid-template-columns: 50px 112px 1fr; }
  .chips { display: flex; flex-direction: column; gap: 4px; padding-top: 6px; }
  .chip { display: inline-flex; align-items: center; height: 21px; padding: 0 6px; background: var(--dep); color: var(--ink); border: 1px solid var(--ink); border-radius: var(--r); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; justify-self: start; white-space: nowrap; width: max-content; }
  .chip.said { font-family: var(--f-hand); color: var(--pen); font-size: 14px; letter-spacing: 0; text-transform: none; font-weight: 700; }
  .kstrip .tab { font-size: 10px; justify-content: space-between; padding: 7px 0; }
  .kstrip .sbody { padding: 2px 16px 2px 12px; }
  .kstrip .amend { font-size: 13.5px; line-height: 2.35; }
  .kstrip.asw { outline: 1px solid var(--pen); outline-offset: 2px; }
  .kstrip .kmar .lb { font-size: 11px; }
  .kstrip .kmar .asw-l { font-family: var(--f-hand); color: var(--pen); font-size: 14px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .txr .t .ms { font-size: 14px; color: var(--key); margin-left: -2px; }

  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .side .rail { padding: 10px; }
  .ksum .cells { display: grid; grid-template-columns: repeat(7, 1fr); }
  .ksum .cell { padding: 5px 0 4px; text-align: center; border-left: 1px solid var(--rule); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .ksum .cell:first-child { border-left: 0; }
  .ksum .cell .tm { font-size: 11px; color: var(--ink-2); }
  .ksum .cell b { font-family: var(--f-mono); font-size: 13px; }
  .ksum .bar { width: 26px; height: 5px; background: rgba(18, 21, 19, .14); border-radius: 1px; overflow: hidden; }
  .ksum .bar i { display: block; height: 100%; background: var(--ink); }
  .ksum .cell svg { width: 20px; height: 13px; margin-top: -1px; }
  .ksum .cell.asw b { color: var(--pen); }
  .ksum .tot { display: flex; gap: 0; }
  .ksum .tot .box { flex: 1; }
  .ksum .tot .v { font-family: var(--f-mono); font-size: 20px; font-weight: 700; line-height: 1.1; }
  .ksum .tot .v.hand { font-family: var(--f-hand); font-size: 22px; }
  .esc-strip .box { padding: 7px 11px; }
  .esc-strip .why { display: flex; gap: 7px; font-size: 12.5px; line-height: 1.4; }
  .esc-strip .why .ms { color: var(--red); font-size: 17px; }
  .esc-strip .evs { display: flex; gap: 14px; font-size: 11.5px; }
  .esc-strip .evs > span { display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
  .esc-strip .evs .ms { font-size: 15px; }
  .oc .box { padding: 6px 10px; }
  .oc .item { font-size: 12.5px; line-height: 1.35; }
  .oc .amt { font-family: var(--f-mono); font-weight: 700; font-size: 13px; width: 78px; flex: none; text-align: right; align-items: flex-end; }
  .oc .res { width: 104px; flex: none; }
  .oc.declined .item { color: var(--ink-2); }
  .totrow { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 0; }
  .totrow .lb2 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--on-bay-2); }
  .totrow .sum { font-family: var(--f-mono); font-size: 24px; font-weight: 700; }
  .note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 8px 10px; }
  .note .ms { font-size: 18px; }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<main class="page">
  <div class="pagehead">
    <a class="crumb" href="03-call-logs.html"><span class="ms" aria-hidden="true">arrow_back</span>Call logs</a>
    <h1 id="title"></h1>
    <span class="sub" id="sub"></span>
  </div>

  <section class="strip dep hdr" id="hdr" aria-label="Call details"></section>

  <section class="player" aria-label="Recording">
    <div class="ctrl">
      <button class="key key-primary key-play" aria-label="Play recording"><span class="ms fill" aria-hidden="true">play_arrow</span></button>
      <span class="tt"><b id="pos"></b> / <span id="len"></span></span>
    </div>
    <div class="strip tape" id="tape"><div class="area" id="area"></div></div>
    <div class="tlegend" aria-hidden="true">
      <span><i style="background:var(--ink)"></i>Kiku</span>
      <span><i style="background:#8B9690"></i>Guest</span>
      <span><i style="background:var(--pen)"></i>Tomasz</span>
    </div>
  </section>

  <div class="cols">
    <section class="txpane" aria-labelledby="h-tx">
      <div class="plate txhead">
        <span class="ms" aria-hidden="true">forum</span><span id="h-tx">Message history</span>
        <span class="legend" aria-label="Legend"><span>Kiku wrote</span><i></i><span class="del">dropped</span><i></i><span class="hand">Tomasz said</span></span>
        <span class="jump"><span class="dim" style="font-size:11px">Jump to</span>
          <button class="key key-bay key-sm" data-t="00:00">Start</button>
          <button class="key key-bay key-sm" data-t="00:36">Escalation</button>
          <button class="key key-bay key-sm on" data-t="00:52" aria-pressed="true">Takeover</button>
        </span>
      </div>
      <div class="rail txrail" id="tx"></div>
    </section>

    <aside class="side">
      <section aria-labelledby="h-k">
        <h2 class="plate" id="h-k"><span class="ms" aria-hidden="true">edit_note</span>Karaoke<span class="c" id="k-c"></span></h2>
        <div class="rail">
          <div class="strip dep ksum"><div class="sbody">
            <div class="srow tot" id="k-tot"></div>
            <div class="srow"><div class="cells" id="k-cells" style="width:100%"></div></div>
          </div></div>
        </div>
      </section>
      <section class="strip pri esc-strip" aria-label="Escalation"><div class="sbody" id="esc"></div></section>
      <section aria-labelledby="h-o" style="min-height:0">
        <h2 class="plate" id="h-o"><span class="ms" aria-hidden="true">receipt_long</span>Outcome</h2>
        <div class="rail" id="oc" style="gap:6px"></div>
      </section>
    </aside>
  </div>
</main>
<script>
  const { D, esc, icon, status, hand, initials, amended, tick, txRow, glyph } = KK;
  KK.mountTower({ role: "specialist", active: "logs" });
  const A = D.audit;
  const sp = A.specialist, spFirst = sp.split(" ")[0], spI = initials(sp);
  const secs = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const LEN = secs(A.duration);
  const PLAY = "01:12";

  document.getElementById("title").textContent = "Call audit";
  document.getElementById("sub").textContent = `${A.id} · ${A.started}`;
  document.getElementById("pos").textContent = PLAY;
  document.getElementById("len").textContent = A.duration;

  const box = (lb, v, st = "") => `<div class="box" style="${st}"><span class="lb">${lb}</span><span class="v">${v}</span></div>`;
  document.getElementById("hdr").innerHTML = `
    <div class="tab">${icon("call_made")}<span>OUT</span></div>
    <div class="sbody">
      <div class="srow">
        ${box("Started", `<span class="tm">${esc(A.started)}</span>`, "flex:none")}
        ${box("Call", `<span class="cs">${A.id}</span>`, "flex:none")}
        ${box("Guest", `<span class="big">${esc(A.guest)}</span>`, "flex:none").replace('class="v"', 'class="v big"')}
        ${box("Phone", `<span class="tm">${esc(A.phone)}</span>`, "flex:none")}
        ${box("Booking", `<span class="cs">${A.booking}</span>`, "flex:none")}
        ${box("Stay", esc(A.stay), "flex:1")}
      </div>
      <div class="srow">
        ${box("Direction · type", `<span class="st">${icon("call_made")}Outbound · ${esc(A.type)}</span>`, "flex:none")}
        ${box("Purpose", esc(A.purpose), "flex:1")}
        ${box("Status", status(A.status), "flex:none")}
        ${box("Duration", `<span class="tm">${A.duration}</span>`, "flex:none")}
        ${box("Agent", `<span style="display:inline-flex;gap:6px;align-items:center">${glyph(16)}${esc(A.agent)}</span>`, "flex:none")}
        ${box("Specialist", `<span class="sig">${hand(spI)}<span class="nm">${esc(sp)} · took over ${A.takeoverAt}</span></span>`, "flex:none")}
      </div>
    </div>`;

  /* tape */
  const T = A.transcript;
  const pct = (s) => (s / LEN) * 100;
  let rnd = 7;
  const r = () => ((rnd = (rnd * 9301 + 49297) % 233280) / 233280);
  const col = { agent: "#121513", guest: "#8B9690", specialist: "#1D3FA8" };
  let bars = "";
  T.forEach((it, i) => {
    if (it.speaker === "system") return;
    const a = secs(it.t), b = i + 1 < T.length ? secs(T[i + 1].t) : LEN;
    for (let x = a * 10 + 3; x < b * 10 - 4; x += 6) {
      const h = 5 + r() * 25;
      bars += `<rect x="${x}" y="${(30 - h) / 2}" width="3.4" height="${h.toFixed(1)}" fill="${col[it.speaker]}"/>`;
    }
  });
  let ticks = "";
  for (let s = 0; s <= LEN; s += 10) {
    const maj = s % 30 === 0;
    ticks += `<span class="tk ${maj ? "maj" : ""}" style="left:${pct(s)}%"></span>`;
    if (maj) ticks += `<span class="tl" style="left:${pct(s)}%">${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}</span>`;
  }
  const ev = (k) => T.find((x) => x.kind === k);
  const e1 = ev("escalation"), e2 = ev("join"), e3 = ev("takeover");
  document.getElementById("area").innerHTML = `
    <svg class="wave" viewBox="0 0 ${LEN * 10} 30" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>
    <div class="ticks">${ticks}</div>
    <div class="span" style="left:${pct(secs(A.takeoverAt))}%;right:0">${hand("karaoke, " + spFirst + " on the line")}</div>
    <div class="mk esc" style="left:${pct(secs(e1.t))}%"><span class="lab" style="transform:translateX(calc(-100% + 1px))">${icon("warning")}Escalated ${e1.t}</span><span class="line"></span></div>
    <div class="mk join" style="left:${pct(secs(e2.t))}%"><span class="line"></span></div>
    <div class="mk take" style="left:${pct(secs(e3.t))}%"><span class="lab">${hand(spI)} took over ${e3.t}</span><span class="line"></span></div>
    <div class="head" style="left:${pct(secs(PLAY))}%"></div>`;

  /* transcript */
  const kItems = T.filter((x) => x.karaoke);
  const ctx = {
    guest: "Guest",
    specialist: spFirst,
    karaoke(it) {
      const n = kItems.indexOf(it) + 1;
      const mar = it.asWritten
        ? `${tick()}<span class="asw-l">as written</span><span class="pct">${it.match}%</span>`
        : `<span class="lb">Match</span><span class="pct">${it.match}%</span>`;
      return `
        <div class="txr k ${it.t === PLAY ? "now" : ""}">
          <span class="t">${it.t === PLAY ? icon("play_arrow", "fill") : ""}${it.t}</span>
          <div class="chips"><span class="chip">Kiku wrote</span><span class="chip said">${esc(spFirst)} said</span></div>
          <div class="strip dep kstrip ${it.asWritten ? "asw" : ""}">
            <div class="tab"><span>L${n}</span>${hand(spI)}</div>
            <div class="sbody"><p class="amend">${amended(it.diff)}</p></div>
            <div class="kmar">${mar}</div>
          </div>
        </div>`;
    },
  };
  const txEl = document.getElementById("tx");
  txEl.innerHTML = T.map((it) => {
    const html = txRow(it, ctx);
    return html.replace('class="txr', `id="t-${it.t}-${it.speaker}" class="txr`);
  }).join("");

  /* karaoke summary */
  const ks = A.karaokeSummary;
  document.getElementById("k-c").textContent = `${ks.lines} LINES`;
  document.getElementById("k-tot").innerHTML = `
    <div class="box"><span class="lb">Lines</span><span class="v">${ks.lines}</span></div>
    <div class="box"><span class="lb">As written</span><span class="v" style="color:var(--pen)">${ks.asWritten}</span></div>
    <div class="box"><span class="lb">Improvised</span><span class="v hand">${ks.improvised}</span></div>`;
  document.getElementById("k-cells").innerHTML = kItems.map((it, i) => `
    <div class="cell ${it.asWritten ? "asw" : ""}" title="Line ${i + 1}, ${it.match}% match">
      ${it.asWritten ? tick() : `<span class="lb">L${i + 1}</span>`}<span class="tm">${it.t}</span><b>${it.match}%</b><span class="bar"><i style="width:${it.match}%"></i></span>
    </div>`).join("");

  /* escalation */
  document.getElementById("esc").innerHTML = `
    <div class="srow"><div class="box grow"><span class="lb">Escalation reason</span><span class="why">${icon("warning")}<span>${esc(A.escalationReason)}</span></span></div></div>
    <div class="srow"><div class="box grow"><span class="evs">
      <span>${icon("warning")}<b class="tm">${e1.t}</b> escalated</span>
      <span>${icon("headphones")}<b class="tm">${e2.t}</b> joined</span>
      <span>${icon("record_voice_over")}<b class="tm">${e3.t}</b> took over</span>
    </span></div></div>`;

  /* outcome */ /*icons:do_not_disturb_on*/
  const oc = A.outcome.map((o) => {
    const added = o.result === "added";
    return `
      <div class="strip ${added ? "dep" : "fail"} oc ${added ? "" : "declined"}">
        <div class="sbody"><div class="srow">
          <div class="box grow"><span class="item">${esc(o.item)}</span></div>
          <div class="box res row"><span class="st">${icon(added ? "check_box" : "do_not_disturb_on")}${added ? "Added" : "Declined"}</span></div>
          <div class="box amt"><span>${esc(o.amount)}</span></div>
        </div></div>
      </div>`;
  }).join("");
  document.getElementById("oc").innerHTML = `${oc}
    <div class="totrow"><span class="lb2">Added to ${A.booking}</span><span class="sum">${A.total}</span></div>
    <div class="strip note">${icon("sticky_note_2")}<span>${esc(A.note)}</span></div>`;

  KK.finish();
  const anchor = document.getElementById("t-00:31-agent");
  if (anchor) txEl.scrollTop = anchor.offsetTop - 6;
</script>
</body>
</html>
