<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · On the line, KK-24030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .onair { flex: none; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 18px; background: var(--red); color: #fff; border-bottom: 1px solid #5E0F0F; }
  .onair .big { display: inline-flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; }
  .onair .big .ms { font-size: 24px; }
  .onair .who3 { font-size: 13.5px; }
  .onair .meter i { background: rgba(255, 255, 255, .28); height: 16px; width: 5px; }
  .onair .meter i.on { background: #fff; }
  .onair .sp { flex: 1; }
  .onair .clk { display: flex; gap: 18px; font-size: 12px; }
  .onair .clk > span { display: flex; flex-direction: column; line-height: 1.2; }
  .onair .clk small { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .92; }
  .onair .clk b { font-family: var(--f-mono); font-size: 16px; }
  .page { gap: 10px; padding-top: 10px; }
  .hdr .tab { width: 38px; justify-content: center; gap: 4px; font-size: 11px; }
  .hdr .tab .ms { font-size: 22px; }
  .hdr .box { padding: 5px 11px; }
  .hdr .v { font-size: 13.5px; }
  .hdr .v.big { font-size: 15px; font-weight: 700; }

  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 408px minmax(0, 1fr) 300px; gap: 16px; }
  .histpane { display: flex; flex-direction: column; min-height: 0; }
  .hist { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px 10px; gap: 6px; position: relative; }
  .hr { display: grid; grid-template-columns: 42px 1fr; gap: 8px; font-size: 12.5px; line-height: 1.45; }
  .hr .t { font-family: var(--f-mono); font-size: 11.5px; color: var(--on-bay-2); padding-top: 1px; }
  .hr .w { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-bay-2); margin-right: 6px; }
  .hr .w.g { color: var(--ink); background: var(--on-bay); padding: 1px 4px; border-radius: var(--r); }
  .hr.sys .sysline { font-size: 11.5px; }
  .hk .strip .sbody { padding: 2px 10px 2px 10px; }
  .hk .amend { font-size: 12.5px; line-height: 2.3; }
  .hk .tab { font-size: 9.5px; padding: 6px 0; justify-content: space-between; width: 26px; }
  .hk .tab .hand { font-size: 13px; }
  .vacant { height: 70px; border: 1px dashed var(--on-bay-2); border-radius: var(--r); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--on-bay-2); font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; flex: none; }
  .vacant .ms { font-size: 18px; color: var(--on-bay); }

  .stage { display: flex; flex-direction: column; gap: 12px; min-height: 0; padding-top: 2px; }
  .lifted { flex-direction: column; box-shadow: var(--lift-hi); }
  .lifted .top { display: flex; border-bottom: 1px solid var(--rule); }
  .lifted .top .box { padding: 6px 12px; }
  .lifted .top .hold { width: 44px; flex: none; background: var(--st); border-right: 1px solid var(--ink); align-items: center; }
  .lifted .top .hold .hand { font-size: 20px; font-weight: 700; line-height: 1; }
  .lifted .top .v { font-size: 13px; }
  .lifted .live { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 12px; color: var(--pen); }
  .lifted .live .ms { font-size: 17px; }
  .lifted .prompt { padding: 30px 30px 26px 32px; }
  .lifted .amend { font-size: 27px; line-height: 2.6; }
  .lifted .amend .hw { font-size: 1.22em; font-weight: 700; }
  .lifted .amend .ahead { text-underline-offset: 7px; }
  .lifted .amend .nib .ms { font-size: 26px; vertical-align: -3px; }
  .lifted .key-row { display: flex; gap: 16px; padding: 7px 12px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink-2); flex-wrap: wrap; }
  .lifted .key-row span { display: inline-flex; gap: 6px; align-items: center; }
  .lifted .key-row .del { text-decoration: line-through; text-decoration-color: var(--pen); text-decoration-thickness: 1.7px; }
  .lifted .key-row .hand { font-size: 15px; line-height: 1; }
  .lifted .key-row .ahead { text-decoration: underline dotted rgba(18, 21, 19, .5); text-underline-offset: 4px; }
  .nextup .box { padding: 8px 12px; }
  .nextup .nx { font-size: 17px; line-height: 1.45; }
  .ctl { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 10px; margin-top: auto; }
  .ctl .key { height: 50px; font-size: 12.5px; }

  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .side .box { padding: 7px 10px; }
  .why { display: flex; gap: 7px; font-size: 12.5px; line-height: 1.4; }
  .why .ms { color: var(--red); font-size: 17px; }
  .evl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .evl > span { display: flex; gap: 7px; align-items: center; }
  .evl .ms { font-size: 15px; }
  .fact { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.4; }
  .fact .ms { font-size: 17px; margin-top: 1px; }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<div class="onair" role="status" id="onair"></div>
<main class="page">
  <section class="strip pri hdr" id="hdr" aria-label="Call details"></section>
  <div class="cols">
    <section class="histpane" aria-labelledby="h-h">
      <h2 class="plate" id="h-h"><span class="ms" aria-hidden="true">forum</span>Call so far<span class="c" id="h-c"></span></h2>
      <div class="rail hist" id="hist"></div>
    </section>

    <section class="stage" aria-label="Karaoke prompter">
      <article class="strip pri lifted" id="lifted"></article>
      <article class="strip nextup" id="next"></article>
      <div class="ctl">
        <button class="key key-bay"><span class="ms" aria-hidden="true">mic_off</span>Mute my mic</button>
        <button class="key key-bay"><span class="ms" aria-hidden="true">assignment_return</span>Hand back to Kiku</button>
        <button class="key key-red"><span class="ms" aria-hidden="true">call_end</span>End call</button>
      </div>
    </section>

    <aside class="side">
      <section class="strip pri" aria-label="Escalation"><div class="sbody" id="esc"></div></section>
      <section class="strip" aria-label="Booking"><div class="sbody" id="facts"></div></section>
    </aside>
  </div>
</main>
<script>
  const { D, esc, icon, status, hand, initials, glyph, meter, amended, txRow } = KK;
  KK.mountTower({ role: "specialist", active: "live" });
  const C = D.takeover;
  const me = D.people.specialist;
  const secs = (t) => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
  const mmss = (n) => `${String(Math.floor(n / 60)).padStart(2, "0")}:${String(n % 60).padStart(2, "0")}`;
  const onFor = mmss(secs(C.duration) - secs(C.takeoverAt));

  document.getElementById("onair").innerHTML = `
    <span class="big">${icon("mic", "fill")}You're on the line</span>
    <span class="who3">${esc(C.guest)} hears you. Kiku is writing your lines.</span>
    ${meter(16, 11)}
    <span class="sp"></span>
    <span class="clk">
      <span><small>Took over</small><b>${C.takeoverAt}</b></span>
      <span><small>On the line</small><b>${onFor}</b></span>
      <span><small>Call</small><b>${C.duration}</b></span>
    </span>`;

  const box = (lb, v, st = "", cls = "v") => `<div class="box" style="${st}"><span class="lb">${lb}</span><span class="${cls}">${v}</span></div>`;
  document.getElementById("hdr").innerHTML = `
    <div class="tab">${icon("call_received")}<span>IN</span></div>
    <div class="sbody"><div class="srow">
      ${box("Started", `<span class="tm">${C.started}</span>`, "flex:none")}
      ${box("Call", `<span class="cs">${C.id}</span>`, "flex:none")}
      ${box("Guest", esc(C.guest), "flex:none", "v big")}
      ${box("Phone", `<span class="tm">${esc(C.phone)}</span>`, "flex:none")}
      ${box("Purpose", esc(C.purpose), "flex:1")}
      ${box("Status", status(C.status), "flex:none")}
      ${box("Specialist", `<span class="sig">${hand(me.initials)}<span class="nm">You · on the line</span></span>`, "flex:none")}
    </div></div>`;

  const T = C.transcript;
  const K = T.filter((x) => x.karaoke);
  const cur = K.find((x) => x.live);
  const done = T.filter((x) => x !== cur);
  document.getElementById("h-c").textContent = `${K.length - 1} OF ${K.length} LINES DONE`;
  document.getElementById("hist").innerHTML = done.map((it) => {
    if (it.speaker === "system") return txRow(it, {}).replace('class="txr sys', 'class="hr sys').replace('<span class="t">', '<span class="t">');
    if (it.karaoke) {
      const n = K.indexOf(it) + 1;
      return `<div class="hr hk"><span class="t">${it.t}</span>
        <div class="strip pri"><div class="tab"><span>L${n}</span>${hand(me.initials)}</div><div class="sbody"><p class="amend">${amended(it.diff)}</p></div></div></div>`;
    }
    const w = it.speaker === "agent" ? `<span class="w">Kiku</span>` : `<span class="w g">Guest</span>`;
    return `<div class="hr"><span class="t">${it.t}</span><p>${w}${esc(it.text)}</p></div>`;
  }).join("") + `<div class="vacant">${icon("open_in_full")}L${K.length} lifted to the prompter</div>`;
  const hist = document.getElementById("hist");

  document.getElementById("lifted").innerHTML = `
    <div class="top">
      <div class="box hold">${hand(me.initials)}</div>
      ${box("Kiku wrote", `<span class="tm">${cur.t}</span>`, "flex:none")}
      ${box("Line", `<span class="cs">L${K.length}</span>`, "flex:none")}
      ${box("Match so far", `<span class="tm">${cur.match}%</span>`, "flex:none")}
      <div class="box grow row" style="justify-content:flex-end"><span class="live">${icon("edit", "fill")}You're speaking, live</span></div>
    </div>
    <div class="prompt"><p class="amend">${amended(cur.diff, { live: true })}</p></div>
    <div class="key-row">
      <span>Printed: Kiku wrote</span>
      <span><span class="del">struck</span> you dropped it</span>
      <span><span class="hand">pen</span> what you're saying</span>
      <span><span class="ahead">dotted</span> not reached yet</span>
    </div>`;

  document.getElementById("next").innerHTML = `
    <div class="tab">${glyph(16)}</div>
    <div class="sbody">
      <div class="srow"><div class="box grow"><span class="lb">Next line · Kiku wrote</span><p class="nx">${esc(C.nextLine)}</p></div></div>
    </div>`;

  const ev = (k) => T.find((x) => x.kind === k);
  document.getElementById("esc").innerHTML = `
    <div class="srow"><div class="box"><span class="lb">Escalation reason</span><span class="why">${icon("warning")}<span>${esc(C.escalationReason)}</span></span></div></div>
    <div class="srow"><div class="box"><span class="evl">
      <span>${icon("warning")}<b class="tm">${ev("escalation").t}</b> escalated</span>
      <span>${icon("headphones")}<b class="tm">${ev("join").t}</b> you joined</span>
      <span>${icon("record_voice_over")}<b class="tm">${ev("takeover").t}</b> you took over</span>
    </span></div></div>`;
  const fIcons = ["payments", "hourglass_top", "credit_card"];
  document.getElementById("facts").innerHTML = `
    <div class="srow"><div class="box"><span class="lb">Booking</span><span class="cs">${C.booking}</span></div></div>
    <div class="srow"><div class="box"><span class="lb">Stay</span><span class="v" style="font-size:12.5px">${esc(C.stay)}</span></div></div>
    <div class="srow"><div class="box" style="gap:7px"><span class="lb">Payment facts</span>
      ${C.facts.map((f, i) => `<span class="fact">${icon(fIcons[i])}<span>${esc(f)}</span></span>`).join("")}
    </div></div>`;
  /*icons:payments,hourglass_top,credit_card*/

  KK.finish();
  hist.scrollTop = hist.scrollHeight;
</script>
</body>
</html>
