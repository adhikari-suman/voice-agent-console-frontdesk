<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Listening to KK-24031</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .page { gap: 10px; padding-top: 10px; }
  .pagehead { min-height: 26px; gap: 14px; }
  .pagehead h1 { font-size: 18px; }
  .livetag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-weight: 700; font-size: 13px; padding: 3px 8px; border: 1px solid var(--arr); color: var(--arr); border-radius: var(--r); }
  .livetag .ms { font-size: 17px; }
  .hdr .tab { width: 38px; justify-content: center; gap: 4px; font-size: 11px; }
  .hdr .tab .ms { font-size: 22px; }
  .hdr .box { padding: 5px 11px; }
  .hdr .v { font-size: 13.5px; }
  .hdr .v.big { font-size: 15px; font-weight: 700; }

  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 14px; }
  .txpane { display: flex; flex-direction: column; min-height: 0; }
  .txrail { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 0 12px; gap: 0; position: relative; }
  .txr.latest { margin: 8px 14px 0 12px; padding: 0; grid-template-columns: 50px 1fr; }
  .latest .strip { display: flex; }
  .latest .strip .sbody { padding: 9px 14px; gap: 4px; }
  .latest .strip .q { font-size: 16px; line-height: 1.45; font-weight: 700; }
  .draft { margin: 10px 14px 0 12px; display: grid; grid-template-columns: 50px 1fr; column-gap: 12px; }
  .draft .t { font-family: var(--f-mono); font-size: 12px; color: var(--on-bay-2); padding-top: 10px; }
  .draftstrip { background: transparent; border: 1px dashed var(--on-bay-2); box-shadow: none; color: var(--on-bay); }
  .draftstrip > .tab { background: transparent; border-right: 1px dashed var(--on-bay-2); color: var(--on-bay); }
  .draftstrip .sbody { padding: 9px 14px; gap: 5px; }
  .draftstrip .dl { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-bay-2); }
  .draftstrip .dl .ms { font-size: 16px; color: var(--on-bay); }
  .draftstrip .dt { font-size: 15px; font-style: italic; color: var(--on-bay); line-height: 1.45; }
  .draftstrip .cur { display: inline-block; width: 8px; height: 16px; background: var(--key); vertical-align: -2px; margin-left: 3px; }
  .draftstrip .hint { font-size: 12px; color: var(--on-bay-2); }

  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .side .rail { padding: 10px; }
  .prow .box { padding: 6px 10px; }
  .prow .who2 { display: flex; align-items: center; gap: 9px; }
  .prow .who2 b { font-size: 13px; }
  .prow .who2 small { display: block; font-size: 11px; color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
  .prow .lvl { width: 150px; flex: none; justify-content: center; }
  .prow .state { width: 106px; flex: none; }
  .prow .st .ms { font-size: 16px; }
  .ctrls { display: flex; flex-direction: column; gap: 8px; }
  .ctrls .key-lg { height: 54px; font-size: 14px; width: 100%; }
  .ctrls .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ctrls .cap { font-size: 12px; color: var(--on-bay-2); line-height: 1.4; }
  .facts .box { padding: 6px 10px; }
  .act .box { padding: 7px 10px; }
  .act .v { font-size: 12.5px; display: flex; gap: 7px; align-items: flex-start; }
  .act .v .ms { font-size: 17px; }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<main class="page">
  <div class="pagehead">
    <a class="crumb" href="02-live-overview.html"><span class="ms" aria-hidden="true">arrow_back</span>Live board</a>
    <h1>Live call</h1>
    <span class="sub" id="sub"></span>
    <span class="sp"></span>
    <span class="livetag" id="live"></span>
  </div>

  <section class="strip arr hdr" id="hdr" aria-label="Call details"></section>

  <div class="cols">
    <section class="txpane" aria-labelledby="h-tx">
      <div class="plate"><span class="ms" aria-hidden="true">forum</span><span id="h-tx">Live transcript</span><span class="c" id="tx-c"></span></div>
      <div class="rail txrail" id="tx"></div>
    </section>

    <aside class="side">
      <section aria-labelledby="h-r">
        <h2 class="plate" id="h-r"><span class="ms" aria-hidden="true">graphic_eq</span>On the call</h2>
        <div class="rail" id="roster"></div>
      </section>
      <div class="ctrls">
        <a class="key key-primary key-lg is-hover" href="06-takeover-karaoke.html"><span class="ms" aria-hidden="true">record_voice_over</span>Take over</a>
        <p class="cap">You speak to the guest. Kiku keeps writing each line for you to use or change.</p>
        <div class="row2">
          <button class="key key-bay"><span class="ms" aria-hidden="true">volume_off</span>Mute audio</button>
          <a class="key key-bay" href="02-live-overview.html"><span class="ms" aria-hidden="true">logout</span>Leave call</a>
        </div>
      </div>
      <section aria-labelledby="h-f" style="min-height:0">
        <h2 class="plate" id="h-f"><span class="ms" aria-hidden="true">hotel</span>Call facts</h2>
        <div class="rail" id="facts"></div>
      </section>
    </aside>
  </div>
</main>
<script>
  const { D, esc, icon, status, hand, initials, glyph, meter, txRow } = KK;
  KK.mountTower({ role: "specialist", active: "live" });
  const L = D.liveCall;
  const me = D.people.specialist;
  document.getElementById("sub").textContent = `${L.id} · you joined to listen`;
  document.getElementById("live").innerHTML = `${icon("graphic_eq")}<span>LIVE ${L.duration}</span>`;

  const box = (lb, v, st = "", cls = "v") => `<div class="box" style="${st}"><span class="lb">${lb}</span><span class="${cls}">${v}</span></div>`;
  document.getElementById("hdr").innerHTML = `
    <div class="tab">${icon("call_received")}<span>IN</span></div>
    <div class="sbody">
      <div class="srow">
        ${box("Started", `<span class="tm">${L.started}</span>`, "flex:none")}
        ${box("Call", `<span class="cs">${L.id}</span>`, "flex:none")}
        ${box("Guest", esc(L.guest), "flex:none", "v big")}
        ${box("Phone", `<span class="tm">${esc(L.phone)}</span>`, "flex:none")}
        ${box("Booking", `<span class="cs">${L.booking}</span>`, "flex:none")}
        ${box("Stay", esc(L.stay), "flex:1")}
      </div>
      <div class="srow">
        ${box("Direction", `<span class="st">${icon("call_received")}Inbound · rang <span class="tm" style="font-weight:400">${esc(D.hotel.line)}</span></span>`, "flex:none")}
        ${box("Purpose", esc(L.purpose), "flex:1")}
        ${box("Status", status(L.status), "flex:none")}
        ${box("Elapsed", `<span class="tm">${L.duration}</span>`, "flex:none")}
        ${box("Specialist", `<span class="sig">${hand(me.initials)}<span class="nm">You · listening</span></span>`, "flex:none")}
      </div>
    </div>`;

  const T = L.transcript;
  const last = T[T.length - 1];
  const ctx = { guest: "Guest", specialist: "You" };
  document.getElementById("tx-c").textContent = `${T.length} LINES`;
  document.getElementById("tx").innerHTML =
    T.slice(0, -1).map((it) => txRow(it, ctx)).join("") +
    `<div class="txr latest"><span class="t">${last.t}</span>
       <div class="strip arr"><div class="tab">${icon("call_received")}</div><div class="sbody">
         <span class="lb">Guest · latest</span><p class="q">${esc(last.text)}</p>
       </div></div></div>
     <div class="draft"><span class="t">now</span>
       <div class="strip draftstrip"><div class="tab">${glyph(18)}</div><div class="sbody">
         <span class="dl">${icon("edit_note")}Kiku · ${esc(L.agentState.toLowerCase())}</span>
         <p class="dt">${esc(L.agentDraft)}<span class="cur" aria-hidden="true"></span></p>
         <p class="hint">Not spoken yet. Take over now if you'd rather answer yourself.</p>
       </div></div></div>`;
  const tx = document.getElementById("tx");

  const prow = (cls, tab, name, role, lvl, st) => `
    <div class="strip ${cls} prow"><div class="tab">${tab}</div><div class="sbody"><div class="srow">
      <div class="box grow"><span class="who2">${name ? `<span><b>${name}</b><small>${role}</small></span>` : ""}</span></div>
      <div class="box lvl">${lvl}</div>
      <div class="box state row">${st}</div>
    </div></div></div>`;
  document.getElementById("roster").innerHTML = [
    prow("arr", icon("call_received"), esc(L.guest), "Guest", meter(18, 12, "ink"), `<span class="st">${icon("graphic_eq")}Speaking</span>`),
    prow("", glyph(18), "Kiku", "Voice agent", meter(18, 1, "ink"), `<span class="st">${icon("edit_note")}Drafting</span>`),
    prow("", hand(me.initials), "You", esc(me.name), meter(18, 0, "ink"), `<span class="st">${icon("headphones")}Listening</span>`),
  ].join("");

  document.getElementById("facts").innerHTML = `
    <div class="strip facts"><div class="sbody">
      <div class="srow">${box("Booking", `<span class="cs">${L.booking}</span>`, "flex:none")}${box("Stay", esc(L.stay), "flex:1")}</div>
      <div class="srow">${box("Purpose", esc(L.purpose), "flex:1")}</div>
    </div></div>
    <p class="colhead" style="height:22px;margin-top:2px">Kiku has already</p>
    ${L.actionsTaken.map((a) => `<div class="strip arr act"><div class="sbody"><div class="box"><span class="v">${icon("check_box")}<span>${esc(a)}</span></span></div></div></div>`).join("")}`;

  KK.finish();
  tx.scrollTop = tx.scrollHeight;
</script>
</body>
</html>
