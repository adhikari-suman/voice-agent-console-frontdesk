<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Users · Kiku</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .main { display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr; height: 100vh; }
  .topbar { grid-column: 1; }
  .content { grid-column: 1; grid-row: 2; display: flex; flex-direction: column; min-height: 0; }
  .tablewrap { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  table.grid td { padding: 11px 10px; font-size: 13.5px; }
  table.grid td:first-child, table.grid th:first-child { padding-left: 18px; }
  table.grid td:last-child, table.grid th:last-child { padding-right: 18px; text-align: right; }
  .person { display: flex; gap: 10px; align-items: center; }
  .person .nm { font-weight: 700; }
  .person .em { font-size: 12.5px; color: var(--ink-3); }
  .role { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; }
  .role svg.lucide { width: 14px; height: 14px; }
  .role.Admin { color: var(--kiku-ink); }
  .ust { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
  .ust svg { width: 13px; height: 13px; }
  .ust.Active { color: var(--ok); }
  .ust.Invited { color: var(--human-ink); }
  .ust.Deactivated { color: var(--ink-3); }
  tr.off td { color: var(--ink-3); }
  tr.off .egg { opacity: .5; }
  .tk { font-family: var(--display); font-stretch: 80%; font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 8px; }
  .tk .bar { width: 60px; height: 6px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
  .tk .bar b { display: block; height: 100%; background: var(--human); }
  tr.new td { background: var(--human-soft); }

  .drawer { grid-column: 2; grid-row: 1 / span 2; background: var(--surface); box-shadow: -1px 0 0 var(--rule), -12px 0 32px rgba(43,22,51,.07); display: flex; flex-direction: column; min-height: 0; }
  .drawer .h { padding: 24px 24px 8px; display: flex; align-items: flex-start; gap: 12px; }
  .drawer .h h2 { font-family: var(--display); font-stretch: 112%; font-weight: 780; font-size: 21px; letter-spacing: -0.01em; }
  .drawer .h .x { margin-left: auto; }
  .drawer .body { padding: 12px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow: auto; }
  .rolecard { border-radius: 12px; box-shadow: inset 0 0 0 1px var(--rule-2); padding: 12px 14px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 10px; }
  .rolecard.on { box-shadow: inset 0 0 0 2px var(--ink); background: var(--surface); }
  .radio { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--rule-2); margin-top: 1px; }
  .rolecard.on .radio { box-shadow: inset 0 0 0 5px var(--ink); }
  .rolecard .rn { font-weight: 700; font-size: 14.5px; }
  .rolecard ul { grid-column: 2; list-style: none; display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .rolecard li { font-size: 13px; color: var(--ink-2); display: flex; gap: 7px; align-items: flex-start; }
  .rolecard li svg.lucide { width: 14px; height: 14px; margin-top: 2px; color: var(--ok); }
  .drawer .foot { padding: 14px 24px; border-top: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; }
  .drawer .foot .hint { margin-right: auto; }
</style>
</head>
<body>
<div class="app">
  <aside class="rail" data-role="admin" data-active="users"></aside>
  <main class="main">
    <header class="topbar"><div><h1>Users</h1><div class="sub">Who can sign in to Kiku, and what they can do.</div></div><div class="right"><button class="btn kiku"><i data-lucide="user-plus"></i>Add user</button></div></header>
    <section class="content">
      <div class="panel tablewrap"><div class="scroll"><table class="grid" id="tbl"></table></div></div>
    </section>
    <aside class="drawer" id="drawer"></aside>
  </main>
</div>
<script>
const { K, esc, ic } = UI;
const UST = {
  Active: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>`,
  Invited: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.4 2"/></svg>`,
  Deactivated: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 11L11 3" stroke="currentColor" stroke-width="1.6"/></svg>`,
};
const max = Math.max(...K.users.map(u => u.takeovers30d));
const d = K.newUserDraft;
document.getElementById("tbl").innerHTML = `
  <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th>Takeovers, 30 days</th></tr></thead>
  <tbody>${K.users.map(u => `<tr class="${u.status === "Deactivated" ? "off" : ""}">
    <td><div class="person"><span class="egg ${u.role === "Admin" ? "admin" : "human"}">${u.initials}</span><div><div class="nm">${u.name}</div><div class="em">${u.email}</div></div></div></td>
    <td><span class="role ${u.role}">${ic(u.role === "Admin" ? "shield" : "headphones")}${u.role}</span></td>
    <td><span class="ust ${u.status}">${UST[u.status]}${u.status}</span></td>
    <td style="white-space:nowrap">${u.lastActive}</td>
    <td><span class="tk">${u.role === "Specialist" ? `<span class="bar"><b style="width:${u.takeovers30d / max * 100}%"></b></span>` : ""}${u.role === "Admin" ? "<span style='color:var(--ink-3);font-weight:500'>n/a</span>" : u.takeovers30d}</span></td></tr>`).join("")}
  <tr class="new"><td><div class="person"><span class="egg human" style="opacity:.6">GM</span><div><div class="nm">${d.name}</div><div class="em">${d.email}</div></div></div></td>
    <td><span class="role">${ic("headphones")}${d.role}</span></td><td><span class="ust Invited" style="color:var(--kiku-ink)">${ic("pencil-line")}Not sent yet</span></td><td colspan="2" style="color:var(--ink-3)">Being added</td></tr>
  </tbody>`;

const roleCard = (r, desc) => `<div class="rolecard${d.role === r ? " on" : ""}"><span class="radio"></span><div><span class="rn">${r}</span> <span class="hint">${desc}</span></div>
  <ul>${K.roles[r].map(p => `<li>${ic("check")}${p}</li>`).join("")}</ul></div>`;
document.getElementById("drawer").innerHTML = `
  <div class="h"><span class="egg human">GM</span><div><h2>Add a user</h2><div class="hint">They get an email invite to set a password.</div></div><button class="btn sm ghost x" aria-label="Close">${ic("x")}</button></div>
  <div class="body">
    <label class="field"><span>Full name</span><div class="input">${d.name}</div></label>
    <label class="field"><span>Work email</span><div class="input focus">${d.email}</div></label>
    <div class="field"><span>Role</span>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${roleCard("Specialist", "Guest services")}
        ${roleCard("Admin", "Managers")}
      </div></div>
  </div>
  <div class="foot"><span class="hint">Invite goes to ${d.email.split("@")[0]}</span><button class="btn">Cancel</button><button class="btn kiku">${ic("send")}Send invite</button></div>`;
</script>
</body>
</html>
