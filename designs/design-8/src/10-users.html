<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .main2 { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 468px; }
  .page { padding-right: 18px; }
  :root { --ucols: minmax(0, 1fr) 112px 140px 176px 128px 46px; }
  .uhead { display: grid; grid-template-columns: 31px var(--ucols); height: 24px; align-items: center; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--on-bay-2); padding-right: 11px; flex: none; }
  .uhead span { padding: 0 10px; }
  .urack { flex: 1; min-height: 0; overflow: hidden; padding: 4px 10px 10px; gap: 6px; }
  .usr .sbody { display: grid; grid-template-columns: var(--ucols); }
  .usr .box { padding: 7px 10px; }
  .usr .nmc { display: flex; align-items: center; gap: 10px; }
  .usr .nmc b { font-size: 13.5px; }
  .usr .nmt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .usr .nmt .em { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .usr .you { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border: 1px solid var(--ink); border-radius: var(--r); margin-left: 6px; }
  .usr .em { font-family: var(--f-mono); font-size: 12px; }
  .usr .rl { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
  .usr .rl .ms { font-size: 17px; }
  .usr .la { font-size: 12.5px; }
  .usr .to { flex-direction: row; align-items: center; gap: 10px; }
  .usr .to b { font-family: var(--f-mono); font-size: 13px; width: 22px; text-align: right; }
  .usr .tbar { width: 80px; height: 6px; background: rgba(18, 21, 19, .12); border-radius: 1px; overflow: hidden; }
  .usr .tbar i { display: block; height: 100%; background: var(--ink); }
  .usr .ac { align-items: center; justify-content: center; padding: 0; }
  .usr .ac .key { width: 30px; height: 28px; padding: 0; }
  .usr.inv { background: var(--paper); border-style: dashed; }
  .usr.is-hover { background: #F4F7F5; }

  .panel2 { background: var(--bay-deep); border-left: 1px solid #151A18; box-shadow: -10px 0 24px rgba(0, 0, 0, .28); display: flex; flex-direction: column; min-height: 0; }
  .p2head { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--rail); flex: none; }
  .p2head h2 { font-size: 16px; font-weight: 700; display: inline-flex; gap: 8px; align-items: center; }
  .p2head .sp { flex: 1; }
  .p2body { flex: 1; min-height: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .p2body .entry .elabel { width: 96px; }
  .p2body .entry .efield { padding: 9px 11px; }
  .p2body .inp { height: 36px; font-size: 14px; }
  .rolehd { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
  .rolehd .lb2 { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--on-bay); }
  .rolehd .dim { font-size: 12px; }
  .choice { cursor: pointer; }
  .choice > .tab { justify-content: flex-start; padding-top: 12px; }
  .choice .sbody { padding: 10px 12px; gap: 6px; }
  .choice .rt { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 14px; }
  .choice .rt .ms { font-size: 18px; }
  .choice ul { list-style: none; margin: 0; padding: 0 0 0 26px; display: flex; flex-direction: column; gap: 4px; }
  .choice li { display: flex; gap: 7px; align-items: flex-start; font-size: 12.5px; line-height: 1.35; }
  .choice li .ms { font-size: 16px; }
  .choice.on { box-shadow: var(--lift), 0 0 0 1px var(--ink); --st: var(--key); }
  .choice:not(.on) { box-shadow: none; border-color: var(--rule-strong); }
  .p2foot { border-top: 1px solid var(--rail); padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px; flex: none; }
  .p2foot p { font-size: 12.5px; color: var(--on-bay-2); line-height: 1.45; }
  .p2foot .row { display: flex; gap: 10px; justify-content: flex-end; }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<div class="main2">
  <main class="page">
    <div class="pagehead">
      <h1>Users</h1>
      <span class="sub" id="sub"></span>
      <span class="sp"></span>
      <button class="key key-bay on" aria-pressed="true" aria-controls="newuser"><span class="ms" aria-hidden="true">person_add</span>Create user</button>
    </div>
    <div class="uhead"><span></span><span>Name · email</span><span>Role</span><span>Status</span><span>Last active</span><span>Takeovers 30 d</span><span></span></div>
    <div class="rail urack" id="users"></div>
  </main>

  <aside class="panel2" id="newuser" aria-labelledby="h-new">
    <div class="p2head">
      <h2 id="h-new"><span class="ms" aria-hidden="true">person_add</span>New user</h2>
      <span class="sp"></span>
      <button class="key key-bay key-ic" aria-label="Close"><span class="ms" aria-hidden="true">close</span></button>
    </div>
    <form class="p2body" onsubmit="return false">
      <div class="strip entry">
        <div class="tab"><span class="ms" aria-hidden="true">badge</span></div>
        <label class="elabel" for="n"><span class="lb">Name</span></label>
        <div class="efield"><input class="inp" id="n"></div>
      </div>
      <div class="strip entry">
        <div class="tab"><span class="ms" aria-hidden="true">mail</span></div>
        <label class="elabel" for="e"><span class="lb">Email</span></label>
        <div class="efield"><input class="inp is-focus" id="e" type="email"></div>
      </div>
      <div class="rolehd"><span class="lb2">Role</span><span class="dim">You can change it later</span></div>
      <div id="roles" style="display:flex;flex-direction:column;gap:8px" role="radiogroup" aria-label="Role"></div>
    </form>
    <div class="p2foot">
      <p id="foot"></p>
      <div class="row">
        <button class="key key-bay key-lg">Cancel</button>
        <button class="key key-primary key-lg"><span class="ms" aria-hidden="true">send</span>Send invite</button>
      </div>
    </div>
  </aside>
</div>
<script>
  const { D, esc, icon, glyph } = KK;
  KK.mountTower({ role: "admin", active: "users" });
  const U = D.users, me = D.people.admin, N = D.newUserDraft;
  const n = (s) => U.filter((u) => u.status === s).length;
  document.getElementById("sub").textContent = `${U.length} people · ${n("Active")} active · ${n("Invited")} invited · ${n("Deactivated")} deactivated`;

  const roleIcon = { Admin: "admin_panel_settings", Specialist: "support_agent" };
  const stIcon = { Active: "check_box", Invited: "forward_to_inbox", Deactivated: "block" };
  const max = Math.max(...U.map((u) => u.takeovers30d));
  const rows = U.map((u) => {
    const off = u.status === "Deactivated";
    const inv = u.status === "Invited";
    const self = u.email === me.email;
    return `
      <article class="strip usr ${off ? "fail" : ""} ${inv ? "inv" : ""} ${u.name === "Callum Reid" ? "is-hover" : ""}">
        <div class="tab">${icon(roleIcon[u.role])}</div>
        <div class="sbody">
          <div class="box"><span class="nmc"><span class="av">${u.initials}</span><span class="nmt"><span><b class="${off ? "struck" : ""}">${esc(u.name)}</b>${self ? `<span class="you">You</span>` : ""}</span><span class="em">${esc(u.email)}</span></span></span></div>
          <div class="box"><span class="rl">${esc(u.role)}</span></div>
          <div class="box row"><span class="st">${icon(stIcon[u.status])}${u.status}</span></div>
          <div class="box"><span class="la">${esc(u.lastActive)}</span></div>
          <div class="box to"><b>${u.takeovers30d}</b><span class="tbar"><i style="width:${(u.takeovers30d / max) * 100}%"></i></span></div>
          <div class="box ac"><button class="key key-paper" ${self ? "disabled" : ""} aria-label="${self ? "You can't change your own account here" : `Actions for ${esc(u.name)}`}">${icon("more_vert")}</button></div>
        </div>
      </article>`;
  });
  /*icons:admin_panel_settings,support_agent,forward_to_inbox,check_box,block,more_vert*/
  const rack = document.getElementById("users");
  rack.innerHTML = rows.join("");
  for (let i = 0; i < 12; i++) {
    const sl = rack.appendChild(Object.assign(document.createElement("div"), { className: "slot" }));
    if (rack.scrollHeight > rack.clientHeight) { sl.remove(); break; }
  }

  document.getElementById("n").value = N.name;
  document.getElementById("e").value = N.email;
  document.getElementById("roles").innerHTML = ["Specialist", "Admin"].map((r) => {
    const on = r === N.role;
    return `
      <label class="strip choice ${on ? "on" : ""}">
        <div class="tab">${icon(roleIcon[r])}</div>
        <div class="sbody">
          <span class="rt"><input class="rad" type="radio" name="role" ${on ? "checked" : ""}>${r}</span>
          <ul>${D.roles[r].map((p) => `<li>${icon("check")}<span>${esc(p)}</span></li>`).join("")}</ul>
        </div>
      </label>`;
  }).join("");
  document.getElementById("foot").textContent = `${N.name.split(" ")[0]} gets an email to set a password, and shows as Invited until the first sign-in.`;
  KK.finish();
</script>
</body>
</html>
