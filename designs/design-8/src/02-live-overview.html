<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku · Live board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=B612:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..24,400,0..1,0&icon_names=add,admin_panel_settings,arrow_back,arrow_forward,assignment_return,badge,block,call,call_end,call_made,call_received,campaign,check,check_box,close,confirmation_number,credit_card,data_object,description,do_not_disturb_on,done_all,download,edit,edit_note,error,event_upcoming,expand_more,forum,forward_to_inbox,graphic_eq,group,headphones,hotel,hourglass_top,info,list,lock,login,logout,mail,mic,mic_off,more_vert,open_in_full,pause_circle,payments,person,person_add,phone_in_talk,play_arrow,receipt_long,record_voice_over,remove,room_service,save,schedule,search,sell,send,sticky_note_2,subject,support_agent,table_view,today,upload_file,view_week,visibility,volume_off,warning&display=block">
<script src="../../_shared/data.js"></script>
<link rel="stylesheet" href="styles.css">
<script src="app.js"></script>
<style>
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, .94fr); gap: 14px; padding: 14px 16px 16px; }
  .baycol { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .baycol .rail { flex: 1; overflow: hidden; }
  .lstrip .box { padding: 6px 9px; }
  .lstrip .w-t { width: 58px; flex: none; }
  .lstrip .w-d { width: 74px; flex: none; }
  .lstrip .guest { font-weight: 700; font-size: 13.5px; }
  .lstrip .ph { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  .lstrip .purp { font-size: 12.5px; line-height: 1.4; }
  .lstrip .keys { gap: 6px; flex-direction: row; align-items: center; justify-content: flex-end; }
  .lstrip .keyrow { padding: 8px 9px; flex-direction: row; gap: 8px; }
  .lstrip .keyrow .key-primary { flex: 1; }
  .ringed { position: relative; display: inline-block; font-family: var(--f-mono); font-weight: 700; font-size: 17px; }
  .ringed { margin: 4px 0 2px 6px; }
  .ringed .penmark { left: -11px; top: -5px; width: calc(100% + 24px); height: calc(100% + 11px); }
  .reason { font-size: 12px; display: flex; gap: 6px; align-items: flex-start; }
  .reason .ms { color: var(--red); font-size: 16px; margin-top: 1px; }
  .jstrip .box { padding: 5px 9px; }
  .jstrip .out { font-size: 12px; line-height: 1.35; color: var(--ink); }
  .jstrip .w-t { width: 54px; flex: none; }
  a.jstrip { text-decoration: none; }
  .nm2 { display: flex; flex-direction: column; line-height: 1.2; font-size: 12.5px; }
  .nm2 small { font-size: 11.5px; color: var(--ink-2); }
  .railnote { margin-top: auto; flex: none; font-size: 12px; color: var(--on-bay-2); display: flex; gap: 8px; align-items: flex-start; padding: 2px 2px 0; line-height: 1.45; }
  .railnote .ms { font-size: 16px; color: var(--on-bay); margin-top: 1px; }
  .atis .more { margin-left: auto; color: var(--on-bay); }
</style>
</head>
<body>
<header class="tower" id="tower"></header>
<div class="atis" id="atis"></div>
<main class="board">
  <section class="baycol" aria-labelledby="h-need">
    <h2 class="plate hot" id="h-need"><span class="ms" aria-hidden="true">warning</span>Needs specialist<span class="c" id="c-need"></span></h2>
    <div class="rail" id="b-need"></div>
  </section>
  <section class="baycol" aria-labelledby="h-on">
    <h2 class="plate" id="h-on"><span class="ms" aria-hidden="true">support_agent</span>Specialist on line<span class="c" id="c-on"></span></h2>
    <div class="rail" id="b-on"></div>
  </section>
  <section class="baycol" aria-labelledby="h-kiku">
    <h2 class="plate" id="h-kiku"><span id="kglyph"></span>Kiku handling<span class="c" id="c-kiku"></span></h2>
    <div class="rail" id="b-kiku"></div>
  </section>
  <section class="baycol" aria-labelledby="h-land">
    <h2 class="plate" id="h-land"><span class="ms" aria-hidden="true">done_all</span>Just landed<span class="c" id="c-land"></span></h2>
    <div class="rail" id="b-land"></div>
  </section>
</main>
<script>
  const { D, esc, icon, status, kind, dirTab, route, initials, specParse, hand, glyph, ring } = KK;
  KK.mountTower({ role: "specialist", active: "live" });
  const me = D.people.specialist.name;
  const s = D.stats;

  document.getElementById("atis").innerHTML = `
    <span class="lbl">${icon("today")}Today</span>
    <span><b>${s.callsToday}</b> calls, <b>${s.inbound}</b> inbound and <b>${s.outbound}</b> outbound</span><span class="sep"></span>
    <span><b>${s.completed}</b> completed · <b>${s.inProgress}</b> in progress · <b>${s.escalated}</b> escalated · <b>${s.failed}</b> failed</span><span class="sep"></span>
    <span><b>${s.takeoversToday}</b> takeovers</span><span class="sep"></span>
    <span>average handle <b>${s.avgHandle}</b></span><span class="sep"></span>
    <span>upsell added <b>${s.upsellValueToday}</b></span>
    <a class="linkkey more" href="03-call-logs.html">All call logs${icon("arrow_forward")}</a>`;

  const live = D.calls.filter((c) => c.status === "in_progress" || c.status === "escalated");
  const need = live.filter((c) => c.status === "escalated" && !c.specialist);
  const onLine = live.filter((c) => c.specialist);
  const kiku = live.filter((c) => !c.specialist && c.status !== "escalated");
  const landed = D.calls.filter((c) => c.status === "completed" || c.status === "failed").slice(0, 5);

  function who(c) {
    const p = specParse(c);
    if (!p) return `<span class="kiku-only">${glyph(14)}Kiku only</span>`;
    const you = p.name === me;
    const note = p.note || (c.status === "escalated" ? "on the line" : "");
    return `<span class="sig">${hand(initials(p.name))}<span class="nm2"><b>${you ? "You" : esc(p.name)}</b>${note ? `<small>${esc(note)}</small>` : ""}</span></span>`;
  }

  function liveStrip(c) {
    const p = specParse(c);
    const lead = c.status === "escalated" && !c.specialist;
    const reason = c.escalationReason
      ? `<div class="srow"><div class="box grow"><span class="reason">${icon("warning")}<span>${esc(c.escalationReason)}</span></span></div></div>` : "";
    let action;
    if (lead) {
      action = `
        <div class="srow">
          <div class="box grow"><span class="lb">Waiting</span><span><span class="ringed">${c.waiting}${ring()}</span></span></div>
          <div class="box w-d"><span class="lb">Dur</span><span class="tm">${c.duration}</span></div>
        </div>
        <div class="srow"><div class="box grow keyrow">
          <a class="key key-primary key-lg is-focus" href="06-takeover-karaoke.html">${icon("record_voice_over")}Take over</a>
          <a class="key key-paper key-lg" href="05-live-call-listening.html">${icon("headphones")}Listen</a>
        </div></div>`;
    } else {
      let k;
      if (p && p.name === me && c.status === "escalated") k = `<a class="key key-paper key-sm" href="06-takeover-karaoke.html" aria-label="Open your call with ${esc(c.guest)}">${icon("phone_in_talk")}Open</a>`;
      else if (p && p.name === me) k = `<a class="key key-paper key-sm" href="05-live-call-listening.html">${icon("headphones")}Open</a>`;
      else k = `<a class="key key-paper key-sm${c.id === "KK-24029" ? " is-hover" : ""}" href="05-live-call-listening.html">${icon("headphones")}Listen</a>`;
      action = `
        <div class="srow">
          <div class="box grow row">${who(c)}</div>
          <div class="box w-d"><span class="lb">Dur</span><span class="tm">${c.duration}</span></div>
          <div class="box keys">${k}</div>
        </div>`;
    }
    return `
      <article class="strip ${kind(c)} lstrip">
        <div class="tab">${dirTab(c)}</div>
        <div class="sbody">
          <div class="srow">
            <div class="box w-t"><span class="tm">${c.started}</span></div>
            <div class="box"><span class="cs">${c.id}</span></div>
            <div class="box grow row">${status(c.status)}</div>
          </div>
          <div class="srow">
            <div class="box grow"><span class="guest">${esc(c.guest)}</span><span class="ph">${esc(c.phone)}</span></div>
            <div class="box" style="flex:none"><span class="lb">Type</span><span class="v" style="font-size:12px;white-space:nowrap">${esc(c.type)}</span></div>
          </div>
          <div class="srow"><div class="box grow"><span class="purp">${esc(c.purpose)}</span></div></div>
          ${reason}
          ${action}
        </div>
      </article>`;
  }

  function landedStrip(c) {
    const p = specParse(c);
    const f = c.status === "failed";
    const tag = c.id === D.audit.id ? "a" : "article";
    return `
      <${tag} class="strip ${kind(c)} jstrip" ${tag === "a" ? 'href="04-call-audit.html"' : ""}>
        <div class="tab">${dirTab(c)}${p ? hand(initials(p.name)) : ""}</div>
        <div class="sbody">
          <div class="srow">
            <div class="box w-t"><span class="tm">${c.started}</span></div>
            <div class="box"><span class="cs ${f ? "struck" : ""}">${c.id}</span></div>
            <div class="box grow row">${status(c.status)}</div>
          </div>
          <div class="srow">
            <div class="box grow"><span class="v b ell ${f ? "struck" : ""}">${esc(c.guest)}</span></div>
            <div class="box" style="flex:none"><span class="v" style="font-size:12px">${c.direction === "inbound" ? "Inbound" : esc(c.type)}</span></div>
            <div class="box" style="flex:none"><span class="tm">${c.duration}</span></div>
          </div>
          <div class="srow"><div class="box grow"><span class="out">${esc(c.outcome)}</span></div></div>
        </div>
      </${tag}>`;
  }

  function fill(id, html, note) {
    const rail = document.getElementById(id);
    rail.innerHTML = html;
    const n = note ? rail.appendChild(Object.assign(document.createElement("p"), { className: "railnote", innerHTML: note })) : null;
    for (let i = 0; i < 12; i++) {
      const sl = Object.assign(document.createElement("div"), { className: "slot" });
      rail.insertBefore(sl, n);
      if (rail.scrollHeight > rail.clientHeight) { sl.remove(); break; }
    }
  }

  document.getElementById("kglyph").innerHTML = glyph(20);
  document.getElementById("c-need").textContent = need.length;
  document.getElementById("c-on").textContent = onLine.length;
  document.getElementById("c-kiku").textContent = kiku.length;
  document.getElementById("c-land").textContent = `LAST ${landed.length}`;
  fill("b-need", need.map(liveStrip).join(""), `${icon("info")}<span>Escalated calls wait in this bay until a specialist takes over. The oldest wait sits at the top.</span>`);
  fill("b-on", onLine.map(liveStrip).join(""));
  fill("b-kiku", kiku.map(liveStrip).join(""));
  fill("b-land", landed.map(landedStrip).join(""));
  KK.finish();
</script>
</body>
</html>
