<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku · Users</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="styles.css">
<script src="vendor/lucide.min.js"></script>
<script src="../../_shared/data.js"></script><script src="app.js"></script>
<style>
.hrow{display:flex;align-items:flex-end;gap:16px}
.hrow p{color:var(--ink-2)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;flex:1;min-height:0}
td{font-size:13px;padding:9px 10px}th{padding:10px}
.person{display:flex;align-items:center;gap:10px}
.person .av{background:var(--paper);color:var(--ink);border-color:var(--line-2)}
.person b{font-weight:600;display:block;line-height:1.2}
.person span.e{font-size:12px;color:var(--ink-3)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.us{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.us svg{width:13px;height:13px}
.us.Active{color:var(--green)} .us.Invited{color:var(--orchid-deep)} .us.Deactivated{color:var(--ink-3)}
tr.off td{color:var(--ink-3)}
tr.off .person b{color:var(--ink-3)}
.tk{font-family:var(--display);font-weight:650;font-size:15px}
.tkbar{display:inline-block;height:6px;border-radius:3px;background:var(--saffron);vertical-align:middle;margin-left:8px}
.new{border-color:var(--rail);box-shadow:inset 0 4px 0 var(--orchid)}
.new .panel-b{display:flex;flex-direction:column;gap:14px}
.rc{border:1px solid var(--line-2);border-radius:6px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;cursor:pointer}
.rc.on{border-color:var(--rail);background:var(--sunk);box-shadow:0 0 0 1px var(--rail)}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;margin-top:1px}
.rc.on .radio{border-color:var(--rail)}
.rc.on .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--rail)}
.rc h3{font-size:14px}
.rc ul{grid-column:2;margin-top:4px}
.rc li{list-style:none;font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;padding:2px 0}
.rc li svg,.rc li [data-lucide]{width:14px;height:14px;color:var(--green)}
.grid>section:first-child{align-self:start;max-height:100%}
.after{border:1px dashed var(--line-2);border-radius:6px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px}
.actions{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);flex:none;align-items:center}
</style></head>
<body>
<div class="app"><nav class="rail" id="rail"></nav>
<main id="main"></main></div>
<script>
rail("admin", "users");
const US = K.users, N = K.newUserDraft, R = K.roles;
const USH = {
  Active: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>`,
  Invited: `<svg viewBox="0 0 14 14"><path d="M1.5 3.5h11v7h-11z M1.5 3.5L7 8l5.5-4.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`,
  Deactivated: `<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 11L11 3" stroke="currentColor" stroke-width="1.4"/></svg>`,
};
const max = Math.max(...US.map(u => u.takeovers30d));
const rows = US.map(u => `<tr class="${u.status === "Deactivated" ? "off" : ""}">
  <td><div class="person"><span class="av">${u.initials}</span><div><b>${esc(u.name)}</b><span class="e">${u.email}</span></div></div></td>
  <td><span class="role">${u.role === "Admin" ? `<i data-lucide="shield"></i>` : `<i data-lucide="headset"></i>`}${u.role}</span></td>
  <td><span class="us ${u.status}">${USH[u.status]}${u.status}</span></td>
  <td class="muted" style="white-space:nowrap">${esc(u.lastActive)}</td>
  <td style="white-space:nowrap">${u.role === "Specialist" ? `<span class="tk">${u.takeovers30d}</span>${u.takeovers30d ? `<span class="tkbar" style="width:${u.takeovers30d / max * 48}px"></span>` : ""}` : `<span class="dim">n/a</span>`}</td>
  <td style="text-align:right;width:40px;padding:0 6px 0 0"><button class="btn sm ghost" style="padding:0 6px" aria-label="More for ${esc(u.name)}"><i data-lucide="more-horizontal"></i></button></td></tr>`).join("");
const rc = (role, on) => `<div class="rc ${on ? "on" : ""}"><span class="radio"></span><h3>${role}</h3>
  <ul>${R[role].map(p => `<li><i data-lucide="check"></i>${esc(p)}</li>`).join("")}</ul></div>`;
document.getElementById("main").innerHTML = topbar(`Team <span class="dim">/</span> <b>Users</b>`) + `
<div class="page">
  <div class="hrow"><h1>Users</h1><p>${US.filter(u => u.status === "Active").length} active, ${US.filter(u => u.status === "Invited").length} invited, ${US.filter(u => u.status === "Deactivated").length} deactivated</p>
    <button class="btn sm primary" style="margin-left:auto" disabled><i data-lucide="user-plus"></i>New user</button></div>
  <div class="grid">
    <section class="panel">
      <div class="scroll" style="flex:1"><table>
        <thead><tr><th>Name</th><th>Role</th><th>Status</th><th>Last active</th><th>Takeovers (30 d)</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </section>
    <section class="panel new">
      <div class="panel-h"><h2>New user</h2><button class="btn sm ghost act" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div class="panel-b scroll" style="flex:1">
        <div class="field"><label>Full name</label><div class="input">${esc(N.name)}</div></div>
        <div class="field"><label>Work email</label><div class="input">${N.email}</div><span class="hint">The invite link goes to this address.</span></div>
        <div class="field"><label>Role</label>
          <div style="display:flex;flex-direction:column;gap:10px">${rc("Specialist", N.role === "Specialist")}${rc("Admin", N.role === "Admin")}</div></div>
        <div class="after"><span class="us Invited">${USH.Invited}</span><span>${esc(N.name.split(" ")[0])} appears in the list as <b>Invited</b> until she accepts. You can change her role later.</span></div>
      </div>
      <div class="actions"><button class="btn ghost">Cancel</button><button class="btn primary"><i data-lucide="send"></i>Send invite</button></div>
    </section>
  </div>
</div>`;
icons();
</script>
</body></html>
