<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku · Make a call</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="styles.css">
<script src="vendor/lucide.min.js"></script>
<script src="../../_shared/data.js"></script><script src="app.js"></script>
<link rel="stylesheet" href="outbound.css">
<style>
.paths{grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr)}
.purpose{min-height:112px;font-size:14px}
.count{font-size:12px;color:var(--ink-3);text-align:right}
.tbl td.pp{color:var(--ink-2);line-height:1.35}
.explain{border-left:3px solid var(--orchid);padding:4px 0 4px 14px;font-size:13px;color:var(--ink-2)}
</style>
</head>
<body>
<div class="app"><nav class="rail" id="rail"></nav>
<main id="main"></main></div>
<script>
rail("admin", "make");
const S = K.makeCallSingle, V = K.makeCallCsv;
const prev = V.preview.map(r => `<tr class="${r.ok ? "" : "bad"}"><td class="rn">${r.row}</td>
  <td style="white-space:nowrap">${r.phone ? esc(r.phone) : `<span class="miss">empty</span>`}</td>
  <td style="white-space:nowrap">${r.name ? esc(r.name) : `<span class="dim">No name</span>`}</td>
  <td class="pp">${esc(r.purpose)}${r.ok ? "" : `<div class="st failed" style="margin-top:4px;display:flex">${SHAPES.failed}${esc(r.error)}</div>`}</td>
  <td>${r.ok ? `<span class="st completed" style="font-weight:500">${SHAPES.completed}Ready</span>` : `<span class="st failed">${SHAPES.failed}Skipped</span>`}</td></tr>`).join("");
document.getElementById("main").innerHTML = topbar(`Outbound <span class="dim">/</span> <b>Make a call</b>`) + `
<div class="page">
  <div class="hrow"><h1>Make a call</h1><p>Tell Kiku who to ring and why. It handles the conversation and logs the result.</p></div>
  <div class="paths">
    <section class="panel">
      <div class="panel-h"><span class="pn">A</span><h2>One call</h2></div>
      <div class="panel-b" style="display:flex;flex-direction:column;gap:14px">
        <div class="field"><label for="pu">What is the call for?</label>
          <textarea id="pu" class="input purpose">${esc(S.purpose)}</textarea>
          <span class="hint">Write it as you'd brief a colleague. Kiku opens with this and answers follow-up questions.</span></div>
        <div class="field"><label>Guest name <span class="opt">(optional)</span></label><div class="input">${esc(S.name)}</div></div>
        <div class="field"><label>Phone</label><div class="input">${S.phone}</div></div>
      </div>
      <div class="actions"><span class="small dim" style="margin-right:auto">Kiku calls from ${K.hotel.line}</span><button class="btn primary"><i data-lucide="phone-outgoing"></i>Place call</button></div>
    </section>
    <section class="panel">
      <div class="panel-h"><span class="pn">B</span><h2>Many calls from a CSV</h2><span class="dim small">Columns: ${V.columns.map(c => `<code>${c}</code>`).join(" ")}</span></div>
      <div class="panel-b" style="display:flex;flex-direction:column;gap:12px">
        <div class="file"><span class="ic"><i data-lucide="file-spreadsheet"></i></span>
          <div><b>${V.file}</b> <span class="dim small">${V.size} · ${V.rows} rows</span><div class="rows"><span class="st completed" style="font-weight:500">${SHAPES.completed}${V.ready} ready</span><span class="st failed" style="font-weight:500">${SHAPES.failed}${V.errors} error</span></div></div>
          <button class="btn sm ghost">Replace</button></div>
        <div class="tbl scroll"><table><thead><tr><th>Row</th><th>phone</th><th>name</th><th>purpose</th><th></th></tr></thead><tbody>${prev}</tbody></table></div>
        <div class="tmpl"><i data-lucide="file-down"></i><span>Not sure about the format? Start from the template: one row per call, name can be left blank.</span><a href="#"><i data-lucide="download"></i>Download template</a></div>
      </div>
      <div class="actions"><span class="small dim" style="margin-right:auto">Row 6 is skipped until it has a phone number</span><button class="btn primary"><i data-lucide="phone-outgoing"></i>Place ${V.ready} calls</button></div>
    </section>
  </div>
</div>`;
icons();
</script>
</body></html>
