<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Kiku · Call audit KK-24027</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="styles.css">
<script src="vendor/lucide.min.js"></script>
<script src="../../_shared/data.js"></script><script src="app.js"></script>
<style>
.page{flex-direction:row;gap:22px}
/* left: the call file */
.file{width:318px;flex:none;display:flex;flex-direction:column;gap:16px;min-height:0;overflow:auto;padding-right:2px}
.file::-webkit-scrollbar{width:0}
.file .id{font-size:12.5px;color:var(--ink-3)}
.file h1{font-size:30px;margin-top:2px}
.file .tags{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.play{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--rail);color:#fff;border-radius:6px;padding:10px 12px}
.play .b{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--rail);display:grid;place-items:center}
.play .t{font-size:12px;color:var(--rail-ink);line-height:1.3}
.play .t b{font-family:var(--display);font-size:16px;color:#fff;font-weight:600}
.play .dl{color:var(--rail-ink)}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13px}
dl.facts dt{color:var(--ink-3)}
dl.facts dd{font-weight:500}
.twin{margin:2px 0}
.out h2{margin-bottom:8px}
.out li{list-style:none;display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13px;align-items:start}
.out li [data-lucide],.out li svg{width:15px;height:15px;margin-top:2px}
.out li.dec{color:var(--ink-3)} .out li.dec .it{text-decoration:line-through}
.out .tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:8px;margin-top:2px}
.out .tot .num{font-size:26px;font-stretch:115%}
.note{display:flex;gap:8px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
/* right: transcript with a vertical recording spine */
.hist{flex:1;min-width:0}
.hist .panel-h{flex-wrap:wrap;row-gap:8px}
.dials{display:flex;gap:6px;align-items:center;margin-left:auto}
.dial{width:30px;height:30px;position:relative;flex:none}
.dial svg{width:30px;height:30px;transform:rotate(-90deg)}
.dial span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--ink-2)}
.sumline{font-size:12.5px;color:var(--ink-2);margin-left:10px}
.sumline b{color:var(--ink)}
.body{display:grid;grid-template-columns:62px minmax(0,1fr);flex:1;min-height:0}
.spine{position:relative;border-right:1px solid var(--line);background:var(--sunk)}
.spine .bars{position:absolute;top:18px;bottom:18px;left:10px;right:10px;display:flex;flex-direction:column;justify-content:space-between}
.spine .bars i{display:block;height:2px;border-radius:1px;margin:0 auto}
.spine .mk{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--ink)}
.spine .mk b{position:absolute;left:50%;transform:translate(-50%,-50%);top:0;font-size:9.5px;font-weight:700;background:var(--surface);border:1px solid currentColor;border-radius:3px;padding:0 3px;line-height:14px;z-index:2}
.spine .win{position:absolute;left:3px;right:3px;border:1.5px solid var(--ink);border-radius:3px;background:rgba(255,255,255,.35)}
.spine .ph{position:absolute;left:0;right:0;border-top:2px solid var(--rail)}
.spine .ph::before{content:"";position:absolute;left:-1px;top:-5px;border:4px solid transparent;border-left:6px solid var(--rail)}
.spine .end{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;color:var(--ink-3)}
.tr{padding:4px 22px 18px}
.turn{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.turn .t{font-size:12px;color:var(--ink-3);padding-top:2px}
.turn .txt{font-size:14px;max-width:78ch;margin-top:2px}
.turn.guest .txt{color:var(--ink-2)}
.sysline{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.sysline.escalation,.sysline.takeover{color:var(--saffron-deep)} .sysline.join{color:var(--ink-2)} .sysline.end{color:var(--ink-3)}
.sysline::after{content:"";flex:1;height:4px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2);margin-left:6px}
.turn.sys{padding:8px 0}
.kara .meta{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.kara .meta .n{font-size:12px;color:var(--ink-3)}
.pct{margin-left:auto;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.aswritten{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--green);background:var(--green-wash);padding:2px 8px;border-radius:3px}
.aswritten svg{width:13px;height:13px}
.same1{font-size:14.5px;font-weight:500;padding:8px 12px;border:1px solid #A9D6BC;border-radius:4px;background:var(--green-wash)}
</style></head>
<body>
<div class="app"><nav class="rail" id="rail"></nav>
<main id="main"></main></div>
<script>
rail("specialist", "logs");
const A = K.audit;
const sec = t => { const [m, s] = t.split(":").map(Number); return m * 60 + s; };
const dur = sec(A.duration), pct = t => sec(t) / dur * 100;
const dial = (m, ok) => { const c = 2 * Math.PI * 12; return `<span class="dial" title="${m}% as written"><svg viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="15" cy="15" r="12" fill="none" stroke="${ok ? "var(--green)" : "var(--saffron)"}" stroke-width="4" stroke-dasharray="${c * m / 100} ${c}"/></svg><span>${m}</span></span>`; };
const r = rng(24027); let bars = "";
for (let i = 0; i < 120; i++) {
  const p = i / 120 * 100, v = .25 + r() * .75;
  const col = p < pct("00:36") ? "var(--orchid)" : p < pct("00:52") ? "var(--line-2)" : "var(--saffron)";
  bars += `<i style="width:${v * 100}%;background:${col}"></i>`;
}
let kn = 0;
const hist = A.transcript.map(t => {
  if (t.speaker === "system") {
    const ic = { escalation: SHAPES.escalated, join: `<i data-lucide="headphones"></i>`, takeover: `<i data-lucide="mic"></i>`, end: `<i data-lucide="phone-off"></i>` }[t.kind];
    return `<div class="turn sys"><span class="t">${t.t}</span><div class="sysline ${t.kind} st">${ic}${esc(t.text)}</div></div>`;
  }
  if (t.karaoke) {
    kn++;
    const head = t.asWritten
      ? `<span class="aswritten">${SHAPES.completed.replace('fill="currentColor"', 'fill="#2B8756"')}Spoken as written</span>`
      : `<span class="who human"><span class="dot"></span>Tomasz improvised</span>`;
    const body = t.asWritten ? `<p class="same1">${esc(t.said)}</p>` : ribbon(t, { name: "Tomasz said" });
    return `<div class="turn"><span class="t">${t.t}</span><div class="kara">
      <div class="meta">${head}<span class="n">Karaoke line ${kn} of ${A.karaokeSummary.lines}</span><span class="pct">${t.match}% as written ${dial(t.match, t.asWritten)}</span></div>${body}</div></div>`;
  }
  const who = t.speaker === "agent" ? `<span class="who kiku"><span class="dot"></span>Kiku</span>` : `<span class="who guest"><span class="dot"></span>${esc(A.guest)}</span>`;
  return `<div class="turn ${t.speaker}"><span class="t">${t.t}</span><div>${who}<p class="txt">${esc(t.text)}</p></div></div>`;
}).join("");
const kl = A.transcript.filter(t => t.karaoke);
document.getElementById("main").innerHTML = topbar(`Call logs <span class="dim">/</span> <b>${A.id}</b>`) + `
<div class="page">
  <aside class="file">
    <div>
      <span class="id">${A.id} · ${A.started}</span>
      <h1>${esc(A.guest)}</h1>
      <div class="tags">${status(A.status)}<span class="tag"><i data-lucide="phone-outgoing"></i>Outbound · ${A.type}</span></div>
    </div>
    <div class="play"><button class="b" aria-label="Play recording"><i data-lucide="play"></i></button>
      <div class="t"><b>01:12</b> / ${A.duration}<br>Recording, both voices</div>
      <button class="btn sm ghost dl" aria-label="Download transcript"><i data-lucide="download"></i></button></div>
    <dl class="facts">
      <dt>Phone</dt><dd>${A.phone}</dd>
      <dt>Booking</dt><dd>${A.booking}</dd>
      <dt>Stay</dt><dd>${esc(A.stay)}</dd>
      <dt>Purpose</dt><dd>${esc(A.purpose)}</dd>
      <dt>Handled by</dt><dd><span class="who kiku" style="font-weight:500"><span class="dot"></span>${A.agent}</span>, then <span class="who human" style="font-weight:500;color:var(--ink)"><span class="dot"></span>${A.specialist}</span></dd>
    </dl>
    <div class="twin"></div>
    <section class="out">
      <h2>Outcome</h2>
      <ul>${A.outcome.map(o => `<li class="${o.result === "added" ? "" : "dec"}">${o.result === "added" ? `<i data-lucide="plus-circle" style="color:var(--green)"></i>` : `<i data-lucide="x-circle"></i>`}<span><span class="it">${esc(o.item)}</span><br><span class="small dim">${o.result === "added" ? "Added to booking" : "Declined by guest"}</span></span><b>${o.amount}</b></li>`).join("")}</ul>
      <div class="tot"><span class="muted small">Added to ${A.booking}</span><span class="num">${A.total}</span></div>
      <p class="note"><i data-lucide="sticky-note"></i>${esc(A.note)}</p>
    </section>
  </aside>
  <section class="panel hist">
    <div class="panel-h"><h2>Message history</h2><span class="sumline"><b>${A.karaokeSummary.lines}</b> karaoke lines: <b>${A.karaokeSummary.asWritten}</b> as written, <b>${A.karaokeSummary.improvised}</b> improvised</span>
      <span class="dials">${kl.map(t => dial(t.match, t.asWritten)).join("")}</span></div>
    <div style="padding:8px 22px;border-bottom:1px solid var(--line);background:var(--sunk)">${ribbonLegend()}</div>
    <div class="body">
      <div class="spine" aria-label="Recording timeline">
        <div class="bars">${bars}</div>
        <span class="mk" style="top:calc(18px + (100% - 36px) * ${pct("00:36") / 100});border-color:var(--saffron-deep)"><b style="color:var(--saffron-deep)">00:36</b></span>
        <span class="mk" style="top:calc(18px + (100% - 36px) * ${pct("00:52") / 100})"><b>00:52</b></span>
        <span class="ph" style="top:calc(18px + (100% - 36px) * ${pct("01:12") / 100})"></span>
        <span class="win" id="win"></span>
        <span class="end" style="top:3px">00:00</span><span class="end" style="bottom:3px">${A.duration}</span>
      </div>
      <div class="scroll tr" id="tr">${hist}</div>
    </div>
  </section>
</div>`;
icons();
const tr = document.getElementById("tr");
tr.scrollTop = tr.querySelectorAll(".turn")[3].offsetTop - tr.offsetTop;
drawRibbons();
const win = document.getElementById("win"), sp = win.parentElement.getBoundingClientRect();
const f = x => 18 + (sp.height - 36) * x;
win.style.top = f(sec("00:21") / dur) - 3 + "px"; win.style.height = f(sec("01:12") / dur) - f(sec("00:21") / dur) + 6 + "px";
</script>
</body></html>
