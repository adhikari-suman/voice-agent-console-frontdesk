<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku, sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  body { display: grid; place-items: center; position: relative; }
  .track { height: 8px !important; }
  .track { position: absolute; left: 0; right: 0; height: 6px; border-radius: 3px; }
  .track.k { top: calc(50% - 16px); background: var(--desk); left: 0; right: 52%; border-radius: 0 3px 3px 0; }
  .track.h { top: calc(50% + 4px); background: var(--human); left: 55%; right: 0; border-radius: 3px 0 0 3px; }
  .card { position: relative; width: 420px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 18px; padding: 40px 40px 30px; box-shadow: 0 24px 60px -30px rgba(30,26,46,.35); }
  .brand-lg { display: flex; align-items: center; gap: 14px; }
  .brand-lg .mark { width: 30px; gap: 5px; }
  .brand-lg .mark i { height: 5px; border-radius: 3px; }
  .brand-lg .mark i:first-child { background: var(--desk); width: 30px; }
  .brand-lg .mark i:last-child { background: var(--human); width: 20px; margin-left: 10px; }
  .brand-lg .wm { font-family: var(--display); font-size: 50px; font-weight: 800; font-variation-settings: "wdth" 80; line-height: 1; letter-spacing: -0.02em; }
  .hotel { margin-top: 10px; font-size: 15px; color: var(--ink-2); }
  form { margin-top: 30px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; }
  .row a { font-size: 13px; color: var(--ink-2); }
  .btn.full { width: 100%; justify-content: center; margin-top: 8px; }
  .note { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--ink-3); display: flex; gap: 8px; }
  .note svg.lucide { width: 14px; height: 14px; margin-top: 1px; }
  .line { position: absolute; bottom: 0; left: 0; right: 0; height: 68px; background: var(--desk); border-top: 1px solid var(--desk-2); display: flex; align-items: center; justify-content: center; font-size: 13px; color: #3D3300; }
</style>
</head>
<body>
<span class="track k"></span><span class="track h"></span>
<main class="card">
  <div class="brand-lg"><svg viewBox="0 0 30 18" style="width:46px;height:28px"><path d="M5 13C12 13 18 5 25 5" stroke="#1C1C1A" stroke-width="2" fill="none"/><circle cx="5" cy="13" r="4" fill="#1C1C1A"/><circle cx="25" cy="5" r="4" fill="#C8372A"/></svg><span class="wm">Kiku</span></div>
  <div class="hotel" id="hotel"></div>
  <form onsubmit="return false">
    <div class="field"><label class="fl" for="em">Email</label><input id="em" class="input" type="email" value="priya.raman@brenlow.example"></div>
    <div class="field"><div class="row"><label class="fl" for="pw">Password</label><a href="#">Forgot password?</a></div><input id="pw" class="input focus" type="password" value="kikudemo2026"></div>
    <button class="btn lg primary full">Sign in</button>
  </form>
  <div class="note"><i data-lucide="flask-conical"></i><span id="demo"></span></div>
</main>
<div class="line" id="line"></div>
<script>
document.getElementById("hotel").textContent = `${K.hotel.name}, ${K.hotel.city}`;
document.getElementById("demo").textContent = K.synthetic;
document.getElementById("line").textContent = `${K.product.tagline} for the hotel line ${K.hotel.line}`;
done();
</script>
</body>
</html>
