<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku, campaign calls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  .cols { display: grid; grid-template-columns: 430px 1fr; gap: 16px; height: 100%; }
  .camp { padding: 16px 18px; border-bottom: 1px solid var(--rule); position: relative; }
  .camp:last-child { border-bottom: 0; }
  .camp.sel { background: #FFF6CC; }
  .camp .top { display: flex; align-items: center; gap: 10px; }
  .code { font-weight: 700; font-size: 15px; letter-spacing: .02em; }
  .camp .top .tag { margin-left: auto; }
  .camp .nm { font-family: var(--display); font-weight: 600; font-size: 18px; margin-top: 2px; }
  .camp .of { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .camp .meta { font-size: 12.5px; color: var(--ink-3); margin-top: 8px; display: flex; gap: 6px 14px; flex-wrap: wrap; }
  .camp .meta span { white-space: nowrap; }
  .camp .meta span { display: inline-flex; gap: 5px; align-items: center; }
  .camp .meta svg.lucide { width: 13px; height: 13px; }
  .funnel { margin-top: 12px; }
  .funnel .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sheet-2); border: 1px solid var(--rule); }
  .funnel .bar i { display: block; height: 100%; }
  .funnel .legend { display: grid; grid-template-columns: repeat(5, auto); justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--ink-3); }
  .funnel .legend b { display: block; font-size: 16px; color: var(--ink); font-weight: 600; }
  .today { padding: 16px 18px; border-top: 1px solid var(--rule); background: var(--sheet-2); }
  .tc { display: grid; grid-template-columns: 44px 1fr auto 110px; gap: 10px; align-items: center; padding: 6px 0; font-size: 13.5px; }
  .tc b { font-weight: 600; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

  .setup { display: flex; flex-direction: column; min-height: 0; }
  .setup .panel-b { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; align-content: start; }
  .full { grid-column: 1 / -1; }
  .tok { display: inline; font-family: var(--sans); font-size: 14px; font-weight: 600; background: var(--ink); color: var(--desk); border-radius: 4px; padding: 1px 5px; }
  .opening { display: block; font-size: 15.5px; background: var(--tape); line-height: 1.5; min-height: 110px; padding: 10px 14px; }
  .helper { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
  .errs { margin-top: 8px; border: 1px solid #EACFD3; background: #FDF6F7; border-radius: var(--r-md); padding: 8px 12px; font-size: 13px; }
  .errs div { display: flex; gap: 10px; padding: 3px 0; }
  .errs b { font-weight: 600; min-width: 54px; }
  .setup-foot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--rule); }
  .setup-foot .sum { color: var(--ink-2); font-size: 13px; margin-right: auto; }
  .inline-row { display: flex; gap: 10px; align-items: center; }
  .attempts { display: flex; gap: 6px; }
  .attempts span { width: 38px; height: 38px; border: 1px solid var(--rule-2); border-radius: var(--r-md); display: grid; place-items: center; background: #fff; font-weight: 600; }
  .attempts span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .days { display: flex; gap: 4px; }
  .days span { width: 36px; height: 30px; display: grid; place-items: center; font-size: 12.5px; border-radius: 6px; border: 1px solid var(--rule-2); background: #fff; color: var(--ink-3); }
  .days span.on { background: var(--ink); color: #fff; border-color: var(--ink); }
</style>
</head>
<body>
<script>
const CS = K.campaigns, D = K.campaignDraft;
const tagFor = c => c.status.startsWith("Paused") ? `<span class="tag paused">${ic("pause")}${c.status}</span>` :
  c.status.startsWith("Scheduled") ? `<span class="tag sched">${ic("calendar-clock")}${c.status}</span>` : `<span class="tag draft">${ic("pencil")}${c.status}</span>`;
const funnel = c => {
  if (!c.called) return "";
  const notCalled = c.contacts - c.called, pct = n => (n / c.contacts * 100).toFixed(1) + "%";
  const answeredNoBook = c.answered - c.booked, noAnswer = c.called - c.answered - c.failed;
  return `<div class="funnel"><div class="bar">
    <i style="width:${pct(c.booked)};background:var(--ok)"></i>
    <i style="width:${pct(answeredNoBook)};background:var(--ink)"></i>
    <i style="width:${pct(noAnswer)};background:#A9A9A1"></i>
    <i style="width:${pct(c.failed)};background:var(--fail)"></i></div>
    <div class="legend">
      <span><b>${c.contacts}</b>contacts</span>
      <span><b>${c.called}</b><i class="sw" style="background:#A9A9A1"></i>called</span>
      <span><b>${c.answered}</b><i class="sw" style="background:var(--ink)"></i>answered</span>
      <span><b>${c.booked}</b><i class="sw" style="background:var(--ok)"></i>booked</span>
      <span><b>${c.failed}</b><i class="sw" style="background:var(--fail)"></i>failed</span>
    </div></div>`;
};
const burns = CS.find(c => c.code === D.code);
const opening = esc(D.opening).replace("{first_name}", '<span class="tok">{first_name}</span>');

shell({
  role: "admin", active: "campaign", title: "Campaign calls",
  crumb: "Kiku calls a list of guests with a promo offer",
  right: `<button class="btn sm primary">${ic("plus")}New campaign</button>`,
  body: `<div class="cols">
  <div class="panel">
    <div class="panel-h"><h2>Campaigns</h2><span class="aside">${CS.length}</span></div>
    <div class="scroll">${CS.map(c => `
      <div class="camp ${c.code === D.code ? "sel" : ""}">
        <div class="top"><span class="code">${c.code}</span>${tagFor(c)}</div>
        <div class="nm">${esc(c.name)}</div>
        <div class="of">${esc(c.offer)}</div>
        <div class="meta"><span>${ic("file-spreadsheet")}${esc(c.audience)}</span><span>${ic("clock-3")}${esc(c.window)}</span>${c.contacts && !c.called ? `<span>${ic("users")}${c.contacts} contacts</span>` : ""}</div>
        ${funnel(c)}
      </div>`).join("")}
      <div class="today">
        <h3>Campaign calls today</h3>
        ${K.calls.filter(c => c.type === "Campaign").map(c => `<div class="tc"><span class="num muted">${c.started}</span><b>${esc(c.guest)}</b><span class="muted">${c.promo}</span>${status(c.status)}</div>`).join("")}
      </div>
    </div>
  </div>

  <div class="panel setup">
    <div class="panel-h"><h2>Set up ${D.code}</h2><span class="tag draft">${ic("pencil")}Draft</span><span class="aside">${esc(burns.name)}</span></div>
    <div class="panel-b">
      <div class="field"><label class="fl">Promo code</label><div class="input" style="font-weight:600;letter-spacing:.02em">${D.code}</div></div>
      <div class="field"><label class="fl">Offer</label><div class="input">${esc(burns.offer)}</div></div>

      <div class="field full"><label class="fl">Audience</label>
        <div class="file"><span class="ic">${ic("file-spreadsheet")}</span><div style="flex:1"><b>${D.file}</b><span>${D.rows} rows uploaded</span></div>
          <div class="tally"><span class="ok">${ic("circle-check")}${D.ready} ready</span><span class="bad">${ic("circle-x")}${D.errors} errors</span></div>
          <button class="btn sm ghost">${ic("upload")}Replace</button></div>
        <p class="helper">${D.errors} rows will be skipped unless you fix them and upload again. Kiku calls the ${D.ready} ready contacts.</p>
      </div>

      <div class="field"><label class="fl">Call window</label>
        <div class="inline-row"><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((d,i)=>`<span class="${i<5?"on":""}">${d}</span>`).join("")}</div></div>
        <div class="inline-row" style="margin-top:8px"><div class="input" style="width:100px">10:00</div><span class="muted">to</span><div class="input" style="width:100px">18:00</div><span class="muted">BST</span></div>
        <p class="helper">${D.window}</p>
      </div>
      <div class="field"><label class="fl">Max attempts per guest</label>
        <div class="attempts">${[1,2,3,4,5].map(n=>`<span class="${n===D.maxAttempts?"on":""}">${n}</span>`).join("")}</div>
        <p class="helper">Kiku retries unanswered numbers up to ${D.maxAttempts} times, then marks the call failed.</p>
      </div>

      <div class="field full"><label class="fl">Opening line <span class="opt">Kiku says this first, then follows the conversation</span></label>
        <div class="input opening">${opening}</div>
        <p class="helper"><span class="tok">{first_name}</span> is filled from the first_name column of ${D.file}. Keep it short: guests decide in the first few seconds whether to stay on the line.</p>
      </div>
    </div>
    <div class="setup-foot"><span class="sum">${D.ready} guests, ${D.window}, up to ${D.maxAttempts} attempts</span>
      <button class="btn">Save draft</button><button class="btn primary">${ic("calendar-check")}Schedule campaign</button></div>
  </div>
</div>`
});
done();
</script>
</body>
</html>
