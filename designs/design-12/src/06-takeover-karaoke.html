<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Kiku, karaoke mode KK-24030</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_shared/data.js"></script>
<script src="app.js"></script>
<style>
  body { background: #F1DAD6; }
  .wrap { display: grid; grid-template-columns: 1fr 330px; grid-template-rows: auto auto 1fr; gap: 14px; height: 100%; }
  .onair { grid-column: 1 / -1; background: var(--human); color: #fff; border-radius: var(--r-lg); padding: 12px 14px 12px 18px; display: flex; align-items: center; gap: 18px; }
  .onair .lampbig { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: grid; place-items: center; color: var(--human); box-shadow: 0 0 0 6px rgba(255,255,255,.25); flex: none; }
  .onair .lampbig svg.lucide { width: 20px; height: 20px; stroke-width: 2.4; }
  .onair .msg b { display: block; font-family: var(--display); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; font-variation-settings: "wdth" 88; line-height: 1.15; }
  .onair .msg span { font-size: 13px; opacity: .92; }
  .onair .wave i { background: #fff; }
  .onair .timer { margin-left: auto; text-align: right; white-space: nowrap; }
  .onair .timer b { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; display: block; }
  .onair .timer small { font-size: 12px; opacity: .85; }
  .onair .btn { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.45); color: #fff; }
  .onair .btn.hand { background: var(--desk); border-color: var(--desk); color: var(--ink); }
  .onair .btn.end { background: var(--ink); border-color: var(--ink); color: #fff; }

  .stage { background: var(--sheet); border-radius: var(--r-lg); border: 1px solid var(--rule); padding: 14px 18px 16px; }
  .stage-h { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); margin-bottom: 10px; }
  .stage-h b { color: var(--ink); font-weight: 600; }
  .stage-h .r { margin-left: auto; color: var(--ink-3); }
  .stage .patch p { font-size: 20px; line-height: 1.6; }
  .stage .patch .said p { font-weight: 500; }
  .stage .patch .pc { padding: 12px 16px 14px; }
  .next { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; margin-top: 12px; padding: 10px 14px; border: 1.5px dashed #D9C46A; border-radius: var(--r); background: #FFFBE6; }
  .next .l { font-size: 12.5px; font-weight: 600; color: var(--tape-ink); display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .next p { font-size: 15.5px; color: #3A3100; }
  .next .hint { font-size: 12px; color: var(--ink-3); white-space: nowrap; }

  .hist { grid-column: 1; min-height: 0; }
  .hist .scroll { padding: 4px 20px 8px; -webkit-mask-image: linear-gradient(transparent, #000 36px); mask-image: linear-gradient(transparent, #000 36px); }
  .kturn { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding: 10px 0; }
  .kturn .t { font-size: 12px; color: var(--ink-3); padding-top: 2px; }
  .kturn .spk { font-size: 12.5px; font-weight: 600; color: var(--human-ink); display: flex; gap: 7px; align-items: center; margin-bottom: 6px; }
  .side { grid-column: 2; grid-row: 2 / span 2; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .gname { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variation-settings: "wdth" 85; line-height: 1.1; }
  .reason { background: var(--sheet); border: 1.5px solid var(--human); border-radius: var(--r-lg); padding: 14px 16px; }
  .reason h2 { font-size: 13px; font-weight: 600; color: var(--human-ink); display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
  .facts li { list-style: none; display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #E6E6E0; font-size: 13.5px; }
  .facts li:last-child { border-bottom: 0; }
  .facts li svg.lucide { color: var(--ink-3); margin-top: 2px; }
</style>
</head>
<body>
<script>
const T = K.takeover;
const live = T.transcript[T.transcript.length - 1];
const earlier = T.transcript.slice(0, -1);

const hist = earlier.map(x => {
  if (x.speaker === "system") {
    const icn = { escalation: "triangle-alert", join: "headphones", takeover: "plug" }[x.kind];
    return `<div class="sysline ${x.kind}"><span class="t">${x.t}</span><span class="ev">${ic(icn)}<span>${esc(x.text)}</span></span></div>`;
  }
  if (x.karaoke) return `<div class="kturn"><span class="t">${x.t}</span><div><div class="spk"><span class="who-dot h"></span>You, karaoke line</div>${patch(x, "You")}</div></div>`;
  const g = x.speaker === "guest";
  return `<div class="turn ${x.speaker}"><span class="t">${x.t}</span><div><div class="spk"><span class="who-dot ${g ? "g" : "k"}"></span>${g ? "Margaret Doyle" : "Kiku"}</div><div class="txt">${esc(x.text)}</div></div></div>`;
}).join("");

shell({
  role: "specialist", active: "live", title: "Karaoke mode",
  crumb: `Live board / ${T.id}, ${esc(T.guest)}`,
  body: `<div class="wrap">
  <div class="onair">
    <span class="lampbig">${ic("mic")}</span>
    <div class="msg"><b>You're on the line with ${esc(T.guest)}</b><span>Kiku's voice is off. The guest hears only you; Kiku keeps writing your lines.</span></div>
    ${wave(24, "", 5)}
    <div class="timer"><b class="num">${T.duration}</b><small>you took over at ${T.takeoverAt}</small></div>
    <button class="btn">${ic("mic-off")}Mute</button>
    <button class="btn hand">${ic("bot")}Hand back to Kiku</button>
    <button class="btn end">${ic("phone-off")}End call</button>
  </div>
  <section class="stage">
    <div class="stage-h">${ic("plug")}<b>Now, line ${live.t}</b><span>Read Kiku's line or say it your way. Cords show what you've kept so far.</span><span class="r">${live.match}% kept</span></div>
    ${patch(live, "You", { live: true, noFoot: true })}
    <div class="next"><span class="l">${ic("pen-line")}Up next</span><p>${esc(T.nextLine)}</p><span class="hint">Kiku wrote this from the call so far</span></div>
  </section>
  <section class="panel hist">
    <div class="panel-h"><h2>Conversation so far</h2><span class="aside">${ic("phone-incoming")}Inbound, started ${T.started}</span></div>
    <div class="scroll" id="hist">${hist}</div>
  </section>
  <aside class="side">
    <div class="panel panel-b" style="gap:4px">
      <span class="gname">${esc(T.guest)}</span>
      <span class="sub">${esc(T.phone)}</span>
      <div style="margin-top:8px;display:flex;gap:10px;align-items:center">${status(T.status)}<span class="tag">${ic("phone-incoming")}Inbound</span></div>
    </div>
    <div class="reason"><h2>${ic("triangle-alert")}Why Kiku escalated</h2><p>${esc(T.escalationReason)}</p></div>
    <div class="panel" style="flex:1;min-height:0">
      <div class="panel-h"><h2>Booking ${T.booking}</h2></div>
      <div class="panel-b scroll" style="padding-top:4px">
        <ul class="facts">
          <li>${ic("bed-double")}<span>${esc(T.stay)}</span></li>
          <li>${ic("message-square")}<span>${esc(T.purpose)}</span></li>
          ${T.facts.map(f => `<li>${ic("receipt")}<span>${esc(f)}</span></li>`).join("")}
        </ul>
      </div>
    </div>
  </aside>
</div>`
});
done();
const h = document.getElementById("hist"); h.scrollTop = h.scrollHeight;
</script>
</body>
</html>
